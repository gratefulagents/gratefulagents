{{- if .Values.crd.enable }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: sshtunnels.platform.gratefulagents.dev
spec:
  group: platform.gratefulagents.dev
  names:
    kind: SSHTunnel
    listKind: SSHTunnelList
    plural: sshtunnels
    singular: sshtunnel
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.host
      name: Host
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SSHTunnel is the Schema for SSH tunnels to self-hosted inference
          endpoints.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SSHTunnelSpec describes an SSH local port-forward to a self-hosted,
              OpenAI-compatible inference endpoint that is reachable only over SSH.

              A run that references the tunnel (spec.sshTunnelRef) gets a hardened SSH
              sidecar that forwards 127.0.0.1:localPort inside the run pod to
              remoteHost:remotePort as seen from the SSH server, and its OPENAI_BASE_URL
              is pointed at http://127.0.0.1:localPort<baseURLPath>. The private key is
              mounted only into the sidecar container, never into the worker container.
            properties:
              baseURLPath:
                default: /v1
                description: |-
                  baseURLPath is appended to http://127.0.0.1:localPort to form the
                  OPENAI_BASE_URL for runs using this tunnel.
                type: string
              description:
                description: |-
                  description is a short human-readable summary shown when browsing
                  tunnels.
                type: string
              host:
                description: |-
                  host is the SSH server address (DNS name or IP) that fronts the
                  inference endpoint.
                minLength: 1
                type: string
              image:
                description: |-
                  image overrides the SSH sidecar image for this tunnel. It must provide
                  /bin/sh and an OpenSSH client. Defaults to the operator-configured
                  tunnel image.
                type: string
              localPort:
                default: 8434
                description: |-
                  localPort is the loopback port the sidecar listens on inside the run
                  pod. The worker reaches the endpoint at http://127.0.0.1:localPort.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              port:
                default: 22
                description: port is the SSH server port.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              remoteHost:
                default: 127.0.0.1
                description: |-
                  remoteHost is the forward destination as resolved on the SSH server.
                  Keep the inference server bound to loopback so SSH is the only way in.
                type: string
              remotePort:
                description: remotePort is the inference endpoint port on remoteHost.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              secretRef:
                description: |-
                  secretRef names a Secret in the tunnel's namespace that must contain
                  the keys "privateKey" (SSH private key) and "known_hosts" (pinned host
                  key entries; StrictHostKeyChecking is always enforced against them).
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              user:
                description: |-
                  user is the SSH login user. Use a dedicated no-shell account whose
                  authorized_keys entry restricts the key to this single forward, e.g.
                  restrict,port-forwarding,permitopen="127.0.0.1:8000".
                minLength: 1
                type: string
            required:
            - host
            - remotePort
            - secretRef
            - user
            type: object
          status:
            description: SSHTunnelStatus defines the observed state of SSHTunnel.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              phase:
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
