{{- if .Values.crd.enable }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: securityprograms.triggers.gratefulagents.dev
spec:
  group: triggers.gratefulagents.dev
  names:
    kind: SecurityProgram
    listKind: SecurityProgramList
    plural: securityprograms
    singular: securityprogram
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.referencedBy
      name: ReferencedBy
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SecurityProgram is a namespace-scoped, operator-verified program scope
          snapshot referenced by SecurityScan spec.securityProgramRef.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SecurityProgramSpec is an operator-verified snapshot of a vulnerability
              disclosure or bug bounty program's scope. ProgramURL records provenance
              only: it is never fetched and does not authorize network access.
            properties:
              displayName:
                description: displayName is the human-readable program name.
                maxLength: 200
                minLength: 1
                type: string
              programURL:
                description: |-
                  programURL is the HTTPS provenance URL for the program. The controller
                  never fetches it and it grants no authorization to contact any target.
                maxLength: 2048
                minLength: 1
                pattern: ^https://
                type: string
              provider:
                description: provider identifies the program platform or operator.
                maxLength: 100
                minLength: 1
                type: string
              scopePolicy:
                description: |-
                  scopePolicy is the operator-verified scope snapshot supplied to scan
                  prompts as quoted, untrusted data.
                maxLength: 131072
                minLength: 1
                type: string
              verifiedAt:
                description: |-
                  verifiedAt is when an operator last verified scopePolicy against the
                  program's authoritative source.
                format: date-time
                type: string
            required:
            - displayName
            - programURL
            - provider
            - scopePolicy
            - verifiedAt
            type: object
          status:
            description: SecurityProgramStatus is the observed validation and usage
              state.
            properties:
              conditions:
                description: conditions represent the current state of the resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              contentDigest:
                description: contentDigest is the SHA-256 digest of the validated
                  spec snapshot.
                type: string
              observedGeneration:
                description: observedGeneration is the spec generation most recently
                  validated.
                format: int64
                type: integer
              referencedBy:
                description: |-
                  referencedBy is the number of SecurityScans in the namespace that
                  reference this program.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
