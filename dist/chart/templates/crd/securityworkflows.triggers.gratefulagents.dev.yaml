{{- if .Values.crd.enable }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: securityworkflows.triggers.gratefulagents.dev
spec:
  group: triggers.gratefulagents.dev
  names:
    kind: SecurityWorkflow
    listKind: SecurityWorkflowList
    plural: securityworkflows
    singular: securityworkflow
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.referencedBy
      name: ReferencedBy
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SecurityWorkflow is a reusable, namespace-scoped security scan workflow
          referenced by SecurityScan spec.workflowRef. Referenced content is resolved
          and snapshotted at run-creation time, so edits never change historical
          runs.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SecurityWorkflowSpec defines a reusable security scan research
              plan.
            properties:
              description:
                description: description explains what this workflow hunts for.
                type: string
              parallelism:
                description: |-
                  parallelism optionally caps how many tasks may run concurrently in
                  scans using this workflow, overriding the scan's parallelism.
                format: int32
                maximum: 16
                minimum: 1
                type: integer
              tasks:
                description: |-
                  tasks is the ordered/parallel research plan executed as focused
                  vulnerability-hunting sub-agents (same schema as SecurityScan
                  spec.workflow).
                items:
                  description: |-
                    SecurityScanTask is one focused research task in the scan workflow, executed
                    by a dedicated sub-agent.
                  properties:
                    category:
                      description: category optionally tags the vulnerability class
                        this task hunts for.
                      type: string
                    dependsOn:
                      description: dependsOn lists task names that must complete before
                        this task starts.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                    maxFindings:
                      description: |-
                        maxFindings caps how many findings this task may report. Zero means
                        unlimited.
                      format: int32
                      minimum: 0
                      type: integer
                    model:
                      description: model optionally overrides the model for this task's
                        sub-agent.
                      type: string
                    name:
                      description: name identifies the task and is referenced by dependsOn.
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    objective:
                      description: objective is the focused prompt for this task's
                        sub-agent.
                      minLength: 1
                      type: string
                    role:
                      default: security-reviewer
                      description: role is the RoleInstruction name assumed by this
                        task's sub-agent.
                      type: string
                  required:
                  - name
                  - objective
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
            required:
            - tasks
            type: object
          status:
            description: |-
              SecurityLibraryResourceStatus is the shared observed state of the reusable
              security library resources.
            properties:
              conditions:
                description: conditions represent the current state of the resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the spec generation most recently
                  validated.
                format: int64
                type: integer
              referencedBy:
                description: |-
                  referencedBy is the number of SecurityScans in the namespace that
                  reference this resource.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
