apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityProgram
metadata:
  name: immunefi-sky
spec:
  scanTarget:
    repositoryURL: https://github.com/sky-ecosystem/dss
    workflowRef: smart-contract-review
    policyPackRef: bug-bounty
    scanName: immunefi-sky-dss
    displayName: Sky DSS
    priority: 10
    featured: true
  provider: Immunefi
  displayName: Sky
  programURL: https://immunefi.com/bug-bounty/sky/scope/
  verifiedAt: 2026-08-11T00:00:00Z
  scopePolicy: |
    Verified from the live Immunefi program on 2026-08-11 (program last updated 2026-07-21).

    Repository targets:
    - https://github.com/sky-ecosystem/dss on branch master, limited to the individually listed production assets. Verified listed files include src/dai.sol, src/spot.sol, src/pot.sol, src/flap.sol, src/flop.sol, src/vow.sol, src/vat.sol, and src/jug.sol. Do not treat the repository as blanket scope.

    Rewards:
    - Smart-contract Critical: USD 150,000 minimum to USD 10,000,000 maximum, calculated as 10% of directly affected funds.
    - Smart-contract High: USD 5,000 minimum to USD 100,000 maximum.

    Eligible impacts:
    - Direct theft of user funds, protocol insolvency, permanent freezing of funds, governance-result manipulation that changes the intended outcome, and prevention of governance participation despite participation rights.

    Out of scope:
    - A vulnerability must exist in the currently deployed contract; old or GitHub-only vulnerable versions are ineligible.
    - Malicious governance spells, external-stablecoin depegs not directly caused by a code bug, the deprecated Emergency Shutdown Module, privileged-key assumptions, test/configuration files, known issues, and best-practice-only reports are excluded.

    Testing and submission:
    - PoC required. KYC is not required. Never test mainnet or public testnets; use a local fork. No destructive DoS, phishing, high-traffic automation, or unapproved disclosure.
