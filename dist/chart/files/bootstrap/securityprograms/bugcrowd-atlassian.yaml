apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityProgram
metadata:
  name: bugcrowd-atlassian
spec:
  scanTargets:
    - targetURL: "https://admin.atlassian.com"
      workflowRef: web-app-full-assessment
      policyPackRef: web-application
      scanName: atlassian-admin
      displayName: "Atlassian — Admin"
      priority: 1000
      featured: true
    - targetURL: "https://admin.atlassian.com/atlassian-guard"
      workflowRef: web-app-full-assessment
      policyPackRef: web-application
      scanName: atlassian-guard
      displayName: "Atlassian — Guard"
      priority: 1001
      featured: false
    - targetURL: "https://bitbucket.org"
      workflowRef: web-app-full-assessment
      policyPackRef: web-application
      scanName: atlassian-bitbucket
      displayName: "Atlassian — Bitbucket"
      priority: 1002
      featured: false
    - targetURL: "https://id.atlassian.com/login"
      workflowRef: web-app-full-assessment
      policyPackRef: web-application
      scanName: atlassian-id-login
      displayName: "Atlassian — Identity login"
      priority: 1004
      featured: false
    - targetURL: "https://marketplace.atlassian.com"
      workflowRef: web-app-full-assessment
      policyPackRef: web-application
      scanName: atlassian-marketplace
      displayName: "Atlassian — Marketplace"
      priority: 1005
      featured: false
    - targetURL: "https://mcp.atlassian.com"
      workflowRef: web-api-assessment
      policyPackRef: web-application
      scanName: atlassian-mcp
      displayName: "Atlassian — MCP"
      priority: 1006
      featured: false
    - targetURL: "https://start.atlassian.com"
      workflowRef: web-app-full-assessment
      policyPackRef: web-application
      scanName: atlassian-start
      displayName: "Atlassian — Start"
      priority: 1007
      featured: false
    - targetURL: "https://www.loom.com"
      workflowRef: web-app-full-assessment
      policyPackRef: web-application
      scanName: atlassian-loom
      displayName: "Atlassian — Loom"
      priority: 1026
      featured: false
  provider: Bugcrowd
  displayName: Atlassian
  programURL: https://bugcrowd.com/engagements/atlassian
  verifiedAt: 2026-08-15T00:00:00Z
  severitySystem: custom
  primacy: rules
  pocRequired: true
  scopePolicy: |-
    Browser-verified public scope snapshot (2026-08-15)

    Authoritative engagement: https://bugcrowd.com/engagements/atlassian
    Official testing policy: https://www.atlassian.com/trust/security/penetration-testing
    Official reporting guidance: https://www.atlassian.com/trust/security/report-a-vulnerability
    Browser-readable asset-table source: https://bbscope.com/program/bc/%2Fengagements%2Fatlassian (48 in-scope and 13 out-of-scope rows; source crawl was two months old at verification).

    In-scope asset rows captured: 48
    Cloud and platform: any associated *.atlassian.com or *.atl-paas.net domain exploitable DIRECTLY from the researcher's own *.atlassian.net instance; other *.atlassian.com or *.atl-paas.net domains; Forge Platform; GraphQL API at bugbounty-test-<bugcrowd-name>.atlassian.net/gateway/api/graphql; Other (all other Atlassian targets); *.atlastunnel.com; admin.atlassian.com; admin.atlassian.com/atlassian-guard; bitbucket.org; id.atlassian.com/login; marketplace.atlassian.com; mcp.atlassian.com; start.atlassian.com.
    iOS: Confluence Cloud 1006971684; Confluence Server 1288365159; Jira Cloud 1006972087; Jira Server 1405353949; Loom 1474480829.
    Android: com.atlassian.android.confluence.core; com.atlassian.android.jira.core; com.atlassian.confluence.server; com.atlassian.jira.server; com.loom.android.
    Other clients and tooling: Loom Chrome extension liecbddmkiiihnedobmlmillhodjkdmb; Atlassian Companion; Rovo Dev CLI; @forge/cli; Sourcetree.
    Data Center: Bitbucket, Confluence, Crowd, Jira, and Jira Service Management.
    Product rows: Atlas, Bamboo, Compass, Confluence, Confluence Premium, Crucible, Fisheye, Jira, Jira Product Discovery, Jira Service Management, Jira Work Management, Rovo, Rovo Dev, loom.com, and loom.com/download.

    Out-of-scope asset rows captured: 13
    The exact asset exclusions are transcribed into outOfScope below.

    Scope boundaries
    Atlassian runs separate Bugcrowd engagements for Atlassian-built Marketplace apps and separate programs for Trello, Opsgenie, and Statuspage. Those are not silently inherited by this record. Customer cloud sites are eligible only when they are the researcher's own test instance. Product-page rows identify the covered product, not permission to scan unrelated customer deployments. The specifically listed Rovo Dev CLI documentation path is an in-scope exception; support.atlassian.com generally remains excluded.

    Importable target boundary
    Eight actionable first-party administration, authentication, API, marketplace, and product-platform URLs are exposed as individual import targets. Exact rows that currently resolve only to marketing, documentation, support, or download pages remain policy-only scope, together with client binaries, mobile apps, CLI and npm packages, wildcard tenant surfaces, customer instances, and the templated GraphQL hostname. Importing a target does not remove the researcher-owned test-tenant or program-identity requirements.

    Operator gate
    This is a dated scope snapshot, not standing network authorization. Re-open the authoritative engagement immediately before testing and stop if any row, account requirement, or rule differs.
  outOfScope:
    - bytebucket.org
    - "*.bitbucket.io"
    - "Any customer instance, including <customer>.atlassian.net or <customer>.jira.com; test only instances you own"
    - Any internal or development service
    - Any repository the researcher does not own
    - HipChat, including Data Center, desktop, and mobile
    - Stride, including Video, desktop, and mobile
    - blog.bitbucket.org
    - Atlassian-built Marketplace apps covered by the separate Atlassian Apps engagement
    - info.loom.com
    - shop.atlassian.com
    - support.atlassian.com
    - support.loom.com
    - Bulk automated output, missing HTTP headers, cookie flags without impact, stack traces alone, admin-only content spoofing, and autocomplete findings
  prohibitedTesting:
    - Do not test customer instances, customer data, or repositories you do not own
    - Do not run a network scan until the current Bugcrowd row and required test identity have been re-verified
    - No denial of service, distributed denial of service, request flooding, port flooding, or protocol flooding
    - No social engineering or physical testing
    - Do not submit untriaged scanner output; every result must be manually reproduced and demonstrate impact
    - Stop immediately if testing exposes another user's data and report only the minimum evidence
    - Do not publicly disclose without coordinated approval
