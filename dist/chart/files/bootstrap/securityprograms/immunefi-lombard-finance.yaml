      workflowRef: cross-chain-messaging-review
      policyPackRef: bug-bounty
      scanName: immunefi-lombard-evm
      displayName: Lombard EVM contracts
      priority: 1
      featured: true
  provider: Immunefi
  displayName: Lombard Finance
  programURL: https://immunefi.com/bug-bounty/lombard-finance/scope/
  verifiedAt: 2026-08-23T00:00:00Z
  severitySystem: immunefi-v2.3
  pocRequired: true
  pocEnvironment: mainnet-fork
  kycRequired: true
  assets:
