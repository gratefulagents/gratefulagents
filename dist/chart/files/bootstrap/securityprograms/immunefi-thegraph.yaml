  inScopeImpacts:
    - impact: "A bug that could cause significant (>$1M) User funds to be lost or stolen directly from protocol smart contracts (not including slashing)"
      level: critical
      assetType: Smart Contract
    - impact: "Private information being stolen"
      level: high
      assetType: Smart Contract
    - impact: "An economic attack other than a basic 51% governance attack that could cause significant (>$1M) User funds to be lost or stolen directly from the protocol smart contracts"
      level: high
      assetType: Smart Contract
    - impact: "A bug that could cause network participants to be impersonated and unwanted actions being taken (eg., User funds being stolen directly from the protocol smart contracts)"
      level: high
      assetType: Smart Contract
  outOfScope:
    - "Frontrunning, including back running and sandwich attacks"
    - "Known issues previously reported in security audits"
    - "Natural network activity like curation whose involved mechanisms could result in unprofitable actions for the particular stakeholder"
    - "Attacks that rely on social engineering, including requiring victim to visit an out-of-scope url"
    - "Attacks requiring access to victim's machine"
