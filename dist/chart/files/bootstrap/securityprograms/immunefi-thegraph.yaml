  knownIssues:
    - source: Protocol contract audits
      summary: Any vulnerabilities mentioned in public audits that have not been fixed are ineligible.
      reference: https://github.com/graphprotocol/contracts/tree/main/packages/contracts/audits
    - source: Horizon audits
      summary: Published Horizon upgrade audit findings are ineligible duplicates.
      reference: https://github.com/graphprotocol/contracts/tree/main/packages/horizon/audits
    - source: Issuance audits
      summary: Published protocol issuance audit findings are ineligible duplicates.
      reference: https://github.com/graphprotocol/contracts/tree/main/packages/issuance/audits
  prohibitedTesting:
    - "Any testing on mainnet or public testnet deployed code; all testing should be done on local-forks of either public testnet or mainnet"
    - "Any testing with pricing oracles or third-party smart contracts"
    - "Attempting phishing or other social engineering attacks against employees and/or customers"
    - "Any denial of service attacks that are executed against project assets"
    - "Automated testing of services that generates significant amounts of traffic"
    - "Public disclosure of an unpatched vulnerability in an embargoed bounty"
    - "Do not violate the privacy of network users, other bounty hunters, or The Graph"
  scopePolicy: |-
    Verbatim Immunefi scope excerpts (retrieved 2026-08-23; page last updated 18 August 2026).

    Displayed wording is preserved; layout whitespace is normalized. This snapshot contains smart-contract excerpts, and the live program page remains authoritative. Operator notes below distinguish import boundaries and ROI metrics from quoted program terms.

    Maximum bounty: $50,000. The program reports $1.5 million total paid, approximately one-day median resolution, and a public vault of approximately $42,000. Immunefi triage, KYC, and a reproducible inline PoC are required. The program uses Primacy of Rules.

    Assets in Scope
    The live table listed 36 assets, including deployed Ethereum and Arbitrum GraphToken, Staking, GNS, RewardsManager, DisputeManager, Curation, BillingConnector, Governor, ArbitrumInbox, BridgeEscrow, and GraphTokenLockWallet contracts. The repository resource is https://github.com/graphprotocol/contracts.

    Import boundary
    Importing the contracts repository does not make every package or revision eligible. A report must bind the source file and implementation to an address in the live Immunefi asset table and demonstrate one of the four published impacts. The typed addresses above are the Ethereum rows visible in the verified public page; the complete live 36-row table remains authoritative. GraphTokenLockWallet source belongs to graphprotocol/token-distribution and is not covered by this scan target. Testnet assets and protocol upgrades not yet deployed/listed are excluded. Audit directories are prior-art sources, not review targets.

    Impacts in Scope
    Critical
    A bug that could cause significant (>$1M) User funds to be lost or stolen directly from protocol smart contracts (not including slashing)
    High
    Private information being stolen
    High
    An economic attack other than a basic 51% governance attack that could cause significant (>$1M) User funds to be lost or stolen directly from the protocol smart contracts
    High
    A bug that could cause network participants to be impersonated and unwanted actions being taken (eg., User funds being stolen directly from the protocol smart contracts)

    Out of scope
    Frontrunning/backrunning/sandwich attacks; published audit issues; natural curation losses; social engineering or victim-machine access; third-party providers; best practices; indexer port configuration; token-price-only effects; testnet assets; man-in-the-middle attacks; and the standard leaked-key, privileged-role, test-only, and already-exploited exclusions. Testing must remain on a local fork and must not target project or third-party infrastructure.

    ROI note
    Sourced selection factors are $1.5 million total paid, approximately one-day median resolution, and approximately $42,000 visible in the vault. Counterweights are the $50,000 cap, >$1 million critical-impact threshold, Primacy of Rules, mature audit history, and narrow four-impact gate; prioritize newly deployed address/source deltas and cross-contract upgrade or accounting variants rather than broad protocol review.
