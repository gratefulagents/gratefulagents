  prohibitedTesting:
    - Do not run wildcard, CIDR, or production network scans from this catalog record
    - Verify the live Bugcrowd asset row, bounty flag, supported product version, identity requirements, and rate limit before testing
    - Use only researcher-controlled accounts, devices, content, and data
    - No denial of service, distributed denial of service, traffic flooding, brute force, spam, social engineering, or physical testing
    - Report Chromium-inherited vulnerabilities to Chromium instead of testing them as Opera-specific issues
    - Report Android issues to Opera first before seeking any Google Play reward
    - Human-review automated and AI-assisted findings and provide clear reproduction steps and proof of impact
    - Stop on unintended access to another user's data and retain only minimum evidence
    - Do not publicly disclose until Opera coordinates publication
