    The exact asset exclusions are transcribed into outOfScope below.

    Eligibility boundaries
    Chromium-inherited vulnerabilities must be reported to Chromium and are not eligible for an Opera bounty. Unsupported Opera versions are not eligible. Android vulnerabilities may also qualify under Google's Play Security Reward Program, but Opera asks researchers to report to Opera first. Reports need a clear proof of concept and reproduction steps, and publication must wait for coordinated disclosure.

    Importable target boundary
    The 37 actionable first-party application, authentication, API, and operational-service URLs are exposed as individual import targets. Exact rows that currently resolve only to marketing, download, CDN/static, directory-listing, retired, or redirect-only pages remain policy-only scope, together with wildcard domains, CIDRs, mobile and desktop clients, and the GameMaker Studio product row. Imported URLs must not be expanded into adjacent hosts or network ranges, and the two-month-old browser-readable table still requires live re-verification.

    Operator gate
    Re-open the authenticated Bugcrowd engagement immediately before testing and confirm the exact row, bounty flag, supported version, identity requirements, and rate limits.
