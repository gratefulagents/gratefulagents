apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityProgram
metadata:
  name: immunefi-spark
spec:
  scanTarget:
    repositoryURL: https://github.com/marsfoundation/spark-alm-controller
    workflowRef: smart-contract-review
    policyPackRef: bug-bounty
    scanName: immunefi-spark-alm-controller
    displayName: Spark ALM controller
    priority: 4
    featured: true
  provider: Immunefi
  displayName: Spark
  programURL: https://immunefi.com/bug-bounty/sparklend/scope/
  verifiedAt: 2026-08-11T00:00:00Z
  scopePolicy: |
    Verified from the live Immunefi program on 2026-08-11 (program last updated 2026-07-28).

    Repository targets:
    - https://github.com/marsfoundation/spark-alm-controller/blob/master/src/ALMProxy.sol is the exact supplied-repository asset listed by the program. Scope is not the entire repository.

    Rewards:
    - Smart-contract Critical: up to USD 5,000,000.
    - Smart-contract High: USD 10,000 minimum to USD 100,000 maximum.

    Eligible impacts:
    - Direct theft of funds, permanent freezing, protocol insolvency, and qualifying temporary freezing.

    Out of scope:
    - The bug must exist in the deployed smart contract, not only in the GitHub source. Testnet/mock code, non-deployed configurations, known or audited issues, privileged-access assumptions, and best-practice-only reports are excluded.
    - For pausable or upgradeable code, reward calculations generally consider only the initial attack before mitigation.

    Testing and submission:
    - PoC required. KYC is not required. Use local forks only; never test mainnet/public testnets or third-party systems, perform destructive DoS, or disclose without approval.
