apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityProgram
metadata:
  name: immunefi-olympus
spec:
  scanTarget:
    repositoryURL: https://github.com/OlympusDAO/olympus-v3
    workflowRef: smart-contract-review
    policyPackRef: bug-bounty
    scanName: immunefi-olympus-v3
    displayName: Olympus v3
    priority: 11
    featured: true
  provider: Immunefi
  displayName: Olympus
  programURL: https://immunefi.com/bug-bounty/olympusdao/scope/
  verifiedAt: 2026-08-12T00:00:00Z
  scopePolicy: |
    Snapshot verified against the current/last-known Immunefi scope URL on 2026-08-12. The live program page, including its asset list, impact matrix, exclusions, and reward terms, controls if it differs from this snapshot.

    Repository targets:
    - Catalog repository: https://github.com/OlympusDAO/olympus-v3.
    - Source must be matched to a listed deployed/in-scope asset on the live program page. Repository affiliation is not blanket eligibility; unlisted paths, branches, commits, deployments, forks, tests, and examples are not eligible unless the live scope explicitly lists them.

    Rewards:
    - Up to USD 3,333,000 for eligible Critical impacts, subject to the live reward table and its eligibility, severity, and payout terms.

    Eligible impacts:
    - Smart-contract: direct theft or loss of funds, permanent freezing of funds, protocol insolvency, and unauthorized mint, redemption, treasury, or governance execution affecting in-scope assets.
    - Severity, asset eligibility, and impact qualification are determined solely by the live Immunefi scope and reward table.

    Out of scope:
    - Any asset, deployment, code path, dependency, third-party integration, or impact not explicitly listed by the live program; known issues, theoretical or best-practice-only reports, and attacks requiring privileged or unrealistic assumptions are excluded unless the live scope says otherwise.

    Testing and submission:
    - Test only private/local environments and accounts you control. Do not test mainnet, public testnets, production services, third-party systems, or other users' assets. Do not perform DoS, traffic generation, phishing, social engineering, fund movement, or unapproved public disclosure. Submit a minimal reproducible PoC privately through Immunefi and follow the live program's disclosure and eligibility terms.
