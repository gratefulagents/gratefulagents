    Impacts in Scope
    Low
    All above impacts for OApp, OFT & ONFT related contracts
    High
    Any governance voting result manipulation
    Medium
    Griefing (e.g. no profit motive for an attacker, but damage to the users or the protocol)
    Critical
    Exploits resulting in the permanent locking or theft of user funds
    Critical
    Permanent DoS attacks (excluding volumetric attacks)

    Out of scope
    - Sybil attacks\n- Impacts to OApps themselves as a result of their own misconfiguration (including but not limited to eg. configuring bad libraries, verifier networks, executors…).\n- DoS of LayerZero infrastructure is not eligible for bug bounty rewards\n- Reports regarding bugs that LayerZero Labs was previously aware of are not eligible for a reward\n- Dependencies & Third Party Code\n- Temporary impacts resulting from configuration adjustment race-conditions
    - Incorrect data supplied by third party oracles\n  - Not to exclude oracle manipulation/flash loan attacks\n- Impacts requiring basic economic and governance attacks (e.g. 51% attack)\n- Lack of liquidity impacts\n- Impacts from Sybil attacks\n- Impacts involving centralization risks
    - Impacts requiring attacks that the reporter has already exploited themselves, leading to damage\n- Impacts caused by attacks requiring access to leaked keys/credentials\n- Impacts caused by attacks requiring access to privileged addresses (including, but not limited to: governance and strategist contracts) without additional modifications to the privileges attributed\n- Impacts relying on attacks involving the depegging of an external stablecoin where the attacker does not directly cause the depegging due to a bug in code\n- Mentions of secrets, access tokens, API keys, private keys, etc. in Github will be considered out of scope without proof that they are in-use in production\n- Best practice recommendations\n- Feature requests\n- Impacts on test files and configuration files unless stated otherwise in the bug bounty program\n- Impacts requiring phishing or other social engineering attacks against project's employees and/or customers

    Program rules and rewards

    $3a

    $39

    ['no_ofac_sdn']

    - Any testing on mainnet or public testnet deployed code; all testing should be done on local-forks of either public testnet or mainnet\n- Any testing with pricing oracles or third-party smart contracts\n- Attempting phishing or other social engineering attacks against our employees and/or customers\n- Any testing with third-party systems and applications (e.g. browser extensions) as well as websites (e.g. SSO providers, advertising networks)\n- Any denial of service attacks that are executed against project assets\n- Automated testing of services that generates significant amounts of traffic\n- Public disclosure of an unpatched vulnerability in an embargoed bounty\n- [Any other actions prohibited by the Immunefi Rules](https://immunefi.com/rules/)

