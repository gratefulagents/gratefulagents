    Impacts in Scope
    Low
    Contract fails to deliver promised returns, but doesn't lose value
    High
    Permanent freezing of funds (that can be fixed by upgrade)
    High
    Permanent stopping the priority queue
    High
    Theft of user fees
    Medium
    Block stuffing for profit
    Medium
    Griefing (e.g. no profit motive for an attacker, but damage to the users or the protocol)
    Medium
    Theft of gas
    Medium
    Unbounded gas consumption
    Critical
    Direct theft of any user funds, whether at-rest or in-motion
    Critical
    Permanent freezing of funds (that cannot be fixed by upgrade)
    Critical
    Protocol insolvency

    Out of scope
    - Any finding whose exploitation requires Gateway to be enabled and operating as a settlement layer is out of scope, since Gateway is not currently enabled and all chains settle directly to L1. This applies only to the Gateway precondition — the same code, when reachable by an L1-settling chain, stays in scope.\n- Broken link hijacking is out of scope.\n- Attacks requiring changing the verifier key.
    - Incorrect data supplied by third party oracles\n  - Not to exclude oracle manipulation/flash loan attacks\n- Impacts requiring basic economic and governance attacks (e.g. 51% attack)\n- Lack of liquidity impacts\n- Impacts from Sybil attacks\n- Impacts involving centralization risks
    - Impacts requiring attacks that the reporter has already exploited themselves, leading to damage\n- Impacts caused by attacks requiring access to leaked keys/credentials\n- Impacts caused by attacks requiring access to privileged addresses (including, but not limited to: governance and strategist contracts) without additional modifications to the privileges attributed\n- Impacts relying on attacks involving the depegging of an external stablecoin where the attacker does not directly cause the depegging due to a bug in code\n- Mentions of secrets, access tokens, API keys, private keys, etc. in Github will be considered out of scope without proof that they are in-use in production\n- Best practice recommendations\n- Feature requests\n- Impacts on test files and configuration files unless stated otherwise in the bug bounty program\n- Impacts requiring phishing or other social engineering attacks against project's employees and/or customers

    Program rules and rewards

    $3a

    ZKsync Era is a layer 2 rollup that uses zero-knowledge proofs to scale Ethereum without compromising on security or decentralization. Since it's EVM compatible (Solidity/Vyper), 99% of Ethereum projects can redeploy without refactoring or re-auditing a single line of code. ZKsync Era also uses an LLVM-based compiler that will eventually let developers write smart contracts in C++, Rust and other popular languages.\n\nFor more information about ZKsync Era, please visit [https://zksync.io/](https://zksync.io/)\n\n__For Whitehats__: It is highly recommended that you review the details of this program in full. Although many Bug Bounty programs have standard terms and conditions, each also has their own unique details that are critical to your success. \n\nPrior to submitting a report please review the Immunefi [Bug Report Template and Best Practices. ](https://immunefisupport.zendesk.com/hc/en-us/articles/12435277406481-Bug-Report-Template)

