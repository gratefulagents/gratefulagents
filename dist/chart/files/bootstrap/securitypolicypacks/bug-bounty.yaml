apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityPolicyPack
metadata:
  name: bug-bounty
spec:
  description: Bug-bounty submission policy — only verified, in-scope high and critical vulnerabilities survive triage; hardening noise and unproven repository-automation concerns are rejected before reporting.
  minSeverity: high
  failOnSeverity: critical
  dedupe:
    enabled: true
  defaultRankerRefs:
    - name: bug-bounty-triage
  defaultPostScriptRefs:
    - name: scope-eligibility-check
    - name: false-positive-check
    - name: poc-builder
    - name: poc-validator
    - name: bounty-worthiness-check
    - name: report-writer
  budgets:
    maxRuntime: 4h
  retention:
    scanDays: 730
    findingDays: 730
    reportDays: 730
    evidenceDays: 730
    pocDays: 365
    auditEventDays: 730
