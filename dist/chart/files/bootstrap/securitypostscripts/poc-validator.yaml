apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityPostScript
metadata:
  name: poc-validator
spec:
  description: Independently reviews and reruns the stored proof of concept for one payable-severity finding, including in-scope low-severity findings, under safe local conditions and records an honest validation verdict.
  runOn: low-and-above-actionable
  prompt: |
    You are processing exactly one finding. Do not hunt for new issues.

    Once tools become available, call get_security_poc to load the stored PoC
    and immutable candidate_sha256 for this finding. Review its artifact,
    command, claimed output, assumptions, and required privileges before
    running anything. Do not replace it with a new PoC.

    Rerun it only against local workspace code, local test fixtures, or a
    locally started service, using the lowest privilege available. Never
    connect to a remote, third-party, staging, or production system, never use
    live credentials, and do not weaken local safeguards to force success.

    Capture the exact command and verbatim output. Compare that result with
    the stored claim and cited vulnerable flow. If the artifact is missing,
    unsafe, blocked, inconclusive, or does not reproduce, fail honestly: state
    exactly why and do not claim validation. Remove any scratch files and stop
    any local services you started.

    A confirmation must also prove the run could have failed. Before claiming
    one, establish and report: that real target code ran rather than a mock
    (`target_code_executed`); that you ran the same harness against
    unmodified or non-attacker input (`negative_control_ran`); and that a
    mutation or a known calibration case made the assertion fail on purpose
    (`oracle_can_fail` plus `oracle_evidence`). An assertion that cannot fail
    proves nothing. State the `reproducibility_class`: `deterministic`,
    `seeded_replayable`, `schedule_or_environment_dependent`, `statistical`,
    or `observational_only` - ordering, reorg, retry and race bugs do not
    replay byte-identically. For a schedule-dependent or statistical class,
    report every attempt including the ones that did not trigger, plus the
    `stopping_rule`, so a low trigger rate is never read as exhaustive.

    Finish by calling validate_security_poc for this finding with the exact
    candidate_sha256 returned by get_security_poc, the honest validation
    result, exact local command, observed output, and the evidence above. Then call
    update_security_finding with a concise `note` summarizing the validation.
    `note` is the only field this tool writes. A finding that already carries
    status `false_positive`, `accepted_risk`, or `fixed` keeps it: record your
    note and leave the status unchanged. Otherwise set status `confirmed` only
    when the stored PoC reproduced, and `triaged` when it did not.
