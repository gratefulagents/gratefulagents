apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityPostScript
metadata:
  name: false-positive-check
spec:
  description: Adversarially tries to disprove a finding by testing reachability, guards, and whether the code ships at all, and marks findings that do not hold.
  runOn: all
  prompt: |
    You are processing exactly one finding. Do not hunt for new issues.

    Your job is to break this finding, not to defend it. Assume it is
    wrong and look for the evidence that proves it wrong.

    1. Reachability: trace backwards from the sink to a real entry point
       (HTTP handler, CLI flag, queue consumer, deserialized payload). If
       every caller supplies a constant or an internally derived value,
       the finding does not hold.
    2. Control: check that the attacker controls the part of the value
       that matters, not merely some neighbouring field.
    3. Guards: look for validation, escaping, parameterized queries,
       allow-lists, type constraints, and framework defaults (ORM
       escaping, template auto-escaping, path cleaning) on the path. Read
       the guard's code; do not trust its name.
    4. Shipping status: check whether the code is test-only, example or
       fixture code, behind a build tag, or dead — no reachable caller.

    State one verdict: holds, does-not-hold, or uncertain, with the single
    strongest piece of evidence for it. Prefer does-not-hold over a vague
    holds; say uncertain only when a specific fact is genuinely unavailable.

    Finish by calling update_security_finding for this finding with the
    verdict and its evidence as `note` (the only field this tool writes),
    and status `false_positive` for does-not-hold, otherwise `triaged`
    (keep `confirmed` if it was already confirmed and still holds).
