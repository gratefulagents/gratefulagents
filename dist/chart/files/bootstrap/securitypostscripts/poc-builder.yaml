apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityPostScript
metadata:
  name: poc-builder
spec:
  description: Reuses the current exact proof-of-concept candidate when one exists; otherwise builds and runs a minimal safe candidate and records its exact command and output.
  runOn: low-and-above-actionable
  prompt: |
    You are processing exactly one finding. Do not hunt for new issues.

    Always call get_security_poc first. For a current candidate for this exact finding and execution, reuse that canonical PoC: do not rebuild, rerun, or overwrite it. Call update_security_finding with `poc_reused` and candidate_sha256 in `note`, then stop. Build only when get_security_poc reports that no current exact candidate exists.

    First determine how this exact project requires a PoC to be built and run. Inspect project/CI instructions and harnesses, plus the security program's policy and pocEnvironment. Record requirements and sources. Satisfy all applicable requirements; generic repository or CI guidance cannot relax program policy or pocEnvironment. Treat conflicts as non-reproduction, not permission to choose a weaker rule.

    A unit test is valid only when all applicable project and program requirements explicitly accept it as PoC evidence for this finding class. If unit tests, mocks, or synthetic harnesses are insufficient, use the required integration, e2e, fork, devnet, replay, binary, deployment, or other prescribed harness. If unavailable or unsafe, do not replace it with weaker evidence; record non-reproduction.

    Execute only on local code, fixtures, devnets, or forks. You may query a public chain directly with read-only RPC or API calls solely to inspect state; those reads need no fork. Never sign or broadcast a transaction, call a write/admin method, use live credentials, send exploit payloads, or mutate remote systems.

    1. Craft input reaching the sink.
    2. Build and run it with the project's prescribed toolchain and commands; capture exact commands and output.
    3. Prove real target code executed, not only a model or mock. With the same unchanged harness and oracle, run non-attacker input as a negative control and a calibration case known to make the assertion fail; capture both transcripts. Re-run the exploit against unmodified target code. A successful command or assertion that cannot fail is not a reproduction.
    4. Make it runnable from a clean checkout: include every file and record revision, prerequisites, setup, environment variables, fixtures, seeds, generated assets, build/run commands, and teardown. Do not rely on unrecorded workspace state or prior commands. Clean scratch files and stop services.

    Do not invent a PoC. If setup cannot complete safely, stop instead of pivoting to a weaker harness. Name the missing dependency, unreachable path, unmet requirement, or guard and lower confidence.

    On the fallback path, call save_security_poc with the self-contained artifact, complete transcript, and control/oracle evidence (or explicit non-reproduction). Then call update_security_finding with a concise `note`, not the artifact. A finding that already carries status `false_positive`, `accepted_risk`, or `fixed` keeps it: record your note and leave the status unchanged. Otherwise set status `confirmed` only on reproduction and `triaged` when it did not reproduce.
