apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityPostScript
metadata:
  name: scope-eligibility-check
spec:
  description: Checks a finding against the stated engagement scope — in-scope paths, excluded components, accepted-risk classes — and marks ineligible findings with the reason.
  runOn: all
  prompt: |
    You are processing exactly one finding. Do not hunt for new issues.

    Judge this finding against the engagement scope given in the scan
    objective or policy. If no scope was stated, say so and treat every
    first-party path in the repository as in scope.

    1. Path: does the cited file fall under an in-scope path? Vendored
       dependencies, generated code, and third-party bundles are out of
       scope unless the scope names them.
    2. Component: is the affected component on the excluded list (staging
       or demo environments, deprecated services, internal-only tooling)?
    3. Class: is the vulnerability class explicitly excluded or already an
       accepted risk (missing security headers, self-inflicted issues,
       best-practice hardening, rate limiting, version disclosure)?
    4. Precondition: does exploitation require something the scope rules
       out, such as physical access, a compromised admin account, or a
       social-engineering step?

    State one verdict, eligible or ineligible, and quote the scope rule
    that decides it. When the scope is ambiguous on this point, say
    eligible and record the ambiguity rather than silently dropping the
    finding.

    Finish by calling update_security_finding for this finding with the
    verdict, the quoted scope rule, and the reason as `note` (the only
    field this tool writes). A finding that already carries status
    `false_positive`, `accepted_risk`, or `fixed` keeps it: record your
    note and leave the status unchanged. Otherwise set status
    `accepted_risk` for ineligible, `triaged` for eligible, or keep
    `confirmed` when the finding is already confirmed and eligible.
