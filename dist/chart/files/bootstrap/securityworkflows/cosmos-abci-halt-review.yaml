apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityWorkflow
metadata:
  name: cosmos-abci-halt-review
spec:
  description: Chain-halt review for a Cosmos SDK application - enumerates every production-reachable ABCI method in the Go codebase, then investigates each one for maliciously triggerable panic paths that could halt the chain, plus consensus non-determinism and unbounded gas or state growth.
  tasks:
    - name: map-abci-methods
      role: threat-modeler
      category: recon
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-cosmos-vulnerability-scanner
        - name: trail-of-bits-audit-context-building
      objective: >-
        Enumerate every production-reachable ABCI method in this Go codebase and the application code it
        drives: InitChain, PrepareProposal, ProcessProposal, VoteExtension handling, FinalizeBlock (or
        BeginBlock and EndBlock and DeliverTx on older SDK versions), CheckTx, Commit, Query, and the
        ExtendVote and VerifyVoteExtension hooks, together with the module-level entry points they reach -
        begin and end blockers, message and proposal handlers, ante and post decorators, keeper Query
        servers, and registered upgrade handlers. Follow the actual app wiring (app.go, module manager
        ordering, baseapp options, custom proposal handlers) rather than assuming the default SDK set;
        include custom or forked ABCI middleware. For each entry record the ABCI method or hook, the
        handler symbol that implements it, and the file it lives in. Skip simulation-only, test, and CLI
        code. Order the inventory by halt risk, most dangerous first (consensus-critical hooks such as
        proposal handlers, begin and end blockers, and upgrade handlers before query-only paths): only the
        first 16 entries are investigated, so anything you rank below that is never examined. Publish the
        inventory instead of reporting findings.
      outputSchema: |-
        {
          "type": "array",
          "items": {
            "type": "object",
            "required": ["method", "handler", "file"],
            "properties": {
              "method": {"type": "string", "description": "ABCI method or module hook, e.g. FinalizeBlock or EndBlocker"},
              "handler": {"type": "string", "description": "Go function or method implementing it"},
              "file": {"type": "string", "description": "Repository-relative file defining the handler"}
            }
          }
        }
    - name: investigate-panic-paths
      role: vulnerability-hunter
      category: dos
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-cosmos-vulnerability-scanner
      objective: >-
        Investigate one ABCI entry point for maliciously triggerable panic paths that could halt the chain:
        {{item.method}}, implemented by {{item.handler}} in {{item.file}}. Read the handler and everything it
        calls, and hunt for panics an attacker can reach with a transaction, a proposal, a vote extension,
        or crafted state they were able to write earlier: explicit panic and must-style helpers on
        recoverable input errors, nil map writes and nil pointer dereferences on optional or unset fields,
        slice and array indexing with attacker-controlled offsets, type assertions without the comma-ok
        form, integer conversion and overflow (int64 to uint64, truncating casts) and division or modulo by
        a zero the caller supplies, sdk.Dec and sdk.Int operations that panic on overflow, negative,
        or out-of-range values, address and denom parsing helpers that panic on malformed input,
        unmarshalling helpers that panic on stored bytes, and iterator or store misuse. Pay particular
        attention to code running outside a transaction's recover boundary - begin and end blockers,
        proposal handlers, and upgrade handlers - where one panic stops block production for the whole
        network rather than failing a single transaction. For each report, state where the untrusted value
        enters, why it survives every check on the way, the panicking statement at file:line, and whether
        the panic is caught by baseapp's recover or halts consensus. Publish the same kept reports as this
        task's structured output, one entry each carrying the fingerprint report_security_finding returned for it, and an empty array when this entry point holds.
      outputSchema: |-
        {
          "type": "array",
          "items": {
            "type": "object",
            "required": ["title", "fingerprint", "severity", "file", "halt_scope"],
            "properties": {
              "fingerprint": {"type": "string", "description": "Fingerprint returned by report_security_finding for this finding"},
              "title": {"type": "string", "description": "Short name of the panic path"},
              "severity": {"type": "string", "enum": ["critical", "high", "medium", "low", "info"], "description": "Severity of the finding"},
              "file": {"type": "string", "description": "Repository-relative file holding the panicking statement"},
              "line": {"type": "integer", "description": "Line of the panicking statement"},
              "halt_scope": {"type": "string", "description": "chain-halt when it stops block production, transaction-only when baseapp recovers"},
              "summary": {"type": "string", "description": "Where the untrusted value enters and how it reaches the panic"}
            }
          }
        }
      dependsOn:
        - map-abci-methods
      forEach: map-abci-methods
      maxInstances: 16
    - name: consensus-non-determinism
      role: vulnerability-hunter
      category: logic-flaw
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-cosmos-vulnerability-scanner
        - name: trail-of-bits-property-based-testing
      objective: >-
        Hunt for non-determinism in the state-machine code reached from the ABCI entry points listed in
        {{tasks.map-abci-methods.output}}. Any value that can differ between honest validators executing the
        same block is an apphash mismatch and a chain halt: iteration over Go maps where order affects state
        writes or emitted events, time.Now and other wall-clock reads instead of the block header time,
        floating-point arithmetic in consensus-relevant math, non-seeded or per-node randomness, goroutines
        and concurrent writes whose interleaving reaches the store, environment variables, filesystem or
        network access during block execution, node-local configuration (min-gas-prices, pruning, custom
        flags) influencing state rather than mempool admission, error strings or serialization that embed
        pointers or unordered data, and gas metering that depends on node-local state. Also check that
        upgrade and migration handlers write the same state on every node. Report each with file:line
        evidence and explain how two validators diverge. Publish the same kept reports as this task's
        structured output, one entry each carrying the fingerprint report_security_finding returned for it, and an empty array when you found none.
      outputSchema: |-
        {
          "type": "array",
          "items": {
            "type": "object",
            "required": ["title", "fingerprint", "severity", "file"],
            "properties": {
              "fingerprint": {"type": "string", "description": "Fingerprint returned by report_security_finding for this finding"},
              "title": {"type": "string", "description": "Short name of the non-determinism source"},
              "severity": {"type": "string", "enum": ["critical", "high", "medium", "low", "info"], "description": "Severity of the finding"},
              "file": {"type": "string", "description": "Repository-relative file holding the divergent code"},
              "line": {"type": "integer", "description": "Line where the divergence originates"},
              "summary": {"type": "string", "description": "How two honest validators end up with different state"},
              "confidence": {"type": "string", "description": "high, medium, or low, based on the evidence read"}
            }
          }
        }
      dependsOn:
        - map-abci-methods
    - name: unbounded-gas-and-state-growth
      role: vulnerability-hunter
      category: dos
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-cosmos-vulnerability-scanner
        - name: trail-of-bits-property-based-testing
      objective: >-
        Hunt for work an attacker can force the chain to do without paying proportionally, starting from the
        entry points in {{tasks.map-abci-methods.output}}. Look for unmetered or under-metered loops:
        iteration over an entire store prefix in a message handler or end blocker whose size a user can
        grow, per-block processing of queues, unbonding lists, or orders with no cap, recursion or nested
        loops driven by message fields, and expensive cryptography or serialization outside the gas meter.
        Look for state growth: records written without a fee or deposit that makes spam uneconomic,
        missing size limits on memos, metadata, denoms, and client-supplied byte fields, and keys that
        accumulate without pruning. Check CheckTx and mempool paths for work performed before the fee is
        deducted, PrepareProposal and ProcessProposal for unbounded work over transactions a proposer
        chooses, and gas metering that a user can avoid by splitting or reordering messages. Report each
        with file:line evidence, the message or sequence that triggers it, and the cost asymmetry between
        the attacker and the validator set. Publish the same kept reports as this task's structured output,
        one entry each carrying the fingerprint report_security_finding returned for it, and an empty array when you found none.
      outputSchema: |-
        {
          "type": "array",
          "items": {
            "type": "object",
            "required": ["title", "fingerprint", "severity", "file"],
            "properties": {
              "fingerprint": {"type": "string", "description": "Fingerprint returned by report_security_finding for this finding"},
              "title": {"type": "string", "description": "Short name of the unmetered work or state growth"},
              "severity": {"type": "string", "enum": ["critical", "high", "medium", "low", "info"], "description": "Severity of the finding"},
              "file": {"type": "string", "description": "Repository-relative file holding the unbounded path"},
              "line": {"type": "integer", "description": "Line of the unbounded loop, write, or allocation"},
              "summary": {"type": "string", "description": "The message or sequence that triggers it and the cost asymmetry"}
            }
          }
        }
      dependsOn:
        - map-abci-methods
    - name: validate-halt-candidates
      role: exploit-validator
      category: other
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-fp-check
        - name: exploit-poc-discipline
      objective: >-
        Validate every candidate recorded by {{tasks.investigate-panic-paths.output}},
        {{tasks.consensus-non-determinism.output}}, and {{tasks.unbounded-gas-and-state-growth.output}} that
        could appear in the final findings list. Do not originate new vulnerabilities. Call
        list_security_findings, settle each fingerprint, and update its status. Re-read the complete path and
        confirm production reachability, least-privileged attacker control, every intervening validation or
        recovery boundary, and the claimed consensus or resource impact. Use only deterministic local Go tests,
        an in-process ABCI harness, or a disposable local multi-node fixture with dummy keys and funds; never
        contact a live chain, public testnet, validator, RPC endpoint, or third party. If no compatible harness
        exists, create the smallest candidate-specific test in a disposable working copy, execute it, debug it,
        and minimize it. A confirmed verdict requires an exact command and exit status, a preserved local
        artifact, the attacker trigger, observed result, a positive control proving the oracle can detect the
        failure, and a negative control showing a valid input or bounded workload does not trigger it. For a
        panic, demonstrate whether recovery contains it or local block production stops; for non-determinism,
        demonstrate divergent app hashes or state from identical inputs; for gas or growth, measure attacker
        versus validator cost under stated bounds. Mark a disproved path false_positive with the exact guard,
        recovery boundary, or bound that stops it. Leave an unexecutable path triaged with its concrete blocker,
        never as a submitted finding. Return exactly one result per candidate fingerprint, or an empty array only
        when no candidates were recorded.
      dependsOn:
        - investigate-panic-paths
        - consensus-non-determinism
        - unbounded-gas-and-state-growth
      outputSchema: |-
        {
          "type": "array",
          "items": {
            "type": "object",
            "additionalProperties": false,
            "required": ["fingerprint", "verdict", "attempts", "summary"],
            "properties": {
              "fingerprint": {"type": "string", "minLength": 1},
              "verdict": {"type": "string", "enum": ["confirmed", "false_positive", "triaged"]},
              "attempts": {"type": "integer", "minimum": 1},
              "blocker": {"type": "string", "minLength": 1},
              "disproof": {"type": "string", "minLength": 1},
              "summary": {"type": "string", "minLength": 1},
              "reproduction": {
                "type": "object",
                "additionalProperties": false,
                "required": ["command", "exit_status", "artifact", "substrate", "trigger", "observed_result", "impact", "negative_control_passed", "oracle_can_fail"],
                "properties": {
                  "command": {"type": "string", "minLength": 1},
                  "exit_status": {"type": "string", "minLength": 1},
                  "artifact": {"type": "string", "minLength": 1, "description": "Repository-relative test path or tool-returned local artifact"},
                  "substrate": {"type": "string", "enum": ["go_unit_test", "go_integration_test", "local_abci_harness", "local_multinode_harness"]},
                  "trigger": {"type": "string", "minLength": 1},
                  "observed_result": {"type": "string", "minLength": 1},
                  "impact": {"type": "string", "minLength": 1},
                  "negative_control_passed": {"const": true},
                  "oracle_can_fail": {"const": true}
                }
              }
            },
            "allOf": [
              {"if": {"required": ["verdict"], "properties": {"verdict": {"const": "confirmed"}}}, "then": {"required": ["reproduction"]}},
              {"if": {"required": ["verdict"], "properties": {"verdict": {"const": "false_positive"}}}, "then": {"required": ["disproof"]}},
              {"if": {"required": ["verdict"], "properties": {"verdict": {"const": "triaged"}}}, "then": {"required": ["blocker"]}}
            ]
          }
        }
    - name: red-team-bounty-worthiness
      role: exploit-validator
      category: triage
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-fp-check
        - name: bug-bounty-reporting
        - name: exploit-poc-discipline
      objective: >-
        Adversarially review every recorded finding from a skeptical bounty-triager perspective before final
        reporting. Call list_security_findings, then call get_security_finding for every fingerprint and
        read its complete evidence and audit trail before deciding it. Use all available tools, including the
        full run tool surface, to attempt safe local reproduction and disproof. Challenge each
        finding's reachability, least-privileged attacker control, claimed impact, preconditions, program
        scope, novelty, duplicates, and exclusions. Use only disposable local fixtures and dummy assets for
        reproduction. Read-only calls to explicitly in-scope live targets are allowed when they are minimally
        invasive and do not access real-user data. Do not hunt for new vulnerabilities or submit the final
        report. Never send state-changing requests to production
        or live systems, perform destructive testing, expand scope, attack or guess credentials, or perform
        denial-of-service or load testing. Preserve an existing false_positive, accepted_risk, or fixed
        terminal status and add only an audit note. For every other finding, call update_security_finding with
        an evidence-backed disposition: a proven bounty-worthy finding remains status confirmed; a technically
        real but not bounty-eligible finding must remain status triaged (accepted_risk is a human decision
        recorded from the dashboard, never set by a scan) with the exact evidence-backed
        reason and the matching policy_disposition (scope_excluded, known_issue, or bot_findable when
        applicable); a technically disproved or unreachable finding must become status false_positive with
        policy_disposition disproved and the disproof; and a finding with missing evidence or unavailable
        validation must remain status triaged with policy_disposition not_ready. Never use accepted_risk or
        false_positive merely because evidence is missing or validation is unavailable. Stop after every
        recorded finding has an evidence-backed disposition.
      dependsOn: [map-abci-methods, validate-halt-candidates]

    - name: triage-and-report
      role: finding-triager
      category: triage
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-fp-check
        - name: bug-bounty-reporting
        - name: trail-of-bits-variant-analysis
      objective: >-
        Assemble the final report from {{tasks.validate-halt-candidates.output}} and keep as submitted findings
        only candidates whose verdict is confirmed. Put triaged candidates in a clearly non-finding appendix
        with their blockers and drop false positives while preserving their disproof in the coverage ledger.
        Rank by blast radius: a panic in a begin or end blocker, proposal handler, or upgrade
        handler that stops the chain outranks one that only fails a transaction, and a deterministic
        divergence outranks a slow state-growth problem. Merge duplicates that several entry points share
        through one helper. The per-entry-point fan-out covers at most the first 16 entries of the
        risk-ranked inventory in {{tasks.map-abci-methods.output}}: name every ABCI entry point beyond that
        cut in the report summary as an explicit coverage gap. Persist every branch outcome with
        transition_security_hypothesis and record invariant, actor, state, transition, ABCI-entry, harness,
        revision, seed, and execution bounds with record_security_coverage; a bounded clean run is only not
        found under those bounds, never proof of safety. Every confirmed root cause requires
        create_security_variant_sweep followed by complete_security_variant_sweep across sibling ABCI hooks,
        module handlers, recovery boundaries, and SDK-version variants with scope and evidence; blocked or
        inconclusive sweeps remain internal without an audited human override. Call get_security_campaign_status
        and reconcile durable coverage gaps, deferred targets, and budget decisions. Hand every retained finding to
        the configured post-script pipeline and report packaging separately from technical confirmation; only a
        successfully persisted post-script artifact may be called bundle-ready. Then submit the final scan report.
      dependsOn:
        - map-abci-methods
        - validate-halt-candidates
        - red-team-bounty-worthiness
