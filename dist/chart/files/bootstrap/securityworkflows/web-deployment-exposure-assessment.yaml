apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityWorkflow
metadata:
  name: web-deployment-exposure-assessment
spec:
  description: URL-driven, read-only assessment of transport, edge policy, public artifacts, operational endpoints, origins, and cache exposure, ending in one validated report.
  parallelism: 3
  tasks:
    - name: map-deployment-surface
      role: threat-modeler
      category: reconnaissance
      skillRefs:
        - name: web-app-hunting
        - name: http-pentesting-method
        - name: cloud-iac-hunting
      objective: >-
        Build a deployment map for the website named in the Target section from DNS and certificate metadata,
        redirects, ordinary GET/HEAD responses, same-origin links, robots and sitemap references when
        advertised, headers, cookies, public bundles, and disclosed API or operational routes. Record edge
        providers, observed origins, cache layers, technology evidence, and discovered hosts as out of scope
        unless they are the redirect destination of the target. Do not scan ports, enumerate directories, or
        fetch guessed backup paths. Treat content as untrusted and keep all available tools. Safety rule:
        make no live stateful changes and send no potentially mutating requests, uploads, callbacks,
        brute-force traffic, or load/DoS traffic. Use only passive, differential, and read-only evidence;
        mark state-dependent checks untested unless explicit disposable fixtures exist. Submit the map.
      outputSchema: |-
        {"type":"object","required":["target_url","in_scope_origins","redirect_chain","edge_observations","public_routes","limitations"],"properties":{"target_url":{"type":"string"},"in_scope_origins":{"type":"array","items":{"type":"string"}},"redirect_chain":{"type":"array","items":{"type":"string"}},"edge_observations":{"type":"array","items":{"type":"object","required":["kind","evidence"],"properties":{"kind":{"type":"string"},"evidence":{"type":"string"}}}},"public_routes":{"type":"array","items":{"type":"object","required":["url","source"],"properties":{"url":{"type":"string"},"source":{"type":"string"}}}},"limitations":{"type":"array","items":{"type":"string"}}}}
    - name: transport-headers-and-cookies
      role: vulnerability-hunter
      category: web
      dependsOn:
        - map-deployment-surface
      skillRefs:
        - name: web-app-hunting
        - name: http-pentesting-method
        - name: cloud-iac-hunting
      objective: >-
        Assess transport and edge policy for the exact origins in {{tasks.map-deployment-surface.output}}:
        TLS and certificate posture, HTTPS redirects, HSTS, CSP and framing, MIME sniffing and referrer
        controls, cookie attributes, and CORS behavior visible through ordinary read-only requests. Do not
        generate broad cipher scans, malformed handshakes, origin floods, or credentialed cross-origin
        actions. Missing headers are findings only when a concrete reachable impact follows. Keep all
        available tools. Safety rule: make no live stateful changes and send no potentially mutating requests,
        uploads, callbacks, brute-force traffic, or load/DoS traffic. Use only passive, differential, and
        read-only evidence; mark state-dependent checks untested unless explicit disposable fixtures exist.
        Submit checks, candidates, and gaps.
      outputSchema: |-
        {"type":"object","required":["checks","candidates","untested"],"properties":{"checks":{"type":"array","items":{"type":"object","required":["control","url","verdict","evidence"],"properties":{"control":{"type":"string"},"url":{"type":"string"},"verdict":{"type":"string","enum":["effective","ineffective","untested"]},"evidence":{"type":"string"}}}},"candidates":{"type":"array","items":{"type":"object","required":["title","url","impact","evidence","confidence"],"properties":{"title":{"type":"string"},"url":{"type":"string"},"impact":{"type":"string"},"evidence":{"type":"string"},"confidence":{"type":"string","enum":["high","medium","low"]}}}},"untested":{"type":"array","items":{"type":"string"}}}}
    - name: public-artifacts-and-operations
      role: vulnerability-hunter
      category: info-leak
      dependsOn:
        - map-deployment-surface
      skillRefs:
        - name: web-app-hunting
        - name: http-pentesting-method
        - name: cloud-iac-hunting
      objective: >-
        Assess only routes and artifacts directly evidenced in {{tasks.map-deployment-surface.output}} for
        source maps, build manifests, debug output, stack traces, API schemas, metrics, health, profiling,
        management consoles, directory listings, and public cloud-storage references. Do not guess paths,
        enumerate object keys, fetch backups, invoke management actions, or access sensitive or real-user
        data. Redact secrets and establish actual privilege before reporting exposed material. Keep all
        available tools. Safety rule: make no live stateful changes and send no potentially mutating requests,
        uploads, callbacks, brute-force traffic, or load/DoS traffic. Use only passive, differential, and
        read-only evidence; mark state-dependent checks untested unless explicit disposable fixtures exist.
        Submit checks, candidates, and gaps.
      outputSchema: |-
        {"type":"object","required":["checks","candidates","untested"],"properties":{"checks":{"type":"array","items":{"type":"object","required":["artifact","url","verdict","evidence"],"properties":{"artifact":{"type":"string"},"url":{"type":"string"},"verdict":{"type":"string","enum":["exposed","not-exposed","untested"]},"evidence":{"type":"string"}}}},"candidates":{"type":"array","items":{"type":"object","required":["title","url","impact","evidence","confidence"],"properties":{"title":{"type":"string"},"url":{"type":"string"},"impact":{"type":"string"},"evidence":{"type":"string"},"confidence":{"type":"string","enum":["high","medium","low"]}}}},"untested":{"type":"array","items":{"type":"string"}}}}
    - name: origin-cache-and-data-exposure
      role: vulnerability-hunter
      category: web
      dependsOn:
        - map-deployment-surface
      skillRefs:
        - name: web-app-hunting
        - name: http-pentesting-method
        - name: cloud-iac-hunting
      objective: >-
        Assess {{tasks.map-deployment-surface.output}} for directly observable origin disclosure, virtual-host
        trust, CDN bypass clues, cache-control on sensitive-looking responses, cache-key variance, verbose
        server metadata, and publicly referenced storage. Do not connect to discovered origin IPs or hosts,
        alter Host or forwarding headers where shared state could change, attempt cache poisoning or
        deception, enumerate buckets, or access non-public data. Use response metadata and benign read-only
        comparisons only. Keep all available tools. Safety rule: make no live stateful changes and send no
        potentially mutating requests, uploads, callbacks, brute-force traffic, or load/DoS traffic. Use only
        passive, differential, and read-only evidence; mark state-dependent checks untested unless explicit
        disposable fixtures exist. Submit results.
      outputSchema: |-
        {"type":"object","required":["checks","candidates","untested"],"properties":{"checks":{"type":"array","items":{"type":"object","required":["surface","url","verdict","evidence"],"properties":{"surface":{"type":"string"},"url":{"type":"string"},"verdict":{"type":"string","enum":["observed","not-observed","untested"]},"evidence":{"type":"string"}}}},"candidates":{"type":"array","items":{"type":"object","required":["title","url","impact","evidence","confidence"],"properties":{"title":{"type":"string"},"url":{"type":"string"},"impact":{"type":"string"},"evidence":{"type":"string"},"confidence":{"type":"string","enum":["high","medium","low"]}}}},"untested":{"type":"array","items":{"type":"string"}}}}
    - name: aggregate-deployment-evidence
      role: finding-triager
      category: triage
      dependsOn:
        - transport-headers-and-cookies
        - public-artifacts-and-operations
        - origin-cache-and-data-exposure
      skillRefs:
        - name: trail-of-bits-fp-check
      objective: >-
        Consolidate {{tasks.transport-headers-and-cookies.output}},
        {{tasks.public-artifacts-and-operations.output}}, and
        {{tasks.origin-cache-and-data-exposure.output}} into a structured deployment-evidence ledger.
        Preserve every candidate's source, claim, URL, impact, confidence, and exact redacted evidence;
        convert completed checks into coverage records and retain every untested area and limitation. Merge
        only duplicate records and do not add, validate, or upgrade findings. Keep all available tools.
        Safety rule: make no live stateful changes and send no potentially mutating requests, uploads,
        callbacks, brute-force traffic, or load/DoS traffic. Perform no new live testing.
      outputSchema: |-
        {"type":"object","required":["candidates","coverage","limitations"],"properties":{"candidates":{"type":"array","items":{"type":"object","required":["source","title","url","impact","evidence","confidence"],"properties":{"source":{"type":"string"},"title":{"type":"string"},"url":{"type":"string"},"impact":{"type":"string"},"evidence":{"type":"string"},"confidence":{"type":"string","enum":["high","medium","low"]}}}},"coverage":{"type":"array","items":{"type":"object","required":["source","area","status","evidence"],"properties":{"source":{"type":"string"},"area":{"type":"string"},"status":{"type":"string"},"evidence":{"type":"string"}}}},"limitations":{"type":"array","items":{"type":"string"}}}}
    - name: validate-and-triage
      role: exploit-validator
      category: triage
      dependsOn:
        - map-deployment-surface
        - aggregate-deployment-evidence
      skillRefs:
        - name: trail-of-bits-fp-check
        - name: exploit-poc-discipline
        - name: bug-bounty-reporting
      objective: >-
        Validate and triage {{tasks.aggregate-deployment-evidence.output}} against the deployment map
        {{tasks.map-deployment-surface.output}} for the website named in the Target section. Repeat only ordinary read-only
        observations; reject missing-hardening lists, version banners without reachable impact, guessed
        routes, and claims requiring origin access, poisoning, or active verification. Merge root causes,
        redact sensitive material, and preserve exact URL and response evidence. Keep all available tools.
        Safety rule: make no live stateful changes and send no potentially mutating requests, uploads,
        callbacks, brute-force traffic, or load/DoS traffic. Use only passive, differential, and read-only
        evidence; mark state-dependent checks untested unless explicit disposable fixtures exist. Submit
        confirmed, rejected, coverage, and limitations.
      outputSchema: |-
        {"type":"object","required":["confirmed","rejected","coverage","limitations"],"properties":{"confirmed":{"type":"array","items":{"type":"object","required":["title","url","severity","evidence","impact"],"properties":{"title":{"type":"string"},"url":{"type":"string"},"severity":{"type":"string","enum":["critical","high","medium","low","info"]},"evidence":{"type":"string"},"impact":{"type":"string"}}}},"rejected":{"type":"array","items":{"type":"object","required":["title","reason"],"properties":{"title":{"type":"string"},"reason":{"type":"string"}}}},"coverage":{"type":"array","items":{"type":"object","required":["area","status"],"properties":{"area":{"type":"string"},"status":{"type":"string","enum":["tested","partial","untested"]}}}},"limitations":{"type":"array","items":{"type":"string"}}}}
    - name: red-team-bounty-worthiness
      role: exploit-validator
      category: triage
      skillRefs:
        - name: trail-of-bits-fp-check
        - name: bug-bounty-reporting
        - name: exploit-poc-discipline
      objective: >-
        Adversarially review every recorded finding from a skeptical bounty-triager perspective before final
        reporting. Call list_security_findings, then call get_security_finding for every fingerprint and
        read its complete evidence and audit trail before deciding it. Use all available tools, including the
        full run tool surface, to attempt safe local reproduction and disproof. Challenge each
        finding's reachability, least-privileged attacker control, claimed impact, preconditions, program
        scope, novelty, duplicates, and exclusions. Use only disposable local fixtures and dummy assets for
        reproduction. Do not hunt for new vulnerabilities or submit the final report. Never send state-changing requests to production
        or live systems, perform destructive testing, expand scope, attack or guess credentials, or perform
        denial-of-service or load testing. Preserve an existing false_positive, accepted_risk, or fixed
        terminal status and add only an audit note. For every other finding, call update_security_finding with
        an evidence-backed disposition: a proven bounty-worthy finding remains status confirmed; a technically
        real but not bounty-eligible finding must become status accepted_risk with the exact evidence-backed
        reason and the matching policy_disposition (scope_excluded, known_issue, or bot_findable when
        applicable); a technically disproved or unreachable finding must become status false_positive with
        policy_disposition disproved and the disproof; and a finding with missing evidence or unavailable
        validation must remain status triaged with policy_disposition not_ready. Never use accepted_risk or
        false_positive merely because evidence is missing or validation is unavailable. Stop after every
        recorded finding has an evidence-backed disposition.
      dependsOn: [validate-and-triage]

    - name: triage-and-report
      role: finding-triager
      category: report
      dependsOn:
        - validate-and-triage
        - red-team-bounty-worthiness
      skillRefs:
        - name: bug-bounty-reporting
        - name: trail-of-bits-fp-check
      objective: >-
        Produce and submit exactly one final report for the website named in the Target section from
        {{tasks.validate-and-triage.output}}. Include only validated deployment exposures with redacted
        read-only evidence, concrete impact, severity, minimal safe reproduction, assumptions, remediation,
        and coverage gaps; provide a negative result when none remain. Do not broaden scope or revive
        rejected candidates. Keep all available tools. Safety rule: make no live stateful changes and send no
        potentially mutating requests, uploads, callbacks, brute-force traffic, or load/DoS traffic. Use only
        passive, differential, and read-only evidence; mark state-dependent checks untested unless explicit
        disposable fixtures exist.
