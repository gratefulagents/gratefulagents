apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityWorkflow
metadata:
  name: smart-contract-review
  annotations:
    # The prior shipped workflow after the removed maxFindings field is
    # represented by current API types. Allow this exact untouched version to
    # advance even though its pre-removal recorded hash no longer matches.
    platform.gratefulagents.dev/bootstrap-replaces-spec-hashes: 5a9a7929c802fd7f10d418c1f3b08341df62ce7e3fb4f7e073391a2ddfa97386
spec:
  description: Complete EVM smart-contract review lifecycle covering structured scope and deployment mapping, architecture and entry points, explicit invariants, reproducible builds and source-to-deployment comparison, executable Aderyn and seeded Forge checks, specialist manual review, formal-method applicability, local exploit validation, privileged configuration, coverage accounting, remediation, retesting, and one final triage report.
  parallelism: 6
  tasks:
    - name: inventory-scope-repositories-deployments
      role: threat-modeler
      category: recon
      skillRefs:
        - name: trail-of-bits-audit-context-building
        - name: trail-of-bits-entry-point-analyzer
      tools:
        denied:
          - Bash
      objective: >-
        Establish the exact EVM review scope before hunting. Follow production wiring and publish one
        structured object containing: the immutable revision and stated inclusions/exclusions; every
        contract project root and repository component, framework, manifests, source/test/script/artifact
        roots, dependency locks, compiler configuration, and whether it is production-relevant; and every
        known deployment from manifests, scripts, address books, explorer metadata, or documentation.
        Deployment records must include chain id/network, address when available, contract and artifact,
        proxy/implementation/admin relationship, constructor or initializer source, and an availability
        status. Distinguish absent information from evidence that no deployment exists. Do not infer that
        documentation is authoritative and do not report vulnerabilities in this mapping task. Submit the
        complete inventory for all later stages; use empty arrays plus an explicit limitation rather than
        silently omitting an unavailable class of data.
      outputSchema: |-
        {
          "type": "object",
          "required": ["scope", "repositories", "deployments", "limitations"],
          "properties": {
            "scope": {
              "type": "object",
              "required": ["revision", "in_scope", "out_of_scope"],
              "properties": {
                "revision": {"type": "string"},
                "in_scope": {"type": "array", "items": {"type": "string"}},
                "out_of_scope": {"type": "array", "items": {"type": "string"}}
              }
            },
            "repositories": {
              "type": "array",
              "items": {
                "type": "object",
                "required": ["project_root", "framework", "manifests", "source_roots", "test_roots", "artifact_roots", "production_relevance"],
                "properties": {
                  "project_root": {"type": "string"},
                  "framework": {"type": "string"},
                  "manifests": {"type": "array", "items": {"type": "string"}},
                  "source_roots": {"type": "array", "items": {"type": "string"}},
                  "test_roots": {"type": "array", "items": {"type": "string"}},
                  "script_roots": {"type": "array", "items": {"type": "string"}},
                  "artifact_roots": {"type": "array", "items": {"type": "string"}},
                  "dependency_locks": {"type": "array", "items": {"type": "string"}},
                  "compiler_config": {"type": "array", "items": {"type": "string"}},
                  "production_relevance": {"type": "string"}
                }
              }
            },
            "deployments": {
              "type": "array",
              "items": {
                "type": "object",
                "required": ["network", "contract", "artifact", "kind", "availability"],
                "properties": {
                  "network": {"type": "string"},
                  "chain_id": {"type": "string"},
                  "address": {"type": "string"},
                  "contract": {"type": "string"},
                  "artifact": {"type": "string"},
                  "kind": {"type": "string", "enum": ["direct", "proxy", "implementation", "beacon", "diamond", "clone", "factory", "unknown"]},
                  "implementation": {"type": "string"},
                  "admin": {"type": "string"},
                  "initialization_source": {"type": "string"},
                  "availability": {"type": "string", "enum": ["available", "partial", "unavailable"]}
                }
              }
            },
            "limitations": {"type": "array", "items": {"type": "string"}}
          }
        }

    - name: map-architecture-assets-roles-entrypoints
      role: threat-modeler
      category: recon
      skillRefs:
        - name: trail-of-bits-audit-context-building
        - name: trail-of-bits-entry-point-analyzer
      tools:
        denied:
          - Bash
      objective: >-
        Using {{tasks.inventory-scope-repositories-deployments.output}}, follow actual inheritance,
        registration, factory, proxy, diamond, library, hook, callback, and deployment wiring. Publish a
        structured architecture map of protected assets; actors and roles including owners, multisigs,
        governance, timelocks, guardians, keepers, relayers, bundlers, token holders, and arbitrary users;
        trust boundaries and external dependencies; and every production-reachable state-changing entry
        point. Each entry point must name its contract/symbol and file, caller class and guard, value or
        state affected, external calls/callbacks, deployment reachability, and risk rank. Include receive,
        fallback, constructors/initializers, upgrade and migration hooks, token/NFT receiver hooks,
        signatures/permits, ERC-4337 validation/execution, EIP-7702-sensitive authorization, factories,
        CREATE/CREATE2, and privileged configuration. Exclude test-only harnesses and publish limitations.
        This is an inventory, not a finding task.
      dependsOn:
        - inventory-scope-repositories-deployments
      outputSchema: |-
        {
          "type": "object",
          "required": ["assets", "roles", "trust_boundaries", "external_dependencies", "entrypoints", "limitations"],
          "properties": {
            "assets": {"type": "array", "items": {"type": "object", "required": ["name", "protection_goal"], "properties": {"name": {"type": "string"}, "protection_goal": {"type": "string"}}}},
            "roles": {"type": "array", "items": {"type": "object", "required": ["role", "capabilities", "trust"], "properties": {"role": {"type": "string"}, "capabilities": {"type": "array", "items": {"type": "string"}}, "trust": {"type": "string"}}}},
            "trust_boundaries": {"type": "array", "items": {"type": "string"}},
            "external_dependencies": {"type": "array", "items": {"type": "object", "required": ["name", "assumption"], "properties": {"name": {"type": "string"}, "assumption": {"type": "string"}}}},
            "entrypoints": {
              "type": "array",
              "items": {
                "type": "object",
                "required": ["id", "contract", "symbol", "file", "caller", "guard", "state_or_value", "external_interactions", "deployment_reachability", "risk_rank"],
                "properties": {
                  "id": {"type": "string"},
                  "contract": {"type": "string"},
                  "symbol": {"type": "string"},
                  "file": {"type": "string"},
                  "caller": {"type": "string"},
                  "guard": {"type": "string"},
                  "state_or_value": {"type": "string"},
                  "external_interactions": {"type": "array", "items": {"type": "string"}},
                  "deployment_reachability": {"type": "string"},
                  "risk_rank": {"type": "integer", "minimum": 1}
                }
              }
            },
            "limitations": {"type": "array", "items": {"type": "string"}}
          }
        }

    - name: define-security-invariants
      role: threat-modeler
      category: logic-flaw
      skillRefs:
        - name: trail-of-bits-property-based-testing
        - name: trail-of-bits-dimensional-analysis
        - name: evm-economic-and-mev-review
      tools:
        denied:
          - Bash
      objective: >-
        Derive explicit, falsifiable security properties from
        {{tasks.inventory-scope-repositories-deployments.output}} and
        {{tasks.map-architecture-assets-roles-entrypoints.output}}. Cover system-wide conservation and
        solvency, assets versus liabilities and bad debt, share/asset exchange rates and rounding direction,
        total supply and per-user accounting, authorization and role separation, nonce/domain/replay rules,
        lifecycle and initialization, upgrade/storage compatibility, oracle freshness/deviation, liquidation
        health and incentives, auction settlement, rewards/interest monotonicity, queue progress, bounded
        work/state growth, callback atomicity, and cross-contract/deployment consistency. For each invariant
        identify assets, actors, state variables, transitions that may break it, and a concrete assertion or
        test oracle. Mark assumptions and applicability; do not claim a property was tested here. Submit the
        invariant portfolio for build, manual, fuzz, formal, validation, and coverage stages.
      dependsOn:
        - inventory-scope-repositories-deployments
        - map-architecture-assets-roles-entrypoints
      outputSchema: |-
        {
          "type": "array",
          "items": {
            "type": "object",
            "required": ["id", "domain", "property", "assets", "actors", "state", "transitions", "oracle", "applicability"],
            "properties": {
              "id": {"type": "string"},
              "domain": {"type": "string"},
              "property": {"type": "string"},
              "assets": {"type": "array", "items": {"type": "string"}},
              "actors": {"type": "array", "items": {"type": "string"}},
              "state": {"type": "array", "items": {"type": "string"}},
              "transitions": {"type": "array", "items": {"type": "string"}},
              "oracle": {"type": "string"},
              "assumptions": {"type": "array", "items": {"type": "string"}},
              "applicability": {"type": "string", "enum": ["applicable", "not_applicable", "unknown"]}
            }
          }
        }

    - name: reproducible-build-artifact-deployment-review
      role: security-reviewer
      category: supply-chain
      skillRefs:
        - name: trail-of-bits-audit-prep-assistant
        - name: trail-of-bits-supply-chain-risk-auditor
        - name: evm-low-level-and-deployment-review
      tools:
        denied:
          - Bash
      objective: >-
        Review the build and release evidence in {{tasks.inventory-scope-repositories-deployments.output}},
        architecture in {{tasks.map-architecture-assets-roles-entrypoints.output}}, and properties in
        {{tasks.define-security-invariants.output}} without pretending that static inspection executed a
        build. Record exact Solidity/Vyper compiler versions and pragma compatibility, optimizer runs,
        via-IR, EVM version, metadata settings, remappings, dependency/solc locks, generated sources,
        libraries, build scripts, CI and verification inputs. Determine whether the repository supplies a
        reproducible offline build recipe. Where artifacts or deployment data exist, compare source names,
        ABI/selectors, creation/runtime bytecode metadata, link references, immutables, constructor arguments,
        proxy implementation slots, and verification metadata as far as available; clearly separate an
        observed match, mismatch, and unavailable comparison. Report concrete build/deployment defects with
        file:line evidence. Submit one record per project/deployment with status examined, skipped,
        unsupported, or inconclusive and never call an unexecuted build successful.
      dependsOn:
        - inventory-scope-repositories-deployments
        - map-architecture-assets-roles-entrypoints
        - define-security-invariants
      outputSchema: |-
        {
          "type": "array",
          "items": {
            "type": "object",
            "required": ["area", "status", "build_reproducibility", "source_artifact_deployment", "summary"],
            "properties": {
              "area": {"type": "string"},
              "status": {"type": "string", "enum": ["examined", "skipped", "unsupported", "inconclusive"]},
              "build_reproducibility": {"type": "string", "enum": ["established", "not_established", "not_attempted", "inconclusive"]},
              "source_artifact_deployment": {"type": "string", "enum": ["matched", "mismatched", "partial", "unavailable", "inconclusive"]},
              "compiler": {"type": "string"},
              "evidence": {"type": "array", "items": {"type": "string"}},
              "summary": {"type": "string"}
            }
          }
        }

    - name: aderyn-static-analysis
      role: vulnerability-hunter
      category: other
      skillRefs:
        - name: security-scan
        - name: trail-of-bits-fp-check
      tools:
        denied:
          - Bash
      objective: >-
        Use {{tasks.inventory-scope-repositories-deployments.output}} and
        {{tasks.reproducible-build-artifact-deployment-review.output}} to identify each applicable Solidity
        project root. For each applicable root, actually call run_security_tool exactly once with tool
        `aderyn`, target type `solidity_project`, locator equal to that workspace project root, and target
        revision equal to the scan's immutable revision. Supply no invented arguments or seed. Correlate
        normalized Aderyn findings with reachable production code and the entry-point map in
        {{tasks.map-architecture-assets-roles-entrypoints.output}}; do not re-submit tool findings. If no
        Solidity project exists, publish skipped/not_applicable. If run_security_tool is absent, rejects the
        target, errors, or times out, publish unsupported or inconclusive with the exact returned status and
        limitation; never say Aderyn ran, passed, or found nothing. A completed pass means only that this
        pinned Aderyn run emitted no findings, not that the contracts are safe. Submit one coverage record per
        project including execution status and artifact/replay references when returned.
      dependsOn:
        - inventory-scope-repositories-deployments
        - map-architecture-assets-roles-entrypoints
        - reproducible-build-artifact-deployment-review
      outputSchema: |-
        {
          "type": "array",
          "items": {
            "type": "object",
            "required": ["area", "status", "execution_status", "summary"],
            "properties": {
              "area": {"type": "string"},
              "status": {"type": "string", "enum": ["examined", "skipped", "unsupported", "inconclusive"]},
              "execution_status": {"type": "string", "enum": ["pass", "findings", "error", "timeout", "partial", "not_applicable", "not_run"]},
              "tool_run": {"type": "string"},
              "artifacts": {"type": "array", "items": {"type": "string"}},
              "summary": {"type": "string"}
            }
          }
        }

    - name: slither-static-analysis
      role: vulnerability-hunter
      category: other
      skillRefs:
        - name: security-scan
        - name: trail-of-bits-fp-check
      tools:
        denied:
          - Bash
      objective: >-
        Use {{tasks.inventory-scope-repositories-deployments.output}} and
        {{tasks.reproducible-build-artifact-deployment-review.output}} to identify each applicable offline
        Solidity project root. For every applicable root, actually call run_security_tool exactly once with
        tool `slither`, target type `solidity_project`, locator equal to that project root, and target revision
        equal to the immutable scan revision. Supply no raw flags, seed, RPC endpoint, or package-download
        request. The pinned multi-architecture Slither 0.11.3 root runs with network disabled against an
        ephemeral writable copy of the digest-verified project. Record compiler/remapping availability,
        normalized findings, exact execution status, artifacts, and limitations. A missing pinned compiler or
        offline dependency closure is unsupported; error, timeout, and partial output are inconclusive; no
        Solidity root is skipped/not_applicable. A pass means only that this exact Slither run emitted no
        detector result. Do not re-submit tool findings or claim a broader clean bill of health.
      dependsOn:
        - inventory-scope-repositories-deployments
        - reproducible-build-artifact-deployment-review
      outputSchema: |-
        {
          "type": "array",
          "items": {
            "type": "object",
            "required": ["area", "status", "execution_status", "summary"],
            "properties": {
              "area": {"type": "string"},
              "status": {"type": "string", "enum": ["examined", "skipped", "unsupported", "inconclusive"]},
              "execution_status": {"type": "string", "enum": ["pass", "findings", "error", "timeout", "partial", "not_applicable", "not_run"]},
              "tool_run": {"type": "string"},
              "artifacts": {"type": "array", "items": {"type": "string"}},
              "summary": {"type": "string"}
            }
          }
        }

    - name: merge-solidity-static-analysis
      role: finding-triager
      category: triage
      tools:
        denied:
          - Bash
      objective: >-
        Compact {{tasks.aderyn-static-analysis.output}} and {{tasks.slither-static-analysis.output}} into one
        lossless static-analysis coverage array.
        Preserve every project, exact execution_status, tool_run, artifacts, limitations, and finding status.
        Emit seed 0 and empty bounds and harnesses because these static analyzers expose none. Never turn a
        skipped, unsupported, error, timeout, or partial run into examined coverage.
      dependsOn:
        - aderyn-static-analysis
        - slither-static-analysis
      outputSchema: |-
        {"type":"array","items":{"type":"object","required":["area","status","basis","execution_status","tool_run","seed","bounds","harnesses","artifacts","summary"],"properties":{"area":{"type":"string"},"status":{"type":"string","enum":["examined","skipped","unsupported","inconclusive"]},"basis":{"type":"array","items":{"type":"string"}},"execution_status":{"type":"string","enum":["not_run","pass","findings","error","timeout","partial","not_applicable"]},"tool_run":{"type":"string"},"seed":{"type":"integer"},"bounds":{"type":"array","items":{"type":"string"}},"harnesses":{"type":"array","items":{"type":"string"}},"artifacts":{"type":"array","items":{"type":"string"}},"summary":{"type":"string"}}}}

    - name: deterministic-forge-tests-and-invariants
      role: test-engineer
      category: logic-flaw
      skillRefs:
        - name: security-scan
        - name: trail-of-bits-property-based-testing
        - name: exploit-poc-discipline
      tools:
        denied:
          - Bash
      objective: >-
        Use {{tasks.inventory-scope-repositories-deployments.output}},
        {{tasks.define-security-invariants.output}}, and
        {{tasks.reproducible-build-artifact-deployment-review.output}} to identify Foundry project roots and
        existing unit, fuzz, invariant, fork, differential, and regression tests. For every applicable root,
        actually call run_security_tool exactly once with tool `forge-security-tests`, target type
        `foundry_project`, locator equal to that workspace root, target revision equal to the immutable scan
        revision, and the fixed seed `2062026`. Do not invent raw Forge flags. Record the seed, pinned tool and
        target references, tests/harnesses discovered, executed result, failures, and coverage limitations.
        The registered runner is offline and single-threaded. Detect project-local allocs or full-genesis
        fixtures and the harnesses that call `vm.loadAllocs`; record fixture paths and digests, source chain ID,
        immutable source block number/hash, timestamp, and state-completeness limitations. Such bounded local
        state replay is examined when the harness executes it. Tests using `createFork`/`createSelectFork`,
        remote RPC aliases, missing state, staged RPC caches, or raw Anvil persistence snapshots are
        unsupported, not passed. If the tool or a compatible Foundry project is unavailable, publish skipped or unsupported
        with execution_status not_run/not_applicable. Error, timeout, partial, setup failure, and a bounded
        fuzz run with no crash remain inconclusive coverage and never prove safety or an invariant not encoded
        by the harness.
      dependsOn:
        - inventory-scope-repositories-deployments
        - define-security-invariants
        - reproducible-build-artifact-deployment-review
      outputSchema: |-
        {
          "type": "array",
          "items": {
            "type": "object",
            "required": ["area", "status", "execution_status", "seed", "harnesses", "state_mode", "fixture_paths", "fixture_digests", "state_limitations", "summary"],
            "properties": {
              "area": {"type": "string"},
              "status": {"type": "string", "enum": ["examined", "skipped", "unsupported", "inconclusive"]},
              "execution_status": {"type": "string", "enum": ["pass", "findings", "error", "timeout", "partial", "not_applicable", "not_run"]},
              "seed": {"type": "integer"},
              "harnesses": {"type": "array", "items": {"type": "string"}},
              "state_mode": {"type": "string", "enum": ["none", "local_allocs", "rpc_required", "raw_anvil_snapshot", "unknown"]},
              "fixture_paths": {"type": "array", "items": {"type": "string"}},
              "fixture_digests": {"type": "array", "items": {"type": "string"}},
              "chain_context": {"type": "object", "properties": {"chain_id": {"type": "integer"}, "block_number": {"type": "integer"}, "block_hash": {"type": "string"}, "timestamp": {"type": "integer"}}},
              "state_limitations": {"type": "array", "items": {"type": "string"}},
              "invariants_exercised": {"type": "array", "items": {"type": "string"}},
              "uncovered_targets": {"type": "array", "items": {"type": "string"}},
              "tool_run": {"type": "string"},
              "artifacts": {"type": "array", "items": {"type": "string"}},
              "summary": {"type": "string"}
            }
          }
        }

    - name: echidna-stateful-property-fuzzing
      role: test-engineer
      category: logic-flaw
      skillRefs:
        - name: security-scan
        - name: trail-of-bits-property-based-testing
        - name: trail-of-bits-harness-writing
        - name: trail-of-bits-coverage-analysis
      tools:
        denied:
          - Bash
      objective: >-
        Use {{tasks.inventory-scope-repositories-deployments.output}},
        {{tasks.define-security-invariants.output}}, and
        {{tasks.reproducible-build-artifact-deployment-review.output}} to locate existing Echidna property or
        assertion harnesses and their configured target contracts. For every applicable project root, actually
        call run_security_tool with tool `echidna`, target type `solidity_project`, that workspace root and
        immutable revision, and fixed seed `2062026`. The registered wrapper fixes one worker, 10,000 test
        sequences, sequence length 32, shrink limit 5,000, JSON output, no Slither subprocess, and no
        caller-configurable RPC or FFI; do not invent scanner flags. Correlate falsified properties and
        minimized transaction sequences with the invariant portfolio and preserve replay/artifact references.
        Record harnesses, properties, seed, targets and coverage limitations. Missing harnesses are skipped,
        an unavailable compiler/build is unsupported, and error/timeout/partial results are inconclusive. A bounded clean campaign proves only
        that those harnesses found no violation under that seed and bound; it never proves contract safety.
      dependsOn:
        - inventory-scope-repositories-deployments
        - define-security-invariants
        - reproducible-build-artifact-deployment-review
      outputSchema: |-
        {
          "type": "array",
          "items": {
            "type": "object",
            "required": ["area", "status", "execution_status", "seed", "harnesses", "summary"],
            "properties": {
              "area": {"type": "string"},
              "status": {"type": "string", "enum": ["examined", "skipped", "unsupported", "inconclusive"]},
              "execution_status": {"type": "string", "enum": ["pass", "findings", "error", "timeout", "partial", "not_applicable", "not_run"]},
              "seed": {"type": "integer"},
              "harnesses": {"type": "array", "items": {"type": "string"}},
              "properties_exercised": {"type": "array", "items": {"type": "string"}},
              "uncovered_targets": {"type": "array", "items": {"type": "string"}},
              "tool_run": {"type": "string"},
              "artifacts": {"type": "array", "items": {"type": "string"}},
              "summary": {"type": "string"}
            }
          }
        }

    - name: bounded-mythril-symbolic-analysis
      role: vulnerability-hunter
      category: logic-flaw
      skillRefs:
        - name: security-scan
        - name: trail-of-bits-fp-check
        - name: evm-low-level-and-deployment-review
      tools:
        denied:
          - Bash
      objective: >-
        Use {{tasks.inventory-scope-repositories-deployments.output}},
        {{tasks.map-architecture-assets-roles-entrypoints.output}}, and
        {{tasks.reproducible-build-artifact-deployment-review.output}} to select production Solidity contract
        source files or EVM bytecode files for bounded symbolic analysis. For each selected single-file target,
        actually call run_security_tool with tool `mythril`, target type `solidity_contract` or `evm_bytecode`
        matching the file, its workspace locator and immutable revision. Do not invent flags: the pinned
        multi-architecture wrapper runs offline breadth-first search with fixed transaction, depth, call,
        loop, solver and time bounds. Correlate normalized SWC issues and transaction counterexamples with
        reachable entry points and manually validate them; do not re-submit tool findings. Record every
        selected and omitted contract and the bound that limits the claim. A clean bounded result is partial
        symbolic coverage only. Compiler absence, unsupported multi-file imports, tool error, timeout or
        native success=false are unsupported/inconclusive rather than passes.
      dependsOn:
        - inventory-scope-repositories-deployments
        - map-architecture-assets-roles-entrypoints
        - reproducible-build-artifact-deployment-review
      outputSchema: |-
        {
          "type": "array",
          "items": {
            "type": "object",
            "required": ["area", "status", "execution_status", "bounds", "summary"],
            "properties": {
              "area": {"type": "string"},
              "status": {"type": "string", "enum": ["examined", "skipped", "unsupported", "inconclusive"]},
              "execution_status": {"type": "string", "enum": ["pass", "findings", "error", "timeout", "partial", "not_applicable", "not_run"]},
              "target_type": {"type": "string"},
              "bounds": {"type": "array", "items": {"type": "string"}},
              "counterexamples": {"type": "array", "items": {"type": "string"}},
              "tool_run": {"type": "string"},
              "artifacts": {"type": "array", "items": {"type": "string"}},
              "summary": {"type": "string"}
            }
          }
        }

    - name: external-calls-reentrancy-and-atomicity
      role: vulnerability-hunter
      category: logic-flaw
      skillRefs:
        - name: trail-of-bits-secure-workflow-guide
        - name: trail-of-bits-entry-point-analyzer
      tools:
        denied:
          - Bash
      objective: >-
        Audit the full call graph from {{tasks.map-architecture-assets-roles-entrypoints.output}} against
        {{tasks.define-security-invariants.output}} and the reviewed build context in
        {{tasks.reproducible-build-artifact-deployment-review.output}}. Enumerate call, delegatecall,
        staticcall, ETH sends, token/NFT transfers, hooks, flash-loan callbacks, routers, settlement callbacks,
        multicalls, fallback/receive, and user-selected callees. Hunt single-function, cross-function,
        cross-contract, callback, initialization, and read-only reentrancy; stale-state observations;
        inconsistent guards; effects after interaction; partial failures; unchecked returns; returndata/revert
        bombs; gas assumptions; and delegatecall target control. Report only concrete attacker sequences with
        file:line evidence and the invariant/value impact. Submit coverage for every relevant call class,
        including explicit skipped, unsupported, or inconclusive areas.
      dependsOn:
        - map-architecture-assets-roles-entrypoints
        - define-security-invariants
        - reproducible-build-artifact-deployment-review
      outputSchema: |-
