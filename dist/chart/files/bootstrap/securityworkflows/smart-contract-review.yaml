    - name: triage-and-report
      role: finding-triager
      category: triage
      skillRefs:
        - name: trail-of-bits-fp-check
        - name: bug-bounty-reporting
        - name: evm-economic-and-mev-review
        - name: evm-low-level-and-deployment-review
      tools:
        denied:
          - Bash
      objective: >-
        Perform the workflow's only final triage and reporting pass. Load every recorded finding and reconcile
        it with local validation {{tasks.validate-high-impact-exploits.output}}, lifecycle coverage
        {{tasks.account-lifecycle-coverage.output}}, and remediation/retest guidance
        {{tasks.remediation-and-retest.output}}. Re-read cited code and retain only concrete production-reachable
        attacker paths with file:line evidence, a broken explicit invariant, prerequisites and quantified fund,
        authorization, integrity or liveness impact. Keep confirmed critical/high findings; retain an
        inconclusive candidate only as tentative with its blocker prominent; reject scanner noise, impossible
        state, deliberate trust assumptions and paths stopped by another guard. Merge duplicates by root cause
        and rank direct fund loss/insolvency, unauthorized control/upgrades, permanent freeze, economic/MEV
        extraction and sustained liveness failure by realistic prerequisites. The report must include the
        structured scope and deployment basis, executed Aderyn, Forge, Echidna and Mythril run statuses with
        seed, bounds and artifact references, formal-method limitations, local-validation evidence,
        remediation/retest plan, and every examined,
        skipped, unsupported and inconclusive coverage record. Never describe unavailable or failed tooling
        as executed or passed. Then assemble and submit exactly one final report.
      dependsOn:
        - validate-high-impact-exploits
        - account-lifecycle-coverage
        - remediation-and-retest
