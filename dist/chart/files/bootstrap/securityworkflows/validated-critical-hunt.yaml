apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityWorkflow
metadata:
  name: validated-critical-hunt
spec:
  description: High-signal hunt restricted to remote-compromise vulnerability classes. A history-priors pass seeds six hunts with the project's past bugs, every task records exploitability evidence, a validation pass settles each candidate, confirmed candidates trigger a variant sweep, and triage keeps only findings with a concrete end-to-end exploitation path.
  tasks:
    - name: target-priors
      role: threat-modeler
      category: recon
      timeout: 30m
      maxTurns: 60
      skillRefs:
        - name: trail-of-bits-differential-review
      objective: >-
        Build the history priors for this repository from the checkout alone; do not build or run the project.
        Call get_security_research_context first and reuse only evidence for this exact target and revision;
        note prior false_positive or accepted_risk findings so hunters do not re-report them. Read SECURITY.md,
        advisories and CVEs referenced in the repository, CHANGELOG or release-note security entries, checked-in
        audit reports, and the program snapshot's known issues, and select from the last 200 commits or 12 months
        those whose message or diff fixes a security bug. Keep only priors relevant to remote compromise
        (unauthenticated execution, authentication bypass, mass exfiltration, SSRF, deserialization, credential
        exposure). For each produce one compact prior: what went wrong, the anchor (path plus line or symbol),
        the bug class, and the hunt it suggests (sibling call sites the fix did not touch, or a bypass of the
        patch). Rank most promising first, return at most ten, mark classes the runtime or a past fix now
        forbids as stale, and report nothing as a finding from this task.
      outputSchema: |-
        {"type":"array","maxItems":10,"items":{"type":"object","additionalProperties":false,"required":["id","kind","summary","bug_class","anchor","hunt"],"properties":{"id":{"type":"string","minLength":2,"maxLength":8},"kind":{"type":"string","enum":["advisory_or_cve","security_fix_commit","changelog","prior_audit","known_issue","prior_scan","todo_or_unsafe"]},"summary":{"type":"string","minLength":1,"maxLength":240},"bug_class":{"type":"string","minLength":1,"maxLength":80},"anchor":{"type":"string","minLength":1,"maxLength":240},"commits":{"type":"array","maxItems":4,"items":{"type":"string","minLength":7,"maxLength":64}},"hunt":{"type":"string","minLength":1,"maxLength":300},"stale":{"type":"boolean"}}}}
    - name: unauthenticated-remote-execution
      role: vulnerability-hunter
      category: injection
      skillRefs:
        - name: trail-of-bits-codeql
        - name: exploit-poc-discipline
      objective: >-
        Hunt for remote code execution reachable without valid credentials. Start from the entry points an
        anonymous caller can touch and look for untrusted data reaching an interpreter: shell and subprocess
        invocation built from request values, template or expression engines evaluating user input, dynamic
        code loading (eval, require, import, reflection, plugin paths), file writes that land in an
        executed location (web root, extension or config directory, archive extraction escaping its target),
        and command arguments where an option can be injected. Ignore anything that needs an
        administrator, a local shell, or a developer's machine. For every candidate record the exploitability
        evidence: the exact entry point and request, each hop from source to sink with file:line, the
        preconditions the attacker needs, and the payload shape that would execute. Report nothing you
        cannot walk end to end.
        Start from the history priors in {{tasks.target-priors.output}} that fall in this class: treat each as a
        hypothesis (the same root cause in sibling call sites, or a bypass of the patch) before widening to the
        rest of the surface, and skip stale classes and previously disproved findings. Assume the developer made
        a mistake on the path you are tracing and, for token, signature, and parser code, hunt the delta from
        the canonical secure implementation.
      dependsOn: [target-priors]
    - name: authentication-bypass
      role: vulnerability-hunter
      category: authn
      skillRefs:
        - name: api-authz-hunting
        - name: web-app-hunting
        - name: exploit-poc-discipline
      objective: >-
        Hunt for full authentication bypass: reaching an authenticated or administrative identity without
        the credential. Look for token validation that skips signature, algorithm, audience, issuer, or
        expiry checks; identity taken from a client-supplied header, cookie, or body field that a proxy does
        not strip; session or reset tokens that are guessable, non-expiring, or reusable across accounts;
        comparison logic that fails open on empty, null, or malformed values; guards registered so that a
        route, method, or alternate path never reaches them; and default, seeded, or debug accounts left
        enabled. Ignore weaknesses that only matter after a valid session exists. For every candidate record
        the exploitability evidence: the request an unauthenticated attacker sends, the code at file:line
        that accepts it, the identity obtained, and any precondition (known username, leaked id) it needs.
        Start from the history priors in {{tasks.target-priors.output}} that fall in this class: treat each as a
        hypothesis (the same root cause in sibling call sites, or a bypass of the patch) before widening to the
        rest of the surface, and skip stale classes and previously disproved findings. Assume the developer made
        a mistake on the path you are tracing and, for token, signature, and parser code, hunt the delta from
        the canonical secure implementation.
      dependsOn: [target-priors]
    - name: remote-data-exfiltration
      role: vulnerability-hunter
      category: injection
      skillRefs:
        - name: trail-of-bits-codeql
        - name: exploit-poc-discipline
      objective: >-
        Hunt for mass exfiltration of data an attacker is not entitled to: injection into database, search,
        or storage queries that returns arbitrary rows; identifiers accepted without an ownership or tenant
        predicate on endpoints that return records in bulk; export, backup, report, and admin listing
        endpoints reachable with a weak or absent check; path traversal or object-storage key control
        reading arbitrary files; and cross-tenant reads through shared caches or misscoped queries. Focus on
        volume and sensitivity: one user's profile is not this task's target, every user's credentials or
        every tenant's records is. For every candidate record the exploitability evidence: the request, the
        query or file access at file:line, what returns to the attacker, and the privilege level required.
        Start from the history priors in {{tasks.target-priors.output}} that fall in this class: treat each as a
        hypothesis (the same root cause in sibling call sites, or a bypass of the patch) before widening to the
        rest of the surface, and skip stale classes and previously disproved findings. Assume the developer made
        a mistake on the path you are tracing and, for token, signature, and parser code, hunt the delta from
        the canonical secure implementation.
      dependsOn: [target-priors]
    - name: ssrf-to-internal-services
      role: vulnerability-hunter
      category: ssrf
      skillRefs:
        - name: web-app-hunting
        - name: exploit-poc-discipline
      objective: >-
        Hunt for server-side request forgery that reaches something valuable: cloud instance metadata and
        credential endpoints, internal admin or service APIs, databases and caches speaking text protocols,
        and the container or cluster control plane. Trace every place a URL, host, port, or scheme derives
        from user input or from a record the user controls into an HTTP client, fetcher, renderer, importer,
        or proxy, and check the defenses honestly: allowlists matched on the parsed host, redirects
        re-validated, DNS resolution checked against internal ranges at connection time, non-HTTP schemes
        rejected, and whether the response body, status, or timing returns to the caller. For every
        candidate record the exploitability evidence: the request, the outbound call at file:line, the
        internal target reached, and what the attacker learns or obtains.
        Start from the history priors in {{tasks.target-priors.output}} that fall in this class: treat each as a
        hypothesis (the same root cause in sibling call sites, or a bypass of the patch) before widening to the
        rest of the surface, and skip stale classes and previously disproved findings. Assume the developer made
        a mistake on the path you are tracing and, for token, signature, and parser code, hunt the delta from
        the canonical secure implementation.
      dependsOn: [target-priors]
    - name: deserialization-to-rce
      role: vulnerability-hunter
      category: deserialization
      skillRefs:
        - name: trail-of-bits-codeql
        - name: trail-of-bits-property-based-testing
        - name: exploit-poc-discipline
      objective: >-
        Hunt for untrusted deserialization that leads to code execution or object injection: native
        deserializers and object-constructing YAML loaders fed request, cookie, cache, or queue data;
        session or signed-payload formats decoded before the signature is verified, or verified with a key
        the attacker can obtain; XML parsers with external entities enabled; and prototype or class
        pollution sinks reachable from parsed input. Establish whether a usable gadget exists in the
        dependencies actually installed rather than assuming one. For every candidate record the
        exploitability evidence: the untrusted source, the decoding call at file:line, the gadget or
        constructed object, and what execution or state change follows.
        Start from the history priors in {{tasks.target-priors.output}} that fall in this class: treat each as a
        hypothesis (the same root cause in sibling call sites, or a bypass of the patch) before widening to the
        rest of the surface, and skip stale classes and previously disproved findings. Assume the developer made
        a mistake on the path you are tracing and, for token, signature, and parser code, hunt the delta from
        the canonical secure implementation.
      dependsOn: [target-priors]
    - name: credential-exposure-to-takeover
      role: secrets-auditor
      category: secrets
      skillRefs:
        - name: exploit-poc-discipline
      objective: >-
        Hunt for exposed credential material that hands an attacker a production system: live-looking keys,
        tokens, or private keys committed to the repository or embedded in shipped artifacts and client
        bundles; credentials written into logs, error responses, or telemetry that a lower-privilege party
        can read; signing and encryption keys checked in or derived from constants, letting tokens be
        forged; and credentials reachable through an unauthenticated endpoint. Discard placeholders,
        fixtures, expired or local-only values, and anything that grants nothing. For every candidate
        record the exploitability evidence: the location at file:line, what the credential authenticates to,
        who can read it today, and the takeover it enables.
        Start from the history priors in {{tasks.target-priors.output}} that fall in this class: treat each as a
        hypothesis (the same root cause in sibling call sites, or a bypass of the patch) before widening to the
        rest of the surface, and skip stale classes and previously disproved findings. Assume the developer made
        a mistake on the path you are tracing and, for token, signature, and parser code, hunt the delta from
        the canonical secure implementation.
      dependsOn: [target-priors]
    - name: validate-exploitability
      role: exploit-validator
      category: other
      skillRefs:
        - name: trail-of-bits-fp-check
        - name: exploit-poc-discipline
      objective: >-
        Settle every candidate reported by the six hunts. Take each finding in turn, re-read the code it
        cites, and reconstruct the attack path from the attacker's position to the impact without skipping
        a hop: confirm the entry point is reachable in a production configuration, that each intermediate
        check is genuinely absent or bypassable, and that the final sink does what the report claims. Build
        and execute the cheapest local proof that settles the question - a focused harness, a direct call into
        the vulnerable function, or a request against a locally started server. If the project has no suitable
        harness, create the smallest candidate-specific PoC in a disposable working copy, debug it, and minimize
        it; never send traffic to a real system. Confirm only from observed output and preserve exact commands,
        exit statuses, and artifacts. Update each finding with the outcome: confirmed with the reproduction steps and evidence,
        or false_positive with the specific check that stops the attack (false_positive is the canonical status
        for a disproved candidate; never invent a status such as "rejected"). Kill every candidate whose
        path breaks; a disproved finding is as valuable an outcome as a confirmed one. Publish one entry per settled
        candidate as this task's structured output, each carrying the fingerprint of the finding it settles, and an empty array when there was nothing to settle.
      outputSchema: |-
        {
          "type": "array",
          "items": {
            "type": "object",
            "required": ["title", "fingerprint", "verdict", "reproduction", "summary"],
            "properties": {
              "fingerprint": {"type": "string", "description": "Fingerprint returned by report_security_finding for this finding"},
              "title": {"type": "string", "description": "Short name of the candidate finding"},
              "verdict": {"type": "string", "enum": ["confirmed", "false_positive"], "description": "Status set on the finding: confirmed when the attack path holds, false_positive when it is disproved"},
              "severity": {"type": "string", "enum": ["critical", "high", "medium", "low", "info"], "description": "Severity of the finding"},
              "file": {"type": "string", "description": "Repository-relative file the candidate cites"},
              "line": {"type": "integer", "description": "Line the candidate cites"},
              "reproduction": {"type": "array", "items": {"type": "string"}, "description": "Exact local PoC setup, execution, and observed evidence"},
              "summary": {"type": "string", "description": "The reproduction that confirms it, or the check that stops it"}
            }
          }
        }
      dependsOn:
        - unauthenticated-remote-execution
        - authentication-bypass
        - remote-data-exfiltration
        - ssrf-to-internal-services
        - deserialization-to-rce
        - credential-exposure-to-takeover
    - name: variant-sweep
      role: vulnerability-hunter
      category: other
      timeout: 30m
      maxTurns: 60
      skillRefs:
        - name: trail-of-bits-variant-analysis
      objective: >-
        Variant analysis for one settled candidate: {{item.title}} ({{item.verdict}}) at {{item.file}}. If the
        verdict is false_positive, submit an empty array immediately and stop. Otherwise call
        get_security_finding for fingerprint {{item.fingerprint}}, extract the exact vulnerable pattern from
        its evidence (the sink, the missing or bypassable check, and the shape of attacker-controlled input),
        and search the whole in-scope codebase for siblings: start with an exact-match pattern that must hit
        the confirmed site, then generalize one element at a time (same sink other callers, same guard other
        routes, same parser other formats), stopping when more than half the matches are noise. For each
        sibling, trace reachability from the same remote attacker position before reporting it; a pattern
        match without a path is not a variant. Report each real variant with report_security_finding, cite the
        original finding in references, and publish the kept reports as structured output carrying their
        fingerprints, or an empty array when the root cause has no siblings.
      outputSchema: |-
        {"type":"array","items":{"type":"object","required":["title","fingerprint","severity","file"],"properties":{"fingerprint":{"type":"string"},"title":{"type":"string"},"severity":{"type":"string","enum":["critical","high","medium","low","info"]},"file":{"type":"string"},"line":{"type":"integer"},"summary":{"type":"string"}}}}
      dependsOn:
        - validate-exploitability
      forEach: validate-exploitability
      maxInstances: 6
    - name: red-team-bounty-worthiness
      role: exploit-validator
      category: triage
      skillRefs:
        - name: trail-of-bits-fp-check
        - name: bug-bounty-reporting
        - name: exploit-poc-discipline
      objective: >-
        Adversarially review every recorded finding from a skeptical bounty-triager perspective before final
        reporting. Call list_security_findings, then call get_security_finding for every fingerprint and
        read its complete evidence and audit trail before deciding it. Use all available tools, including the
        full run tool surface, to attempt safe local reproduction and disproof. Challenge each
        finding's reachability, least-privileged attacker control, claimed impact, preconditions, program
        scope, novelty, duplicates, and exclusions. Use only disposable local fixtures and dummy assets for
        reproduction. Read-only calls to explicitly in-scope live targets are allowed when they are minimally
        invasive and do not access real-user data. Do not hunt for new vulnerabilities or submit the final
        report. Never send state-changing requests to production
        or live systems, perform destructive testing, expand scope, attack or guess credentials, or perform
        denial-of-service or load testing. Preserve an existing false_positive, accepted_risk, or fixed
        terminal status and add only an audit note. For every other finding, call update_security_finding with
        an evidence-backed disposition: a proven bounty-worthy finding remains status confirmed; a technically
        real but not bounty-eligible finding must remain status triaged (accepted_risk is a human decision
        recorded from the dashboard, never set by a scan) with the exact evidence-backed
        reason and the matching policy_disposition (scope_excluded, known_issue, or bot_findable when
        applicable); a technically disproved or unreachable finding must become status false_positive with
        policy_disposition disproved and the disproof; and a finding with missing evidence or unavailable
        validation must remain status triaged with policy_disposition not_ready. Never use accepted_risk or
        false_positive merely because evidence is missing or validation is unavailable. Stop after every
        recorded finding has an evidence-backed disposition.
      dependsOn: [validate-exploitability, variant-sweep]

    - name: triage-and-report
      role: finding-triager
      category: triage
      skillRefs:
        - name: trail-of-bits-fp-check
        - name: bug-bounty-reporting
      objective: >-
        Assemble the final report from the validation results in {{tasks.validate-exploitability.output}}.
        Apply one admission rule without exception: a finding stays only when the report states a concrete
        exploitation path - who the attacker is, what they send, the code path it traverses with file:line
        evidence, and what they gain - and that path survived validation. Drop everything marked false_positive,
        everything whose path is stated in conditional or speculative terms, and everything whose impact
        does not amount to remote compromise, no matter how tidy the analysis. Merge duplicates and variants
        that share a root cause into one finding listing every affected site, rank the survivors by attacker prerequisites and impact, and prefer an empty report over a
        padded one. Then assemble and submit the final scan report.
      dependsOn:
        - validate-exploitability
        - variant-sweep
        - red-team-bounty-worthiness
