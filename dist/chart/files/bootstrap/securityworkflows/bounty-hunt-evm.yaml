apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityWorkflow
metadata:
  name: bounty-hunt-evm
spec:
  description: Harness-first EVM bounty hunt. A typed orientation contract precedes adaptive review, source review, builds, and local harnesses; an operator-authorized archive endpoint adds deployed-state and pinned-fork evidence when configured. One write-capable task builds and calibrates the oracle while hunting, an independent warden challenges every candidate before impact is measured in the program's own vocabulary, and anything that never broke an invariant is recorded as untested or refuted rather than reported.
  parameters:
    - name: fork_endpoint_alias
      description: Operator-authorized endpoint alias used to read deployed state and start the local fork. Supply an alias, never a raw credential-bearing URL.
      default: "unconfigured"
    - name: chain_id
      description: Expected chain ID for both deployed-state reads and the pinned local fork.
      default: "unconfigured"
    - name: fork_block_number
      description: Immutable finalized block number selected by the operator or scan launcher.
      default: "unconfigured"
    - name: fork_block_hash
      description: Block hash for fork_block_number; every fork-backed tool verifies it before execution.
      default: "unconfigured"
    - name: project_root
      description: Repository-relative root of the EVM project under test.
      default: "."
    - name: deployment_manifest
      description: Path, relative to project_root, to the deployment manifest that identifies in-scope contracts and addresses.
      default: "unconfigured"
  parallelism: 4
  tasks:
    - name: pin-target-and-deployment
      role: threat-modeler
      category: recon
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-entry-point-analyzer
      objective: >-
        Produce the complete orientation contract before anyone begins deep review. First call
        get_security_research_context and load only records bound to this exact target revision and scope;
        prior-revision negative evidence is stale context. Preserve uncertainty rather than inferring
        undocumented intent. From project root {{params.project_root}}, pin the exact source revision,
        dependencies, compiler and settings, protocol target, project layout, build system, test entry
        points, and source-level scope. Model assets, liabilities, roles and authorities; public, peer and
        privileged entry points; trust boundaries and external dependencies; normal state transitions and
        retry, rollback, reorg, upgrade, migration and recovery paths; specification, source, artifact and
        deployment representations; critical properties; applicable and inapplicable prior art and
        incidents; unresolved and conflicting assumptions; tests, fuzz targets, simulators, reference
        implementations and authorized evidence sources; and every missing fact with the resulting limit
        on conclusions. Use explicit unavailable or not_applicable values where appropriate.

        Deployment and archive-chain evidence is an optional enrichment lane. If
        any of {{params.deployment_manifest}}, {{params.fork_endpoint_alias}}, {{params.chain_id}},
        {{params.fork_block_number}}, or {{params.fork_block_hash}} is unconfigured, set verification_status
        to blocked, name each missing input in missing_evidence and gaps, use unavailable for its output
        field, and cap evidence_class at source_and_local_artifact. If local artifacts are also unavailable,
        use source_only. Still publish the orientation contract so later source review, builds, static tools,
        and local tests can run. Otherwise,
        read deployment manifest {{params.deployment_manifest}} and through the operator-authorized fork
        endpoint alias {{params.fork_endpoint_alias}}, verify that the endpoint
        reports required chain id {{params.chain_id}} and verifies configured block
        {{params.fork_block_number}} with hash {{params.fork_block_hash}}, and
        record the source revision that builds the deployed artifacts. Record every in-scope address with
        its proxy/implementation/admin relationship, the initialization state of each implementation, the
        decimals of every token the protocol prices or transfers, the oracle wiring, the role and permission
        holders, and the upstream project this codebase forked from when it is a fork. The chain-read pack
        reads EIP-1967 implementation, admin and beacon slots, token decimals, owners and role holders;
        deployed-bytecode-diff proves the compiled artifact of the pinned revision is the code actually
        running at each address. Mark the pin verified only when the endpoint chain id and block hash match,
        the manifest addresses were read, and deployed bytecode matches the pinned source. A divergence or
        unavailable fact blocks only deployed-state verification and is a stated gap, never an assumption.
        Use verified_deployment evidence_class only when all deployment checks pass. Publish one structured
        orientation dossier for every later task and report no vulnerabilities here.
      outputSchema: |-
        {
          "type": "object",
          "required": ["revision", "target", "evidence_class", "chain_id", "fork_block_number", "fork_block_hash", "deployment_manifest", "verification_status", "configuration_evidence", "addresses", "assets", "liabilities", "roles_and_authorities", "entry_points", "trust_boundaries", "external_dependencies", "state_machine", "representations", "critical_properties", "prior_art_and_incidents", "unresolved_assumptions", "conflicting_assumptions", "review_resources", "authorized_evidence_sources", "missing_evidence", "conclusion_limits", "gaps"],
          "properties": {
            "revision": {"type": "string", "description": "Immutable source revision under test"},
            "target": {
              "type": "object",
              "additionalProperties": false,
              "required": ["source_revision", "dependencies", "compilers", "protocol", "project_layout", "build_system", "test_entry_points", "scope"],
              "properties": {
                "source_revision": {"type": "string"},
                "dependencies": {"type": "array", "items": {"type": "object", "required": ["name", "version", "source"], "properties": {"name": {"type": "string"}, "version": {"type": "string"}, "source": {"type": "string"}}}},
                "compilers": {"type": "array", "items": {"type": "object", "required": ["name", "version", "settings"], "properties": {"name": {"type": "string"}, "version": {"type": "string"}, "settings": {"type": "string"}}}},
                "protocol": {"type": "string", "description": "Exact protocol, version and network target, or not_applicable"},
                "project_layout": {"type": "string"},
                "build_system": {"type": "string"},
                "test_entry_points": {"type": "array", "items": {"type": "string"}},
                "scope": {"type": "array", "items": {"type": "string"}}
              }
            },
            "evidence_class": {"type": "string", "enum": ["source_only", "source_and_local_artifact", "verified_deployment"], "description": "Strongest evidence class actually established; missing deployment evidence forbids verified_deployment"},
            "chain_id": {"type": "string", "description": "Chain ID returned by the authorized endpoint and checked against the required chain_id parameter"},
            "fork_block_number": {"type": "string"},
            "fork_block_hash": {"type": "string"},
            "deployment_manifest": {"type": "string", "description": "Resolved manifest path under project_root"},
            "verification_status": {"type": "string", "enum": ["verified", "blocked"], "description": "verified only when endpoint chain ID and block hash, manifest addresses, and deployed bytecode all match; otherwise blocked with every cause in gaps"},
            "upstream": {"type": "string", "description": "Upstream project and revision this codebase forked from, when applicable"},
            "configuration_evidence": {"type": "array", "items": {"type": "object", "required": ["fact", "value", "source", "status"], "properties": {"fact": {"type": "string"}, "value": {"type": "string"}, "source": {"type": "string"}, "status": {"type": "string", "enum": ["verified", "unverified", "unavailable"]}}}},
            "addresses": {
              "type": "array",
              "items": {
                "type": "object",
                "required": ["address", "role", "availability", "bytecode_match"],
                "properties": {
                  "address": {"type": "string"},
                  "role": {"type": "string", "description": "proxy, implementation, admin, token, oracle, or the protocol role it holds"},
                  "implementation": {"type": "string"},
                  "initialized": {"type": "string", "enum": ["yes", "no", "unknown"]},
                  "decimals": {"type": "string"},
                  "availability": {"type": "string", "enum": ["read", "unavailable"]},
                  "bytecode_match": {"type": "string", "enum": ["yes", "no", "unavailable"]}
                }
              }
            },
            "assets": {"type": "array", "items": {"type": "object", "required": ["name", "security_interest"], "properties": {"name": {"type": "string"}, "security_interest": {"type": "string"}}}},
            "liabilities": {"type": "array", "items": {"type": "object", "required": ["name", "accounting_rule"], "properties": {"name": {"type": "string"}, "accounting_rule": {"type": "string"}}}},
            "roles_and_authorities": {"type": "array", "items": {"type": "object", "required": ["role", "authority", "holder_evidence"], "properties": {"role": {"type": "string"}, "authority": {"type": "string"}, "holder_evidence": {"type": "string"}}}},
            "entry_points": {"type": "array", "items": {"type": "object", "required": ["name", "access", "state_effect"], "properties": {"name": {"type": "string"}, "access": {"type": "string", "enum": ["public", "peer", "privileged"]}, "state_effect": {"type": "string"}}}},
            "trust_boundaries": {"type": "array", "items": {"type": "object", "required": ["boundary", "trusted_side", "untrusted_side", "validation"], "properties": {"boundary": {"type": "string"}, "trusted_side": {"type": "string"}, "untrusted_side": {"type": "string"}, "validation": {"type": "string"}}}},
            "external_dependencies": {"type": "array", "items": {"type": "object", "required": ["name", "assumption", "failure_mode"], "properties": {"name": {"type": "string"}, "assumption": {"type": "string"}, "failure_mode": {"type": "string"}}}},
            "state_machine": {
              "type": "object",
              "additionalProperties": false,
              "required": ["normal", "retry", "rollback", "reorg", "upgrade", "migration", "recovery"],
              "properties": {
                "normal": {"type": "array", "items": {"type": "object", "required": ["from", "action", "to", "actor", "guard"], "properties": {"from": {"type": "string"}, "action": {"type": "string"}, "to": {"type": "string"}, "actor": {"type": "string"}, "guard": {"type": "string"}}}},
                "retry": {"type": "array", "items": {"type": "object", "required": ["from", "action", "to", "actor", "guard"], "properties": {"from": {"type": "string"}, "action": {"type": "string"}, "to": {"type": "string"}, "actor": {"type": "string"}, "guard": {"type": "string"}}}},
                "rollback": {"type": "array", "items": {"type": "object", "required": ["from", "action", "to", "actor", "guard"], "properties": {"from": {"type": "string"}, "action": {"type": "string"}, "to": {"type": "string"}, "actor": {"type": "string"}, "guard": {"type": "string"}}}},
                "reorg": {"type": "array", "items": {"type": "object", "required": ["from", "action", "to", "actor", "guard"], "properties": {"from": {"type": "string"}, "action": {"type": "string"}, "to": {"type": "string"}, "actor": {"type": "string"}, "guard": {"type": "string"}}}},
                "upgrade": {"type": "array", "items": {"type": "object", "required": ["from", "action", "to", "actor", "guard"], "properties": {"from": {"type": "string"}, "action": {"type": "string"}, "to": {"type": "string"}, "actor": {"type": "string"}, "guard": {"type": "string"}}}},
                "migration": {"type": "array", "items": {"type": "object", "required": ["from", "action", "to", "actor", "guard"], "properties": {"from": {"type": "string"}, "action": {"type": "string"}, "to": {"type": "string"}, "actor": {"type": "string"}, "guard": {"type": "string"}}}},
                "recovery": {"type": "array", "items": {"type": "object", "required": ["from", "action", "to", "actor", "guard"], "properties": {"from": {"type": "string"}, "action": {"type": "string"}, "to": {"type": "string"}, "actor": {"type": "string"}, "guard": {"type": "string"}}}}
              }
            },
            "representations": {
              "type": "object",
              "additionalProperties": false,
              "required": ["specification", "source", "artifact", "deployment"],
              "properties": {
                "specification": {"type": "object", "required": ["status", "locator", "evidence"], "properties": {"status": {"type": "string", "enum": ["verified", "unverified", "unavailable", "not_applicable"]}, "locator": {"type": "string"}, "evidence": {"type": "string"}}},
                "source": {"type": "object", "required": ["status", "locator", "evidence"], "properties": {"status": {"type": "string", "enum": ["verified", "unverified", "unavailable", "not_applicable"]}, "locator": {"type": "string"}, "evidence": {"type": "string"}}},
                "artifact": {"type": "object", "required": ["status", "locator", "evidence"], "properties": {"status": {"type": "string", "enum": ["verified", "unverified", "unavailable", "not_applicable"]}, "locator": {"type": "string"}, "evidence": {"type": "string"}}},
                "deployment": {"type": "object", "required": ["status", "locator", "evidence"], "properties": {"status": {"type": "string", "enum": ["verified", "unverified", "unavailable", "not_applicable"]}, "locator": {"type": "string"}, "evidence": {"type": "string"}}}
              }
            },
            "critical_properties": {"type": "array", "items": {"type": "object", "required": ["id", "property", "protected_asset", "evidence"], "properties": {"id": {"type": "string"}, "property": {"type": "string"}, "protected_asset": {"type": "string"}, "evidence": {"type": "string"}}}},
            "prior_art_and_incidents": {"type": "array", "items": {"type": "object", "required": ["reference", "applicability", "reason"], "properties": {"reference": {"type": "string"}, "applicability": {"type": "string", "enum": ["applicable", "inapplicable", "unresolved"]}, "reason": {"type": "string"}}}},
            "unresolved_assumptions": {"type": "array", "items": {"type": "string"}},
            "conflicting_assumptions": {"type": "array", "items": {"type": "string"}},
            "review_resources": {
              "type": "object",
              "additionalProperties": false,
              "required": ["tests", "fuzz_targets", "simulators", "reference_implementations"],
              "properties": {
                "tests": {"type": "array", "items": {"type": "string"}},
                "fuzz_targets": {"type": "array", "items": {"type": "string"}},
                "simulators": {"type": "array", "items": {"type": "string"}},
                "reference_implementations": {"type": "array", "items": {"type": "string"}}
              }
            },
            "authorized_evidence_sources": {"type": "array", "items": {"type": "string"}},
            "missing_evidence": {"type": "array", "items": {"type": "object", "required": ["fact", "reason", "required_for"], "properties": {"fact": {"type": "string"}, "reason": {"type": "string"}, "required_for": {"type": "string"}}}},
            "conclusion_limits": {"type": "array", "items": {"type": "string"}, "description": "Claims forbidden or left unresolved because evidence is missing"},
            "gaps": {"type": "array", "items": {"type": "string"}, "description": "Facts that could not be verified and the exact missing tool, authorization, or mismatch"}
          },
          "allOf": [
            {"if": {"required": ["verification_status"], "properties": {"verification_status": {"const": "blocked"}}}, "then": {"properties": {"evidence_class": {"enum": ["source_only", "source_and_local_artifact"]}}}},
            {"if": {"required": ["evidence_class"], "properties": {"evidence_class": {"const": "verified_deployment"}}}, "then": {"properties": {"verification_status": {"const": "verified"}}}}
          ]
        }
    - name: fork-harness-hunt
      role: exploit-validator
      category: other
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-property-based-testing
        - name: trail-of-bits-harness-writing
        - name: evm-low-level-and-deployment-review
        - name: evm-economic-and-mev-review
        - name: exploit-poc-discipline
      objective: >-
        In one write-capable run, build the oracle, calibrate it, hunt against it, and reproduce or kill
        each hypothesis. Always run source review, the repository build, applicable static tools, and local
        project tests in {{params.project_root}}, using the dossier in
        {{tasks.pin-target-and-deployment.output}}. When the dossier is verified, also start a local fork
        through operator-authorized endpoint alias {{params.fork_endpoint_alias}} and require chain id
        {{params.chain_id}} at configured block {{params.fork_block_number}} and hash
        {{params.fork_block_hash}}, matching the dossier exactly. Set fork_status to executed only after
        those values and the verified pin agree. Otherwise set it to blocked, record the blocker, and
        continue source review and local harness work. Leave only hypotheses that actually require deployed
        state untested rather than refuted; do not discard hypotheses reproducible in project tests or a
        local devnet. Never substitute a public-chain transaction for the local fork.

        Before hunting, derive explicit adaptive review units from the orientation model, target shape and
        risk rather than generic file ranges or a universal checklist. A fork requires upstream/revision
        differential and changed-invariant review; a bridge requires complete message and value lifecycle,
        finality, replay, identity, retry and refund review; an upgradeable deployment requires implementation
        initialization, storage evolution, admin and deployed-state review; lending requires solvency,
        rounding, oracle, liquidation and callback-visible-state review; multiple implementations require
        differential state-transition and encoding tests. Include only applicable units and explain each
        selection. Every unit must identify its question or hypothesis, protected asset and property,
        least-privileged attacker and controlled input, state and order, production path and expected guard,
        required manual trace and experiment, falsifying observation, stopping rule, exact evidence bounds,
        and strongest permitted evidence class. Source inspection is one evidence method, not a sufficient
        review process by itself.

        Then write 5 to 15 executable invariants against the strongest available local substrate:
        a verified pinned fork when available, otherwise project tests or a local devnet. Cover
        conservation of value and
        solvency; share price or exchange rate monotonicity where claimed; accounting identities across
        deposit, withdraw and settle; the access-control matrix; encode/decode round trips for identifiers;
        and cross-domain identity binding for relayed or proved messages. Calibrate each assertion by
        applying a temporary mutant that SHOULD make it fail. Bind every significant build, static analysis,
        differential, harness, mutant, fuzz and reproduction run to one review-unit question and property.
        Record its exact target and revision, evidence class, oracle and calibration method, command,
        configuration, environment, seed, corpus, actors, states, sequence depth, attempts, stopping rule,
        expected falsifier, observed result, semantic coverage and limitations. Count an invariant as calibrated only when it
        is executable and kills its mutant; an assertion that survives cannot detect its own violation and
        must be fixed or dropped before it guides a finding. Record exact tool commands, deterministic or
        replayable seeds, attempts, successes, and limitations. A green harness never means the target is
        safe; it means only not found under the recorded bounds.

        Then hunt for ways to break a named calibrated invariant, working the classes in the order the
        disclosed payouts follow. Priority 1, initialization and upgrade state on the DEPLOYED
        implementation: hunt uninitialized implementations, initializer re-entry across upgrades,
        ownership held on the implementation itself, and implementation/admin slot confusion (Wormhole,
        $10M). Priority 2, cross-chain proof and identity binding: hunt emitter, chain id and nonce binding,
        relayer and forwarder identity, and what msg.sender becomes after relaying (Aurora, $1M). Priority 3,
        fork-versus-upstream divergence: run upstream-fork-diff against the dossier's upstream revision,
        enumerate every divergence, and test the invariant the upstream code used to satisfy (Optimism
        l2geth, $2,000,042). Priority 4, encoding and decoding round trips and replay: hunt colliding
        encodings, signature malleability, and missing nonce or domain separation (Polygon Plasma, $2M).
        Priority 5, missing balance and state validation: test every state-changing path for the balance,
        allowance, bound or existence check it depends on. Priority 6, accounting, rounding, precision and
        decimals: build the decimals matrix from chain reads and hunt division before multiplication and
        repeated caller-favorable rounding (DFX; Moonbeam, Astar and Acala, $1M). Priority 7, access control
        and role or permission inventories: test the harness matrix against deployed role holders. Priorities
        1 and 6 rest on facts only the chain-read and deployed-bytecode-diff packs can settle. Templated
        reentrancy and flash-loan oracle manipulation remain available but are off the default bounty path:
        bot-findable means unpayable under Code4rena Zellic V12 and Cantina LightChaser duplicate rules.

        For every hypothesis name the invariant, payout priority, least-privileged attacker, controlled
        input, expected state transition, and falsifying observation. Turn each viable hypothesis into a
        failing assertion on the strongest substrate that can settle it: pinned fork for deployed-state
        claims, otherwise project tests or a local devnet. A broken verdict requires the exact command and
        seed, failing assertion, observed state or balance delta, a negative control that did not trigger,
        and the calibration mutant proving the oracle can fail. State the reproduction substrate, never
        generalize a local-only result into a claim about deployed configuration, and record the reproducibility class
        as deterministic, seeded and replayable, schedule or environment dependent, statistical, or
        observational only; for the last three record every attempt and the stopping rule. A hypothesis
        without a failing assertion is refuted or untested and may not be reported. Only report findings for
        reproducible broken hypotheses and attach the reproduction.
      dependsOn:
        - pin-target-and-deployment
      outputSchema: |-
        {
          "type": "object",
          "required": ["fork_status", "verified_pin", "review_units", "executable_invariant_count", "calibrated_invariant_count", "invariants", "tool_runs", "hypotheses", "limitations"],
          "properties": {
            "fork_status": {"type": "string", "enum": ["executed", "blocked"], "description": "executed only when a local fork ran at the verified chain ID, block number, and block hash; blocked otherwise"},
            "fork_blocker": {"type": "string", "description": "Required when fork_status is blocked; exact authorization, endpoint, chain, block, build, or deployment mismatch that prevented execution"},
            "verified_pin": {
              "type": "object",
              "required": ["status", "revision", "chain_id", "fork_block_number", "fork_block_hash", "endpoint_alias", "deployment_manifest"],
              "properties": {
                "status": {"type": "string", "enum": ["verified", "blocked"], "description": "verified only after matching endpoint chain ID and block hash, manifest addresses, and deployed bytecode; must be blocked when any condition fails"},
                "revision": {"type": "string"},
                "chain_id": {"type": "string"},
                "fork_block_number": {"type": "string"},
                "fork_block_hash": {"type": "string"},
                "endpoint_alias": {"type": "string"},
                "deployment_manifest": {"type": "string"}
              }
            },
            "executable_invariant_count": {"type": "integer", "minimum": 0, "description": "Number of invariants that ran as assertions"},
            "calibrated_invariant_count": {"type": "integer", "minimum": 0, "description": "Number of executable invariants whose temporary mutant was killed; must not exceed executable_invariant_count"},
            "review_units": {
              "type": "array",
              "items": {
                "type": "object",
                "additionalProperties": false,
                "required": ["id", "selection_rationale", "risk", "question_or_hypothesis", "protected_asset", "property", "attacker", "controlled_input", "controlled_state", "controlled_order", "production_path", "expected_guard", "manual_trace", "experiment", "falsifying_observation", "stopping_rule", "evidence_bounds", "evidence_class"],
                "properties": {
                  "id": {"type": "string"},
                  "selection_rationale": {"type": "string", "description": "Target-model and risk reason this unit is applicable"},
                  "risk": {"type": "string", "enum": ["critical", "high", "medium", "low"]},
                  "question_or_hypothesis": {"type": "string"},
                  "protected_asset": {"type": "string"},
                  "property": {"type": "string"},
                  "attacker": {"type": "string"},
                  "controlled_input": {"type": "string"},
                  "controlled_state": {"type": "string"},
                  "controlled_order": {"type": "string"},
                  "production_path": {"type": "string"},
                  "expected_guard": {"type": "string"},
                  "manual_trace": {"type": "string"},
                  "experiment": {"type": "string"},
                  "falsifying_observation": {"type": "string"},
                  "stopping_rule": {"type": "string"},
                  "evidence_bounds": {"type": "string", "description": "Exact actors, states, orderings, depth, attempts and exclusions"},
                  "evidence_class": {"type": "string", "enum": ["source_only", "source_and_local_artifact", "verified_deployment"]}
                }
              }
            },
            "invariants": {
              "type": "array",
              "items": {
                "type": "object",
                "required": ["name", "property", "executable", "calibrated"],
                "properties": {
                  "name": {"type": "string"},
                  "property": {"type": "string", "description": "Invariant in protocol terms"},
                  "executable": {"type": "boolean"},
                  "calibrated": {"type": "boolean", "description": "true only when executable and mutation_killed is true"},
                  "mutation_applied": {"type": "string"},
                  "mutation_killed": {"type": "boolean"},
                  "limitation": {"type": "string"}
                }
              }
            },
            "tool_runs": {
              "type": "array",
              "description": "Every significant build, static-analysis, harness, mutant, fuzz, differential and reproduction run, including failures, partial output, timeouts and stopping-rule attempts",
              "items": {
                "type": "object",
                "additionalProperties": false,
                "required": ["tool", "review_unit_id", "question", "property", "target", "target_revision", "evidence_class", "oracle", "calibration_method", "calibration_result", "command", "configuration", "environment", "seed", "corpus", "actors", "states", "sequence_depth", "attempts", "successes", "stopping_rule", "expected_falsifier", "observed_result", "outcome", "semantic_coverage", "limitations"],
                "properties": {
                  "tool": {"type": "string"},
                  "review_unit_id": {"type": "string"},
                  "question": {"type": "string"},
                  "property": {"type": "string"},
                  "target": {"type": "string"},
                  "target_revision": {"type": "string"},
                  "evidence_class": {"type": "string", "enum": ["source_only", "source_and_local_artifact", "verified_deployment"]},
                  "oracle": {"type": "string"},
                  "calibration_method": {"type": "string"},
                  "calibration_result": {"type": "string", "enum": ["calibrated", "failed", "not_applicable"]},
                  "command": {"type": "string"},
                  "configuration": {"type": "string"},
                  "environment": {"type": "string"},
                  "seed": {"type": "string", "description": "Exact replay seed, or not_applicable for a deterministic unseeded run"},
                  "corpus": {"type": "string", "description": "Exact corpus path or digest, or not_applicable"},
                  "actors": {"type": "array", "items": {"type": "string"}},
                  "states": {"type": "array", "items": {"type": "string"}},
                  "sequence_depth": {"type": "integer", "minimum": 0},
                  "attempts": {"type": "integer", "minimum": 0},
                  "successes": {"type": "integer", "minimum": 0},
                  "stopping_rule": {"type": "string"},
                  "expected_falsifier": {"type": "string"},
                  "observed_result": {"type": "string"},
                  "outcome": {"type": "string", "enum": ["counterexample", "not_found_under", "inconclusive"], "description": "Errors, missing dependencies, partial output and timeouts are inconclusive; a clean run is not_found_under its recorded bounds"},
                  "semantic_coverage": {"type": "array", "items": {"type": "string"}},
                  "limitations": {"type": "array", "items": {"type": "string"}}
                }
              }
            },
            "hypotheses": {
              "type": "array",
              "items": {
                "type": "object",
                "required": ["review_unit_id", "invariant", "priority_class", "attacker", "controlled_input", "expected_transition", "falsifier", "verdict"],
                "properties": {
                  "review_unit_id": {"type": "string"},
                  "invariant": {"type": "string"},
                  "priority_class": {"type": "string", "description": "Payout-ordered class 1 through 7"},
                  "attacker": {"type": "string", "description": "Least privilege the attacker needs"},
                  "controlled_input": {"type": "string"},
                  "expected_transition": {"type": "string"},
                  "falsifier": {"type": "string"},
                  "evidence": {"type": "string", "description": "file:line trace supporting the hypothesis"},
                  "verdict": {"type": "string", "enum": ["broken", "refuted", "untested"]},
                  "missing_dependency": {"type": "string", "description": "Required when verdict is untested"},
                  "fingerprint": {"type": "string", "description": "Required when verdict is broken; fingerprint returned by report_security_finding"},
                  "reproduction": {
                    "type": "object",
                    "description": "Required when verdict is broken. pinned_fork requires fork_status executed and a verified pin; project_tests and local_devnet may prove only claims that do not depend on deployed configuration",
                    "additionalProperties": false,
                    "required": ["command", "exit_status", "seed", "substrate", "artifact", "failing_assertion", "observed_delta", "negative_control_passed", "oracle_can_fail", "reproducibility_class", "attempts", "successes"],
                    "properties": {
                      "command": {"type": "string", "minLength": 1},
                      "exit_status": {"type": "string", "minLength": 1},
                      "seed": {"type": "string", "minLength": 1},
                      "substrate": {"type": "string", "enum": ["pinned_fork", "project_tests", "local_devnet"]},
                      "artifact": {"type": "string", "minLength": 1, "description": "Repository-relative test/PoC path or tool-returned reproduction artifact"},
                      "failing_assertion": {"type": "string", "minLength": 1},
                      "observed_delta": {"type": "string", "minLength": 1},
                      "negative_control_passed": {"const": true, "description": "The valid-path negative control did not trigger"},
                      "oracle_can_fail": {"const": true, "description": "The calibration mutant proved the oracle can fail"},
                      "reproducibility_class": {"type": "string", "enum": ["deterministic", "seeded_replayable", "schedule_or_environment_dependent", "statistical", "observational_only"]},
                      "attempts": {"type": "integer", "minimum": 1},
                      "successes": {"type": "integer", "minimum": 1},
                      "stopping_rule": {"type": "string", "minLength": 1, "description": "Required for schedule_or_environment_dependent, statistical, or observational_only results"}
                    },
                    "allOf": [
                      {"if": {"required": ["reproducibility_class"], "properties": {"reproducibility_class": {"enum": ["schedule_or_environment_dependent", "statistical", "observational_only"]}}}, "then": {"required": ["stopping_rule"]}}
                    ]
                  }
                },
                "allOf": [
                  {"if": {"required": ["verdict"], "properties": {"verdict": {"const": "broken"}}}, "then": {"required": ["fingerprint", "reproduction"]}},
                  {"if": {"required": ["verdict"], "properties": {"verdict": {"const": "untested"}}}, "then": {"required": ["missing_dependency"]}}
                ]
              }
            },
            "limitations": {"type": "array", "items": {"type": "string"}}
          }
        }
    - name: independent-candidate-warden
      role: security-reviewer
      category: triage
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-fp-check
        - name: bug-bounty-reporting
        - name: evm-economic-and-mev-review
      objective: >-
        Independently challenge every broken candidate in {{tasks.fork-harness-hunt.output}} before impact
        qualification or reporting. Act as a skeptic, not an editor or summarizer. Reconstruct the complete
        attack path from the orientation dossier, pinned source and safe-local reproduction evidence, then
        try to disprove it. For critical and high-risk review units, preserve initial independence by first
        tracing the production path and attempting the reproduction without adopting the hunter's narrative;
        compare reasoning only after recording that reconstruction. Never submit a public-chain transaction.
        Missing deployment evidence limits the challenge to the orientation evidence_class and makes any
        deployment-dependent dimension inconclusive rather than assumed.

        Separately challenge all seven dimensions: (1) production reachability, including whether the tested
        path is the production path under the established evidence class; (2) attacker control over the
        claimed input, state, order or timing at the stated privilege; (3) absence or bypass of every expected
        guard; (4) execution of the claimed unsafe state transition; (5) an observable violation of the named
        invariant; (6) the maximum claimed impact and every economic, liquidity, capital, timing and mempool
        assumption; and (7) novelty, prior art and governing-program eligibility. For each dimension record
        an independent method, safe-local evidence, reasoning and a substantiated, disproved or inconclusive
        verdict. An overall candidate is upheld only when all seven dimensions are substantiated; one
        disproved dimension disproves it, and any unresolved dimension makes it inconclusive. Emit one result
        for every broken candidate, including those disproved or inconclusive, and do not create new findings.
      dependsOn:
        - fork-harness-hunt
      outputSchema: |-
        {
          "type": "object",
          "required": ["candidates", "limitations"],
          "properties": {
            "candidates": {
              "type": "array",
              "items": {
                "type": "object",
                "additionalProperties": false,
                "required": ["fingerprint", "review_unit_id", "independent_reconstruction", "production_reachability", "attacker_control", "guard_absence_or_bypass", "unsafe_transition", "observable_invariant_violation", "impact_and_economic_assumptions", "novelty_prior_art_and_eligibility", "overall_verdict"],
                "properties": {
                  "fingerprint": {"type": "string"},
                  "review_unit_id": {"type": "string"},
                  "independent_reconstruction": {"type": "string", "description": "Attack path reconstructed before comparison with the hunter's reasoning"},
                  "production_reachability": {"type": "object", "additionalProperties": false, "required": ["verdict", "method", "evidence", "reasoning"], "properties": {"verdict": {"type": "string", "enum": ["substantiated", "disproved", "inconclusive"]}, "method": {"type": "string"}, "evidence": {"type": "array", "items": {"type": "string"}}, "reasoning": {"type": "string"}}},
                  "attacker_control": {"type": "object", "additionalProperties": false, "required": ["verdict", "method", "evidence", "reasoning"], "properties": {"verdict": {"type": "string", "enum": ["substantiated", "disproved", "inconclusive"]}, "method": {"type": "string"}, "evidence": {"type": "array", "items": {"type": "string"}}, "reasoning": {"type": "string"}}},
                  "guard_absence_or_bypass": {"type": "object", "additionalProperties": false, "required": ["verdict", "method", "evidence", "reasoning"], "properties": {"verdict": {"type": "string", "enum": ["substantiated", "disproved", "inconclusive"]}, "method": {"type": "string"}, "evidence": {"type": "array", "items": {"type": "string"}}, "reasoning": {"type": "string"}}},
                  "unsafe_transition": {"type": "object", "additionalProperties": false, "required": ["verdict", "method", "evidence", "reasoning"], "properties": {"verdict": {"type": "string", "enum": ["substantiated", "disproved", "inconclusive"]}, "method": {"type": "string"}, "evidence": {"type": "array", "items": {"type": "string"}}, "reasoning": {"type": "string"}}},
                  "observable_invariant_violation": {"type": "object", "additionalProperties": false, "required": ["verdict", "method", "evidence", "reasoning"], "properties": {"verdict": {"type": "string", "enum": ["substantiated", "disproved", "inconclusive"]}, "method": {"type": "string"}, "evidence": {"type": "array", "items": {"type": "string"}}, "reasoning": {"type": "string"}}},
                  "impact_and_economic_assumptions": {"type": "object", "additionalProperties": false, "required": ["verdict", "method", "evidence", "reasoning"], "properties": {"verdict": {"type": "string", "enum": ["substantiated", "disproved", "inconclusive"]}, "method": {"type": "string"}, "evidence": {"type": "array", "items": {"type": "string"}}, "reasoning": {"type": "string"}}},
                  "novelty_prior_art_and_eligibility": {"type": "object", "additionalProperties": false, "required": ["verdict", "method", "evidence", "reasoning"], "properties": {"verdict": {"type": "string", "enum": ["substantiated", "disproved", "inconclusive"]}, "method": {"type": "string"}, "evidence": {"type": "array", "items": {"type": "string"}}, "reasoning": {"type": "string"}}},
                  "overall_verdict": {"type": "string", "enum": ["upheld", "disproved", "inconclusive"]}
                },
                "allOf": [
                  {"if": {"properties": {"overall_verdict": {"const": "upheld"}}}, "then": {"properties": {
                    "production_reachability": {"properties": {"verdict": {"const": "substantiated"}}},
                    "attacker_control": {"properties": {"verdict": {"const": "substantiated"}}},
                    "guard_absence_or_bypass": {"properties": {"verdict": {"const": "substantiated"}}},
                    "unsafe_transition": {"properties": {"verdict": {"const": "substantiated"}}},
                    "observable_invariant_violation": {"properties": {"verdict": {"const": "substantiated"}}},
                    "impact_and_economic_assumptions": {"properties": {"verdict": {"const": "substantiated"}}},
                    "novelty_prior_art_and_eligibility": {"properties": {"verdict": {"const": "substantiated"}}}
                  }}}
                ]
              }
            },
            "limitations": {"type": "array", "items": {"type": "string"}}
          }
        }
    - name: quantify-impact-and-eligibility
      role: finding-triager
      category: triage
      skillRefs:
        - name: blockchain-security-research-method
        - name: bug-bounty-reporting
        - name: evm-economic-and-mev-review
      objective: >-
        Price and qualify only hypotheses with verdict broken, a valid reproduction in
        {{tasks.fork-harness-hunt.output}}, and overall_verdict upheld in
        {{tasks.independent-candidate-warden.output}}. Disproved and inconclusive candidates remain internal.
        For a pinned-fork reproduction, measure the value at risk at the
        verified block and say how it was measured. For a project-test or local-devnet reproduction, qualify
        only impacts that do not rely on an unverified deployment fact, label deployed exposure and value at
        risk unknown, and confirm that the governing program permits that PoC environment; never estimate a
        number you did not derive. Record the capital the attacker must
        front, the capital they risk, the privileges and timing they need, and the mempool assumptions.
        Then map the result onto the governing program's own published in-scope impact list, copying the
        clause verbatim, and give the maximum achievable impact reachable from the same root cause rather
        than the first one demonstrated. Judge severity under that program's own system and never translate
        a label from another system into it. Every candidate needs a calibrated oracle, passing negative
        control, reproducible failing assertion, permitted PoC environment, and published impact clause.
        Additionally, any claim about deployed addresses, roles, balances, oracle wiring, bytecode, or value
        at risk needs an executed fork and verified pin; source-level claims do not.
      dependsOn:
        - fork-harness-hunt
        - independent-candidate-warden
      outputSchema: |-
        {
          "type": "array",
          "items": {
            "type": "object",
            "required": ["fingerprint", "warden_verdict", "impact_clause", "max_achievable_impact", "eligible"],
            "properties": {
              "fingerprint": {"type": "string"},
              "warden_verdict": {"const": "upheld"},
              "impact_clause": {"type": "string", "description": "Copied verbatim from the program's in-scope impact list"},
              "program_severity": {"type": "string"},
              "max_achievable_impact": {"type": "string"},
              "funds_at_risk": {"type": "string", "description": "Measured value plus the block it was measured at, or why no measurement is possible"},
              "attacker_capital": {"type": "string"},
              "preconditions": {"type": "string"},
              "eligible": {"type": "boolean"},
              "ineligible_reason": {"type": "string"}
            }
          }
        }
    - name: triage-and-report
      role: finding-triager
      category: triage
      skillRefs:
        - name: blockchain-security-research-method
        - name: bug-bounty-reporting
        - name: trail-of-bits-fp-check
        - name: trail-of-bits-variant-analysis
      objective: >-
        Assemble the report from {{tasks.quantify-impact-and-eligibility.output}} and independently verify it against
        {{tasks.independent-candidate-warden.output}} under one admission rule:
        a finding survives only when a named calibrated invariant broke, a reproducible failing assertion
        on a permitted local substrate proves it, the negative control did not trigger, the oracle was shown
        capable of failing, and the impact maps to a clause the program published. Require a verified pinned
        fork only when the finding depends on deployed state, and label project-test or local-devnet evidence
        without implying deployment exposure. Drop everything else,
        including analyses that read well but never broke anything. Prefer an empty report to a padded one:
        reporting is rationed, and a rejected submission costs more than a withheld one. State the bounded
        negative result explicitly — which invariants were tested, at which revision and block, under which
        bounds and coverage — so a clean or blocked run is recorded as not found under those bounds rather
        than as a clean bill of health. Persist branch outcomes with transition_security_hypothesis and
        invariant/actor/state/transition bounds with record_security_coverage. Every confirmed root cause must
        have create_security_variant_sweep followed by complete_security_variant_sweep with scope and evidence;
        blocked or inconclusive sweeps stay internal without an audited human override. Call
        get_security_campaign_status and reconcile durable gaps and budget decisions. Hand every technically
        confirmed finding to the configured post-script pipeline and report packaging separately from confirmation;
        only a successfully persisted post-script artifact may be called bundle-ready. Then submit the final report.
      dependsOn:
        - quantify-impact-and-eligibility
        - independent-candidate-warden
