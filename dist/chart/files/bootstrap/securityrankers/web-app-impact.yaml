apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityRanker
metadata:
  name: web-app-impact
spec:
  description: Severity calibration for user-facing web applications; floors access-control, stored-XSS, SSRF, and CSRF impact and keeps hardening gaps informational.
  rules:
    - "severity-floor: authz=high"
    - "severity-floor: authn=high"
    - "severity-floor: xss=medium"
    - "severity-floor: ssrf=high"
    - Authentication bypass and horizontal or vertical access-control failures that expose another user's data or actions are at least high, and critical when the bypass is pre-authentication.
    - Stored cross-site scripting that renders in another user's session is high; reflected XSS needing a crafted link is medium; self-XSS an attacker can only fire in their own browser is informational.
    - Server-side request forgery that reaches cloud instance metadata, an internal admin surface, or a service on the loopback interface is critical; SSRF limited to outbound requests to attacker-chosen public hosts is medium.
    - Cross-site request forgery on a state-changing endpoint is high when it transfers funds, changes credentials, or grants access, and medium for lower-value mutations; endpoints that only read data are informational.
    - Session fixation, missing session rotation on privilege change, and session tokens that survive logout are high when the session grants authenticated access.
    - Missing security headers, absent cookie flags on non-session cookies, verbose version banners, and missing rate limiting without a demonstrated impact are informational hardening notes, never medium or above.
    - Downgrade any finding whose exploitation requires the victim to paste attacker-supplied content into their own developer console or to disable browser protections.
