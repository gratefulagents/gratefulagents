name: Helm Chart

on:
  push:
    branches: [main]
    paths:
      - "dist/chart/**"
      - "config/test/minio.yaml"
      - "configs/modetemplates/**"
      - "configs/roleinstructions/**"
      - ".github/workflows/test-chart.yml"
  pull_request:
    paths:
      - "dist/chart/**"
      - "config/test/minio.yaml"
      - "configs/modetemplates/**"
      - "configs/roleinstructions/**"
      - ".github/workflows/test-chart.yml"

jobs:
  validate-chart:
    name: Lint and render
    if: ${{ vars.ENABLE_GITHUB_ACTIONS == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Check chart bootstrap files are in sync with configs/
        run: |
          make helm-sync-bootstrap
          git diff --exit-code dist/chart/files/bootstrap \
            || { echo "::error::dist/chart/files/bootstrap is out of sync; run 'make helm-sync-bootstrap' and commit."; exit 1; }

      - name: Lint Helm chart
        run: helm lint ./dist/chart

      - name: Keep installer release manifest below the Secret limit
        run: |
          rendered="$(mktemp)"
          release_chart="$(mktemp -d)"
          cp -a ./dist/chart/. "$release_chart/"
          rm -rf "$release_chart/files/bootstrap"
          helm template test ./dist/chart --namespace gratefulagents-system \
            --set bootstrapDefaults.enabled=false > "$rendered"
          test "$(gzip -9 -c "$rendered" | wc -c)" -lt 262144 \
            || { echo "::error::installer release manifest compressed size exceeds 256 KiB"; exit 1; }
          archive="$(helm package "$release_chart" --destination "$(dirname "$release_chart")" \
            | sed -n 's/^Successfully packaged chart and saved it to: //p')"
          test -n "$archive" && test "$(stat -c %s "$archive")" -lt 262144 \
            || { echo "::error::installer release chart archive exceeds 256 KiB"; exit 1; }
          helm template test ./dist/chart --namespace gratefulagents-system \
            --show-only templates/bootstrap/defaults.yaml > "$rendered"
          grep -q 'platform.gratefulagents.dev/bootstrap-ready: "true"' "$rendered"

      - name: Render with default values (all bundled dependencies)
        run: |
          rendered="$(mktemp)"
          helm template test ./dist/chart --namespace gratefulagents-system > "$rendered"
          grep -q -- '- --enable-agentrun-overseer' "$rendered"
          grep -q -- '- --enable-repo-maintainer' "$rendered"
          grep -A1 -- 'name: ENABLE_BROWSER_TOOLS' "$rendered" | grep -q 'value: "true"'
          grep -q -- 'max_connections=500' "$rendered"

      - name: Verify bundled Silo server and bucket initialization
        run: |
          rendered="$(mktemp)"
          helm template test ./dist/chart --namespace gratefulagents-system \
            --show-only templates/dependencies/minio.yaml > "$rendered"
          for manifest in "$rendered" config/test/minio.yaml; do
            test "$(grep -c 'image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z' "$manifest")" -eq 2
            grep -Fq 'args: ["server", "/data"]' "$manifest"
            grep -Fq 'command: ["/bin/sh", "-c"]' "$manifest"
            grep -q 'until mcli alias set ' "$manifest"
            grep -q 'mcli mb --ignore-existing ' "$manifest"
            ! grep -Eq 'image: (minio/|quay.io/minio/)' "$manifest"
          done
          grep -q 'claimName: test-gratefulagents-minio-data' "$rendered"
          grep -q 'name: test-gratefulagents-minio-create-bucket' "$rendered"
          helm template test ./dist/chart --namespace gratefulagents-system \
            --set minio.enabled=false > "$rendered"
          ! grep -q 'pgsty/silo' "$rendered"
          ! grep -q 'name: test-gratefulagents-minio-create-bucket' "$rendered"

      - name: Render with custom PostgreSQL connection capacity
        run: |
          rendered="$(mktemp)"
          helm template test ./dist/chart --namespace gratefulagents-system \
            --set postgres.maxConnections=1000 > "$rendered"
          grep -q -- 'max_connections=1000' "$rendered"

      - name: Render with browser tools disabled
        run: |
          rendered="$(mktemp)"
          helm template test ./dist/chart --namespace gratefulagents-system \
            --set features.browserTools=false > "$rendered"
          grep -A1 -- 'name: ENABLE_BROWSER_TOOLS' "$rendered" | grep -q 'value: "false"'

      - name: Render barebones (external dependencies)
        run: |
          helm template test ./dist/chart --namespace gratefulagents-system \
            --set postgres.enabled=false \
            --set minio.enabled=false \
            --set jaeger.enabled=false \
            --set bootstrapDefaults.enabled=false \
            --set database.url='postgres://user:pass@db.example.com:5432/app' \
            --set dashboard.service.type=LoadBalancer \
            --set auth.google.clientID='x.apps.googleusercontent.com' \
            --set githubApp.appID='1' > /dev/null

      - name: Render pull-only PR reconciliation
        run: |
          rendered="$(mktemp)"
          helm template test ./dist/chart --namespace gratefulagents-system \
            --set githubWebhook.enabled=false > "$rendered"
          grep -q -- '- --github-webhook-addr=' "$rendered"
          ! grep -q 'controller-manager-github-webhooks' "$rendered"
          ! grep -q 'name: gh-webhooks' "$rendered"
