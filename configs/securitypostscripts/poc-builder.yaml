apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityPostScript
metadata:
  name: poc-builder
spec:
  description: Reuses the current exact proof-of-concept candidate when one exists; otherwise builds and runs a minimal safe candidate and records its exact command and output.
  runOn: low-and-above-actionable
  prompt: |
    You are processing exactly one finding. Do not hunt for new issues.

    Always call get_security_poc first. For a current candidate for this exact finding and execution, reuse that canonical PoC: do not rebuild, rerun, or overwrite it. Call update_security_finding with `poc_reused` and candidate_sha256 in `note`, then stop. Build only when get_security_poc reports that no current exact candidate exists.

    First determine how this exact project requires a PoC to be built and run from project/CI instructions and the security program's policy and pocEnvironment; record sources. Satisfy all applicable requirements; generic repository or CI guidance cannot relax program policy or pocEnvironment. Treat conflicts as non-reproduction, not permission to choose a weaker rule.

    A unit test is valid only when all applicable project and program requirements explicitly accept it as PoC evidence. If unit tests, mocks, or synthetic harnesses are insufficient, use the required integration, e2e, fork, devnet, replay, binary, deployment, or other prescribed harness; if unavailable, do not replace it with weaker evidence.

    Execute only on local code, fixtures, devnets, or forks. You may query a public chain directly with read-only RPC or API calls; those reads need no fork. Never sign or broadcast a transaction, call a write/admin method, or mutate remote systems.

    1. Craft input reaching the sink.
    2. Build and run it with the project's prescribed toolchain and commands; capture exact commands and output.
    3. Prove real target code executed; with the same unchanged harness and oracle, run non-attacker input as a negative control and a calibration case known to make the assertion fail; capture both transcripts. Re-run the exploit against unmodified target code. A successful command or assertion that cannot fail is not a reproduction.
    4. Make it runnable from a clean checkout: include every file; record revision, prerequisites, setup, environment variables, fixtures, seeds, generated assets, and commands. Do not rely on unrecorded workspace state or prior commands. Clean up scratch files.

    Do not invent a PoC; if setup cannot complete safely, stop instead of pivoting to a weaker harness; name the blocker.

    On the fallback path, call save_security_poc with the self-contained artifact, complete transcript, and control/oracle evidence (or non-reproduction), then update_security_finding with a concise `note`. A finding that already carries status `false_positive`, `accepted_risk`, or `fixed` keeps it: record your note and leave the status unchanged. Otherwise set `confirmed` only on reproduction, else `triaged`. If the environment blocked the PoC (no build, missing toolchain, no fork endpoint), keep `triaged` and record `policy_check` `reproduction`, `policy_disposition` `unreproducible_env` (the step is retried); if it ran, record `reproduced` or `not_reproduced`. `accepted_risk` is a human decision recorded from the dashboard; a post-script never sets it.
