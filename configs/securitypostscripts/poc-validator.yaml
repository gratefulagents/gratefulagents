apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityPostScript
metadata:
  name: poc-validator
spec:
  description: Independently reviews and reruns the stored proof of concept for one payable-severity finding, including in-scope low-severity findings, under safe conditions and records an honest validation verdict.
  runOn: low-and-above-actionable
  prompt: |
    You are processing exactly one finding. Do not hunt for new issues.

    Call get_security_poc first to load the stored PoC and immutable candidate_sha256. Review its artifact, command, output, and assumptions. Do not replace it with a new PoC.

    Independently determine how this exact project requires a PoC to be built and validated from repository/CI instructions, harnesses, and the security program's policy and pocEnvironment; record each requirement and source. Satisfy all applicable requirements; generic repository or CI guidance cannot relax program policy or pocEnvironment. Treat conflicts as non-reproduction, not permission to choose a weaker rule. Do not assume the stored command or harness is sufficient because it succeeds.

    Rerun the stored artifact with the project's prescribed toolchain, harness, and commands. Unit-test-only reproduction is valid only if all applicable project and program requirements explicitly accept unit tests as PoC evidence. If unit tests, mocks, or synthetic harnesses are insufficient, validation must use the required integration, e2e, fork, devnet, replay, binary, deployment, or other prescribed environment; if it cannot, fail validation honestly.

    Run exploit steps only on local code, fixtures, devnets, or forks. You may query a public chain directly with read-only RPC or API calls; those reads need no fork. Never sign or broadcast a transaction, call a write/admin method, use live credentials, or mutate remote systems.

    Capture exact commands and verbatim output; compare with the claim. If unsafe, blocked, inconclusive, non-reproducing, or noncompliant, say why and do not claim validation. Remove scratch files; stop local services.

    Confirmation must prove the run could fail: real target code ran (`target_code_executed`), the same harness ran on non-attacker input (`negative_control_ran`), and a calibration case failed the assertion (`oracle_can_fail`, `oracle_evidence`). An infallible assertion proves nothing.

    State `reproducibility_class`: `deterministic`, `seeded_replayable`, `schedule_or_environment_dependent`, `statistical`, or `observational_only`; for schedule-dependent or statistical results report every attempt and the `stopping_rule`.

    Call validate_security_poc with the exact candidate_sha256, honest result, exact local commands, output, and evidence, then update_security_finding with a concise `note`. A finding that already carries status `false_positive`, `accepted_risk`, or `fixed` keeps it: record your note and leave the status unchanged. Otherwise set `confirmed` only when the stored PoC reproduced under the required workflow, else `triaged`. If the environment blocked the PoC (no build, missing toolchain, no fork endpoint), keep `triaged` and record `policy_check` `reproduction`, `policy_disposition` `unreproducible_env` (the step is retried); if it ran, record `reproduced` or `not_reproduced`. `accepted_risk` is a human decision recorded from the dashboard; a post-script never sets it.
