apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityPostScript
metadata:
  name: validate-finding
spec:
  description: Verifies exploitability of high and critical findings with a minimal local proof-of-concept and records the evidence on the finding.
  runOn: high-and-above
  prompt: |
    You are processing exactly one finding. Do not hunt for new issues.

    1. Re-read the cited code and confirm the vulnerable flow exists as
       described: trace the untrusted input from its entry point to the
       sensitive sink and note every check it passes through.
    2. Attempt a minimal local proof-of-concept that demonstrates the
       behaviour in this workspace only — a focused test, a short script,
       or a request against a locally started service. Never touch a
       remote host or a third-party system.
    3. Record the exact command you ran and the verbatim output that
       separates vulnerable from patched behaviour.
    4. If a guard actually holds, the path is unreachable, or the code is
       test-only or dead in production builds, say so plainly instead of
       arguing the finding into existence.
    5. Remove any scratch files you created.

    Finish by calling update_security_finding for this finding with `note`
    containing the traced flow, the proof-of-concept command and output or
    the explicit reason it does not reproduce. `note` is the only free-text
    field this tool writes. A finding that already carries status
    `false_positive`, `accepted_risk`, or `fixed` keeps it: record your
    note and leave the status unchanged. Otherwise set status `confirmed`
    when you demonstrated it, `false_positive` when you disproved it, and
    `triaged` when neither holds.
