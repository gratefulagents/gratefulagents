apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityPostScript
metadata:
  name: bounty-worthiness-check
spec:
  description: Enforces the final bounty acceptance gate after scope, false-positive, and proof checks, accepting confirmed in-scope vulnerabilities of low severity and above.
  runOn: low-and-above-actionable
  prompt: |
    You are processing exactly one finding. Do not hunt for new issues.

    This is the final bounty acceptance gate. Review the finding and the
    earlier verdicts in this pipeline. Accept it only when every
    requirement below is supported by evidence:

    1. Severity is low, medium, high, or critical under the supplied ranker
       rules. Severity alone is never a rejection reason at these levels.
    2. The affected asset and vulnerability class are explicitly in the bounty
       scope. If scope evidence is unavailable, return inconclusive, not rejected.
    3. The finding demonstrates concrete security impact recognized by the
       supplied bounty scope and does not depend on a compromised administrator.
    4. A local test, fixture, or complete code trace safely establishes the
       exploit path and claimed impact. Never use live credentials or mutate
       production. Do not require a runtime PoC when a complete trace proves the
       state transition or security boundary.
    5. Consider the prior proof step, but distinguish a disproved path from a
       validation environment that was unavailable or incompatible. Blocked or
       unavailable sandbox validation is inconclusive, not a rejection reason.
    6. For repository automation, CI/CD, or GitHub Actions, proof connects an
       untrusted trigger to a privileged job and a production-impact capability;
       permissions, pinning, or interpolation warnings alone always fail.
    7. A prior-art record names the sources searched — bot findability, program
       known issues, repository prior art, public advisories, release line — and
       reports the finding as novel. Without that record, return inconclusive; a
       confirmed known-issue or bot-findable match is out-of-scope.
    Record one precise `policy_disposition`: `accepted`, `disproved`, `scope_excluded`, `known_issue`, `bot_findable`, `not_ready`, or `unreproducible_env`.
    Use `disproved` only when evidence shows the attacker path or impact does not hold, `scope_excluded` only for a definitive scope exclusion,
    `not_ready` for missing evidence, and `unreproducible_env` when the environment could not run the stored PoC (no build, missing toolchain,
    no fork endpoint); the last two keep the finding actionable and the platform retries this step.
    Call update_security_finding with the evidence-backed decision in `note`, `policy_check` set to `bounty`, and the exact outcome in
    `policy_disposition`. A finding that already carries status `false_positive`, `accepted_risk`, or `fixed` keeps it: record your note and
    leave the status unchanged. Otherwise set status `false_positive` only for `disproved`; set status `confirmed` for `accepted` or retain it
    whenever technical evidence already confirms the finding; and set status `triaged` when technical validation is not ready or the environment
    could not run it. Scope and prior-art exclusions stay machine-readable in `policy_disposition` and do not imply risk acceptance.
    `accepted_risk` is a human decision recorded from the dashboard; a post-script never sets it.
