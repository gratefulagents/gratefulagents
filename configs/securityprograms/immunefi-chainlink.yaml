    Impacts in Scope
    Impacts Body

    Only the following impacts are accepted within this bug bounty program. All other impacts are out of scope, even if they affect an in scope asset.

    Critical


    Any governance voting result manipulation



    Critical


    Predictable or manipulable RNG that results in abuse of downstream services



    Critical


    Misreporting of prices and/or data



    Critical


    RMN onchain curse bypass



    Critical


    Direct theft of any user funds, whether at-rest or in-motion, other than unclaimed yield



    Critical


    Permanent freezing of funds



    Critical


    Protocol insolvency



    High


    Theft of protocol revenue



    High


    Rate limit violations



    High


    Delaying delivery of oracle price feed updates unrelated to congestion of the underlying blockchain and unrelated to CCIP



    Medium


    Loss of protocol revenue (i.e skipping all or part of protocol fees)



    Medium


    Griefing in the condition where the cost of carrying out attack is less than or equal to the damage



    Medium


    Unbounded gas consumption



    Low


    Smart contract fails to deliver expected return(s) but doesn’t result in loss of value



    Low


    Griefing in the condition where the cost of carrying out attack is more than the damage

