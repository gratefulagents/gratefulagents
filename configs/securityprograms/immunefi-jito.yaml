apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityProgram
metadata:
  name: immunefi-jito
spec:
  scanTargets:
    - repositoryURL: https://github.com/jito-foundation/jito-solana
      baseBranch: master
      workflowRef: blockchain-protocol-audit
      policyPackRef: bug-bounty
      scanName: immunefi-jito-solana
      displayName: Jito Solana
      priority: 18
      featured: false
  provider: Immunefi
  displayName: Jito
  programURL: https://immunefi.com/bug-bounty/jito/scope/
  verifiedAt: 2026-08-12T00:00:00Z
  severitySystem: immunefi-v2.3
  inScopeImpacts:
    - impact: "Direct loss of funds"
      level: critical
      assetType: "Blockchain/DLT"
    - impact: "Permanent freezing of funds (fix requires hardfork)"
      level: critical
      assetType: "Blockchain/DLT"
    - impact: "Network not being able to confirm new transactions (total network shutdown)"
      level: critical
      assetType: "Blockchain/DLT"
    - impact: "Unintended permanent chain split requiring hard fork (network partition requiring hard fork)"
      level: critical
      assetType: "Blockchain/DLT"
    - impact: "Temporary freezing of network transactions by delaying one block by 500% or more of the average block time of the preceding 24 hours beyond standard difficulty adjustments"
      level: high
      assetType: "Blockchain/DLT"
    - impact: "Unintended chain split (network partition)"
      level: high
      assetType: "Blockchain/DLT"
    - impact: "Causing network processing nodes to process transactions from the mempool beyond set parameters"
      level: medium
      assetType: "Blockchain/DLT"
    - impact: "Increasing network processing node resource consumption by at least 30% without brute force actions, compared to the preceding 24 hours"
      level: medium
      assetType: "Blockchain/DLT"
    - impact: "Shutdown of greater than or equal to 30% of network processing nodes without brute force actions, but does not shut down the network"
      level: medium
      assetType: "Blockchain/DLT"
    - impact: "A bug in the respective layer 0/1/2 network code that results in unintended smart contract behavior with no concrete funds at direct risk"
      level: medium
      assetType: "Blockchain/DLT"
    - impact: "Shutdown of greater than 10% or equal to but less than 30% of network processing nodes without brute force actions, but does not shut down the network"
      level: low
      assetType: "Blockchain/DLT"
    - impact: "Modification of transaction fees outside of design parameters"
      level: low
      assetType: "Blockchain/DLT"
    - impact: "Direct theft of any user funds, whether at-rest or in-motion, other than unclaimed yield"
      level: critical
      assetType: "Smart Contract"
    - impact: "Permanent freezing of funds"
      level: critical
      assetType: "Smart Contract"
    - impact: "Theft of protocol revenue"
      level: high
      assetType: "Smart Contract"
    - impact: "Theft of Yield"
      level: high
      assetType: "Smart Contract"
    - impact: "Griefing (e.g. no profit motive for an attacker, but damage to the users or the protocol)"
      level: medium
      assetType: "Smart Contract"
  scopePolicy: |
    Verbatim Immunefi scope (retrieved 2026-08-12T15:44:25.476Z; page last updated 12 August 2026).

    Displayed wording is preserved; layout whitespace is normalized.

    Blockchain/DLT

    Assets in Scope
    Target    Name    Added on

    https://github.com/jito-foundation/firebam    firedancer fork for bam    12 August 2026
    https://github.com/jito-foundation/jito-solana    jito-solana    27 August 2024

    Impacts in Scope
    Impacts Body

    Only the following impacts are accepted within this bug bounty program. All other impacts are not considered as in-scope, even if they affect something in the assets in scope table.

    Critical


    Direct loss of funds



    Critical


    Permanent freezing of funds (fix requires hardfork)



    Critical


    Network not being able to confirm new transactions (total network shutdown)



    Critical


    Unintended permanent chain split requiring hard fork (network partition requiring hard fork)



    High


    Temporary freezing of network transactions by delaying one block by 500% or more of the average block time of the preceding 24 hours beyond standard difficulty adjustments



    High


    Unintended chain split (network partition)



    Medium


    Causing network processing nodes to process transactions from the mempool beyond set parameters



    Medium


    Increasing network processing node resource consumption by at least 30% without brute force actions, compared to the preceding 24 hours



    Medium


    Shutdown of greater than or equal to 30% of network processing nodes without brute force actions, but does not shut down the network



    Medium


    A bug in the respective layer 0/1/2 network code that results in unintended smart contract behavior with no concrete funds at direct risk



    Low


    Shutdown of greater than 10% or equal to but less than 30% of network processing nodes without brute force actions, but does not shut down the network



    Low


    Modification of transaction fees outside of design parameters

     View rewards

    Out of scope
    Program's Out of Scope information
    Any affected code, from dependant Solana client implementations (eg. Agave or Firedancer) should be reported upstream.
    Example code (https://github.com/jito-foundation/jito-programs/tree/master/example-programs)
    any findings should be exploitable without being a trusted third party, findings involving a trusted third party for example BAM node may be considered on a discretionary basis since these would be more defense in depth controls rather than a direct exploit path
    any findings which assume misconfiguration, for example a deployment of a program gone wrong or a validator misconfigured are not in scope
    any findings which can only be demonstrated using unit tests only are out of scope. The attack must be a possible attack vector under realistic network/deployment conditions to be considered. A unit test can be used to demonistrat and can be a sufficient POC if it meets this criteria but can not be the sole determining factor.
    Default Out of Scope and rules

    Blockchain/DLT specific

    Incorrect data supplied by third party oracles
    Not to exclude oracle manipulation/flash loan attacks
    Impacts requiring basic economic and governance attacks (e.g. 51% attack)
    Lack of liquidity impacts
    Impacts from Sybil attacks
    Impacts involving centralization risks

    All categories

    Impacts requiring attacks that the reporter has already exploited themselves, leading to damage
    Impacts caused by attacks requiring access to leaked keys/credentials
    Impacts caused by attacks requiring access to privileged addresses (including, but not limited to: governance and strategist contracts) without additional modifications to the privileges attributed
    Impacts relying on attacks involving the depegging of an external stablecoin where the attacker does not directly cause the depegging due to a bug in code
    Mentions of secrets, access tokens, API keys, private keys, etc. in Github will be considered out of scope without proof that they are in-use in production
    Best practice recommendations
    Feature requests
    Impacts on test files and configuration files unless stated otherwise in the bug bounty program
    Impacts requiring phishing or other social engineering attacks against project's employees and/or customers

