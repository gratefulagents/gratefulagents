apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityProgram
metadata:
  name: immunefi-filecoin
spec:
  scanTargets:
    - repositoryURL: https://github.com/filecoin-project/lotus
      baseBranch: master
      workflowRef: filecoin-security-review
      policyPackRef: bug-bounty
      scanName: filecoin-lotus
      displayName: Filecoin Lotus
      priority: 53
      featured: true
    - repositoryURL: https://github.com/filecoin-project/builtin-actors
      baseBranch: master
      workflowRef: filecoin-security-review
      policyPackRef: bug-bounty
      scanName: filecoin-builtin-actors
      displayName: Filecoin built-in actors
      priority: 54
      featured: true
    - repositoryURL: https://github.com/filecoin-project/ref-fvm
      baseBranch: master
      workflowRef: filecoin-security-review
      policyPackRef: bug-bounty
      scanName: filecoin-ref-fvm
      displayName: Filecoin FVM
      priority: 55
      featured: true
    - repositoryURL: https://github.com/filecoin-project/go-f3
      baseBranch: main
      workflowRef: filecoin-security-review
      policyPackRef: bug-bounty
      scanName: filecoin-go-f3
      displayName: Filecoin Fast Finality
      priority: 56
      featured: true
  provider: Immunefi
  displayName: Filecoin
  programURL: https://immunefi.com/bug-bounty/filecoin/scope/
  verifiedAt: 2026-08-24T00:00:00Z
  severitySystem: immunefi-v2.3
  primacy: rules
  pocRequired: true
  pocEnvironment: local-devnet
  kycRequired: true
