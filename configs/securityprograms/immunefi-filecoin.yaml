  inScopeImpacts:
    - impact: Direct loss of funds
      level: critical
      assetType: Blockchain/DLT
    - impact: DoS of greater than 10% but less than 30% of validator or miner nodes and does not shut down the network
      level: low
      assetType: Blockchain/DLT
    - impact: High compute consumption by validator/mining nodes where a crash, memory exhaustion, or any other demonstrated lasting effect involving network availability is demonstrated.
      level: medium
      assetType: Blockchain/DLT
    - impact: Unintended permanent chain split requiring hard fork (network partition requiring hard fork)
      level: critical
      assetType: Blockchain/DLT
    - impact: Permanent freezing of funds (fix requires hardfork)
      level: critical
      assetType: Blockchain/DLT
    - impact: Underpricing transaction fees relative to computation time
      level: low
      assetType: Blockchain/DLT
    - impact: Contract on the platform fails to deliver promised returns, but doesn’t lose values
      level: low
      assetType: Blockchain/DLT
    - impact: EVM instruction fails to execute when provided with concrete parameters
      level: low
      assetType: Blockchain/DLT
    - impact: Unintended chain split (Network partition) with localized impacts (which would require hard fork but doesn’t affect the chain as whole)
      level: high
      assetType: Blockchain/DLT
    - impact: Transient consensus failures (Temporary halt in transactions leading to consensus failure)
      level: high
      assetType: Blockchain/DLT
    - impact: Protocol-level bug preventing contracts from using their funds
      level: high
      assetType: Blockchain/DLT
    - impact: Protocol-level bug causing the inability for developers to deploy new smart contracts
      level: high
      assetType: Blockchain/DLT
    - impact: Protocol-level bug rendering a single contract unusable after the exploit (i.e. contract bricked)
      level: high
      assetType: Blockchain/DLT
    - impact: DoS of greater than 30% of validator or miner nodes and does not shut down the network
      level: medium
      assetType: Blockchain/DLT
    - impact: EVM instruction fails to execute, in a general way
      level: medium
      assetType: Blockchain/DLT
    - impact: Inability to deploy a contract under a specific circumstances
      level: medium
      assetType: Blockchain/DLT
    - impact: Total Chain halt
      level: critical
      assetType: Blockchain/DLT
    - impact: Protocol-level bug that causes a general breakage of all contracts deployed on the chain
      level: critical
      assetType: Blockchain/DLT
    - impact: Protocol-level bug that enables tricking contracts into sending funds to arbitrary addresses
      level: critical
      assetType: Blockchain/DLT
    - impact: Inability to propagate new transactions (limited to fraction of the network)
      level: high
      assetType: Blockchain/DLT
  knownIssues:
    - source: Public repository disclosures
      summary: Issues, pull requests, and code comments already disclosed in the in-scope repositories are known and ineligible.
    - source: Previous audits
      summary: Unfixed vulnerabilities already identified in Filecoin audit reports linked from the Filecoin specification are ineligible.
  outOfScope:
    - Unit tests (_test.go, #[test], or equivalent) as the sole proof of concept
    - Fuzzer crash outputs without a local-devnet reproduction proving external reachability
    - Static-analysis or linter findings without demonstrated exploitability on a local devnet
    - Theoretical writeups without runnable exploit code
    - Screenshots or video recordings as sole evidence
    - AI/LLM-generated reports not validated by the researcher against a running local devnet
    - Incorrect data supplied by third-party oracles, except oracle manipulation or flash-loan attacks
    - Impacts requiring basic economic or governance attacks, including 51% attacks
    - Lack of liquidity, Sybil, or centralization impacts
    - Impacts requiring leaked keys, credentials, or existing privileged-address access
    - Best-practice recommendations and feature requests
    - Impacts on test files and configuration files unless the program expressly includes them
    - Impacts requiring phishing or social engineering
  prohibitedTesting:
    - Any testing on mainnet or public-testnet deployed code; use a local devnet
    - Any denial-of-service attack executed against project assets
    - Automated testing that generates significant amounts of traffic
    - Testing with pricing oracles, third-party smart contracts, systems, applications, or websites
    - Phishing or other social-engineering attacks against employees or customers
    - Public disclosure of an unpatched vulnerability in an embargoed bounty
