    This is a Primacy of Rules program. A valid bounty report must affect an itemized asset and produce an itemized impact. The published table contains 30 rows: 29 source-code assets, plus https://filecoin.io as the non-code "Primacy of Impact" marker. The 29 source rows collapse to 28 repositories because Lotus is listed both at the repository root and specifically at master/miner. Automated scans intentionally target only the four featured core blockchain implementations: Lotus, built-in actors, ref-fvm, and go-f3. The remaining official assets stay recorded for bounty eligibility but are not scheduled as standalone scans. The Lotus scan target imports the root once; bounty eligibility must still be checked against the exact published asset rows. Repository default branches were verified on 2026-08-24; Immunefi itself explicitly pins only the Lotus miner row to master/miner.

    Program status and rewards
    - Live since 14 April 2023; last updated 21 July 2026.
    - The structured header and reward table publish a $50,000 maximum bounty: Critical $25,000-$50,000, High $7,500-$25,000, Medium $2,000-$7,500, and Low $1,000-$2,000.
    - Critical rewards are described in the structured table as 10% of directly affected funds, capped at $50,000 with a $25,000 minimum.
    - The same information page contains stale-looking prose stating a $150,000 cap and $100,000 minimum, which conflicts with its structured current table. This snapshot preserves the discrepancy rather than silently choosing the larger figure.
    - Rewards are denominated in USD and paid in USDC on Ethereum. KYC is required for payout.

    Out of scope
    All submissions must include a working proof of concept demonstrated against a running local devnet.
    The following are out of scope and will be closed without review:
    - Unit tests (_test.go, #[test], or equivalent) as the sole PoC; unit tests do not exercise consensus, networking, or state sync, which are the layers where exploitability must be proven
    - Fuzzer crash outputs without a devnet reproduction showing the crash is reachable from an external input on a running node
    - Static analysis or linter findings without demonstrated exploitability on a devnet
    - Theoretical writeups without runnable exploit code
    - Screenshots or video recordings as sole evidence (acceptable as supplements, not replacements)
    - AI/LLM-generated reports not validated by the researcher against a running devnet

    Proof-of-concept boundary
    Every severity requires a runnable proof of concept against a running local devnet. The program directs researchers to https://github.com/FilecoinFoundationWeb/filecoin-audit-kit and requires the Audit Kit setup and version, any source modifications as diffs, runnable exploit code, execution output, and impact evidence such as crash logs, state diffs, or chain behavior. Unit tests alone, raw fuzzer crashes, static-analysis output, theoretical reports, screenshots/video alone, and unvalidated AI/LLM output are explicitly insufficient.

    Eligibility and disclosure
    Current and former Filecoin core-development team members, and current or former employees, contractors, or others paid by Protocol Labs or Filecoin Foundation to work directly or indirectly on Filecoin, are not eligible for rewards. Reports must remain confidential and follow Immunefi rules. The official Filecoin security policy directs reports to this Immunefi program and asks researchers not to use public GitHub issues.
