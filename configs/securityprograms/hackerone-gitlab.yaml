apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityProgram
metadata:
  name: hackerone-gitlab
spec:
  provider: HackerOne
  displayName: GitLab
  programURL: https://hackerone.com/gitlab
  verifiedAt: 2026-08-15T00:00:00Z
  severitySystem: custom
  primacy: rules
  scopePolicy: |-
    Verification boundary (2026-08-15)

    GitLab confirms that vulnerabilities in GitLab itself or GitLab.com are reported through this HackerOne program. The live HackerOne asset table and program-specific exclusions were not renderable during verification. No scan target is shipped until an operator verifies a current scope row. Source: https://about.gitlab.com/security/disclosure/

    Operator gate
    This catalog record is provenance and policy context only. It grants no network authorization. Re-check the authoritative program immediately before testing because bounty scope changes without notice.
  outOfScope:
    - Any asset not explicitly listed in the current authoritative program scope
    - Any customer-owned or third-party asset not expressly included by the program
  prohibitedTesting:
    - Do not test any network target from this catalog record until an operator verifies and configures a current in-scope asset
    - No denial of service, social engineering, spam, physical intrusion, or access to another user's data
