    Out of scope
    Program's Out of Scope information
    Out of Scope and Rules
    Smart Contract specific
    Incorrect data supplied by third party oracles
    Not to exclude oracle manipulation/flash loan attacks
    Impacts requiring basic economic and governance attacks (e.g. 51% attack)
    Lack of liquidity impacts
    Impacts from Sybil attacks
    Impacts involving centralization risks
    All categories
    Impacts only reachable under a non-default node or chain configuration, or in a feature not currently enabled on Arbitrum One or Arbitrum Nova
    Impacts that only manifest during a node-software upgrade/rollout window, historical block replay, or archive/from-genesis sync, and do not affect the live canonical chain
    Impacts requiring attacks that the reporter has already exploited themselves, leading to damage
    Impacts caused by attacks requiring access to leaked keys/credentials
    Impacts caused by attacks requiring access to privileged addresses/roles (including, but not limited to: governance, sequencer, batch poster and feed relays and strategist contracts) without additional modifications to the privileges attributed
    Impacts relying on attacks involving the depegging of an external stablecoin where the attacker does not directly cause the depegging due to a bug in code
    Mentions of secrets, access tokens, API keys, private keys, etc. in Github will be considered out of scope without proof that they are in-use in production
    Best practice recommendations
    Feature requests
    Impacts on test files and configuration files unless stated otherwise in the bug bounty program
    Impacts requiring phishing or other social engineering attacks against project's employees and/or customers
    Impacts affecting only validator/assertion stakes, challenge bonds, or protocol fee accounts (theft, loss, or freezing) — these funds are excluded from the user-fund impact tiers

    Informational

    Changes or bugs found or related to Tutorials maintained by Offchain Labs
    Changes or bugs regarding the arbitrum-sdk
    Inconsistencies found between documentation and smart contracts and other blockchain code
    Best practice critiques
    Denial of Service (DoS) Attacks that only affects some nodes, or cause only some nodes to crash
    Problems caused by L1 Gas Pricing
    Issues that affect geth and are not caused by changes made in the Nitro implementation
    Issues that affect Arbitrum One and Arbitrum Nova will be treated as a single issue, and a report of the same issue with the only difference being the network will be treated as a duplicate.
