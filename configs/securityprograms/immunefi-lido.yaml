    Impacts in Scope
    Impacts Body

    If the smart contract where the vulnerability exists can be paused, only the initial attack window of 1-hour will be considered for a reward. This is because the project can mitigate the risk of further exploitation by pausing the component where the vulnerability exists.

    If the smart contract where the vulnerability exists can only be upgraded, only the initial attack window of 5-days for Critical issues and 9 days for other issues will be considered for a reward. This is because the project can mitigate the risk of further exploitation by upgrading the component where the vulnerability exists.

    Critical


    Execute arbitrary system commands



    Critical


    Taking and/modifying authenticated actions (with or without blockchain state interaction) on behalf of other users without any interaction by that user, such as:

    Changing registration information
    Commenting
    Voting
    Making trades
    Withdrawals, etc.


    Critical


    Subdomain takeover with already-connected wallet interaction



    Critical


    Direct theft of user funds



    Critical


    Malicious interactions with an already-connected wallet, such as:

    Modifying transaction arguments or parameters
    Substituting contract addresses
    Submitting malicious transactions


    High


    Changing sensitive details of other users (including modifying browser local storage) without already-connected wallet interaction and with up to one click of user interaction, such as:

    Email
    Password of the victim etc.


    High


    Subdomain takeover without already-connected wallet interaction



    High


    Retrieve sensitive data/files from a running server, such as: /etc/shadow database passwords blockchain keys (this does not include non-sensitive environment variables, open source code, or usernames)



    Medium


    Redirecting users to malicious websites (open redirect)



    Medium


    Injecting/modifying the static content on the target application without JavaScript injection such as HTML injection, replacing existing text with arbitrary text, arbitrary file uploads, etc.



    Medium


    Improperly disclosing confidential user information such as email address, phone number, IP address, etc.



    Low


    Changing details of other users (including modifying browser local storage) without already-connected wallet interaction and with significant user interaction, such as:

    Iframing leading to modifying the backend/browser state (must demonstrate impact with PoC)


    Low


    Taking over broken or expired outgoing links, such as:

    Social media handles, etc.


    Low


    Taking down the application/website



    Low


    Changing non- sensitive details of other users (including modifying browser local storage) without already-connected wallet interaction and with up to one click of user interaction, such as changing the first/last name of user, or en/disabling

