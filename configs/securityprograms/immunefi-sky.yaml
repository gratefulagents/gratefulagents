    Impacts in Scope
    Impacts Body

    Only the following impacts are accepted within this bug bounty program. All other impacts are not considered as in-scope, even if they affect something in the assets in scope table.

    Critical


    Direct theft of any user funds, whether at-rest or in-motion, other than unclaimed yield



    Critical


    Manipulation of governance voting result deviating from voted outcome and resulting in a direct change from intended effect of original results



    Critical


    Protocol insolvency



    Critical


    Permanent freezing of funds



    Critical


    Prevention of governance participation despite design parameters providing participation rights



    High


    Theft of unclaimed yield



    High


    Permanent freezing of unclaimed yield



    High


    Temporary freezing of funds for at least five blocks



    Medium


    Smart contract unable to operate due to lack of token funds



    Medium


    Griefing (e.g. no profit motive for an attacker, but damage to the users or the protocol)



    Medium


    Theft of gas



    Low


    Smart contract fails to work correctly, but doesn’t lose value

     View rewards

    Out of scope
    Program's Out of Scope information

    The following vulnerabilities are excluded from the rewards for this bug bounty program:

    All impacts relying on attacks involving the depegging of an external stablecoin where the attacker does not directly cause the depegging due to a bug in code

    Impacts that rely on the governance approval of a malicious spell or governance crafting malicious code

    Impacts involving the deprecated Emergency Shutdown Module

    Default Out of Scope and rules

    Smart Contract specific

    Incorrect data supplied by third party oracles
    Not to exclude oracle manipulation/flash loan attacks
    Impacts requiring basic economic and governance attacks (e.g. 51% attack)
    Lack of liquidity impacts
    Impacts from Sybil attacks
    Impacts involving centralization risks

    All categories

    Impacts requiring attacks that the reporter has already exploited themselves, leading to damage
    Impacts caused by attacks requiring access to leaked keys/credentials
    Impacts caused by attacks requiring access to privileged addresses (including, but not limited to: governance and strategist contracts) without additional modifications to the privileges attributed
    Impacts relying on attacks involving the depegging of an external stablecoin where the attacker does not directly cause the depegging due to a bug in code
    Mentions of secrets, access tokens, API keys, private keys, etc. in Github will be considered out of scope without proof that they are in-use in production
    Best practice recommendations
    Feature requests
    Impacts on test files and configuration files unless stated otherwise in the bug bounty program
    Impacts requiring phishing or other social engineering attacks against project's employees and/or customers

