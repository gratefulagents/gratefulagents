apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityProgram
metadata:
  name: immunefi-sky
spec:
  scanTargets:
    - repositoryURL: https://github.com/sky-ecosystem/dss
      baseBranch: master
      workflowRef: smart-contract-review
      policyPackRef: bug-bounty
      scanName: immunefi-sky-dss
      displayName: Sky DSS
      priority: 10
      featured: true
  provider: Immunefi
  displayName: Sky
  programURL: https://immunefi.com/bug-bounty/sky/scope/
  verifiedAt: 2026-08-12T00:00:00Z
  severitySystem: immunefi-v2.3
  inScopeImpacts:
    - impact: "Direct theft of any user funds, whether at-rest or in-motion, other than unclaimed yield"
      level: critical
      assetType: "Smart Contract"
    - impact: "Manipulation of governance voting result deviating from voted outcome and resulting in a direct change from intended effect of original results"
      level: critical
      assetType: "Smart Contract"
    - impact: "Protocol insolvency"
      level: critical
      assetType: "Smart Contract"
    - impact: "Permanent freezing of funds"
      level: critical
      assetType: "Smart Contract"
    - impact: "Prevention of governance participation despite design parameters providing participation rights"
      level: critical
      assetType: "Smart Contract"
    - impact: "Theft of unclaimed yield"
      level: high
      assetType: "Smart Contract"
    - impact: "Permanent freezing of unclaimed yield"
      level: high
      assetType: "Smart Contract"
    - impact: "Temporary freezing of funds for at least five blocks"
      level: high
      assetType: "Smart Contract"
    - impact: "Smart contract unable to operate due to lack of token funds"
      level: medium
      assetType: "Smart Contract"
    - impact: "Griefing (e.g. no profit motive for an attacker, but damage to the users or the protocol)"
      level: medium
      assetType: "Smart Contract"
    - impact: "Theft of gas"
      level: medium
      assetType: "Smart Contract"
    - impact: "Smart contract fails to work correctly, but doesn’t lose value"
      level: low
      assetType: "Smart Contract"
    - impact: "Direct theft of user funds"
      level: critical
      assetType: "Web & App"
    - impact: "Retrieve sensitive data/files from a running server such as /etc/shadow, database passwords, and blockchain keys(this does not include non-sensitive environment variables, open source code, or usernames)"
      level: critical
      assetType: "Web & App"
    - impact: "Taking state-modifying authenticated actions (with or without blockchain state interaction) on behalf of other users without any interaction by that user, such as, changing registration information, commenting, voting, making trades, withdrawals, etc."
      level: critical
      assetType: "Web & App"
    - impact: "Malicious interactions with an already-connected wallet such as modifying transaction arguments or parameters, substituting contract addresses, submitting malicious transactions"
      level: critical
      assetType: "Web & App"
    - impact: "Execute arbitrary system commands, only when allowing access to sensitive data or causing financial losses"
      level: critical
      assetType: "Web & App"
    - impact: "Subdomain takeover with already-connected wallet interaction, only for subdomains that are not used for testing"
      level: critical
      assetType: "Web & App"
    - impact: "Subdomain takeover without already-connected wallet interaction"
      level: high
      assetType: "Web & App"
    - impact: "Injecting/modifying the static content on the target application without Javascript (Persistent) such as HTML injection without Javascript, replacing existing text with arbitrary text, arbitrary file uploads, etc."
      level: high
      assetType: "Web & App"
    - impact: "Changing sensitive details of other users (including modifying browser local storage) without already-connected wallet interaction and with up to one click of user interaction, such as email or password of the victim, etc."
      level: high
      assetType: "Web & App"
    - impact: "Improperly disclosing confidential user information such as email address, phone number, physical address, etc."
      level: high
      assetType: "Web & App"
    - impact: "Redirecting users to malicious websites (open redirect)"
      level: medium
      assetType: "Web & App"
    - impact: "Changing non-sensitive details of other users (including modifying browser local storage) without already-connected wallet interaction and with up to one click of user interaction, such as changing the first/last name of user, or en/disabling notification"
      level: medium
      assetType: "Web & App"
    - impact: "Injecting/modifying the static content on the target application without Javascript (Reflected) such as reflected HTML injection or loading external site data"
      level: medium
      assetType: "Web & App"
    - impact: "Taking down the application/website, in a way that doesn’t allow remediation in less than half an hour"
      level: medium
      assetType: "Web & App"
