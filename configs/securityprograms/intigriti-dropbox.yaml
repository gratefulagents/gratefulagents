    - targetURL: "https://www.docsend.com"
      workflowRef: web-app-full-assessment
      policyPackRef: web-application
      scanName: dropbox-docsend
      displayName: "Dropbox — DocSend"
      priority: 10007
      featured: false
    - targetURL: "https://app.reclaim.ai"
      workflowRef: web-app-full-assessment
      policyPackRef: web-application
