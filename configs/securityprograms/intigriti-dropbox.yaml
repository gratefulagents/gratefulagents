apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityProgram
metadata:
  name: intigriti-dropbox
spec:
  scanTargets:
    - targetURL: https://www.dropbox.com
      workflowRef: web-app-full-assessment
      policyPackRef: web-application
      scanName: dropbox-web
      displayName: Dropbox.com
      priority: 1
      featured: true
    - targetURL: https://sign.dropbox.com
      workflowRef: web-app-full-assessment
      policyPackRef: web-application
      scanName: dropbox-sign
      displayName: Dropbox Sign
      priority: 2
      featured: true
    - targetURL: https://www.hellosign.com
      workflowRef: web-app-full-assessment
      policyPackRef: web-application
      scanName: dropbox-hellosign
      displayName: HelloSign.com
      priority: 3
      featured: true
    - targetURL: https://dash.ai
      workflowRef: web-app-full-assessment
      policyPackRef: web-application
      scanName: dropbox-dash-ai
      displayName: Dash.ai
      priority: 4
      featured: true
    - targetURL: https://dash.dropbox.com
      workflowRef: web-app-full-assessment
      policyPackRef: web-application
      scanName: dropbox-dash
      displayName: Dropbox Dash
      priority: 5
      featured: true
    - targetURL: https://api.dropbox.com
      workflowRef: web-api-assessment
      policyPackRef: web-application
      scanName: dropbox-api
      displayName: Dropbox API
      priority: 6
      featured: true
    - targetURL: https://www.hellofax.com
      workflowRef: web-app-full-assessment
      policyPackRef: web-application
      scanName: dropbox-hellofax
      displayName: HelloFax.com
      priority: 7
      featured: false
    - targetURL: https://www.docsend.com
      workflowRef: web-app-full-assessment
      policyPackRef: web-application
      scanName: dropbox-docsend
      displayName: DocSend.com
      priority: 8
      featured: false
    - targetURL: https://app.reclaim.ai
      workflowRef: web-app-full-assessment
      policyPackRef: web-application
      scanName: dropbox-reclaim
      displayName: Reclaim.ai
      priority: 9
      featured: false
    - targetURL: https://www.dropbox.com/paper
      workflowRef: web-app-full-assessment
      policyPackRef: web-application
      scanName: dropbox-paper
      displayName: Dropbox Paper
      priority: 10
      featured: false
  provider: Intigriti
  displayName: Dropbox
  programURL: https://app.intigriti.com/programs/dropbox/dropbox/detail
  verifiedAt: 2026-08-15T00:00:00Z
  severitySystem: custom
  primacy: rules
  pocRequired: true
  scopePolicy: |-
    Public Intigriti scope snapshot verified 2026-08-15

    Tier 1 web assets
    Dropbox.com
    sign.dropbox.com
    HelloSign.com
    dash.ai
    dash.dropbox.com
    api.dropbox.com

    Tier 2 web assets
    HelloFax.com
    docsend.com
    app.Reclaim.ai
    dropbox.com/paper

    Tier 3 wildcard assets
    *.dropbox.com
    *.dropboxer.net
    *.dropboxforum.com
    *.dropboxpartners.com
    *.hellofax.com
    *.docsend.com
    *.reclaim.ai
    *.helloworks.com
    *.hellosign.com
    *.dash.ai

    Explicit out-of-scope web asset
    replay.dropbox.com

    Rules of engagement
    Use an @intigriti.me identity. Send User-Agent "Intigriti - <username> - <user agent>" and X-Intigriti-Username: <username>. Automated tooling is limited to 5 requests per second. Use only test accounts and verify automated results manually. The vulnerability must demonstrate security impact to a listed asset.

    Reward tiers at verification
    Tier 1: Low $100-$500; Medium $500-$1,000; High $1,000-$5,000; Critical $5,000-$10,000; Exceptional $10,000-$15,000.
    Tier 2: Low $100-$250; Medium $250-$750; High $750-$2,500; Critical $2,500-$7,500; Exceptional $7,500-$10,000.
    Tier 3: Low $100; Medium $100-$500; High $500-$2,000; Critical $2,000-$5,000; Exceptional $5,000-$7,500.
  outOfScope:
    - Any domain that is not listed in the program's Domains section
    - replay.dropbox.com
    - Any domain or application with a public or private planned deprecation plan
    - XSS on dropboxusercontent.com
    - Third-party integrations not owned by Dropbox
    - Reports from automated tools or scans that are not manually verified
    - Missing security headers or cookie flags without demonstrated impact
    - CORS, CSRF, clickjacking, request smuggling, host-header injection, blind SSRF, or arbitrary upload without demonstrated impact
    - Subdomain takeover without actually taking control
    - Newly patched zero-days within 14 days are usually not bounty-eligible
    - Boxcryptor, Formswift, Dropbox Passwords, and Dropbox Capture desktop applications
  prohibitedTesting:
    - Do not exceed 5 automated requests per second
    - No denial of service, distributed denial of service, brute force, spam, or email bombing
    - No social engineering or physical intrusion
    - Do not access another user's private information; use test accounts only
    - No attacks requiring physical access, man-in-the-middle position, or compromised user accounts
    - Do not publicly disclose before the report is closed and Dropbox grants permission
