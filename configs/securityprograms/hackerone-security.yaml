    Browser-readable asset-table source: https://bbscope.com/program/h1/security (source crawl was two months old at verification).

    In-scope asset rows captured: 25
    *.vpn.hackerone.net; a5s.hackerone-ext-content.com; api.hackerone.com; app.pullrequest.com; b5s.hackerone-ext-content.com; cover-photos-us-east-2.hackerone-user-content.com; cover-photos.hackerone-user-content.com; ctf.hacker101.com; errors.hackerone.net; hackathon-photos-us-east-2.hackerone-user-content.com; hackathon-photos.hackerone-user-content.com; hackerone-ext-content.com; hackerone-us-west-2-production-attachments.s3.us-west-2.amazonaws.com; hackerone-user-content.com; hackerone.com; hackerone.live; https://*.hackerone-ext-content.com; https://*.hackerone-user-content.com; github.com/Hacker0x01/react-datepicker (no bounty); mta-sts.wearehackerone.com; profile-photos-us-east-2.hackerone-user-content.com; profile-photos.hackerone-user-content.com; reviewer.pullrequest.com; www.hackerone.com; www.wearehackerone.com.

    Out-of-scope asset rows captured: 8
    go.hacker.one; h1.community; hackerone-swag.com; info.hacker.one; ma.hacker.one; support.hackerone.com; www.h1.community; www.hackeronestatus.com.

    Scope and identity rules
    Issues within HackerOne's control, including configuration and patching of self-hosted dependencies, may be eligible. Third-party assets outside HackerOne's control are not authorized and are generally informative only. Every testing request must identify the researcher with X-Bug-Bounty: HackerOne-<username>, or identify the tool with X-Bug-Bounty: <toolname>; the report must state which value was used.

    DoS exception
    DoS testing is limited to a single request, user, or IP; no automation or high-volume traffic; Monday through Thursday, 21:00-06:00 UTC only; immediate stop on impact; and disclosure of source IP, timezone, and timing. DDoS, multiple source IPs, resource exhaustion, and data corruption remain prohibited.

    Importable target boundary
    The 21 exact first-party web/API URLs and the explicitly listed repository are exposed as individual import targets. Wildcard content and VPN rows remain policy-only scope. The catalog does not inject the mandatory X-Bug-Bounty header or authorize conditional DoS testing; operators remain responsible for those live-program requirements.

    Operator gate
    Re-open the live policy before testing and configure the mandatory header, a HackerOne-provided sandbox where applicable, and every current rate limit. Customer programs and customer assets are never inherited.
  outOfScope:
    - go.hacker.one
    - h1.community
    - hackerone-swag.com
    - info.hacker.one
    - ma.hacker.one
    - support.hackerone.com
    - www.h1.community
    - www.hackeronestatus.com
    - HackerOne customer programs, customer-owned assets, and third-party assets outside HackerOne's control
    - github.com/Hacker0x01/react-datepicker is listed in scope but marked no bounty
  prohibitedTesting:
    - "Do not send testing traffic without X-Bug-Bounty: HackerOne-<username> or X-Bug-Bounty: <toolname> and report the exact value used"
    - Configure the mandatory identity header before sending testing traffic to an imported target
    - No testing of HackerOne customers, their program data, or their external assets without separate authorization
    - No DDoS, multiple-source testing, high-volume automation, resource exhaustion, or data corruption
    - DoS testing outside Monday-Thursday 21:00-06:00 UTC or beyond one request, user, or IP is prohibited
    - No brute force, spam, social engineering, or physical testing
    - Human-review all automated and AI-assisted results; do not submit unverified or high-volume low-signal reports
    - Stop immediately on unintended impact or data access and retain only minimum evidence
    - Do not publicly disclose without coordinated approval
