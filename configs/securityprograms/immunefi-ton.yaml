apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityProgram
metadata:
  name: immunefi-ton
spec:
  scanTarget:
    repositoryURL: https://github.com/ton-blockchain/ton
    baseBranch: master
    workflowRef: ton-security-review
    policyPackRef: bug-bounty
    scanName: immunefi-ton
    displayName: TON
    priority: 17
    featured: false
  provider: Immunefi
  displayName: TON
  programURL: https://immunefi.com/bug-bounty/ton/scope/
  verifiedAt: 2026-08-12T00:00:00Z
  scopePolicy: |
    Archived last-known scope summary (the configured Immunefi program URL returned Not Found when rechecked on 2026-08-12). The archived/last-known program scope, including its asset list, impact matrix, exclusions, and reward terms, controls if it differs from this snapshot.

    Repository targets:
    - Catalog repository: https://github.com/ton-blockchain/ton.
    - Source must be matched to a listed deployed/in-scope asset on the archived/last-known program scope. Repository affiliation is not blanket eligibility; unlisted paths, branches, commits, deployments, forks, tests, and examples are not eligible unless the archived/last-known scope explicitly lists them.

    Rewards:
    - The program was not present in the live Immunefi bounty catalog when rechecked. No current reward eligibility is asserted; consult the project for any successor disclosure program.

    Eligible impacts:
    - Blockchain/DLT and smart-contract: direct theft or loss of funds, permanent freezing of funds, consensus safety failure, validator or node remote code execution, and unauthorized asset operations on listed targets.
    - Severity, asset eligibility, and impact qualification are determined solely by the live Immunefi scope and reward table.

    Out of scope:
    - Any asset, deployment, code path, dependency, third-party integration, or impact not explicitly listed by the archived/last-known program; known issues, theoretical or best-practice-only reports, and attacks requiring privileged or unrealistic assumptions are excluded unless the archived/last-known scope says otherwise.

    Testing and submission:
    - Test only private/local environments and accounts you control. Do not test mainnet, public testnets, production services, third-party systems, or other users' assets. Do not perform DoS, traffic generation, phishing, social engineering, fund movement, or unapproved public disclosure. Submit a minimal reproducible PoC privately through Immunefi and follow the archived/last-known program's disclosure and eligibility terms.
