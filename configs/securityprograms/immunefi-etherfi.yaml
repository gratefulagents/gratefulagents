apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityProgram
metadata:
  name: immunefi-etherfi
spec:
  scanTargets:
    - repositoryURL: https://github.com/etherfi-protocol/smart-contracts
      baseBranch: master
      workflowRef: bounty-hunt-evm
      policyPackRef: bug-bounty
      scanName: immunefi-etherfi-smart-contracts
      displayName: Ether.fi liquid restaking contract sources
      priority: 81
      featured: true
    - repositoryURL: https://github.com/etherfi-protocol/cash-v3
      baseBranch: master
      workflowRef: bounty-hunt-evm
      policyPackRef: bug-bounty
      scanName: immunefi-etherfi-cash-v3
      displayName: Ether.fi Cash v3 contract sources
      priority: 82
      featured: false
  provider: Immunefi
  displayName: Ether.fi Smart Contracts
  programURL: https://immunefi.com/bug-bounty/etherfi/scope/
  verifiedAt: 2026-08-29T00:00:00Z
  severitySystem: immunefi-v2.3
  primacy: impact
  pocRequired: true
  pocEnvironment: mainnet-fork
  kycRequired: true
  inScopeImpacts:
