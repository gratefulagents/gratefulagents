apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityWorkflow
metadata:
  name: ton-security-review
spec:
  description: End-to-end security review for TON, covering scope, architecture, invariants, specialist review, applicable executable evidence, validation, explicit coverage, triage, remediation, and retest planning.
  parallelism: 3
  tasks:
    - name: scope-architecture-and-invariants
      role: threat-modeler
      category: recon
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-audit-context-building
        - name: trail-of-bits-entry-point-analyzer
        - name: trail-of-bits-property-based-testing
      objective: >-
        Record the immutable revision and all in-scope/out-of-scope roots. Inventory FunC, Tact, Fift or TVM
        contracts, message handlers, Jetton and NFT masters/wallets, clients, validators, cells/BOCs, tests,
        compiler artifacts, initialization data, upgrades, and deployment addresses. Follow production wiring and
        enumerate assets, privileged and attacker roles, entry points, state, trust boundaries, external
        dependencies, artifacts, deployments, existing tests, and harnesses with repository-relative evidence.
        Define testable invariants for every lifecycle and boundary, including authenticated sender and asset
        identity, message replay and state-machine ordering, balance/gas/forward-value conservation, bounce
        compensation, Jetton/NFT master-wallet relationships, cell/slice parse completeness, serialization
        agreement, initialization uniqueness, and upgrade/storage compatibility. Each invariant must name the
        protected asset, attacker, allowed transition, enforcement, alternate paths, impact, and local validation
        target. Mark absent or conflicting context explicitly. This task is inventory and threat modeling only and
        must not claim build, test, analyzer, fuzzer, simulator, prover, network, or run_security_tool execution.
      outputSchema: |-
        {"type":"object","required":["revision","in_scope","out_of_scope","components","entrypoints","trust_boundaries","assets","roles","artifacts","invariants","test_targets","limitations"],"properties":{"revision":{"type":"string"},"in_scope":{"type":"array","items":{"type":"string"}},"out_of_scope":{"type":"array","items":{"type":"string"}},"components":{"type":"array","items":{"type":"string"}},"entrypoints":{"type":"array","items":{"type":"string"}},"trust_boundaries":{"type":"array","items":{"type":"string"}},"assets":{"type":"array","items":{"type":"string"}},"roles":{"type":"array","items":{"type":"string"}},"artifacts":{"type":"array","items":{"type":"string"}},"invariants":{"type":"array","items":{"type":"object"}},"test_targets":{"type":"array","items":{"type":"string"}},"limitations":{"type":"array","items":{"type":"string"}}}}

    - name: specialist-review
      role: vulnerability-hunter
      category: logic-flaw
      skillRefs:
        - name: blockchain-security-research-method
        - name: ton-security-review
        - name: trail-of-bits-ton-vulnerability-scanner
        - name: trail-of-bits-property-based-testing
      objective: >-
        Use {{tasks.scope-architecture-and-invariants.output}} for a complete manual specialist review. Audit
        internal/external/bounced message entry points, bounce behavior, send modes, reserve and forward-TON
        accounting, fake Jetton/NFT contracts, wallet/master relationships, notification and excess flows, sender
        validation, cell/slice/dictionary parsing, BOC serialization, integer-as-boolean and arithmetic semantics,
        initialization, replay, asynchronous partial failure, upgrades, and storage evolution. Follow attacker-
        controlled values through parsing, authorization, state transition, external interaction, rollback, retry,
        recovery, and upgrade paths; compare equivalent admission and execution paths. Report only production-
        reachable invariant violations with decisive file:line evidence, prerequisites, impact, and finding
        fingerprint. Return examined, skipped, unsupported, and inconclusive targets explicitly. Only claim executable tool or test results when the command actually ran and its output is preserved.
      dependsOn: [scope-architecture-and-invariants]
      outputSchema: |-
        {"type":"object","required":["area","status","examined","skipped","limitations","finding_fingerprints"],"properties":{"area":{"type":"string"},"status":{"type":"string","enum":["examined","skipped","unsupported","inconclusive"]},"examined":{"type":"array","items":{"type":"string"}},"skipped":{"type":"array","items":{"type":"string"}},"limitations":{"type":"array","items":{"type":"string"}},"finding_fingerprints":{"type":"array","items":{"type":"string"}}}}

    - name: applicable-tool-execution
      role: vulnerability-hunter
      category: other
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-harness-writing
        - name: trail-of-bits-coverage-analysis
      objective: >-
        Use only concrete artifacts, test_targets, and invariants in {{tasks.scope-architecture-and-invariants.output}}.
        Run safe local project-native builds, tests, simulators, and harnesses after inspecting every invoked script.
        When scoped coverage needs a missing harness, create the smallest deterministic harness in a disposable
        workspace, execute it with local dummy fixtures, and preserve it as an artifact. Never direct test traffic at a live target, production service, or unrelated third party. A registered staged-build pack may use only its reviewed dependency-resolution egress; do not treat that as authorization to scan the dependency host. Use run_security_tool when a
        compatible registered scanner, fuzzer, sanitizer, vector, or analyzer adapter exists. In particular, inventory
        repository-maintained Rust `fuzz/Cargo.toml` `[[bin]]` targets and Go `FuzzXxx` functions. When one covers an
        in-scope attacker-controlled surface, run it through the registered `cargo-fuzz` or `go-fuzz-tests` adapter;
        do not merely inventory it and do not substitute a model-authored general-purpose harness. Run at most two
        highest-value targets for two minutes each. Use an explicit seed for `cargo-fuzz`; for `go-fuzz-tests`,
        record a null seed and the native Go runner's schedule/environment reproducibility limitation. Request two Rust
        workers when the typed option is available and budget permits. Record all discovered targets and why each ran or remained uncovered,
        together with duration, workers, and corpus provenance. A registered run exists only when `run_security_tool`
        returned a run reference; record tool_run as that reference and use null when no registered run exists. For local project-native checks, record the exact
        completed command. Preserve versions, exit status, output, seed, bounds, harnesses, artifacts, examined and
        uncovered scope, and limitations. Missing tools, incompatible harnesses, errors, timeouts, and partial output
        remain visible as unsupported, inconclusive, or skipped. Reproduce and minimize failures where safe. A bounded
        no-finding run is `not_found_under` its exact bounds, never evidence of safety. Recommend `native-fuzz-campaign`
        instead of starting repeated warm rounds in this normal review.
      dependsOn: [scope-architecture-and-invariants]
      outputSchema: |-
        {"type":"array","items":{"type":"object","required":["tool","target","status","execution_status","tool_run","seed","bounds","harnesses","artifacts","examined","uncovered","limitations","selection_reason","duration","workers","corpus_provenance"],"properties":{"tool":{"type":"string"},"target":{"type":"string"},"status":{"type":"string","enum":["examined","skipped","unsupported","inconclusive"]},"execution_status":{"type":"string"},"tool_run":{"anyOf":[{"type":"string","minLength":1},{"type":"null"}]},"seed":{"anyOf":[{"type":"integer"},{"type":"null"}]},"bounds":{"type":"array","items":{"type":"string"}},"harnesses":{"type":"array","items":{"type":"string"}},"artifacts":{"type":"array","items":{"type":"string"}},"examined":{"type":"array","items":{"type":"string"}},"uncovered":{"type":"array","items":{"type":"string"}},"limitations":{"type":"array","items":{"type":"string"}},"selection_reason":{"type":"string"},"duration":{"anyOf":[{"type":"string"},{"type":"null"}]},"workers":{"anyOf":[{"type":"integer","minimum":1},{"type":"null"}]},"corpus_provenance":{"type":"array","items":{"type":"string"}}}}}

    - name: validate-triage-and-coverage
      role: exploit-validator
      category: triage
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-fp-check
        - name: exploit-poc-discipline
      objective: >-
        Validate every candidate intended for the final findings list in {{tasks.specialist-review.output}}; prioritize critical and high candidates first, but never submit an unvalidated candidate as a finding. Validate it against {{tasks.scope-architecture-and-invariants.output}} and actual evidence in {{tasks.applicable-tool-execution.output}}.
        Confirm production reachability, least-privileged attacker control, each bypassed guard, and impact. Use
        only safe deterministic local fixtures and dummy assets; never contact a live network or third party. First try a candidate-specific compatible harness. If none exists or it does not exercise the candidate, create the smallest candidate-specific PoC or regression harness in a disposable local workspace and execute it with a project-native test runner, simulator, or registered tool. Cite the returned run/artifact or exact commands, exit statuses, and observed output. Debug and minimize the PoC, and confirm a finding only when it reproduces the attacker-controlled path and claimed impact. If execution remains impossible after concrete setup and debugging attempts, give the smallest code/state/message trace and leave the verdict triaged; a missing pre-existing harness is not a reason to stop. Then
        account for every component, entry point, boundary, artifact, invariant, target, tool attempt, and candidate
        under examined, skipped, unsupported, or inconclusive. Preserve errors, timeouts, blocked validation and
        uncovered targets; absence of a finding is not a pass.
      dependsOn: [scope-architecture-and-invariants, specialist-review, applicable-tool-execution]
      outputSchema: |-
        {"type":"object","additionalProperties":false,"required":["examined","skipped","unsupported","inconclusive","candidate_results","uncovered","limitations"],"properties":{"examined":{"type":"array","items":{"type":"string","minLength":1}},"skipped":{"type":"array","items":{"type":"string","minLength":1}},"unsupported":{"type":"array","items":{"type":"string","minLength":1}},"inconclusive":{"type":"array","items":{"type":"string","minLength":1}},"candidate_results":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["fingerprint","verdict","attempts"],"properties":{"fingerprint":{"type":"string","minLength":1},"verdict":{"type":"string","enum":["confirmed","false_positive","triaged"]},"attempts":{"type":"integer","minimum":1},"reachability":{"type":"string","minLength":1},"impact":{"type":"string","minLength":1},"blocker":{"type":"string","minLength":1},"disproof":{"type":"string","minLength":1},"reproduction":{"type":"object","additionalProperties":false,"required":["command","tool_run","failing_assertion","observed_delta","negative_control_passed","oracle_can_fail"],"properties":{"command":{"type":"string","minLength":1},"tool_run":{"type":"string","minLength":1},"failing_assertion":{"type":"string","minLength":1},"observed_delta":{"type":"string","minLength":1},"negative_control_passed":{"const":true},"oracle_can_fail":{"const":true}}}},"allOf":[{"if":{"required":["verdict"],"properties":{"verdict":{"const":"confirmed"}}},"then":{"required":["reachability","impact","reproduction"]}},{"if":{"required":["verdict"],"properties":{"verdict":{"const":"triaged"}}},"then":{"required":["blocker"]}},{"if":{"required":["verdict"],"properties":{"verdict":{"const":"false_positive"}}},"then":{"required":["disproof"]}}]}},"uncovered":{"type":"array","items":{"type":"string","minLength":1}},"limitations":{"type":"array","items":{"type":"string","minLength":1}}}}

    - name: remediation-and-retest
      role: vulnerability-hunter
      category: other
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-variant-analysis
        - name: trail-of-bits-property-based-testing
      objective: >-
        Use {{tasks.validate-triage-and-coverage.output}} to give the smallest root-cause remediation and
        deterministic regression/retest plan for each confirmed or still-triaged finding. Search for sibling
        variants without broad refactoring. Name the restored invariant, change location, migration/rollout risk,
        regression property, fixture or harness, required immutable remediation revision, exact compatible
        registered tool plus seed/bounds when available, expected evidence, and residual unsupported work. This scan
        cannot contain the future revision: do not claim a fix was applied or retested; require a follow-up scan.
      dependsOn: [validate-triage-and-coverage]
      outputSchema: |-
        {"type":"array","items":{"type":"object","required":["fingerprint","remediation","regression_test","retest","rollout_risk"],"properties":{"fingerprint":{"type":"string"},"remediation":{"type":"string"},"regression_test":{"type":"string"},"retest":{"type":"string"},"rollout_risk":{"type":"string"}}}}

    - name: red-team-bounty-worthiness
      role: exploit-validator
      category: triage
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-fp-check
        - name: bug-bounty-reporting
        - name: exploit-poc-discipline
      objective: >-
        Adversarially review every recorded finding from a skeptical bounty-triager perspective before final
        reporting. Call list_security_findings, then call get_security_finding for every fingerprint and
        read its complete evidence and audit trail before deciding it. Use all available tools, including the
        full run tool surface, to attempt safe local reproduction and disproof. Challenge each
        finding's reachability, least-privileged attacker control, claimed impact, preconditions, program
        scope, novelty, duplicates, and exclusions. Use only disposable local fixtures and dummy assets for
        reproduction. Read-only calls to explicitly in-scope live targets are allowed when they are minimally
        invasive and do not access real-user data. Do not hunt for new vulnerabilities or submit the final
        report. Never send state-changing requests to production
        or live systems, perform destructive testing, expand scope, attack or guess credentials, or perform
        denial-of-service or load testing. Preserve an existing false_positive, accepted_risk, or fixed
        terminal status and add only an audit note. For every other finding, call update_security_finding with
        an evidence-backed disposition: a proven bounty-worthy finding remains status confirmed; a technically
        real but not bounty-eligible finding must remain status triaged (accepted_risk is a human decision
        recorded from the dashboard, never set by a scan) with the exact evidence-backed
        reason and the matching policy_disposition (scope_excluded, known_issue, or bot_findable when
        applicable); a technically disproved or unreachable finding must become status false_positive with
        policy_disposition disproved and the disproof; and a finding with missing evidence or unavailable
        validation must remain status triaged with policy_disposition not_ready. Never use accepted_risk or
        false_positive merely because evidence is missing or validation is unavailable. Stop after every
        recorded finding has an evidence-backed disposition.
      dependsOn: [validate-triage-and-coverage, remediation-and-retest]

    - name: triage-and-report
      role: finding-triager
      category: triage
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-fp-check
        - name: bug-bounty-reporting
      objective: >-
        Produce exactly one final report from {{tasks.validate-triage-and-coverage.output}} and {{tasks.remediation-and-retest.output}}. Call list_security_findings, re-read each path and file:line, deduplicate root causes,
        and retain as submitted findings only candidate_results whose verdict is confirmed, with prerequisites and impact. Keep triaged candidates only in a clearly non-finding appendix. Separate confirmed findings,
        tentative/triaged candidates, false positives, task/tool errors and timeouts, examined coverage, skipped
        targets, unsupported execution/context, inconclusive work, uncovered inventory, and limitations. Include
        minimal remediation, regression test, rollout risk, and follow-up retest recipe for every kept finding. A
        bounded clean run applies only to its revision, target, harness, seed and bounds and never proves safety.
        Submit one report.
      dependsOn: [validate-triage-and-coverage, remediation-and-retest, red-team-bounty-worthiness]
