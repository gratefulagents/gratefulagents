apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityWorkflow
metadata:
  name: default-deep-scan
spec:
  description: The platform's default deep scan plan and sole source of its workflow content. SecurityScans that declare neither workflow nor workflowRef resolve this namespaced resource. Eleven specialist hunts plus conditional native fuzz execution fan into a final triage-and-report task.
  tasks:
    - name: attack-surface-mapping
      role: threat-modeler
      category: recon
      skillRefs:
        - name: trail-of-bits-audit-context-building
      objective: >-
        Map the application's attack surface: entry points, exposed endpoints, trust boundaries, privileged
        operations, and data flows from untrusted input to sensitive sinks. Return a risk-ranked array of
        concrete production surfaces with repository-relative evidence so downstream native fuzz selection can
        match existing harnesses to attacker-controlled inputs. Return an empty array only when repository
        evidence establishes that no production surface is in scope.
      outputSchema: |-
        {"type":"array","items":{"type":"object","additionalProperties":false,"required":["surface","entrypoint","attacker","files","risk"],"properties":{"surface":{"type":"string"},"entrypoint":{"type":"string"},"attacker":{"type":"string"},"files":{"type":"array","items":{"type":"string"}},"risk":{"type":"string","enum":["critical","high","medium","low"]}}}}
    - name: authn-authz
      role: vulnerability-hunter
      category: authn
      skillRefs:
        - name: api-authz-hunting
        - name: web-app-hunting
      objective: "Hunt for authentication and authorization flaws: missing or bypassable auth checks, broken session handling, privilege escalation paths, and insecure token validation."
    - name: injection-and-input-handling
      role: vulnerability-hunter
      category: injection
      skillRefs:
        - name: web-app-hunting
        - name: trail-of-bits-codeql
      objective: "Hunt for injection and unsafe input handling: SQL/NoSQL/command/template injection, XSS, path traversal, and unsanitized data reaching interpreters or shells."
    - name: secrets-and-credentials
      role: secrets-auditor
      category: secrets
      skillRefs:
        - name: trail-of-bits-zeroize-audit
      objective: Hunt for hardcoded secrets, credentials committed to the repository, secrets leaked into logs or errors, and insecure credential storage or transmission.
    - name: crypto-and-randomness
      role: vulnerability-hunter
      category: crypto
      skillRefs:
        - name: trail-of-bits-constant-time-analysis
        - name: trail-of-bits-wycheproof
      objective: "Hunt for cryptographic weaknesses: weak or misused algorithms, insecure randomness, missing integrity checks, improper key management, and TLS misconfiguration."
    - name: ssrf-and-network
      role: vulnerability-hunter
      category: ssrf
      skillRefs:
        - name: web-app-hunting
      objective: "Hunt for server-side request forgery and unsafe network egress: user-controlled URLs, open redirects, DNS rebinding exposure, and missing egress restrictions."
    - name: deserialization-and-parsing
      role: vulnerability-hunter
      category: deserialization
      skillRefs:
        - name: trail-of-bits-codeql
        - name: trail-of-bits-property-based-testing
      objective: "Hunt for unsafe deserialization and parser abuse: untrusted data fed to deserializers, XML external entities, prototype pollution, and resource-exhausting parsers."
    - name: access-control-and-multitenancy
      role: vulnerability-hunter
      category: authz
      skillRefs:
        - name: api-authz-hunting
      objective: "Hunt for access-control and tenant-isolation flaws: insecure direct object references, missing ownership checks, and cross-tenant data or resource leakage."
    - name: dependency-and-supply-chain
      role: dependency-auditor
      category: supply-chain
      skillRefs:
        - name: trail-of-bits-supply-chain-risk-auditor
        - name: github-agent-supply-chain
      objective: Hunt for vulnerable or malicious dependencies, unpinned versions, typosquatting risk, and insecure build or release pipeline steps.
    - name: infrastructure-and-configuration
      role: vulnerability-hunter
      category: misconfiguration
      skillRefs:
        - name: cloud-iac-hunting
      objective: "Hunt for insecure infrastructure and configuration: overly permissive RBAC or IAM, exposed debug endpoints, missing security headers, and unsafe container or deployment settings."
    - name: business-logic
      role: vulnerability-hunter
      category: logic-flaw
      skillRefs:
        - name: trail-of-bits-sharp-edges
        - name: trail-of-bits-property-based-testing
      objective: "Hunt for business-logic flaws: race conditions, state-machine bypasses, abuse of workflows (payments, quotas, invites), and missing server-side enforcement of invariants."
    - name: run-upstream-native-fuzz
      role: native-fuzz-runner
      category: other
      skillRefs:
        - name: trail-of-bits-cargo-fuzz
        - name: trail-of-bits-harness-writing
        - name: trail-of-bits-coverage-analysis
      objective: >-
        Use {{tasks.attack-surface-mapping.output}} to inventory repository-maintained Rust targets declared by
        `fuzz/Cargo.toml` `[[bin]]` entries and Go `FuzzXxx` functions, then match them to in-scope,
        attacker-controlled surfaces. If none exists, return not_applicable cheaply with the searched paths and
        uncovered surfaces. Otherwise run at most two highest-value parser, wire-format, protocol-message, proof,
        transaction, or state-machine targets for two minutes each through `run_security_tool` using the
        registered `cargo-fuzz` or `go-fuzz-tests` adapter. Use an explicit seed for `cargo-fuzz`; record a null
        seed and the native Go runner's schedule/environment reproducibility limitation for `go-fuzz-tests`.
        Request two Rust workers when
        the typed option is available and budget permits; otherwise record fixed runtime parallelism. Never use
        a model-authored general-purpose harness for this baseline and do not merely inventory an eligible
        upstream harness. Record every target, selection decision, revision, returned run reference, execution
        status, seed, duration, workers, corpus provenance, artifacts, errors, uncovered scope, and limitations.
        A clean run is only not_found_under its bounds and is never proof of safety. Recommend the dedicated
        `native-fuzz-campaign` workflow rather than starting warm follow-up rounds in a normal deep scan.
      dependsOn: [attack-surface-mapping]
      outputSchema: |-
        {"type":"object","additionalProperties":false,"required":["status","inventory","runs","uncovered","limitations"],"properties":{"status":{"type":"string","enum":["examined","not_applicable","unsupported","inconclusive"]},"inventory":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["tool","target","harness","surface","decision","reason"],"properties":{"tool":{"type":"string","enum":["cargo-fuzz","go-fuzz-tests"]},"target":{"type":"string"},"harness":{"type":"string"},"surface":{"type":"string"},"decision":{"type":"string","enum":["selected","skipped","unsupported"]},"reason":{"type":"string"}}}},"runs":{"type":"array","maxItems":2,"items":{"type":"object","additionalProperties":false,"required":["tool","target","revision","execution_status","tool_run","seed","duration","workers","corpus_provenance","artifacts","errors","limitations"],"properties":{"tool":{"type":"string","enum":["cargo-fuzz","go-fuzz-tests"]},"target":{"type":"string"},"revision":{"type":"string"},"execution_status":{"type":"string"},"tool_run":{"type":"string"},"seed":{"anyOf":[{"type":"integer"},{"type":"null"}]},"duration":{"type":"string"},"workers":{"type":"integer","minimum":1},"corpus_provenance":{"type":"array","items":{"type":"string"}},"artifacts":{"type":"array","items":{"type":"string"}},"errors":{"type":"array","items":{"type":"string"}},"limitations":{"type":"array","items":{"type":"string"}}}}},"uncovered":{"type":"array","items":{"type":"string"}},"limitations":{"type":"array","items":{"type":"string"}}}}
    - name: red-team-bounty-worthiness
      role: exploit-validator
      category: triage
      skillRefs:
        - name: trail-of-bits-fp-check
        - name: bug-bounty-reporting
        - name: exploit-poc-discipline
      objective: >-
        Adversarially review every recorded finding from a skeptical bounty-triager perspective before final
        reporting. Call list_security_findings, then call get_security_finding for every fingerprint and
        read its complete evidence and audit trail before deciding it. Use all available tools, including the
        full run tool surface, to attempt safe local reproduction and disproof. Challenge each
        finding's reachability, least-privileged attacker control, claimed impact, preconditions, program
        scope, novelty, duplicates, and exclusions. Use only disposable local fixtures and dummy assets for
        reproduction. Do not hunt for new vulnerabilities or submit the final report. Never send state-changing requests to production
        or live systems, perform destructive testing, expand scope, attack or guess credentials, or perform
        denial-of-service or load testing. Preserve an existing false_positive, accepted_risk, or fixed
        terminal status and add only an audit note. For every other finding, call update_security_finding with
        an evidence-backed disposition: a proven bounty-worthy finding remains status confirmed; a technically
        real but not bounty-eligible finding must become status accepted_risk with the exact evidence-backed
        reason and the matching policy_disposition (scope_excluded, known_issue, or bot_findable when
        applicable); a technically disproved or unreachable finding must become status false_positive with
        policy_disposition disproved and the disproof; and a finding with missing evidence or unavailable
        validation must remain status triaged with policy_disposition not_ready. Never use accepted_risk or
        false_positive merely because evidence is missing or validation is unavailable. Stop after every
        recorded finding has an evidence-backed disposition.
      dependsOn: [attack-surface-mapping, authn-authz, injection-and-input-handling, secrets-and-credentials, crypto-and-randomness, ssrf-and-network, deserialization-and-parsing, access-control-and-multitenancy, dependency-and-supply-chain, infrastructure-and-configuration, business-logic, run-upstream-native-fuzz]

    - name: triage-and-report
      role: finding-triager
      category: triage
      skillRefs:
        - name: trail-of-bits-fp-check
        - name: bug-bounty-reporting
      objective: >-
        Triage every reported finding and the native-fuzz evidence in
        {{tasks.run-upstream-native-fuzz.output}}: verify exploitability, remove false positives and duplicates,
        apply the ranking rules, then assemble and submit the final scan report. Preserve fuzz errors, timeouts,
        unsupported and skipped targets, uncovered surfaces, exact bounds, and corpus limitations; never turn a
        clean bounded run into a safety claim.
      dependsOn:
        - attack-surface-mapping
        - authn-authz
        - injection-and-input-handling
        - secrets-and-credentials
        - crypto-and-randomness
        - ssrf-and-network
        - deserialization-and-parsing
        - access-control-and-multitenancy
        - dependency-and-supply-chain
        - infrastructure-and-configuration
        - business-logic
        - run-upstream-native-fuzz
        - red-team-bounty-worthiness
