apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityWorkflow
metadata:
  name: bounty-hunt-evm
spec:
  description: Harness-first EVM bounty hunt. The oracle is built and calibrated before any hunting, every candidate has to become a failing assertion on a pinned fork, impact is measured in the program's own vocabulary, and anything that never broke an invariant is recorded as untested or refuted rather than reported.
  parallelism: 4
  tasks:
    - name: pin-target-and-deployment
      role: threat-modeler
      category: recon
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-entry-point-analyzer
      objective: >-
        Pin what is actually under test before anyone reasons about it. Record the immutable source
        revision, and then the deployed reality it corresponds to: chain id, the block the fork will be
        taken at, every in-scope address with its proxy/implementation/admin relationship, the
        initialization state of each implementation, the decimals of every token the protocol prices or
        transfers, the oracle wiring, the role and permission holders, and the upstream project this
        codebase forked from when it is a fork. Several of the highest-impact classes are properties of
        deployed state rather than of source, so an address you could not read is a stated gap, never an
        assumption. The chain-read pack reads that deployed state directly — EIP-1967 implementation,
        admin and beacon slots, token decimals, owners and role holders — through an operator-authorized
        endpoint alias pinned to the same chain id, block number and block hash, and deployed-bytecode-diff
        proves the compiled artifact of the pinned revision is the code actually running at an address.
        A bytecode divergence invalidates every later finding derived from source, so record it here.
        Where a fact is unavailable, say which tool or authorization was missing. Publish one
        structured dossier for every later task and report no vulnerabilities here.
      outputSchema: |-
        {
          "type": "object",
          "required": ["revision", "chain_id", "fork_block_number", "addresses", "gaps"],
          "properties": {
            "revision": {"type": "string", "description": "Immutable source revision under test"},
            "chain_id": {"type": "string"},
            "fork_block_number": {"type": "string"},
            "fork_block_hash": {"type": "string"},
            "upstream": {"type": "string", "description": "Upstream project and revision this codebase forked from, when applicable"},
            "addresses": {
              "type": "array",
              "items": {
                "type": "object",
                "required": ["address", "role", "availability"],
                "properties": {
                  "address": {"type": "string"},
                  "role": {"type": "string", "description": "proxy, implementation, admin, token, oracle, or the protocol role it holds"},
                  "implementation": {"type": "string"},
                  "initialized": {"type": "string", "enum": ["yes", "no", "unknown"]},
                  "decimals": {"type": "string"},
                  "availability": {"type": "string", "enum": ["read", "unavailable"]}
                }
              }
            },
            "gaps": {"type": "array", "items": {"type": "string"}, "description": "Facts that could not be read, and what was missing"}
          }
        }
    - name: build-and-calibrate-invariants
      role: test-engineer
      category: other
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-property-based-testing
        - name: trail-of-bits-harness-writing
      objective: >-
        Build the oracle before hunting. Using the pinned dossier in
        {{tasks.pin-target-and-deployment.output}}, write 5 to 15 executable invariants against the target
        on a fork pinned to that exact chain id and block: conservation of value and solvency, share price
        or exchange rate monotonicity where the design claims it, accounting identities across deposit,
        withdraw and settle, the access-control matrix stating who may call what, encode/decode round
        trips for every identifier that indexes state, and cross-domain identity binding for anything that
        accepts a relayed or proved message. Then calibrate: mutate the implementation so each invariant
        SHOULD fail, and record whether it did. An assertion that survives its own mutation cannot detect
        anything and must be fixed or dropped before hunting begins. Report the calibration honestly,
        including invariants you could not make executable and why. A green harness at this stage proves
        nothing was found under these bounds; it never means the target is safe.
      dependsOn:
        - pin-target-and-deployment
      outputSchema: |-
        {
          "type": "object",
          "required": ["invariants", "harness_entry_point", "limitations"],
          "properties": {
            "harness_entry_point": {"type": "string", "description": "Exact command that runs the invariant suite against the pinned fork"},
            "invariants": {
              "type": "array",
              "items": {
                "type": "object",
                "required": ["name", "property", "executable", "mutation_killed"],
                "properties": {
                  "name": {"type": "string"},
                  "property": {"type": "string", "description": "The invariant in one sentence, in protocol terms"},
                  "executable": {"type": "boolean"},
                  "mutation_applied": {"type": "string", "description": "The mutation used to prove the assertion can fail"},
                  "mutation_killed": {"type": "boolean", "description": "False means the assertion cannot detect its own violation"}
                }
              }
            },
            "limitations": {"type": "array", "items": {"type": "string"}}
          }
        }
    - name: hunt-against-invariants
      role: vulnerability-hunter
      category: other
      skillRefs:
        - name: blockchain-security-research-method
        - name: evm-low-level-and-deployment-review
        - name: evm-economic-and-mev-review
      objective: >-
        Hunt for a way to break a named invariant from {{tasks.build-and-calibrate-invariants.output}},
        working the classes in the order the disclosed payouts follow and naming, for every hypothesis, the
        invariant it tries to break. Priority 1, initialization and upgrade state on the DEPLOYED
        implementation: the invariant is that every implementation behind a proxy is already initialized,
        owns nothing, and is reachable only through its proxy — hunt uninitialized implementations,
        initializer re-entry across upgrades, ownership held on the implementation itself, and
        implementation/admin slot confusion (Wormhole, $10M). Priority 2, cross-chain proof and identity
        binding: the invariant is that a proof is accepted only from the producer allowed to have produced
        it and that a relayed message arrives with the caller identity the destination believes it has —
        hunt emitter, chain id and nonce binding, relayer and forwarder identity, and what msg.sender
        becomes after relaying (Aurora, $1M). Priority 3, fork-versus-upstream divergence: when the target
        is a client or an L2 fork, run upstream-fork-diff against the upstream revision recorded in the
        dossier, enumerate every divergence, and check each one against the invariant the upstream code
        used to satisfy; it is the cheapest enumerable high-payout sweep we have (Optimism l2geth,
        $2,000,042). Priority 4, encoding and decoding round trips and replay: the invariant is that decode
        after encode is the identity and that one identifier has exactly one encoding — hunt two encodings
        colliding on one identifier, signature malleability, and missing nonce or domain separation
        (Polygon Plasma, $2M). Priority 5, missing balance and state validation, the most frequently
        confirmed root cause in Immunefi's disclosed set: the invariant is that every state-changing path
        checks the balance, allowance, bound or existence it depends on. Priority 6, accounting, rounding,
        precision and decimals: the invariant is that share-to-asset conversion round-trips within a stated
        bound and that every amount is scaled by the decimals actually read from chain rather than assumed
        to be 18 — build the decimals matrix over the real values in the dossier and hunt division before
        multiplication and repeated caller-favorable rounding (DFX; Moonbeam, Astar and Acala, $1M).
        Priority 7, access control and role or permission inventories: the invariant is the access-control
        matrix the harness already asserts, checked against the role holders in the dossier. Priorities 1
        and 6 rest on facts only the chain-read and deployed-bytecode-diff packs can settle, and both need
        an operator-authorized fork endpoint alias: with no alias authorized, record the missing
        authorization as an explicit gap, leave the hypothesis untested rather than refuted, and never
        assume the deployed value. Templated reentrancy and flash-loan oracle manipulation stay available
        but are off the default bounty path: they are under one percent of disclosed DeFi losses and bots
        already find them, and bot-findable means unpayable — Code4rena rules Zellic V12 bot findings and
        their duplicates ineligible, and Cantina does the same with LightChaser. For every
        hypothesis state the invariant it targets, the least-privileged attacker who can act, the exact
        input they control, the state transition expected, and the observation that would falsify it. A
        hypothesis you cannot falsify is not a hypothesis. Publish every hypothesis, including the ones
        you refuted, so later runs do not re-explore them.
      dependsOn:
        - build-and-calibrate-invariants
      outputSchema: |-
        {
          "type": "array",
          "items": {
            "type": "object",
            "required": ["invariant", "attacker", "controlled_input", "expected_transition", "falsifier", "status"],
            "properties": {
              "invariant": {"type": "string"},
              "priority_class": {"type": "string", "description": "Which payout-ordered class this hypothesis belongs to, 1 through 7"},
              "missing_dependency": {"type": "string", "description": "Tool or authorization that was unavailable, such as an unauthorized fork endpoint alias for chain-read; required whenever status is untested"},
              "attacker": {"type": "string", "description": "Least privilege the attacker needs"},
              "controlled_input": {"type": "string"},
              "expected_transition": {"type": "string"},
              "falsifier": {"type": "string", "description": "The observation that would disprove this hypothesis"},
              "evidence": {"type": "string", "description": "file:line trace supporting the hypothesis"},
              "status": {"type": "string", "enum": ["open", "refuted", "untested"]}
            }
          }
        }
    - name: synthesize-failing-exploit
      role: exploit-validator
      category: other
      skillRefs:
        - name: exploit-poc-discipline
        - name: blockchain-security-research-method
      objective: >-
        Turn each open hypothesis from {{tasks.hunt-against-invariants.output}} into a test that FAILS,
        or kill it. Run it on the strongest substrate available to you and name which one you used, in
        this order of preference: the pinned fork when a fork endpoint is authorized, otherwise a local
        devnet seeded by the project's own deploy scripts, otherwise the project's own test suite with
        state matching the deployed configuration. All three run locally and none of them touches a
        public network: a transaction sent to a public network forfeits eligibility on every program.
        Then state what your substrate cost you. A devnet or suite run cannot settle anything that
        depends on deployed state, such as the real implementation behind a proxy, a token's actual
        decimals, or the live oracle wiring, so a hypothesis that needs those facts is recorded as
        untested and never as refuted. For each attempt record the exact command, the assertion that
        broke, the observed state or balance
        delta, the negative control against unmodified or non-attacker input and the fact that the control
        did NOT trigger, and the mutation or calibration case proving the assertion can fail at all. State
        the reproducibility class: deterministic, seeded and replayable, schedule or environment
        dependent, statistical, or observational only; for the last three report every attempt including
        the ones that did not trigger, plus the rule that stopped the campaign. A hypothesis with no
        failing assertion is recorded as refuted or untested and may not be reported as a finding, no
        matter how convincing the trace looks. Only report findings for hypotheses that produced a failing
        assertion, and attach the reproduction to each one.
      dependsOn:
        - hunt-against-invariants
      outputSchema: |-
        {
          "type": "array",
          "items": {
            "type": "object",
            "required": ["invariant", "verdict", "command", "reproducibility_class"],
            "properties": {
              "invariant": {"type": "string"},
              "fingerprint": {"type": "string", "description": "Fingerprint returned by report_security_finding when a finding was reported"},
              "verdict": {"type": "string", "enum": ["broken", "refuted", "untested"]},
              "command": {"type": "string"},
              "substrate": {"type": "string", "enum": ["pinned_fork", "local_devnet", "project_test_suite"], "description": "Where the assertion ran, since it bounds what the result can settle"},
              "failing_assertion": {"type": "string"},
              "observed_delta": {"type": "string", "description": "State or balance change proving the effect"},
              "negative_control_passed": {"type": "boolean"},
              "oracle_can_fail": {"type": "boolean"},
              "reproducibility_class": {"type": "string", "enum": ["deterministic", "seeded_replayable", "schedule_or_environment_dependent", "statistical", "observational_only"]},
              "attempts": {"type": "integer"},
              "successes": {"type": "integer"}
            }
          }
        }
    - name: quantify-impact-and-eligibility
      role: finding-triager
      category: triage
      skillRefs:
        - name: blockchain-security-research-method
        - name: bug-bounty-reporting
        - name: evm-economic-and-mev-review
      objective: >-
        Price and qualify only what actually broke in {{tasks.synthesize-failing-exploit.output}}. For each
        broken invariant, measure the value at risk at the pinned block and say how it was measured, or
        state plainly that this impact class permits no measurement; never estimate a number you did not
        derive. Record the capital the attacker must front, the capital they risk, the privileges and
        timing they need, and the mempool assumptions. Then map the result onto the governing program's
        own published in-scope impact list, copying the clause verbatim, and give the maximum achievable
        impact reachable from the same root cause rather than the first one you demonstrated. Judge
        severity under that program's own system and never translate a label from another system into it.
        Anything you cannot map to a published impact clause is not submittable, however real it is.
      dependsOn:
        - synthesize-failing-exploit
      outputSchema: |-
        {
          "type": "array",
          "items": {
            "type": "object",
            "required": ["fingerprint", "impact_clause", "max_achievable_impact", "eligible"],
            "properties": {
              "fingerprint": {"type": "string"},
              "impact_clause": {"type": "string", "description": "Copied verbatim from the program's in-scope impact list"},
              "program_severity": {"type": "string"},
              "max_achievable_impact": {"type": "string"},
              "funds_at_risk": {"type": "string", "description": "Measured value plus the block it was measured at, or why no measurement is possible"},
              "attacker_capital": {"type": "string"},
              "preconditions": {"type": "string"},
              "eligible": {"type": "boolean"},
              "ineligible_reason": {"type": "string"}
            }
          }
        }
    - name: triage-and-report
      role: finding-triager
      category: triage
      skillRefs:
        - name: blockchain-security-research-method
        - name: bug-bounty-reporting
        - name: trail-of-bits-fp-check
      objective: >-
        Assemble the report from {{tasks.quantify-impact-and-eligibility.output}} under one admission rule:
        a finding survives only when a named invariant broke, a failing assertion on the pinned fork proves
        it, the control did not trigger, the oracle was shown capable of failing, and the impact maps to a
        clause the program published. Drop everything else, including analyses that read well but never
        broke anything. Prefer an empty report to a padded one: reporting is rationed, and a rejected
        submission costs more than a withheld one. State the bounded negative result explicitly - which
        invariants were tested, at which revision and block, under which bounds and coverage - so a clean
        run is recorded as not found under those bounds rather than as a clean bill of health. Then submit
        the final scan report.
      dependsOn:
        - quantify-impact-and-eligibility
