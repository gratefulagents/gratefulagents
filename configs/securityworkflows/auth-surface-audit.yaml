apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityWorkflow
metadata:
  name: auth-surface-audit
spec:
  description: Enumerates every authentication and authorization decision point, then investigates each one for bypassable guards, insecure direct object references, confused-deputy delegation, and routes that never reach a check at all.
  tasks:
    - name: map-auth-decisions
      role: threat-modeler
      category: recon
      skillRefs:
        - name: trail-of-bits-audit-context-building
        - name: api-authz-hunting
      objective: >-
        Inventory every place this codebase decides who a caller is or what they may do: authentication
        middleware, session and token validation, permission or policy checks, role and scope comparisons,
        ownership and tenant lookups, admin-only branches, and the routes or handlers that reach a sensitive
        operation without passing any of them. Read the router registration order and middleware chains to
        learn which guards actually run for which paths; a decorator, annotation, or config entry only
        counts when you can follow it to executed code. For each decision point record a short identifier,
        its kind (authentication, authorization, ownership, tenancy, or unguarded), the resource or route it
        protects, the defining file, and the mechanism that enforces it. Every record must name a resource
        and an enforcing mechanism; write "none" for enforced_by when the entrypoint reaches a sensitive
        operation with no check at all. Include unguarded sensitive entrypoints explicitly: a missing check
        is the most valuable record in this inventory. Order the inventory most dangerous first - only the
        first 16 entries are investigated, so anything you rank below that is never examined. Publish the
        inventory rather than reporting findings from this task.
      outputSchema: |-
        {
          "type": "array",
          "items": {
            "type": "object",
            "required": ["decision_point", "kind", "resource", "file", "enforced_by"],
            "properties": {
              "decision_point": {"type": "string", "description": "Short identifier for the check or gap"},
              "kind": {"type": "string", "enum": ["authentication", "authorization", "ownership", "tenancy", "unguarded"], "description": "Class of decision this record describes"},
              "resource": {"type": "string", "description": "Route, handler, or resource governed by this decision"},
              "file": {"type": "string", "description": "Repository-relative file where the decision is made"},
              "enforced_by": {"type": "string", "description": "Middleware, guard, policy, or query that enforces it, or \"none\" for an unguarded entrypoint"}
            }
          }
        }
    - name: investigate-decision-point
      role: vulnerability-hunter
      category: authz
      skillRefs:
        - name: api-authz-hunting
        - name: trail-of-bits-fp-check
      objective: >-
        Attack one access-control decision: {{item.decision_point}} ({{item.kind}}) covering
        {{item.resource}}, defined in {{item.file}} and enforced by {{item.enforced_by}}. Determine what a
        caller must present to satisfy it and then look for the ways to satisfy it without the authority it
        implies: a guard registered after the handler or skipped by an alternate route, path normalization
        or case handling that sidesteps a prefix match, an identifier taken from the request body instead of
        the session, an ownership query that filters by the supplied id rather than the caller's, a
        role comparison that fails open on an unknown or empty value, a token whose signature, audience,
        expiry, or issuer is not checked, an internal or service credential used to perform an action on
        behalf of an untrusted caller without re-checking that caller's rights, and privileged parameters
        that a lower-privilege user can set. When the record is an unguarded entrypoint, prove the missing
        check by tracing the request path and naming the sensitive operation it reaches. Report only what
        you can demonstrate with file:line evidence and describe the concrete request that exploits it.
        Publish the same kept reports as this task's structured output, one entry each carrying the fingerprint report_security_finding returned for it, and an empty array
        when the decision point holds.
      outputSchema: |-
        {
          "type": "array",
          "items": {
            "type": "object",
            "required": ["title", "fingerprint", "severity", "file"],
            "properties": {
              "fingerprint": {"type": "string", "description": "Fingerprint returned by report_security_finding for this finding"},
              "title": {"type": "string", "description": "Short name of the access-control defect"},
              "severity": {"type": "string", "enum": ["critical", "high", "medium", "low", "info"], "description": "Severity of the finding"},
              "file": {"type": "string", "description": "Repository-relative file holding the defect"},
              "line": {"type": "integer", "description": "Line where the missing or bypassable check sits"},
              "summary": {"type": "string", "description": "The request that defeats the check and what it reaches"}
            }
          }
        }
      dependsOn:
        - map-auth-decisions
      forEach: map-auth-decisions
      maxInstances: 16
    - name: session-and-identity-integrity
      role: vulnerability-hunter
      category: authn
      skillRefs:
        - name: web-app-hunting
        - name: api-authz-hunting
      objective: >-
        Audit how identity is established and carried between requests, using the decision inventory in
        {{tasks.map-auth-decisions.output}} as the map of what depends on it. Examine credential
        verification (password comparison, timing, lockout, and reset flows), session issuance and
        invalidation on logout and privilege change, cookie attributes, token signing keys and algorithm
        selection (including algorithm confusion and unverified "none"), refresh and impersonation flows,
        multi-factor enforcement on every path that grants a session, and any place identity is trusted from
        a client-supplied header. Report only defects you can tie to executed code with file:line evidence,
        and say what an attacker obtains: another user's session, a permanent token, or an authentication
        step they never had to complete. Publish the same kept reports as this task's structured output,
        one entry each carrying the fingerprint report_security_finding returned for it, and an empty array when identity handling holds.
      outputSchema: |-
        {
          "type": "array",
          "items": {
            "type": "object",
            "required": ["title", "fingerprint", "severity", "file"],
            "properties": {
              "fingerprint": {"type": "string", "description": "Fingerprint returned by report_security_finding for this finding"},
              "title": {"type": "string", "description": "Short name of the identity or session defect"},
              "severity": {"type": "string", "enum": ["critical", "high", "medium", "low", "info"], "description": "Severity of the finding"},
              "file": {"type": "string", "description": "Repository-relative file holding the defect"},
              "line": {"type": "integer", "description": "Line where the defect is visible"},
              "summary": {"type": "string", "description": "What an attacker obtains and how"},
              "confidence": {"type": "string", "description": "high, medium, or low, based on the evidence read"}
            }
          }
        }
      dependsOn:
        - map-auth-decisions
    - name: red-team-bounty-worthiness
      role: exploit-validator
      category: triage
      skillRefs:
        - name: trail-of-bits-fp-check
        - name: bug-bounty-reporting
        - name: exploit-poc-discipline
      objective: >-
        Adversarially review every recorded finding from a skeptical bounty-triager perspective before final
        reporting. Call list_security_findings, then call get_security_finding for every fingerprint and
        read its complete evidence and audit trail before deciding it. Use all available tools, including the
        full run tool surface, to attempt safe local reproduction and disproof. Challenge each
        finding's reachability, least-privileged attacker control, claimed impact, preconditions, program
        scope, novelty, duplicates, and exclusions. Use only disposable local fixtures and dummy assets for
        reproduction. Read-only calls to explicitly in-scope live targets are allowed when they are minimally
        invasive and do not access real-user data. Do not hunt for new vulnerabilities or submit the final
        report. Never send state-changing requests to production
        or live systems, perform destructive testing, expand scope, attack or guess credentials, or perform
        denial-of-service or load testing. Preserve an existing false_positive, accepted_risk, or fixed
        terminal status and add only an audit note. For every other finding, call update_security_finding with
        an evidence-backed disposition: a proven bounty-worthy finding remains status confirmed; a technically
        real but not bounty-eligible finding must become status accepted_risk with the exact evidence-backed
        reason and the matching policy_disposition (scope_excluded, known_issue, or bot_findable when
        applicable); a technically disproved or unreachable finding must become status false_positive with
        policy_disposition disproved and the disproof; and a finding with missing evidence or unavailable
        validation must remain status triaged with policy_disposition not_ready. Never use accepted_risk or
        false_positive merely because evidence is missing or validation is unavailable. Stop after every
        recorded finding has an evidence-backed disposition.
      dependsOn: [map-auth-decisions, investigate-decision-point, session-and-identity-integrity]

    - name: triage-and-report
      role: finding-triager
      category: triage
      skillRefs:
        - name: trail-of-bits-fp-check
        - name: bug-bounty-reporting
      objective: >-
        Call list_security_findings to load everything the per-decision investigations and the identity
        audit recorded for this scan, and triage that set; address each finding by its fingerprint with
        update_security_finding. Re-read the cited code before keeping any finding: access-control reports
        are the easiest to get wrong when a check lives in a middleware the hunter did not read. Merge
        duplicates that describe one shared guard, drop reports whose bypass depends on privileges the
        attacker would already need, and rank by how far the bypass moves an attacker across a trust
        boundary. The per-decision fan-out covers at most the first 16 entries of the risk-ranked inventory
        in {{tasks.map-auth-decisions.output}}: name every inventory entry beyond that cut in the report
        summary as an explicit coverage gap, so no one reads the report as full coverage of the auth
        surface. Then assemble and submit the final scan report.
      dependsOn:
        - map-auth-decisions
        - investigate-decision-point
        - session-and-identity-integrity
        - red-team-bounty-worthiness
