apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityWorkflow
metadata:
  name: evm-orderbook-settlement-review
spec:
  description: Protocol-specific bounty hunt for EVM order-book, intent-settlement and escrow protocols (1inch limit-order-protocol, fusion-protocol, cross-chain-swap, token-plugins, farming, delegating, and Layer3 cubes escrow). Independent specialists hunt EIP-712 binding and replay, extensions and callbacks, amount and plugin accounting, and escrow state machines before a separate validator builds repository-native reproductions. Technical validity is retained independently from release, novelty and provider submission rules.
  parameters:
    - name: project_root
      description: Repository-relative root of the Solidity project under test.
      default: "."
    - name: build_toolchain
      description: Toolchain the repository builds with. hardhat-yarn for limit-order-protocol, token-plugins, farming and delegating, a foundry and hardhat mix for cross-chain-swap and fusion-protocol, foundry for the Layer3 cubes escrow factory, or autodetect to derive it from the repository rather than assume it.
      default: "autodetect"
    - name: release_tag
      description: Published tag or release the hunt is pinned to. The 1inch program judges submissions against the latest published tag or release, so a finding proved on an unreleased master commit is out of scope until it is confirmed against that tag; leave unconfigured only when the governing program states no such rule.
      default: "unconfigured"
    - name: fork_endpoint_alias
      description: Operator-authorized archive endpoint alias used for fork tests. Supply an alias, never a raw credential-bearing URL.
      default: "unconfigured"
    - name: chain_id
      description: Expected chain ID for the pinned local fork. Cross-chain escrow work needs the chain ID of each side recorded separately.
      default: "unconfigured"
    - name: fork_block_number
      description: Immutable finalized block number for the pinned local fork.
      default: "unconfigured"
    - name: fork_block_hash
      description: Block hash for fork_block_number; every fork-backed run verifies it before execution.
      default: "unconfigured"
  parallelism: 4
  tasks:
    - name: pin-target-and-toolchain
      role: threat-modeler
      category: recon
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-entry-point-analyzer
      objective: >-
        Pin the source target and the sandbox it can actually be exercised in before anyone reasons about
        it. The full run tool surface remains available; this task is inventory only and must not change
        state anywhere outside the sandbox workspace, must not send mutating requests, and must not claim
        any command it did not run.

        From project root {{params.project_root}} record the immutable revision and, when
        {{params.release_tag}} is configured, require HEAD to resolve exactly to that provider-mandated tag;
        record mismatch rather than silently reviewing branch work or a different release. Resolve
        {{params.build_toolchain}} against the repository rather than assuming it. A pure Hardhat lane
        declares hardhat.config.js or .ts with its own solc list, optimizer, viaIR and evmVersion settings
        and a package.json script set; 1inch limit-order-protocol at master is exactly this shape, yarn
        driven, solc 0.8.30 with viaIR on and the Cancun EVM, built with yarn && yarn hardhat compile and
        tested with yarn test:ci, which is plain hardhat test with no fork tests anywhere in the suite, so
        it runs fully offline once node_modules and the solc build are cached and is the strongest offline
        proof-of-concept substrate in this catalog. A Foundry lane declares foundry.toml with src, test,
        solc_version, evm_version, ffi and rpc_endpoints; cross-chain-swap and fusion-protocol mix Foundry
        with Hardhat and must have their real entry point read out of the repository rather than guessed.
        Record the dependency bootstrap the build genuinely needs as an ordered command list — git submodule
        update --init --recursive, forge install or soldeer, yarn or pnpm install with the pinned package
        manager against the node 22 the scan image ships — and record explicitly that the image ships no
        forge, anvil, echidna or slither, so any Foundry lane must bootstrap that toolchain itself before
        it can build. Take the build and test commands from package.json scripts, Makefile and CI, never
        invent them. Record the fork entry point exactly as the repository implements it, and say plainly
        when a repository ships none. Record every in-repo address book, such as the
        deployments/<network>/*.json tree limit-order-protocol ships, and say explicitly when none exists.

        Then map the protocol: the order struct and its EIP-712 domain, type hash and hashing helper; the
        signature validation path including ERC-1271 and any packed or compact signature encoding; the
        fill, partial fill, cancel, expiry and nonce or epoch invalidation entry points and the storage
        that records them; every extension, predicate, interaction, pre- and post-hook or callback point
        and who controls its calldata; the maker and taker asset set with the decimals of each and the
        amount-getter or rate math between them; the fee, surplus and dust accounting; token plugin, hook
        and delegation share accounting; the escrow side of the system with its secret or hashlock, its
        timelock stages, its safety deposit and its rescue path; and the resolver, relayer, allowed-sender
        and owner privileges with their holders. When {{params.fork_endpoint_alias}}, {{params.chain_id}},
        {{params.fork_block_number}} or {{params.fork_block_hash}} is unconfigured, set fork_readiness to
        blocked, name each missing input in gaps, and still publish the dossier so source review, builds and
        the offline Hardhat lane proceed. Publish one structured dossier and report no vulnerabilities here.
      outputSchema: |-
        {
          "type": "object",
          "required": ["revision", "release_constraint", "toolchain", "dependency_bootstrap", "build_command", "test_command", "fork_readiness", "components", "gaps"],
          "properties": {
            "revision": {"type": "string"},
            "release_tag": {"type": "string", "description": "Latest published tag the program judges against, and whether the revision under test equals it"},
            "release_constraint": {"type": "string", "enum": ["not_configured", "matched", "mismatch"]},
            "toolchain": {"type": "string", "description": "hardhat-yarn, foundry, foundry-hardhat, resolved from the repository"},
            "toolchain_pins": {"type": "array", "items": {"type": "string"}, "description": "Pinned solc, viaIR and evmVersion settings, foundry, node and package-manager versions"},
            "dependency_bootstrap": {"type": "array", "items": {"type": "string"}, "description": "Ordered commands that make the project buildable, including submodule, forge and package-manager steps and any toolchain the scan image does not ship"},
            "build_command": {"type": "string"},
            "test_command": {"type": "string"},
            "offline_test_lane": {"type": "string", "description": "The subset of the suite that runs without an archive RPC, or none"},
            "fork_entry_point": {"type": "string", "description": "Repository-implemented fork entry point with its hard-coded block, or none"},
            "fork_readiness": {"type": "string", "enum": ["ready", "blocked"]},
            "address_manifest": {"type": "string", "description": "Resolved in-repo address book path, such as deployments/<network>/*.json, or none_shipped"},
            "components": {
              "type": "array",
              "items": {
                "type": "object",
                "required": ["name", "role"],
                "properties": {
                  "name": {"type": "string"},
                  "role": {"type": "string", "description": "order struct or EIP-712 domain, signature validation, fill or cancel path, nonce or epoch store, extension or predicate, callback or hook, amount or rate math, fee accounting, plugin or delegation share accounting, escrow hashlock, timelock stage, safety deposit, resolver or relayer privilege, or owner role"},
                  "decimals": {"type": "string"},
                  "evidence": {"type": "string", "description": "file:line"}
                }
              }
            },
            "gaps": {"type": "array", "items": {"type": "string"}}
          }
        }
    - name: map-order-lifecycle-and-settlement-invariants
      role: vulnerability-hunter
      category: logic-flaw
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-property-based-testing
        - name: trail-of-bits-dimensional-analysis
        - name: evm-low-level-and-deployment-review
      objective: >-
        Using {{tasks.pin-target-and-toolchain.output}}, write the invariant set this protocol class is
        actually paid for breaking, with repository-relative evidence for each. The full run tool surface
        remains available; this task reads and reasons only, must not change state outside the sandbox
        workspace, and must not claim a test result it did not produce.

        Cover, at minimum: the order hash binds every field that changes economic outcome, so no two
        distinct orders, extensions or interactions can share a hash and no field — receiver, allowed
        sender, expiry, series, extension pointer — is left outside the signed struct; the EIP-712 domain
        separator binds name, version, chainId and verifying contract, is recomputed rather than cached
        across a chain split, and cannot be replayed on another chain, another deployment or an older order
        version; signature validation accepts exactly one valid encoding per order, rejects malleable s and
        v, rejects the zero address recovery result, and routes contract makers through ERC-1271 without
        letting a failed or non-standard return be read as success; a filled, cancelled, expired or
        nonce-invalidated order can never be filled again, and partial fills consume exactly the remaining
        amount with no path that resets, wraps or double-credits the remaining-amount slot; epoch, nonce
        and bit-invalidator cancellation covers every order it claims to cover and cannot be griefed into
        cancelling an unrelated order or made cheap enough to censor a maker; predicate, extension,
        interaction and pre/post callback calldata is attacker-controlled data reaching an external call,
        so it may not re-enter settlement, may not be able to move a maker's approved balance outside the
        order it was signed for, and may not let the caller choose the target of a call the maker's
        allowance pays for; the taking amount for a given making amount, and every amount-getter, rounds
        against the caller and never in the filler's favour, with dust and zero-amount fills bounded; fee,
        surplus and integrator accounting closes exactly and cannot be diverted or double-charged; token
        plugin, hook and delegation share accounting stays consistent with the underlying balance under
        transfer, add, remove and reentrant hook, and a failing plugin cannot brick or be used to steal a
        transfer; for cross-chain escrows the secret or hashlock, the timelock stages and the safety
        deposit must make both sides never claimable by the same party, the withdraw, public withdraw,
        cancel and rescue windows must be strictly ordered with no inversion or overlap, and a revealed
        secret must not let a resolver take both the escrowed funds and the deposit; resolver, relayer and
        allowed-sender privilege admits exactly the intended callers, so no third party may fill, cancel or
        settle on a maker's behalf; and approval handling, including Permit and Permit2 paths, cannot leave
        residual allowance, cannot be front-run into a failed fill, and cannot be replayed.

        For each invariant record the protected asset, the least-privileged attacker, the allowed
        transition, where enforcement lives, the alternate paths that reach the same state, the impact when
        it breaks, and the concrete local validation target: an existing test file, a fuzz or invariant
        suite, or a new test file path in the repository's own suite. Rank the hypotheses by the impact
        clause they would reach, not by novelty. Report no findings here.
      dependsOn:
        - pin-target-and-toolchain
      outputSchema: |-
        {
          "type": "object",
          "required": ["invariants", "ranked_hypotheses", "limitations"],
          "properties": {
            "invariants": {
              "type": "array",
              "items": {
                "type": "object",
                "required": ["name", "property", "asset", "attacker", "enforcement", "validation_target"],
                "properties": {
                  "name": {"type": "string"},
                  "property": {"type": "string"},
                  "asset": {"type": "string"},
                  "attacker": {"type": "string", "description": "Least-privileged actor: anonymous filler, competing resolver, malicious maker, malicious taker, plugin or extension author, or privileged owner"},
                  "enforcement": {"type": "string", "description": "file:line where the invariant is enforced, or unenforced"},
                  "alternate_paths": {"type": "array", "items": {"type": "string"}},
                  "validation_target": {"type": "string", "description": "Existing suite, harness, or the new test file this invariant will be asserted in"}
                }
              }
            },
            "ranked_hypotheses": {
              "type": "array",
              "items": {
                "type": "object",
                "required": ["invariant", "controlled_input", "expected_transition", "falsifier"],
                "properties": {
                  "invariant": {"type": "string"},
                  "controlled_input": {"type": "string", "description": "The attacker-controlled field: order field, signature encoding, extension or predicate calldata, callback target, secret, or timelock parameter"},
                  "expected_transition": {"type": "string"},
                  "falsifier": {"type": "string"},
                  "evidence": {"type": "string", "description": "file:line"}
                }
              }
            },
            "limitations": {"type": "array", "items": {"type": "string"}}
          }
        }
    - name: hunt-signatures-domain-and-replay
      role: vulnerability-hunter
      category: cryptography
      skillRefs:
        - name: blockchain-security-research-method
        - name: evm-low-level-and-deployment-review
      objective: >-
        Hunt EIP-712 domain, order-hash and field binding; EOA/ERC-1271 signature validation; nonce, epoch,
        cancellation and expiry state; partial-fill replay; and cross-chain or cross-version replay using
        {{tasks.map-order-lifecycle-and-settlement-invariants.output}}. Compare every fill entry point and report
        concrete candidates with exact attacker-controlled fields and file:line evidence.
      dependsOn:
        - pin-target-and-toolchain
        - map-order-lifecycle-and-settlement-invariants

    - name: hunt-settlement-extensions-and-callbacks
      role: vulnerability-hunter
      category: logic-flaw
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-entry-point-analyzer
      objective: >-
        Trace attacker-controlled predicate, extension, interaction, permit and callback calldata through every
        settlement path. Hunt reentrant fill/cancel state, allowance redirection, arbitrary target calls, failed
        callback rollback, maker/taker receiver confusion and resolver privilege bypass. Report only a reachable
        path tied to the exact target and invariant map; leave PoC construction to validation.
      dependsOn:
        - pin-target-and-toolchain
        - map-order-lifecycle-and-settlement-invariants

    - name: hunt-amount-fee-and-plugin-accounting
      role: vulnerability-hunter
      category: logic-flaw
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-dimensional-analysis
      objective: >-
        Hunt maker/taker amount calculation, rounding, dust and fee paths plus target-specific plugin, hook,
        delegation and farming share accounting. Check transfer hooks, balance rebases, add/remove cycles, failed
        plugins and alternate token standards. Report concrete invariant breaks and do not force order-book
        assumptions onto repositories whose scoped module is farming, delegation or token hooks.
      dependsOn:
        - pin-target-and-toolchain
        - map-order-lifecycle-and-settlement-invariants

    - name: hunt-escrow-hashlock-and-timelocks
      role: vulnerability-hunter
      category: logic-flaw
      skillRefs:
        - name: blockchain-security-research-method
        - name: evm-economic-and-mev-review
      objective: >-
        For escrow targets, hunt hashlock/secret binding, partial-fill Merkle proofs, source/destination parameter
        agreement, deterministic clone addresses, withdraw/public-withdraw/cancel/rescue window ordering and safety
        deposit accounting. Prove neither party can claim both sides or both principal and deposit. For non-escrow
        targets record the lane as not applicable rather than manufacturing a generic finding.
      dependsOn:
        - pin-target-and-toolchain
        - map-order-lifecycle-and-settlement-invariants

    - name: validate-candidates-in-harness
      role: exploit-validator
      category: other
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-harness-writing
        - name: trail-of-bits-property-based-testing
        - name: evm-low-level-and-deployment-review
        - name: exploit-poc-discipline
        - name: trail-of-bits-variant-analysis
      objective: >-
        In one write-capable run, bootstrap the sandbox, build and calibrate the oracle, then reproduce or kill
        the candidate findings recorded by the four discovery lanes. Do not originate new vulnerabilities. The full
        run tool surface remains available and is intentional here: this is the only task that builds and
        executes code. All execution is local. Never change state on any live, public or third-party
        system, never send a mutating request to a deployed contract, never test against mainnet or a
        public testnet, and never touch a third-party oracle, resolver or protocol deployment; every
        governing program treats that as grounds for a permanent ban.

        Bootstrap exactly what {{tasks.pin-target-and-toolchain.output}} recorded: run the recorded
        dependency bootstrap in order, then the recorded build and test command, recording every command
        with its exit status. The scan image ships node 22, yarn and pnpm but no forge, anvil, echidna or
        slither, so a Hardhat lane such as limit-order-protocol builds with yarn && yarn hardhat compile and
        runs yarn test:ci offline once node_modules and solc are cached, while any Foundry lane must install
        that toolchain explicitly first and must be reported as a blocker if it cannot. Obey the governing
        program's own declared proof-of-concept environment as the hard substrate constraint: where the
        program declares project-test-suite, as the 1inch program does, the proof of concept belongs in the
        repository's own suite and no fork is required; where it declares mainnet-fork, as the Layer3
        program does, start the pinned local fork through operator-authorized endpoint alias
        {{params.fork_endpoint_alias}} only when chain id {{params.chain_id}}, block
        {{params.fork_block_number}} and hash {{params.fork_block_hash}} agree with the dossier, and set
        fork_status to executed only then; otherwise set it to blocked, record the blocker, and keep hunting
        on the repository's own suite. When the program judges against a published release, run against
        {{params.release_tag}} and record any divergence from the revision under test.

        For every compatible Foundry root containing a candidate-specific test, actually call
        run_security_tool with tool `forge-security-tests`, target type `foundry_project`, locator equal to that
        workspace root, target revision equal to the pinned immutable revision, and seed `2062026`. When the typed
        program environment permits a local fork and all endpoint, chain, block and hash pins are ready, use
        `forge-fork-test` through run_security_tool for the fork-backed reproduction. Record the returned tool-run
        reference and normalized result; a shell transcript without a successful pack result is not deterministic
        confirmation when a compatible pack is available.

        Turn the invariants in {{tasks.map-order-lifecycle-and-settlement-invariants.output}} into 5 to 15
        executable assertions on the strongest substrate available, preferring an added test file in the
        repository's own suite so the proof of concept is runnable by the program exactly as submitted.
        Calibrate each assertion with a temporary mutant that SHOULD make it fail; an invariant counts as
        calibrated only when it is executable and kills its mutant, because an assertion that survives
        cannot detect its own violation. A green harness never means the target is safe; it means only not
        found under the recorded bounds.

        Validate in payout order: EIP-712 domain and order-hash binding,
        signature validation, ERC-1271 and malleability first; then order lifecycle state — fill, partial
        fill, cancel, expiry, nonce and epoch invalidation — and replay across chains and across order
        versions; then attacker-controlled predicate, extension and callback calldata re-entering
        settlement or redirecting a maker's allowance; then maker and taker amount and rate math, rounding
        direction, dust and fee accounting; then token plugin, hook and delegation share accounting; then
        escrow secret, hashlock and timelock windows and safety-deposit accounting, where both sides being
        claimable by the same party or a timelock ordering inversion is the classic loss path; then
        resolver and relayer privilege and who may fill on a maker's behalf; then approval, Permit and
        Permit2 handling. Templated settlement re-entrancy stays available but sits off the default path,
        because bot-findable means unpayable under duplicate rules. Every broken verdict needs the exact
        command and seed, the failing assertion, the observed balance or state delta, a negative control
        that did not trigger, and the calibration mutant proving the oracle can fail. Record the
        reproducibility class and never generalize a local-only result into a claim about deployed
        configuration. A hypothesis without a failing assertion is refuted or untested and may not be
        reported.

        Reconcile every discovery candidate by source and fingerprint. Return exactly one schema-valid verdict per
        fingerprint, preserve deduplicated aliases, and require identical discovered and validated sets before final
        reporting.

        For every broken root cause, call create_security_variant_sweep, apply the referenced variant-analysis skill,
        call complete_security_variant_sweep with the resulting scope and evidence, and populate the schema-required
        variant_sweep_ledger. A broken candidate is not reportable until its durable ledger entry is complete.
      dependsOn:
        - pin-target-and-toolchain
        - map-order-lifecycle-and-settlement-invariants
        - hunt-signatures-domain-and-replay
        - hunt-settlement-extensions-and-callbacks
        - hunt-amount-fee-and-plugin-accounting
        - hunt-escrow-hashlock-and-timelocks
      outputSchema: |-
        {
          "type": "object",
          "required": ["bootstrap_status", "fork_status", "executable_invariant_count", "calibrated_invariant_count", "tool_runs", "hypotheses", "limitations", "candidate_reconciliation", "variant_sweep_ledger"],
          "properties": {
            "bootstrap_status": {"type": "string", "enum": ["built", "partial", "blocked"], "description": "built only when the recorded build and test command both ran"},
            "bootstrap_blocker": {"type": "string"},
            "fork_status": {"type": "string", "enum": ["executed", "blocked", "not_required"], "description": "not_required when the program's declared proof-of-concept environment is the repository's own test suite"},
            "fork_blocker": {"type": "string"},
            "executable_invariant_count": {"type": "integer", "minimum": 0},
            "calibrated_invariant_count": {"type": "integer", "minimum": 0, "description": "Must not exceed executable_invariant_count"},
            "tool_runs": {
              "type": "array",
              "items": {
                "type": "object",
                "required": ["tool", "command", "exit_status"],
                "properties": {
                  "tool": {"type": "string"},
                  "command": {"type": "string", "minLength": 1},
                  "exit_status": {"type": "string"},
                  "seed": {"type": "string"},
                  "attempts": {"type": "integer", "minimum": 0},
                  "successes": {"type": "integer", "minimum": 0}
                }
              }
            },
            "candidate_reconciliation": {
              "type": "object",
              "required": ["discovered_fingerprints", "validated_fingerprints", "unreconciled_fingerprints"],
              "properties": {
                "discovered_fingerprints": {"type": "array", "items": {"type": "string", "minLength": 1}},
                "validated_fingerprints": {"type": "array", "items": {"type": "string", "minLength": 1}},
                "unreconciled_fingerprints": {"type": "array", "items": {"type": "string", "minLength": 1}, "maxItems": 0, "description": "Must be empty; discovered and validated fingerprint sets must be identical"}
              }
            },
            "variant_sweep_ledger": {
              "type": "array",
              "items": {
                "type": "object",
                "required": ["root_cause_fingerprint", "scope", "patterns", "matches", "true_positives", "false_positives", "ci_regression_rule"],
                "properties": {
                  "root_cause_fingerprint": {"type": "string", "minLength": 1},
                  "scope": {"type": "string", "minLength": 1},
                  "patterns": {"type": "array", "minItems": 1, "items": {"type": "string", "minLength": 1}},
                  "matches": {"type": "array", "items": {"type": "string", "minLength": 1}},
                  "true_positives": {"type": "array", "items": {"type": "string", "minLength": 1}},
                  "false_positives": {"type": "array", "items": {"type": "string", "minLength": 1}},
                  "ci_regression_rule": {"type": "string", "minLength": 1}
                }
              }
            },
            "hypotheses": {
              "type": "array",
              "items": {
                "type": "object",
                "required": ["invariant", "attacker", "verdict"],
                "properties": {
                  "invariant": {"type": "string"},
                  "attacker": {"type": "string"},
                  "verdict": {"type": "string", "enum": ["broken", "refuted", "untested"]},
                  "missing_dependency": {"type": "string", "description": "Required when verdict is untested"},
                  "fingerprint": {"type": "string", "description": "Required when verdict is broken"},
                  "reproduction": {
                    "type": "object",
                    "required": ["command", "substrate", "test_path", "failing_assertion", "observed_delta", "expected_output", "observed_output", "environment", "negative_control_passed", "oracle_can_fail", "reproducibility_class"],
                    "properties": {
                      "command": {"type": "string", "minLength": 1},
                      "seed": {"type": "string"},
                      "substrate": {"type": "string", "enum": ["pinned_fork", "project_tests", "local_devnet"]},
                      "test_path": {"type": "string", "minLength": 1, "description": "Repository-relative path of the added test the program can run unchanged"},
                      "failing_assertion": {"type": "string", "minLength": 1},
                      "observed_delta": {"type": "string", "minLength": 1},
                      "expected_output": {"type": "string", "minLength": 1},
                      "observed_output": {"type": "string", "minLength": 1},
                      "environment": {"type": "string", "minLength": 1},
                      "negative_control_passed": {"const": true},
                      "oracle_can_fail": {"const": true},
                      "reproducibility_class": {"type": "string", "enum": ["deterministic", "seeded_replayable", "schedule_or_environment_dependent", "statistical", "observational_only"]}
                    }
                  }
                },
                "allOf": [
                  {"if": {"required": ["verdict"], "properties": {"verdict": {"const": "broken"}}}, "then": {"required": ["fingerprint", "reproduction"]}},
                  {"if": {"required": ["verdict"], "properties": {"verdict": {"const": "untested"}}}, "then": {"required": ["missing_dependency"]}}
                ]
              }
            },
            "limitations": {"type": "array", "items": {"type": "string"}}
          }
        }
    - name: quantify-impact-and-submission-readiness
      role: finding-triager
      category: triage
      skillRefs:
        - name: blockchain-security-research-method
        - name: bug-bounty-reporting
        - name: evm-economic-and-mev-review
      objective: >-
        Price and qualify only hypotheses with verdict broken and a valid reproduction in
        {{tasks.validate-candidates-in-harness.output}}. The full run tool surface remains available; this task
        must not change state outside the sandbox workspace and must never contact the program, the
        protocol, or any deployed system.

        Measure value at risk on the substrate that actually settled the claim: at the verified block for a
        pinned-fork reproduction, and unknown for a project-test reproduction, where deployed exposure must
        be labelled unverified rather than estimated. For this protocol class the exposure is usually the
        maker allowance an order can reach, the resting or partially filled order book, the escrowed
        principal plus safety deposit of a cross-chain swap, or the plugin and delegation share balances,
        so name which of those the reproduction actually moved. Record the capital the attacker fronts, the
        capital they risk, and the privileges and timing they need, including whether they must be a
        whitelisted resolver or merely any filler. When typed in-scope impacts exist, copy the matching impact
        verbatim. When a custom provider publishes vulnerability classes or asset rules instead, copy the matching
        clause verbatim from scopePolicy and mark its source. Never invent an eligibility clause or translate a
        severity label from another program's system.

        The run prompt already carries the governing program's typed scope, including pocRequired,
        pocEnvironment, prohibitedTesting, knownIssues and the in-scope impact list, and that typed scope is
        authoritative: obey pocEnvironment as the hard substrate constraint, treat prohibitedTesting as
        binding, and compare every candidate with knownIssues. A match blocks provider submission but does not
        erase the technically confirmed defect; record the matching clause verbatim. A release_constraint mismatch
        likewise blocks submission without erasing the defect found at the scanned revision.

        Then apply the governing program's own submission gate. Require a runnable coded proof of concept only
        when pocRequired is true; retain the runnable reproduction as technical evidence when it is false. The
        proof runs only in the typed pocEnvironment and never against deployed code or a public network. Check whether the candidate is already
        published in the program's known-issue set, which for 1inch means comparing it with the audit
        reports at github.com/1inch/1inch-audits before reporting; the finding reproduces at the tag or
        release the program judges against, since the 1inch program applies only to the latest published
        tag or release; the report is a single issue written in English as prose the researcher can defend,
        with no raw scanner output and no model-generated narrative standing in for evidence, both of which
        these programs reject outright; KYC and any other program precondition is acknowledged; and it
        states the revision, tag and block it was produced at. Record the fix suggestion when the program
        requires one. When prohibitedTesting says AI-generated reports are not accepted, this autonomous output is
        never submission-ready until a human independently reproduces the issue and rewrites the report. Anything failing the gate is reported as not submission-ready with the exact missing
        element, but remains a technically confirmed finding.
      dependsOn:
        - validate-candidates-in-harness
      outputSchema: |-
        {
          "type": "array",
          "items": {
            "type": "object",
            "required": ["fingerprint", "eligibility_clause", "eligibility_source", "max_achievable_impact", "poc_runnable", "poc_substrate_permitted", "known_issue_checked", "known_issue_match", "release_constraint_satisfied", "technical_status", "submission_ready"],
            "properties": {
              "fingerprint": {"type": "string"},
              "eligibility_clause": {"type": "string", "description": "Verbatim typed impact or scope-policy vulnerability/asset rule"},
              "eligibility_source": {"type": "string", "enum": ["typed_impact", "scope_policy", "unavailable"]},
              "program_severity": {"type": "string"},
              "max_achievable_impact": {"type": "string"},
              "funds_at_risk": {"type": "string", "description": "Measured value plus the block it was measured at, or why no measurement is possible"},
              "attacker_capital": {"type": "string"},
              "preconditions": {"type": "string", "description": "Privileges and timing, including whether the attacker must be a whitelisted resolver or relayer"},
              "poc_runnable": {"type": "boolean", "description": "A coded proof of concept the program can execute unchanged"},
              "poc_command": {"type": "string"},
              "poc_substrate_permitted": {"type": "boolean", "description": "false unless execution stayed inside the program's declared pocEnvironment"},
              "known_issue_checked": {"type": "boolean", "description": "true only when the candidate was compared against the program's published known-issue set"},
              "known_issue_match": {"type": "string", "minLength": 1, "description": "Verbatim published issue sharing this root cause, or exactly none"},
              "release_tag_confirmed": {"type": "string", "description": "Tag or release the reproduction was confirmed at, or why it is unconfirmed"},
              "release_constraint_satisfied": {"type": "boolean", "description": "true when no release tag is required or the reproduction exactly matches the provider-mandated tag"},
              "fix_suggestion": {"type": "string"},
              "technical_status": {"const": "confirmed"},
              "submission_ready": {"type": "boolean"},
              "blocking_gap": {"type": "string", "description": "Required when submission_ready is false"}
            },
            "allOf": [
              {"if": {"required": ["submission_ready"], "properties": {"submission_ready": {"const": false}}}, "then": {"required": ["blocking_gap"]}},
              {"if": {"required": ["submission_ready"], "properties": {"submission_ready": {"const": true}}}, "then": {"properties": {"eligibility_clause": {"minLength": 1}, "poc_runnable": {"const": true}, "poc_substrate_permitted": {"const": true}, "known_issue_checked": {"const": true}, "known_issue_match": {"const": "none"}, "release_constraint_satisfied": {"const": true}, "eligibility_source": {"not": {"const": "unavailable"}}}}}
            ]
          }
        }
    - name: triage-and-report
      role: finding-triager
      category: triage
      skillRefs:
        - name: blockchain-security-research-method
        - name: bug-bounty-reporting
        - name: trail-of-bits-fp-check
      objective: >-
        Assemble the report from {{tasks.quantify-impact-and-submission-readiness.output}} under one
        admission rule: a technical finding survives when a named calibrated invariant broke, a runnable failing
        assertion inside the program's declared proof-of-concept environment proves it, the negative
        control did not trigger, and the oracle was shown capable of failing. Provider novelty, eligibility and
        submission readiness are separate labels: a known-issue match, missing clause, release confirmation or
        prerequisite blocks submission but must not erase a technically confirmed vulnerability. The full run
        tool surface remains available; this task must not change
        state outside the sandbox workspace.

        Require a verified pinned fork only when the program's declared environment is a fork or the
        finding depends on deployed state, and label project-test evidence without implying deployment
        exposure. Drop refuted and unproved claims, including analyses that read well but never broke anything. Prefer
        an empty report to a padded one: reporting is rationed, a rejected submission costs more than a
        withheld one, and these programs explicitly reject automated scanning output and AI-generated
        reports that carry no runnable coded proof of concept. State the bounded negative result explicitly
        — which invariants were tested, at which revision, tag and block, on which substrate, and which
        lanes were blocked by a missing toolchain or endpoint — so a clean or blocked run is recorded as
        not found under those bounds rather than as a clean bill of health. Then submit the final scan
        report.

        Before submission, call transition_security_hypothesis once per discovered candidate,
        record_security_coverage for the tested bounds, reconcile the validator's persisted completed sweeps, and
        call get_security_campaign_status. Submit exactly one report with every remaining blocker and budget
        decision. Bundle readiness belongs only to the policy postscript; never claim an artifact exists unless it
        was persisted successfully.
      dependsOn:
        - quantify-impact-and-submission-readiness
