apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityWorkflow
metadata:
  name: external-flow-analysis
spec:
  description: Maps externally reachable entrypoints, traces each production flow from untrusted input to its sinks, and investigates every flow on its own for concrete security vulnerabilities before a single triage pass assembles the report.
  tasks:
    - name: map-entrypoints
      role: threat-modeler
      category: recon
      skillRefs:
        - name: trail-of-bits-audit-context-building
        - name: trail-of-bits-codeql
      tools:
        denied:
          - bash
      objective: >-
        Enumerate every externally reachable entrypoint of this codebase: HTTP routes, RPC and gRPC methods,
        GraphQL resolvers, webhook receivers, message-queue consumers, and scheduled or CLI entrypoints that
        process data an outside party can influence. Derive the list from the real routing tables, framework
        registrations, and server bootstrap code, never from documentation or README claims. For each
        entrypoint record the route or topic, the HTTP method or verb ("*" when a handler accepts any),
        the handler symbol, the file that defines the handler, and whether an authentication guard is
        actually on the request path for that route rather than merely declared elsewhere. Exclude test
        fixtures, examples, generated mocks, and code that is not reachable in a production build. Order the
        inventory by attacker leverage, most dangerous first: only the first 20 entries are investigated, so
        anything you rank below that is never examined. Finding reports are not this task's product: publish
        the inventory.
      outputSchema: |-
        {
          "type": "array",
          "items": {
            "type": "object",
            "required": ["route", "method", "handler", "file"],
            "properties": {
              "route": {"type": "string", "description": "Route path, RPC method, topic, or command name"},
              "method": {"type": "string", "description": "HTTP method or protocol verb, \"*\" when any"},
              "handler": {"type": "string", "description": "Handler function, method, or resolver symbol"},
              "file": {"type": "string", "description": "Repository-relative file defining the handler"},
              "authenticated": {"type": "boolean", "description": "Whether an auth guard is on the request path"}
            }
          }
        }
    - name: investigate-flow
      role: vulnerability-hunter
      category: other
      skillRefs:
        - name: trail-of-bits-codeql
        - name: trail-of-bits-semgrep
        - name: trail-of-bits-fp-check
      tools:
        denied:
          - bash
      objective: >-
        Investigate one production flow end to end: the {{item.method}} entrypoint {{item.route}}, handled by
        {{item.handler}} in {{item.file}}. Read the handler and follow every function it calls until
        caller-controlled data either reaches a sink (database query, shell or subprocess, filesystem path,
        deserializer, template renderer, outbound request, authorization decision, or response body) or is
        provably neutralized. Establish concretely: which path parameters, query parameters, headers,
        cookies, and body fields an anonymous or low-privilege caller controls; whether the authentication
        and authorization checks execute on this exact path instead of being assumed from a sibling route;
        whether object identifiers are re-checked against the caller's tenant or ownership before use; and
        what the handler does with oversized, malformed, duplicated, or absent input. Report only
        vulnerabilities where you can name the source, every hop, and the sink with file:line evidence, and
        state the attack vector as a request an attacker could actually send. Do not report missing
        hardening, style problems, or risks with no reachable path from this entrypoint. Publish the same
        kept reports as this task's structured output, one entry each carrying the fingerprint report_security_finding returned for it, and an empty array when the flow is
        clean.
      outputSchema: |-
        {
          "type": "array",
          "items": {
            "type": "object",
            "required": ["title", "fingerprint", "severity", "file"],
            "properties": {
              "fingerprint": {"type": "string", "description": "Fingerprint returned by report_security_finding for this finding"},
              "title": {"type": "string", "description": "Short name of the vulnerability"},
              "severity": {"type": "string", "enum": ["critical", "high", "medium", "low", "info"], "description": "Severity of the finding"},
              "file": {"type": "string", "description": "Repository-relative file holding the sink"},
              "line": {"type": "integer", "description": "Line of the sink"},
              "summary": {"type": "string", "description": "Source, hops, and sink stated as the request an attacker sends"},
              "confidence": {"type": "string", "description": "high, medium, or low, based on the evidence read"}
            }
          }
        }
      dependsOn:
        - map-entrypoints
      forEach: map-entrypoints
      maxInstances: 20
      maxFindings: 5
    - name: triage-and-report
      role: finding-triager
      category: triage
      skillRefs:
        - name: trail-of-bits-fp-check
        - name: bug-bounty-reporting
      tools:
        denied:
          - bash
      objective: >-
        Call list_security_findings to load every finding the per-flow investigations recorded for this
        scan, and judge reachability against the entrypoint inventory in {{tasks.map-entrypoints.output}};
        address each finding by its fingerprint with update_security_finding. Drop findings whose
        source-to-sink chain does not hold up when you re-read the cited code, merge duplicates that
        different flows reported for one shared helper (keep the instance with the strongest evidence and
        the most exposed entrypoint), and demote anything that requires privileges the flow never grants.
        Rank what survives by how much an external attacker gains and how little they need to start. The
        per-flow fan-out covers at most the first 20 entries of the risk-ranked inventory: name every
        entrypoint beyond that cut in the report summary as an explicit coverage gap. Then assemble and
        submit the final scan report.
      dependsOn:
        - map-entrypoints
        - investigate-flow
