apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityWorkflow
metadata:
  name: pr-diff-review
spec:
  description: Fast change-focused review for pull-request triggered scans - ranks the changed files by security risk, reviews each risky change on its own under a tight budget, and triages the result.
  parallelism: 4
  tasks:
    - name: map-changed-risk
      role: security-reviewer
      category: recon
      skillRefs:
        - name: trail-of-bits-differential-review
        - name: trail-of-bits-audit-context-building
      tools:
        denied:
          - bash
      objective: >-
        Identify which files in this change actually carry security risk and rank them. Read the diff first
        (git diff against the merge base, or the changed files listed in the scan scope) and judge each
        changed file by what the change does, not by how large it is: new or modified request handlers and
        routes, authentication and authorization logic, query construction, subprocess or filesystem access,
        deserialization and parsing, cryptography and token handling, permission and RBAC manifests, CI
        workflow definitions, dependency manifests and lockfiles, and anything touching secrets or
        configuration defaults. Skip files whose change is purely cosmetic (formatting, comments, string
        changes with no security meaning, test fixtures that no production path reads) - excluding them is
        as valuable as including the risky ones. For each file you keep, record the path, a risk category
        drawn from the finding vocabulary (authz, authn, injection, secrets, crypto, ssrf, deserialization,
        supply-chain, misconfiguration, logic-flaw, info-leak, dos, other), and one sentence naming the
        specific change that creates the risk. Order the list most dangerous first: only the first 10 files
        are reviewed, so anything you rank below that is never examined. Publish the list rather
        than reporting findings.
      outputSchema: |-
        {
          "type": "array",
          "items": {
            "type": "object",
            "required": ["file", "risk_category", "reason"],
            "properties": {
              "file": {"type": "string", "description": "Repository-relative path of the changed file"},
              "risk_category": {"type": "string", "description": "Finding category this change most likely affects"},
              "reason": {"type": "string", "description": "The specific change that creates the risk"}
            }
          }
        }
      timeout: 10m
      maxTurns: 30
    - name: review-change
      role: vulnerability-hunter
      category: other
      skillRefs:
        - name: trail-of-bits-differential-review
        - name: trail-of-bits-variant-analysis
      tools:
        denied:
          - bash
      objective: >-
        Review one changed file for vulnerabilities introduced or exposed by this change: {{item.file}},
        flagged as {{item.risk_category}} because {{item.reason}}. Read the diff for this file and enough of
        the surrounding code to judge it, then answer three questions with evidence: does the change let
        untrusted input reach a sink it could not reach before, does it remove or weaken a check that other
        code still depends on, and does it introduce a new entry point or permission that nothing else
        guards. Stay inside the change: pre-existing problems in untouched code are out of scope unless the
        change makes them newly reachable. Report only what you can point at with file:line evidence in the
        changed code and describe as a concrete attack, and say plainly that the file is clean when it is.
        Work quickly - this review runs on every push, so depth on the risky lines beats breadth over the
        whole file. Publish the same kept reports as this task's structured output, one entry each carrying the fingerprint report_security_finding returned for it, and an
        empty array when the file is clean.
      outputSchema: |-
        {
          "type": "array",
          "items": {
            "type": "object",
            "required": ["title", "fingerprint", "severity", "file", "introduced_by_change"],
            "properties": {
              "fingerprint": {"type": "string", "description": "Fingerprint returned by report_security_finding for this finding"},
              "title": {"type": "string", "description": "Short name of the vulnerability"},
              "severity": {"type": "string", "enum": ["critical", "high", "medium", "low", "info"], "description": "Severity of the finding"},
              "file": {"type": "string", "description": "Repository-relative file reviewed"},
              "line": {"type": "integer", "description": "Line in the changed code carrying the defect"},
              "introduced_by_change": {"type": "boolean", "description": "True when this change created or newly exposed the defect"},
              "summary": {"type": "string", "description": "The attack the change enables and what the author must change"}
            }
          }
        }
      dependsOn:
        - map-changed-risk
      forEach: map-changed-risk
      maxInstances: 10
      maxFindings: 3
      timeout: 15m
      maxTurns: 40
    - name: triage-and-report
      role: finding-triager
      category: triage
      skillRefs:
        - name: trail-of-bits-fp-check
        - name: bug-bounty-reporting
      tools:
        denied:
          - bash
      objective: >-
        Call list_security_findings to load every finding the per-file reviews recorded for this scan and
        turn them into a pull-request verdict; address each one by its fingerprint with
        update_security_finding. Keep only
        findings introduced or made reachable by this change, drop pre-existing issues and stylistic
        objections, merge duplicates that describe one change across several files, and re-read the cited
        lines before keeping anything - a noisy review on every push gets the whole scan ignored. Rank what
        survives by severity and state for each one what the author must change. The per-file fan-out covers
        at most the first 10 entries of the risk-ranked list in {{tasks.map-changed-risk.output}}: name every
        changed file beyond that cut in the report summary as an explicit coverage gap, so the change is not
        read as fully reviewed. If nothing survives, submit a clean report saying so, with the same coverage
        note. Then assemble and submit the final scan report.
      dependsOn:
        - map-changed-risk
        - review-change
      timeout: 10m
      maxTurns: 30
