apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityWorkflow
metadata:
  name: secrets-and-supply-chain
spec:
  description: Credential and supply-chain review - committed secrets and leaked credential material with false-positive discipline, dependency manifest and lockfile risk, CI workflow poisoning and publish-credential exposure, and install or build script review - fanning into a single triage pass.
  tasks:
    - name: credential-and-entropy-hunt
      role: secrets-auditor
      category: secrets
      skillRefs:
        - name: trail-of-bits-zeroize-audit
      objective: >-
        Hunt for credential material in this repository and for code paths that leak it. Search the working
        tree for provider-shaped keys (cloud access keys, service-account JSON, API tokens, webhook URLs
        with embedded tokens), private keys and certificates, database and message-broker URLs carrying
        passwords, .env and config files that were committed, and high-entropy strings in source,
        manifests, notebooks, fixtures, and container definitions. Then audit the leak paths: secrets
        interpolated into log lines, error messages, exception reports, or telemetry; credentials passed as
        command-line arguments or baked into image layers; tokens written into build artifacts, client
        bundles, or debug endpoints. Apply false-positive discipline before reporting anything: confirm the
        value is a real credential rather than a placeholder, example, test fixture, public identifier, or
        checksum; check whether it is already rotated, expired, or pointed at a local development service;
        and prefer a smaller number of confirmed leaks over a wall of entropy hits. For each report give the
        file:line, what the credential grants, and the rotation the operator must perform.
    - name: dependency-manifest-risk
      role: dependency-auditor
      category: supply-chain
      skillRefs:
        - name: trail-of-bits-supply-chain-risk-auditor
        - name: github-agent-supply-chain
      objective: >-
        Audit every dependency manifest and lockfile in the repository. Establish for each ecosystem which
        packages are direct and which are transitive, then look for: known-vulnerable versions whose
        vulnerable code path this project actually uses, unpinned or floating ranges and lockfiles missing
        or out of sync with their manifest, dependencies fetched from non-canonical registries, git URLs,
        or plain HTTP, packages resolvable from a public registry when an internal one is intended
        (dependency confusion), names close to a popular package (typosquatting), packages that are
        abandoned, single-maintainer, or recently transferred and sit in the authentication, parsing,
        serialization, or cryptography path, and vendored or copied third-party code that has drifted from
        upstream. Verify the version actually resolved rather than the range requested. Report with the
        manifest entry at file:line, the resolved version, and the concrete impact on this project.
    - name: ci-pipeline-poisoning
      role: dependency-auditor
      category: supply-chain
      skillRefs:
        - name: trail-of-bits-agentic-actions-auditor
        - name: github-agent-supply-chain
      objective: >-
        Audit the CI and release pipelines - GitHub Actions workflows and composite actions first, then any
        other pipeline definitions - for paths that let an untrusted contributor run code or steal
        credentials. Look for pull_request_target, workflow_run, and issue_comment triggers combined with a
        checkout of the pull request head; expression interpolation of attacker-controlled values (pull
        request titles, branch names, issue bodies, commit messages) into run blocks (script injection);
        actions referenced by mutable tag or branch instead of a pinned commit, and third-party actions
        with broad access to the job; workflow-level permissions left at write or unset where the default
        is permissive, and GITHUB_TOKEN or publish credentials exposed to jobs that build untrusted code;
        secrets passed into forked-PR workflows, printed, or written into artifacts, logs, and caches;
        cache and artifact poisoning between a low-trust build job and a high-trust publish job;
        self-hosted runners executing untrusted code; and release or publish steps whose provenance,
        signing, or approval gate can be skipped. Report each with the workflow file at file:line, the
        trigger that reaches it, and the credential or artifact an attacker compromises.
    - name: install-and-build-scripts
      role: dependency-auditor
      category: supply-chain
      skillRefs:
        - name: trail-of-bits-supply-chain-risk-auditor
        - name: github-agent-supply-chain
      objective: >-
        Review the code this repository executes during installation and build - package lifecycle hooks
        (preinstall, install, postinstall, prepare), setup.py and build backends, Makefiles, Gradle and
        Maven plugins, go generate directives, Dockerfile RUN steps, bootstrap and provisioning shell
        scripts, and IDE or editor task definitions. Hunt for the ways they become an execution or
        exfiltration vector: downloading and executing remote content (curl piped into a shell, unpinned
        installer URLs, fetches without checksum or signature verification), writes outside the build
        directory, credentials or environment variables read and sent over the network, sudo or privilege
        escalation, and generated or fetched binaries committed into the tree. Also check whether a
        dependency's own install hooks run in this project's CI with access to secrets. Report each with
        file:line evidence and the code an attacker would get executed and on whose machine.
    - name: red-team-bounty-worthiness
      role: exploit-validator
      category: triage
      skillRefs:
        - name: trail-of-bits-fp-check
        - name: bug-bounty-reporting
        - name: exploit-poc-discipline
      objective: >-
        Adversarially review every recorded finding from a skeptical bounty-triager perspective before final
        reporting. Call list_security_findings, then call get_security_finding for every fingerprint and
        read its complete evidence and audit trail before deciding it. Use all available tools, including the
        full run tool surface, to attempt safe local reproduction and disproof. Challenge each
        finding's reachability, least-privileged attacker control, claimed impact, preconditions, program
        scope, novelty, duplicates, and exclusions. Use only disposable local fixtures and dummy assets for
        reproduction. Do not hunt for new vulnerabilities or submit the final report. Never send state-changing requests to production
        or live systems, perform destructive testing, expand scope, attack or guess credentials, or perform
        denial-of-service or load testing. Preserve an existing false_positive, accepted_risk, or fixed
        terminal status and add only an audit note. For every other finding, call update_security_finding with
        an evidence-backed disposition: a proven bounty-worthy finding remains status confirmed; a technically
        real but not bounty-eligible finding must become status accepted_risk with the exact evidence-backed
        reason and the matching policy_disposition (scope_excluded, known_issue, or bot_findable when
        applicable); a technically disproved or unreachable finding must become status false_positive with
        policy_disposition disproved and the disproof; and a finding with missing evidence or unavailable
        validation must remain status triaged with policy_disposition not_ready. Never use accepted_risk or
        false_positive merely because evidence is missing or validation is unavailable. Stop after every
        recorded finding has an evidence-backed disposition.
      dependsOn: [credential-and-entropy-hunt, dependency-manifest-risk, ci-pipeline-poisoning, install-and-build-scripts]

    - name: triage-and-report
      role: finding-triager
      category: triage
      skillRefs:
        - name: trail-of-bits-fp-check
        - name: bug-bounty-reporting
      objective: >-
        Triage the credential and supply-chain reports with a bias against noise. For every secret, confirm
        it is live-looking credential material rather than a placeholder or fixture before it stays in the
        report, and collapse repeated hits on the same value. For every dependency finding, keep it only
        when the vulnerable or malicious code is reachable from this project or the exposure is in the
        build itself. For every pipeline finding, confirm the trigger and permission combination actually
        exists in the workflow file. Rank by what an attacker gets and how quickly: a valid production
        credential or a poisonable publish job outranks an outdated transitive package. Then assemble and
        submit the final scan report.
      dependsOn:
        - credential-and-entropy-hunt
        - dependency-manifest-risk
        - ci-pipeline-poisoning
        - install-and-build-scripts
        - red-team-bounty-worthiness
