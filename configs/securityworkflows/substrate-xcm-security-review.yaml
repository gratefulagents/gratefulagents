apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityWorkflow
metadata:
  name: substrate-xcm-security-review
spec:
  description: End-to-end security review for Substrate, Polkadot, and XCM, covering scope, architecture, invariants, specialist review, applicable executable evidence, validation, explicit coverage, triage, remediation, and retest planning.
  parallelism: 3
  tasks:
    - name: scope-architecture-and-invariants
      role: threat-modeler
      category: recon
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-audit-context-building
        - name: trail-of-bits-entry-point-analyzer
        - name: trail-of-bits-property-based-testing
      objective: >-
        Apply the referenced context, entry-point, and property skills at the immutable revision and populate the
        schema. Inventory Substrate nodes and runtimes, FRAME pallets, relay/parachain components, XCM configuration and executors, off-chain workers, runtime metadata, generated weights, migrations, benchmarks, tests, and deployment artifacts. Derive chain-specific, locally testable invariants for origin/privilege integrity, nested-dispatch authorization, weight/proof-size and storage-growth bounds, asset conservation, XCM origin/asset/destination binding, replay prevention, native/Wasm agreement, deterministic runtime behavior, and upgrade/migration safety. This task is inventory and threat modeling only; record missing or
        conflicting context and do not claim any build, test, tool, prover, simulator, or network execution.
      outputSchema: |-
        {"type":"object","required":["revision","in_scope","out_of_scope","components","entrypoints","trust_boundaries","assets","roles","artifacts","invariants","test_targets","limitations"],"properties":{"revision":{"type":"string"},"in_scope":{"type":"array","items":{"type":"string"}},"out_of_scope":{"type":"array","items":{"type":"string"}},"components":{"type":"array","items":{"type":"string"}},"entrypoints":{"type":"array","items":{"type":"string"}},"trust_boundaries":{"type":"array","items":{"type":"string"}},"assets":{"type":"array","items":{"type":"string"}},"roles":{"type":"array","items":{"type":"string"}},"artifacts":{"type":"array","items":{"type":"string"}},"invariants":{"type":"array","items":{"type":"object"}},"test_targets":{"type":"array","items":{"type":"string"}},"limitations":{"type":"array","items":{"type":"string"}}}}

    - name: specialist-review
      role: vulnerability-hunter
      category: logic-flaw
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-substrate-vulnerability-scanner
        - name: trail-of-bits-rust-review
        - name: trail-of-bits-property-based-testing
      objective: >-
        Use {{tasks.scope-architecture-and-invariants.output}} for the specialist review. Audit dispatchables, root/signed/custom origins, signed extensions, unsigned validation, inherents, hooks, off-chain workers, nested dispatch, call indexes, proxy/multisig/scheduler/collective paths, benchmark coverage and weights, storage deposits, runtime APIs, unsafe/native boundaries, and XCM barriers, origin conversion, asset filters, fee traders, routing, replay, traps, claims, and version handling.
        For each production-reachable invariant violation with decisive file:line evidence, call
        create_security_hypothesis and emit one schema-valid canonical candidate preserving the returned identity;
        never emit a fingerprint-only candidate. Return examined, skipped, unsupported, and inconclusive targets,
        and claim executable evidence only when its output was preserved.
      dependsOn: [scope-architecture-and-invariants]
      outputSchema: |-
        {
          "type": "object",
          "additionalProperties": false,
          "required": ["area", "status", "examined", "skipped", "limitations", "candidates"],
          "properties": {
            "area": {"type": "string", "minLength": 1},
            "status": {"type": "string", "enum": ["examined", "skipped", "unsupported", "inconclusive"]},
            "examined": {"type": "array", "items": {"type": "string", "minLength": 1}},
            "skipped": {"type": "array", "items": {"type": "string", "minLength": 1}},
            "limitations": {"type": "array", "items": {"type": "string", "minLength": 1}},
            "candidates": {
              "type": "array",
              "items": {
                "type": "object",
                "additionalProperties": false,
                "required": ["candidate_id", "fingerprint", "hypothesis_id", "hypothesis_version", "invariant", "attacker", "controlled_input", "trace", "expected_guard_or_transition", "impact", "falsifier"],
                "properties": {
                  "candidate_id": {"type": "string", "minLength": 1},
                  "fingerprint": {"type": "string", "minLength": 1},
                  "hypothesis_id": {"type": "string", "minLength": 1},
                  "hypothesis_version": {"type": "integer", "minimum": 1},
                  "invariant": {"type": "string", "minLength": 1},
                  "attacker": {"type": "string", "minLength": 1},
                  "controlled_input": {"type": "string", "minLength": 1},
                  "trace": {"type": "array", "minItems": 1, "items": {"type": "string", "minLength": 1}},
                  "expected_guard_or_transition": {"type": "string", "minLength": 1},
                  "impact": {"type": "string", "minLength": 1},
                  "falsifier": {"type": "string", "minLength": 1}
                }
              }
            }
          }
        }

    - name: applicable-tool-execution
      role: vulnerability-hunter
      category: other
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-harness-writing
        - name: trail-of-bits-coverage-analysis
      objective: >-
        Use only concrete artifacts, test_targets, and invariants in {{tasks.scope-architecture-and-invariants.output}}.
        Run safe local project-native builds, tests, simulators, and harnesses after inspecting every invoked script.
        When scoped coverage needs a missing harness, create the smallest deterministic harness in a disposable
        workspace, execute it with local dummy fixtures, and preserve it as an artifact. Never direct test traffic at a live target, production service, or unrelated third party. A registered staged-build pack may use only its reviewed dependency-resolution egress; do not treat that as authorization to scan the dependency host. Use run_security_tool when a
        compatible registered scanner, fuzzer, sanitizer, vector, or analyzer adapter exists. In particular, inventory
        repository-maintained Rust `fuzz/Cargo.toml` `[[bin]]` targets and Go `FuzzXxx` functions. When one covers an
        in-scope attacker-controlled surface, run it through the registered `cargo-fuzz` or `go-fuzz-tests` adapter;
        do not merely inventory it and do not substitute a model-authored general-purpose harness. Run at most two
        highest-value targets for two minutes each. Use an explicit seed for `cargo-fuzz`; for `go-fuzz-tests`,
        record a null seed and the native Go runner's schedule/environment reproducibility limitation. Request two Rust
        workers when the typed option is available and budget permits. Record all discovered targets and why each ran or remained uncovered,
        together with duration, workers, and corpus provenance. A registered run exists only when `run_security_tool`
        returned a run reference; record tool_run as that reference and use null when no registered run exists. For local project-native checks, record the exact
        completed command. Preserve versions, exit status, output, seed, bounds, harnesses, artifacts, examined and
        uncovered scope, and limitations. Missing tools, incompatible harnesses, errors, timeouts, and partial output
        remain visible as unsupported, inconclusive, or skipped. Reproduce and minimize failures where safe. A bounded
        no-finding run is `not_found_under` its exact bounds, never evidence of safety. Recommend `native-fuzz-campaign`
        instead of starting repeated warm rounds in this normal review.
      dependsOn: [scope-architecture-and-invariants]
      outputSchema: |-
        {"type":"array","items":{"type":"object","required":["tool","target","status","execution_status","tool_run","seed","bounds","harnesses","artifacts","examined","uncovered","limitations","selection_reason","duration","workers","corpus_provenance"],"properties":{"tool":{"type":"string"},"target":{"type":"string"},"status":{"type":"string","enum":["examined","skipped","unsupported","inconclusive"]},"execution_status":{"type":"string"},"tool_run":{"anyOf":[{"type":"string","minLength":1},{"type":"null"}]},"seed":{"anyOf":[{"type":"integer"},{"type":"null"}]},"bounds":{"type":"array","items":{"type":"string"}},"harnesses":{"type":"array","items":{"type":"string"}},"artifacts":{"type":"array","items":{"type":"string"}},"examined":{"type":"array","items":{"type":"string"}},"uncovered":{"type":"array","items":{"type":"string"}},"limitations":{"type":"array","items":{"type":"string"}},"selection_reason":{"type":"string"},"duration":{"anyOf":[{"type":"string"},{"type":"null"}]},"workers":{"anyOf":[{"type":"integer","minimum":1},{"type":"null"}]},"corpus_provenance":{"type":"array","items":{"type":"string"}}}}}

    - name: validate-triage-and-coverage
      role: exploit-validator
      category: triage
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-fp-check
        - name: exploit-poc-discipline
      objective: >-
        Apply the referenced false-positive and PoC skills to every canonical candidate from
        {{tasks.specialist-review.output}}, using the exact scope and executable evidence supplied by the
        dependency tasks. Emit exactly one schema-valid candidate_result per candidate, preserving candidate_id,
        fingerprint, and hypothesis_id; prioritization may change order but never coverage. The workflow-specific
        contract is: transition each durable hypothesis to promoted, falsified, or blocked; keep all execution local
        and safe; require the schema's complete reproduction evidence for confirmed results, a concrete blocker for
        triaged results, and decisive disproof for false positives. Call record_security_coverage for applicable
        invariant, actor, state, and transition bounds, copy returned IDs into coverage_records, and reconcile every
        inventory area, tool attempt, and candidate as examined, skipped, unsupported, or inconclusive.
      dependsOn: [scope-architecture-and-invariants, specialist-review, applicable-tool-execution]
      outputSchema: |-
        {
          "type": "object",
          "additionalProperties": false,
          "required": ["examined", "skipped", "unsupported", "inconclusive", "candidate_results", "coverage_records", "uncovered", "limitations"],
          "properties": {
            "examined": {"type": "array", "items": {"type": "string", "minLength": 1}},
            "skipped": {"type": "array", "items": {"type": "string", "minLength": 1}},
            "unsupported": {"type": "array", "items": {"type": "string", "minLength": 1}},
            "inconclusive": {"type": "array", "items": {"type": "string", "minLength": 1}},
            "candidate_results": {
              "type": "array",
              "items": {
                "type": "object",
                "additionalProperties": false,
                "required": ["candidate_id", "fingerprint", "hypothesis_id", "hypothesis_version", "hypothesis_status", "hypothesis_result", "verdict", "attempts"],
                "properties": {
                  "candidate_id": {"type": "string", "minLength": 1},
                  "fingerprint": {"type": "string", "minLength": 1},
                  "hypothesis_id": {"type": "string", "minLength": 1},
                  "hypothesis_version": {"type": "integer", "minimum": 2},
                  "hypothesis_status": {"type": "string", "enum": ["promoted", "falsified", "blocked"]},
                  "hypothesis_result": {"type": "string", "enum": ["positive", "negative", "failed", "timed_out", "inconclusive", "abandoned"]},
                  "verdict": {"type": "string", "enum": ["confirmed", "false_positive", "triaged"]},
                  "attempts": {"type": "integer", "minimum": 1},
                  "reachability": {"type": "string", "minLength": 1},
                  "impact": {"type": "string", "minLength": 1},
                  "coverage_ids": {"type": "array", "minItems": 1, "items": {"type": "string", "minLength": 1}},
                  "blocker": {"type": "string", "minLength": 1},
                  "disproof": {"type": "string", "minLength": 1},
                  "reproduction": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["setup", "environment", "command", "test_path", "tool_run", "failing_assertion", "expected_output", "observed_output", "observed_delta", "negative_control_passed", "oracle_calibrated"],
                    "properties": {
                      "setup": {"type": "string", "minLength": 1},
                      "environment": {"type": "string", "minLength": 1},
                      "command": {"type": "string", "minLength": 1},
                      "test_path": {"type": "string", "minLength": 1},
                      "tool_run": {"anyOf": [{"type": "string", "minLength": 1}, {"type": "null"}]},
                      "failing_assertion": {"type": "string", "minLength": 1},
                      "expected_output": {"type": "string", "minLength": 1},
                      "observed_output": {"type": "string", "minLength": 1},
                      "observed_delta": {"type": "string", "minLength": 1},
                      "negative_control_passed": {"const": true},
                      "oracle_calibrated": {"const": true}
                    }
                  }
                },
                "allOf": [
                  {"if": {"required": ["verdict"], "properties": {"verdict": {"const": "confirmed"}}}, "then": {"required": ["reachability", "impact", "coverage_ids", "reproduction"], "properties": {"hypothesis_status": {"const": "promoted"}, "hypothesis_result": {"const": "positive"}}}},
                  {"if": {"required": ["verdict"], "properties": {"verdict": {"const": "triaged"}}}, "then": {"required": ["blocker"], "properties": {"hypothesis_status": {"const": "blocked"}}}},
                  {"if": {"required": ["verdict"], "properties": {"verdict": {"const": "false_positive"}}}, "then": {"required": ["disproof"], "properties": {"hypothesis_status": {"const": "falsified"}, "hypothesis_result": {"const": "negative"}}}}
                ]
              }
            },
            "coverage_records": {
              "type": "array",
              "items": {
                "type": "object",
                "additionalProperties": false,
                "required": ["coverage_id", "dimension", "subject", "verdict", "bounds", "evidence", "recorded"],
                "properties": {
                  "coverage_id": {"type": "string", "minLength": 1},
                  "dimension": {"type": "string", "enum": ["invariant", "actor", "state", "transition"]},
                  "subject": {"type": "string", "minLength": 1},
                  "verdict": {"type": "string", "enum": ["disproved", "adequately_tested", "inadequately_tested", "not_tested"]},
                  "bounds": {"type": "array", "items": {"type": "string", "minLength": 1}},
                  "evidence": {"type": "array", "items": {"type": "string", "minLength": 1}},
                  "recorded": {"const": true}
                }
              }
            },
            "uncovered": {"type": "array", "items": {"type": "string", "minLength": 1}},
            "limitations": {"type": "array", "items": {"type": "string", "minLength": 1}}
          }
        }

    - name: remediation-and-retest
      role: vulnerability-hunter
      category: other
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-variant-analysis
        - name: trail-of-bits-property-based-testing
      objective: >-
        Use {{tasks.validate-triage-and-coverage.output}} to provide the schema-required remediation and follow-up
        retest record for each confirmed or triaged candidate; do not claim a future fix or retest occurred. Apply
        the referenced variant-analysis skill to every confirmed root cause, persist it with
        create_security_variant_sweep and complete_security_variant_sweep, and return the durable sweep evidence in
        variant_sweep. A missing or incomplete sweep remains a campaign and bundle-readiness blocker.
      dependsOn: [validate-triage-and-coverage]
      outputSchema: |-
        {
          "type": "array",
          "items": {
            "type": "object",
            "additionalProperties": false,
            "required": ["candidate_id", "fingerprint", "verdict"],
            "properties": {
              "candidate_id": {"type": "string", "minLength": 1},
              "fingerprint": {"type": "string", "minLength": 1},
              "verdict": {"type": "string", "enum": ["confirmed", "triaged"]},
              "root_cause": {"type": "string", "minLength": 1},
              "remediation": {"type": "string", "minLength": 1},
              "regression_test": {"type": "string", "minLength": 1},
              "retest": {"type": "string", "minLength": 1},
              "rollout_risk": {"type": "string", "minLength": 1},
              "blocker": {"type": "string", "minLength": 1},
              "next_investigation_step": {"type": "string", "minLength": 1},
              "variant_sweep": {
                "type": "object",
                "additionalProperties": false,
                "required": ["sweep_id", "status", "scope", "methods", "evidence", "variants", "summary"],
                "properties": {
                  "sweep_id": {"type": "string", "minLength": 1},
                  "status": {"const": "completed"},
                  "scope": {"type": "array", "minItems": 1, "items": {"type": "string", "minLength": 1}},
                  "methods": {"type": "array", "minItems": 1, "items": {"type": "string", "minLength": 1}},
                  "evidence": {"type": "array", "minItems": 1, "items": {"type": "string", "minLength": 1}},
                  "variants": {"type": "array", "items": {"type": "string", "minLength": 1}},
                  "summary": {"type": "string", "minLength": 1}
                }
              }
            },
            "allOf": [
              {"if": {"required": ["verdict"], "properties": {"verdict": {"const": "confirmed"}}}, "then": {"required": ["root_cause", "remediation", "regression_test", "retest", "rollout_risk", "variant_sweep"]}},
              {"if": {"required": ["verdict"], "properties": {"verdict": {"const": "triaged"}}}, "then": {"required": ["blocker", "next_investigation_step"]}}
            ]
          }
        }

    - name: triage-and-report
      role: finding-triager
      category: triage
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-fp-check
        - name: bug-bounty-reporting
      objective: >-
        Produce exactly one final report from {{tasks.validate-triage-and-coverage.output}} and
        {{tasks.remediation-and-retest.output}}. Reconcile durable findings one-to-one with candidate IDs,
        fingerprints, hypothesis transitions, coverage records, and remediation results. Retain as findings only
        confirmed candidates with completed durable variant sweeps; put triaged candidates, false-positive
        disproofs, errors, unsupported or inconclusive work, and coverage gaps in clearly separate sections. Persist
        any missing terminal transition or coverage record, call get_security_campaign_status immediately before
        submission, and reconcile every remaining blocker and budget decision. Hand retained confirmed or triaged
        findings to the configured per-finding post-script pipeline. Technical confirmation is not bundle readiness:
        only a successfully persisted packaging artifact may be reported ready; otherwise report the packaging state
        and never claim the artifact exists.
      dependsOn: [validate-triage-and-coverage, remediation-and-retest]
