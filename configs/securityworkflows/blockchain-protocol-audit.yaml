apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityWorkflow
metadata:
  name: blockchain-protocol-audit
spec:
  description: Evidence-driven review of blockchain clients, rollups, bridges, peer-to-peer nodes, signing services, and protocol release paths. A runtime dossier gates four long investigations and bounded native fuzzing; detailed evidence is persisted behind compact handoffs before adaptive challenge, independent validation, campaign reconciliation, and one final report.
  parallelism: 6
  tasks:
    - name: runtime-preflight-and-dossier
      role: protocol-investigator
      category: recon
      timeout: 25m
      maxTurns: 50
      tools:
        denied: [git_commit, git_push, create_pull_request]
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-audit-context-building
      objective: >-
        Call get_security_research_context first and accept reusable evidence only for the exact immutable target,
        revision, and scope; prior-revision negative evidence is stale context. Perform a bounded runtime preflight:
        verify the checked-out revision, in-scope roots, dependencies and submodules, required toolchains, principal
        build and test commands, companion repositories, generated or deployed artifacts, and operator-authorized
        fork or deployment inputs. Run only cheap local smoke checks needed to decide whether investigation can
        proceed. Build the protocol dossier from production wiring: components, trust boundaries, actors, assets,
        state machines, entry points, invariants, reference implementations, native fuzz targets, and explicit
        exclusions. Persist the dossier and preflight as manifest artifacts and each blocker as a blocker artifact
        with create_security_research_artifact, always supplying kind, an object payload, and a stable idempotency_key;
        persist material dossier changes with amend_security_dossier. Set conditions.ready true only when the four
        source investigations can execute meaningfully; keep conditions.build_ready and conditions.test_ready
        truthful. Return the actual version-1 handoff shape: version, artifact_ids, candidate_fingerprints,
        coverage_ids, blocker_ids, and scalar conditions only. Never embed artifact bodies in task output.
      outputSchema: |-
        {"type":"object","additionalProperties":false,"required":["version","artifact_ids","candidate_fingerprints","coverage_ids","blocker_ids","conditions"],"properties":{"version":{"const":1},"artifact_ids":{"type":"array","minItems":1,"maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"candidate_fingerprints":{"type":"array","maxItems":8,"items":{"type":"string","minLength":1}},"coverage_ids":{"type":"object","additionalProperties":false,"properties":{"disproved":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"adequately_tested":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"inadequately_tested":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"not_tested":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}}}},"blocker_ids":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"conditions":{"type":"object","additionalProperties":false,"required":["ready","build_ready","test_ready"],"properties":{"ready":{"type":"boolean"},"build_ready":{"type":"boolean"},"test_ready":{"type":"boolean"}}}}}

    - name: consensus-and-execution-investigator
      role: protocol-investigator
      category: logic-flaw
      timeout: 90m
      maxTurns: 140
      tools:
        denied: [git_commit, git_push, create_pull_request]
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-secure-workflow-guide
        - name: trail-of-bits-property-based-testing
      objective: >-
        Consume {{tasks.runtime-preflight-and-dossier.output}} and retrieve its dossier artifacts with
        get_security_research_artifacts using include_payload true. Own consensus safety and liveness, finality and
        reorgs, transaction/block/batch/proof admission, deterministic state transitions, runtime/VM and host
        boundaries, rollup derivation, data availability, and dispute paths. Payout-ordered priority 3 is owned here:
        Priority 3, fork-versus-upstream divergence. Name upstream-fork-diff and the invariant the upstream code used
        to satisfy; record an unavailable upstream revision as a limitation. Create falsifiable branches with
        create_security_hypothesis, trace production reachability, and settle them with local fixtures, focused tests,
        mutants, reference vectors, private devnets, or differential execution. After every experiment call
        transition_security_hypothesis and record_security_coverage. Persist manifests, traces, harness summaries,
        commands, outputs, and blockers with create_security_research_artifact using stable idempotency keys. Report
        only proven production-impacting defects with report_security_finding. Apply the evidence stopping rule and
        return only the actual version-1 handoff fields, using artifact IDs and finding fingerprints as challenge
        handles rather than embedding evidence.
      dependsOn: [runtime-preflight-and-dossier]
      when:
        task: runtime-preflight-and-dossier
        path: conditions.ready
        equals: "true"
        otherwiseOutput: '{"version":1,"artifact_ids":[],"candidate_fingerprints":[],"coverage_ids":{},"blocker_ids":[],"conditions":{"ready":false,"reason":"runtime_preflight_blocked"}}'
      outputSchema: &handoffSchema |-
        {"type":"object","additionalProperties":false,"required":["version","artifact_ids","candidate_fingerprints","coverage_ids","blocker_ids","conditions"],"properties":{"version":{"const":1},"artifact_ids":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"candidate_fingerprints":{"type":"array","maxItems":8,"items":{"type":"string","minLength":1}},"coverage_ids":{"type":"object","additionalProperties":false,"properties":{"disproved":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"adequately_tested":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"inadequately_tested":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"not_tested":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}}}},"blocker_ids":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"conditions":{"type":"object","additionalProperties":false,"required":["ready"],"properties":{"ready":{"type":"boolean"},"reason":{"type":"string"}}}}}

    - name: network-and-state-investigator
      role: protocol-investigator
      category: denial-of-service
      timeout: 90m
      maxTurns: 140
      tools:
        denied: [git_commit, git_push, create_pull_request]
      skillRefs:
        - name: blockchain-security-research-method
        - name: offchain-blockchain-services-review
        - name: trail-of-bits-rust-review
      objective: >-
        Consume {{tasks.runtime-preflight-and-dossier.output}} and retrieve its durable dossier with
        get_security_research_artifacts using include_payload true. Own peer discovery and identity, gossip, wire
        decoders, sync, mempool admission and replacement, RPC and admin boundaries, resource exhaustion, persistent
        state, snapshots, pruning, crash recovery, reorg handling, concurrency, native memory safety, FFI, and
        off-chain service reconciliation. Create high-impact branches with create_security_hypothesis, trace the
        production path, and run bounded local fixtures, parser harnesses, focused tests, mutants, sanitizers, fuzzing,
        or differential checks. Never direct availability testing at a live peer or public endpoint. After every
        experiment call transition_security_hypothesis and record_security_coverage, and persist exact trace, harness,
        run, and blocker evidence with create_security_research_artifact using stable idempotency keys. Report only
        evidence-backed production findings, apply the evidence stopping rule, and return only the actual version-1
        handoff fields with compact artifact and fingerprint handles.
      dependsOn: [runtime-preflight-and-dossier]
      when:
        task: runtime-preflight-and-dossier
        path: conditions.ready
        equals: "true"
        otherwiseOutput: '{"version":1,"artifact_ids":[],"candidate_fingerprints":[],"coverage_ids":{},"blocker_ids":[],"conditions":{"ready":false,"reason":"runtime_preflight_blocked"}}'
      outputSchema: *handoffSchema

    - name: cross-chain-and-custody-investigator
      role: protocol-investigator
      category: authz
      timeout: 90m
      maxTurns: 140
      tools:
        denied: [git_commit, git_push, create_pull_request]
      skillRefs:
        - name: blockchain-security-research-method
        - name: bridge-l2-zk-security-review
        - name: wallet-security-review
        - name: mpc-cryptographic-security-review
      objective: >-
        Consume {{tasks.runtime-preflight-and-dossier.output}} and retrieve exact-bound evidence with
        get_security_research_artifacts using include_payload true. Own cross-domain message and value lifecycles,
        relayers and oracles, withdrawals, bridge accounting, signer and wallet policy, key custody, HSM/MPC/threshold
        quorum, nonce safety, recovery, and privileged interfaces. Payout-ordered priority 2 is owned here: Priority 2,
        cross-chain proof and identity binding. For every proof ask who is allowed to have produced this proof and what
        msg.sender becomes on the far side after relaying. Create falsifiable branches with create_security_hypothesis,
        trace both sides of each boundary, and settle them with safe local fixtures, dummy keys and assets, focused
        tests, mutants, simulators, private devnets, or differential checks. Never sign for or write to a public chain.
        After every experiment call transition_security_hypothesis and record_security_coverage, persist evidence and
        blockers with create_security_research_artifact using stable idempotency keys, and report only proven defects.
        Apply the evidence stopping rule and return only the actual version-1 handoff fields.
      dependsOn: [runtime-preflight-and-dossier]
      when:
        task: runtime-preflight-and-dossier
        path: conditions.ready
        equals: "true"
        otherwiseOutput: '{"version":1,"artifact_ids":[],"candidate_fingerprints":[],"coverage_ids":{},"blocker_ids":[],"conditions":{"ready":false,"reason":"runtime_preflight_blocked"}}'
      outputSchema: *handoffSchema

    - name: crypto-economics-and-release-investigator
      role: protocol-investigator
      category: supply-chain
      timeout: 90m
      maxTurns: 140
      tools:
        denied: [git_commit, git_push, create_pull_request]
      skillRefs:
        - name: blockchain-security-research-method
        - name: evm-economic-and-mev-review
        - name: trail-of-bits-constant-time-analysis
        - name: trail-of-bits-supply-chain-risk-auditor
      objective: >-
        Consume {{tasks.runtime-preflight-and-dossier.output}} and retrieve dossier artifacts with
        get_security_research_artifacts using include_payload true. Own cryptographic verification and domain
        separation, encodings and replay, accounting and precision, incentives and solvency, governance, auctions,
        liquidations, MEV, genesis and upgrades, dependency/compiler provenance, reproducible builds, deployed drift,
        release signing, and rollback. Payout-ordered priorities 1, 4, 5, 6, and 7 are owned here: Priority 1,
        initialization and upgrade state on the DEPLOYED implementation; Priority 4, encoding and decoding round trips
        and replay; Priority 5, missing balance and state validation; Priority 6, accounting, rounding, precision and
        decimals, including non-18-decimal representations; and Priority 7, access control and role or permission
        inventories. Where applicable, the chain-read pack reads the EIP-1967 implementation, admin and beacon slots;
        chain-read and deployed-bytecode-diff require an operator-authorized fork endpoint alias, so record a blocker
        rather than assuming the deployed value. Templated flash-loan oracle manipulation stays AVAILABLE but is off
        the default bounty path; bot-findable means unpayable. Create each branch with create_security_hypothesis,
        trace production reachability, and run bounded local vectors, fixtures, focused tests, mutants, artifact
        comparisons, or economic simulations. After every experiment call transition_security_hypothesis and
        record_security_coverage; persist evidence and blockers with create_security_research_artifact using stable
        idempotency keys. Report only proven defects, apply the evidence stopping rule, and return only the actual
        version-1 handoff fields.
      dependsOn: [runtime-preflight-and-dossier]
      when:
        task: runtime-preflight-and-dossier
        path: conditions.ready
        equals: "true"
        otherwiseOutput: '{"version":1,"artifact_ids":[],"candidate_fingerprints":[],"coverage_ids":{},"blocker_ids":[],"conditions":{"ready":false,"reason":"runtime_preflight_blocked"}}'
      outputSchema: *handoffSchema

    - name: run-bounded-native-fuzz
      role: native-fuzz-runner
      category: other
      timeout: 12m
      maxTurns: 35
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-cargo-fuzz
        - name: trail-of-bits-harness-writing
        - name: trail-of-bits-coverage-analysis
      objective: >-
        Own the compact graph's bounded native fuzz baseline. Consume
        {{tasks.runtime-preflight-and-dossier.output}} and retrieve its dossier with
        get_security_research_artifacts using include_payload true. Inventory repository-maintained Rust
        fuzz/Cargo.toml targets and Go FuzzXxx functions, then match each harness to an in-scope attacker-controlled
        protocol surface. Use run_security_tool with the registered cargo-fuzz or go-fuzz-tests adapter for at most two
        targets and two minutes each; do not substitute a model-authored acceptance harness. Use an explicit seed for
        Rust and a null seed for Go, and record workers, tool version, immutable revision, duration, corpus provenance,
        artifacts, errors, timeouts, skipped and unsupported targets. Treat clean execution only as not_found_under
        those exact bounds and recommend the dedicated native-fuzz-campaign for justified warm rounds. Persist the
        inventory and run as manifest or harness_summary artifacts and crashes and blockers in their supported artifact
        kinds with create_security_research_artifact using stable idempotency keys; call record_security_coverage for
        bounded verdicts. Return only the actual version-1 handoff fields, using artifact IDs or finding fingerprints
        for crashes and plateaus rather than embedding run bodies.
      dependsOn: [runtime-preflight-and-dossier]
      when:
        task: runtime-preflight-and-dossier
        path: conditions.ready
        equals: "true"
        otherwiseOutput: '{"version":1,"artifact_ids":[],"candidate_fingerprints":[],"coverage_ids":{},"blocker_ids":[],"conditions":{"ready":false,"reason":"runtime_preflight_blocked"}}'
      outputSchema: *handoffSchema

    - name: collect-investigator-handoffs
      role: protocol-investigator
      category: other
      skillRefs:
        - name: blockchain-security-research-method
      objective: Deterministically concatenate the preflight and five compact version-1 handoffs without loading or copying durable artifact bodies.
      dependsOn:
        - runtime-preflight-and-dossier
        - consensus-and-execution-investigator
        - network-and-state-investigator
        - cross-chain-and-custody-investigator
        - crypto-economics-and-release-investigator
        - run-bounded-native-fuzz
      reduce: concat
      outputSchema: |-
        {"type":"array","minItems":6,"maxItems":6,"items":{"type":"object","additionalProperties":false,"required":["version","artifact_ids","candidate_fingerprints","coverage_ids","blocker_ids","conditions"],"properties":{"version":{"const":1},"artifact_ids":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"candidate_fingerprints":{"type":"array","maxItems":8,"items":{"type":"string","minLength":1}},"coverage_ids":{"type":"object","additionalProperties":false,"properties":{"disproved":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"adequately_tested":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"inadequately_tested":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"not_tested":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}}}},"blocker_ids":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"conditions":{"type":"object"}}}}

    - name: select-adaptive-challenges
      role: threat-modeler
      category: recon
      timeout: 20m
      maxTurns: 40
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-fp-check
      objective: >-
        Review the six compact handoffs in {{tasks.collect-investigator-handoffs.output}}. Retrieve only the artifact
        IDs needed to rank candidates with get_security_research_artifacts using include_payload true. Select no more
        than eight artifact or finding handles where an independent challenge, mutant, differential test, crash replay,
        or same-root-cause variant search has the highest expected information gain. Prefer high-impact reachable
        candidates, conflicting evidence, uncalibrated controls, native crashes, and likely sibling root causes; do not
        select decisively falsified work. Return an array ordered by priority, one actual version-1 handoff per selected
        handle, copying only relevant IDs and setting scalar conditions.ready true. Return an empty array when no
        challenge is justified; never embed artifact content.
      dependsOn: [runtime-preflight-and-dossier, collect-investigator-handoffs]
      when:
        task: runtime-preflight-and-dossier
        path: conditions.ready
        equals: "true"
        otherwiseOutput: '[]'
      outputSchema: |-
        {"type":"array","maxItems":8,"items":{"type":"object","additionalProperties":false,"required":["version","artifact_ids","candidate_fingerprints","coverage_ids","blocker_ids","conditions"],"properties":{"version":{"const":1},"artifact_ids":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"candidate_fingerprints":{"type":"array","maxItems":8,"items":{"type":"string","minLength":1}},"coverage_ids":{"type":"object","additionalProperties":false,"properties":{"disproved":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"adequately_tested":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"inadequately_tested":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"not_tested":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}}}},"blocker_ids":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"conditions":{"type":"object","additionalProperties":false,"required":["ready"],"properties":{"ready":{"const":true}}}}}}

    - name: challenge-and-variant-sweep
      role: protocol-investigator
      category: other
      timeout: 40m
      maxTurns: 80
      tools:
        denied: [git_commit, git_push, create_pull_request]
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-variant-analysis
        - name: trail-of-bits-fp-check
        - name: exploit-poc-discipline
      objective: >-
        Independently challenge the selected artifact IDs {{item.artifact_ids}} and finding fingerprints
        {{item.candidate_fingerprints}}. Retrieve evidence with get_security_research_artifacts using include_payload
        true, re-trace production reachability, and run the cheapest materially different safe local focused test,
        fixture, mutant, crash replay, fuzz check, or differential experiment. A confirmed result requires a failing
        invariant, observed impact, conditions.negative_control_passed true, and conditions.oracle_can_fail true;
        otherwise falsify it or preserve a concrete blocker. Update durable hypotheses with
        transition_security_hypothesis and bounds with record_security_coverage. Persist commands, outputs, controls,
        and blockers with create_security_research_artifact using stable idempotency keys. For every confirmed root
        cause call create_security_variant_sweep and complete_security_variant_sweep with actual searched scope,
        methods, sibling results, and evidence; an incomplete sweep remains blocked. Update existing findings rather
        than duplicating them. Return only the actual version-1 handoff fields with the verdict in scalar conditions.
      dependsOn: [select-adaptive-challenges]
      forEach: select-adaptive-challenges
      maxInstances: 8
      outputSchema: |-
        {"type":"object","additionalProperties":false,"required":["version","artifact_ids","candidate_fingerprints","coverage_ids","blocker_ids","conditions"],"properties":{"version":{"const":1},"artifact_ids":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"candidate_fingerprints":{"type":"array","maxItems":8,"items":{"type":"string","minLength":1}},"coverage_ids":{"type":"object","additionalProperties":false,"properties":{"disproved":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"adequately_tested":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"inadequately_tested":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"not_tested":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}}}},"blocker_ids":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"conditions":{"type":"object","additionalProperties":false,"required":["ready","verdict"],"properties":{"ready":{"type":"boolean"},"verdict":{"type":"string","enum":["confirmed","false_positive","triaged"]},"negative_control_passed":{"type":"boolean"},"oracle_can_fail":{"type":"boolean"}},"allOf":[{"if":{"properties":{"verdict":{"const":"confirmed"}},"required":["verdict"]},"then":{"required":["negative_control_passed","oracle_can_fail"],"properties":{"negative_control_passed":{"const":true},"oracle_can_fail":{"const":true}}}}]}}}

    - name: red-team-bounty-worthiness
      role: exploit-validator
      category: triage
      timeout: 45m
      maxTurns: 90
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-fp-check
        - name: bug-bounty-reporting
        - name: exploit-poc-discipline
      objective: >-
        Act as the independent validator and skeptical bounty-triager for the compact original handoffs
        {{tasks.collect-investigator-handoffs.output}}, selected work {{tasks.select-adaptive-challenges.output}}, and
        challenge results {{tasks.challenge-and-variant-sweep.output}}. Call list_security_findings, then
        get_security_finding for every fingerprint and read its complete evidence and audit trail. Retrieve referenced
        evidence with get_security_research_artifacts using include_payload true. Use all available tools to
        independently reproduce or disprove every candidate intended for the report; confirmed requires observed local
        behavior with calibrated controls, while missing evidence remains triaged and a concrete disproof becomes
        false_positive. Call update_security_finding for every decision and preserve confirmed, accepted_risk,
        false_positive, triaged, and fixed states. Set policy_disposition explicitly to scope_excluded, known_issue,
        bot_findable, not_ready, or eligible without confusing a technically real defect with a payable submission. Do
        not hunt for new vulnerabilities. Live verification is limited to operator-authorized read-only calls to
        in-scope live targets and must be minimally invasive; never access real-user data, make a state-changing call,
        perform destructive testing, expand scope, use credentials, or attempt denial-of-service. Persist one compact
        validation manifest and any blocker with create_security_research_artifact using stable idempotency keys.
        Return only the actual version-1 handoff fields with conditions.ready and conditions.report_ready.
      dependsOn:
        - runtime-preflight-and-dossier
        - collect-investigator-handoffs
        - select-adaptive-challenges
        - challenge-and-variant-sweep
      when:
        task: runtime-preflight-and-dossier
        path: conditions.ready
        equals: "true"
        otherwiseOutput: '{"version":1,"artifact_ids":[],"candidate_fingerprints":[],"coverage_ids":{},"blocker_ids":[],"conditions":{"ready":false,"report_ready":false}}'
      outputSchema: |-
        {"type":"object","additionalProperties":false,"required":["version","artifact_ids","candidate_fingerprints","coverage_ids","blocker_ids","conditions"],"properties":{"version":{"const":1},"artifact_ids":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"candidate_fingerprints":{"type":"array","maxItems":16,"items":{"type":"string","minLength":1}},"coverage_ids":{"type":"object","additionalProperties":false,"properties":{"disproved":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"adequately_tested":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"inadequately_tested":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"not_tested":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}}}},"blocker_ids":{"type":"array","maxItems":8,"items":{"type":"string","minLength":36,"maxLength":36}},"conditions":{"type":"object","additionalProperties":false,"required":["ready","report_ready"],"properties":{"ready":{"type":"boolean"},"report_ready":{"type":"boolean"}}}}}

    - name: triage-and-report
      role: finding-triager
      category: triage
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-variant-analysis
        - name: bug-bounty-reporting
      objective: >-
        Produce exactly one final report. Start from {{tasks.red-team-bounty-worthiness.output}} and reconcile it
        against original handoffs {{tasks.collect-investigator-handoffs.output}}, adaptive selection
        {{tasks.select-adaptive-challenges.output}}, and challenge outcomes
        {{tasks.challenge-and-variant-sweep.output}}. Retrieve referenced dossier, manifests, traces, harness summaries,
        native-fuzz runs, variant evidence, and blockers with get_security_research_artifacts using include_payload
        true; never infer evidence from an ID alone. Call list_security_findings and deduplicate by root cause. Keep
        errors, timeouts, skipped, unsupported, inadequately tested, not tested, inconclusive, blocked, and uncovered
        work as explicit limitations; bounded not_found_under evidence is not proof of safety. Ensure every retained
        finding has exact revision and file:line evidence, attacker path, violated invariant, impact, calibrated local
        proof or honest blocker, remediation, and immutable-revision retest plan. Require completed durable variant
        sweeps for confirmed root causes: create_security_variant_sweep and complete_security_variant_sweep may only
        reflect actual recorded work. Call get_security_campaign_status and reconcile every open hypothesis, coverage
        gap, blocker, variant sweep, native fuzz recommendation, and budget decision. Hand retained findings to the
        configured post-script pipeline and describe bundle state separately from technical validity; only a
        successfully persisted post-script artifact is bundle-ready. Apply ranker rules and minimum severity, then call
        submit_security_scan_report exactly once. Do not create another sink or claim a remediation retest occurred.
      dependsOn:
        - collect-investigator-handoffs
        - select-adaptive-challenges
        - challenge-and-variant-sweep
        - red-team-bounty-worthiness
