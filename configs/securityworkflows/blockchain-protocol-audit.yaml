apiVersion: triggers.gratefulagents.dev/v1alpha1
kind: SecurityWorkflow
metadata:
  name: blockchain-protocol-audit
spec:
  description: Deep security review for blockchain clients, rollups, bridges, peer-to-peer nodes, and signing services. It inventories protocol-critical surfaces, reviews the highest-risk flows individually, and hunts consensus, rollup, transaction, network, bridge, execution, signer, storage, native-safety, and release-integrity failures before exploit validation and triage. Contract-only repositories should use smart-contract-review instead.
  parallelism: 6
  tasks:
    - name: detect-platforms-and-components
      role: threat-modeler
      category: recon
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-audit-context-building
      objective: >-
        Call get_security_research_context first and reuse only records bound to the exact immutable target
        revision and scope; prior-revision negative evidence is stale context. Build the authoritative scope,
        platform, and component inventory for this repository before any surface
        is mapped. Record the immutable revision under review, explicit in-scope and out-of-scope roots, stated
        deployment/artifact availability, and limitations. Inspect manifests, build files, imports, schemas,
        source layout, generated artifacts, tests,
        deployment files, and production wiring for EVM clients/protocol code/system contracts, Solana and
        Anchor, Cosmos SDK/CosmWasm/IBC, Substrate/Polkadot/XCM, Aptos Move, Sui Move, Cairo/Starknet, TON,
        Algorand, and Bitcoin/UTXO/Lightning. Emit exactly one record for every enumerated platform, including
        platforms not detected. For each detected platform identify concrete components such as node/client,
        runtime/VM, consensus, contracts/programs/modules, bridge/rollup/prover, wallet/signer/custody,
        relayer/oracle/indexer/keeper/sequencer/batcher, RPC/P2P, tests, and deployment/release code, with
        repository-relative evidence files. Use detected only when source or configuration evidence supports
        it, not from documentation or names alone; use inconclusive when evidence conflicts. Populate every
        specialists boolean conservatively: each of the ten platform-specialist flags is true exactly when its
        matching platform status is detected or inconclusive; bridge-l2-zk-specialist is true when a bridge,
        rollup, prover, verifier, cross-chain message, or data-availability component is detected or inconclusive;
        wallet-mpc-cryptography-specialist is true for any wallet, signer, custody, HSM, MPC, or threshold-crypto
        component; economics-mev-governance-specialist is true whenever any production protocol platform is
        detected or inconclusive; and off-chain-services-specialist is true for any relayer, oracle, indexer,
        keeper, bundler, sequencer, batcher, prover service, RPC service, admin API, telemetry pipeline,
        key-custody service, backup, or recovery component. Set a specialist flag false only when repository
        evidence establishes that its entire area is absent; uncertainty must route to review. This is inventory,
        not a vulnerability hunt, and it must not claim that builds, tests, analyzers, fuzzers, provers, or
        network checks were executed.
      outputSchema: |-
        {
          "type": "object",
          "required": ["revision", "scope", "platforms", "specialists", "limitations"],
          "properties": {
            "revision": {"type": "string"},
            "scope": {
              "type": "object",
              "required": ["in_scope", "out_of_scope", "deployment_artifacts"],
              "properties": {
                "in_scope": {"type": "array", "items": {"type": "string"}},
                "out_of_scope": {"type": "array", "items": {"type": "string"}},
                "deployment_artifacts": {"type": "string", "enum": ["available", "partial", "unavailable"]}
              }
            },
            "platforms": {
              "type": "array",
              "minItems": 10,
              "maxItems": 10,
              "items": {
                "type": "object",
                "required": ["platform", "status", "evidence", "components"],
                "properties": {
                  "platform": {"type": "string", "enum": ["evm-protocol", "solana-anchor", "cosmos-cosmwasm-ibc", "substrate-polkadot-xcm", "aptos-move", "sui-move", "cairo-starknet", "ton", "algorand", "bitcoin-lightning"]},
                  "status": {"type": "string", "enum": ["detected", "not_detected", "inconclusive"]},
                  "evidence": {"type": "array", "items": {"type": "string", "description": "Repository-relative file or file:line evidence"}},
                  "components": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "required": ["name", "kind", "files"],
                      "properties": {
                        "name": {"type": "string"},
                        "kind": {"type": "string"},
                        "files": {"type": "array", "items": {"type": "string"}}
                      }
                    }
                  }
                }
              }
            },
            "specialists": {"type":"object","required":["evm-protocol-specialist","solana-anchor-specialist","cosmos-cosmwasm-ibc-specialist","substrate-polkadot-xcm-specialist","aptos-move-specialist","sui-move-specialist","cairo-starknet-specialist","ton-specialist","algorand-specialist","bitcoin-lightning-specialist","bridge-l2-zk-specialist","wallet-mpc-cryptography-specialist","economics-mev-governance-specialist","off-chain-services-specialist"],"properties":{"evm-protocol-specialist":{"type":"boolean"},"solana-anchor-specialist":{"type":"boolean"},"cosmos-cosmwasm-ibc-specialist":{"type":"boolean"},"substrate-polkadot-xcm-specialist":{"type":"boolean"},"aptos-move-specialist":{"type":"boolean"},"sui-move-specialist":{"type":"boolean"},"cairo-starknet-specialist":{"type":"boolean"},"ton-specialist":{"type":"boolean"},"algorand-specialist":{"type":"boolean"},"bitcoin-lightning-specialist":{"type":"boolean"},"bridge-l2-zk-specialist":{"type":"boolean"},"wallet-mpc-cryptography-specialist":{"type":"boolean"},"economics-mev-governance-specialist":{"type":"boolean"},"off-chain-services-specialist":{"type":"boolean"}}},
            "limitations": {"type": "array", "items": {"type": "string"}}
          }
        }

    - name: map-protocol-surfaces
      role: threat-modeler
      category: recon
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-audit-context-building
        - name: trail-of-bits-entry-point-analyzer
      objective: >-
        Consume the complete platform/component inventory in
        {{tasks.detect-platforms-and-components.output}} and map and risk-rank every production protocol
        surface in every detected or inconclusive component: consensus and finality;
        transaction, block, batch, proof, and state-transition validation; rollup derivation and disputes;
        peer-to-peer, mempool, synchronization, and public RPC entry points; cross-chain messages and
        withdrawals; execution engines, precompiles, system contracts, and host boundaries; persistent state,
        snapshots, and reorgs; signing, HSM, and privileged operator interfaces; and genesis, upgrade, build,
        and release mechanisms that can change protocol behavior. Follow real production wiring rather than
        documentation. Distinguish unauthenticated peers, transaction senders, RPC callers, block producers,
        validators, sequencers, relayers, and operators. Give each surface a stable id, protected asset or
        invariant, principal control already enforced, and risk rank. Exclude tests and unreachable code.
        This workflow is not a generic Solidity audit: in mixed repositories map only cross-layer contracts,
        system contracts, proof/message semantics, and VM/host boundaries; leave ordinary reentrancy, oracle,
        token, proxy-layout, and contract access-control review to smart-contract-review. Publish the complete
        risk-ranked inventory, not findings. Sort the array by strictly ascending, unique risk_rank (one is
        highest risk); later fan-out consumes that array order and reviews every surface. Preserve the
        inventory's platform identifier on every surface and do not map a not_detected platform.
      dependsOn: [detect-platforms-and-components]
      outputSchema: |-
        {
          "type": "array",
          "items": {
            "type": "object",
            "required": ["surface_id", "platform", "domain", "entrypoint", "file", "attacker", "asset_or_invariant", "control", "risk_rank"],
            "properties": {
              "surface_id": {"type": "string", "description": "Stable short identifier for this review unit"},
              "platform": {"type": "string", "enum": ["evm-protocol", "solana-anchor", "cosmos-cosmwasm-ibc", "substrate-polkadot-xcm", "aptos-move", "sui-move", "cairo-starknet", "ton", "algorand", "bitcoin-lightning"]},
              "domain": {"type": "string", "enum": ["consensus", "rollup", "zk", "transaction", "p2p", "bridge", "execution", "signer", "wallet", "economics", "offchain", "storage", "native", "deployment", "release"]},
              "entrypoint": {"type": "string", "description": "Production handler, message, method, hook, or build entry point"},
              "file": {"type": "string", "description": "Repository-relative implementation file"},
              "attacker": {"type": "string", "description": "Least-privileged principal able to influence this surface"},
              "asset_or_invariant": {"type": "string", "description": "Funds, keys, safety, liveness, state, or release property protected here"},
              "control": {"type": "string", "description": "Validation or authorization expected to enforce the invariant"},
              "risk_rank": {"type": "integer", "minimum": 1, "description": "One is highest risk; ranks are unique and the array is strictly ascending by this field"}
            }
          }
        }

    - name: review-critical-surface
      role: vulnerability-hunter
      category: other
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-secure-workflow-guide
      objective: >-
        Process the indexed array in {{items}}, reviewing every risk-ranked protocol surface it contains end
        to end. For each input, use its surface_id, domain, entrypoint, file, attacker, asset_or_invariant, and
        control. Attack each surface in the payout-ordered sequence, naming the invariant you are trying to
        break. Priority 1, initialization and upgrade state on the DEPLOYED implementation: every
        implementation behind a proxy is already initialized, owns nothing, and is reachable only through
        its proxy (Wormhole, $10M). Priority 2, cross-chain proof and identity binding: a proof is accepted
        only from the producer allowed to have produced it, and a relayed message keeps the caller identity
        the destination believes it has, msg.sender after relaying included (Aurora, $1M). Priority 3,
        fork-versus-upstream divergence when the surface belongs to a client or an L2 fork: upstream-fork-diff
        enumerates every divergence and each one is checked against the invariant the upstream code used to
        satisfy (Optimism l2geth, $2,000,042). Priority 4, encoding and decoding round trips and replay:
        decode after encode is the identity, one identifier has exactly one encoding, and nonce and domain
        separation are present (Polygon Plasma, $2M). Priority 5, missing balance and state validation, the
        most frequently confirmed root cause in Immunefi's disclosed set: every state-changing path checks
        the balance, bound or existence it depends on. Priority 6, accounting, rounding, precision and
        decimals: conversions round-trip within a stated bound at the decimals actually reported, never an
        assumed 18 (Moonbeam, Astar and Acala, $1M). Priority 7, access control and role or permission
        inventories: the matrix of who may call what holds. Priorities 1 and 6 rest on deployed state that
        only the chain-read and deployed-bytecode-diff packs can settle, and both need an
        operator-authorized fork endpoint alias: with no alias authorized, return blocked for that surface
        with the missing authorization named in the summary rather than assuming the deployed value.
        Templated reentrancy and flash-loan oracle patterns stay available but sit off the default path,
        because bots already sweep them and bot-findable means unpayable. Follow attacker-controlled data through parsing, validation, authorization, state reads and
        writes, cryptography, external calls, persistence, and error or rollback handling. Compare alternate
        admission, replay, synchronization, estimation, tracing, recovery, and upgrade paths that perform the
        same operation. Report only a concrete path where the stated control is absent or bypassable, with
        every hop and the resulting fund, key, safety, liveness, or node-compromise impact at file:line. Return
        exactly one envelope per input, preserving its absolute recordIndex, with result containing surface_id,
        status, fingerprints, and summary. Set status to reviewed when the review completes or blocked when it
        cannot complete. List every finding fingerprint returned by report_security_finding; use an empty
        fingerprints array when the surface holds.
      dependsOn: [map-protocol-surfaces]
      forEach: map-protocol-surfaces
      # Chunk the complete surface inventory across a bounded number of agents.
      # Twelve preserves one result per surface while reducing repeated repository
      # discovery and prompt context compared with the previous sixteen-run fan-out.
      targetRuns: 12
      outputSchema: |-
        {
          "type": "array",
          "items": {
            "type": "object",
            "required": ["recordIndex", "result"],
            "properties": {
              "recordIndex": {"type": "integer", "minimum": 0, "description": "Absolute index of the input record"},
              "result": {
                "type": "object",
                "required": ["surface_id", "status", "fingerprints", "summary"],
                "properties": {
                  "surface_id": {"type": "string"},
                  "status": {"type": "string", "enum": ["reviewed", "blocked"]},
                  "fingerprints": {"type": "array", "items": {"type": "string"}},
                  "summary": {"type": "string", "description": "What was checked or why review was blocked"}
                }
              }
            }
          }
        }

    - name: consensus-finality-and-state-transition
      role: vulnerability-hunter
      category: logic-flaw
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-property-based-testing
        - name: trail-of-bits-sharp-edges
      objective: >-
        Use {{tasks.map-protocol-surfaces.output}} to audit consensus, finality, and state transitions.
        Payout-ordered priority 3 is owned here: when this codebase is a fork of an upstream client or L2,
        name upstream-fork-diff, enumerate every divergence against the upstream revision, and check each
        divergence against the invariant the upstream code used to satisfy — a state-transition or
        accounting rule upstream enforced and the fork silently dropped is the cheapest enumerable
        high-payout sweep we have (Optimism l2geth, $2,000,042). Record an unavailable upstream revision as
        a limitation instead of guessing at the diff. Cover
        vote and certificate validation, stake-weighted quorum, validator-set and epoch changes,
        equivocation and slashing, view or round transitions, weak-subjectivity and checkpoint assumptions,
        fork-choice and upgrade activation, block and transaction execution, and state-root construction.
        Hunt for validation differences across admission, proposal, replay, sync, and recovery paths;
        invalid transitions; fail-open errors; and nondeterminism from iteration order, wall-clock time,
        floating point, environment, I/O, or concurrency. Report only a production-reachable object or
        sequence that honest nodes accept differently, commits invalid state, violates finality, or halts
        network progress, with the attacker's role and decisive code at file:line.
      dependsOn: [map-protocol-surfaces]
      outputSchema: |-
        {"type":"object","required":["area","status","examined","skipped","limitations","finding_fingerprints"],"properties":{"area":{"type":"string"},"status":{"type":"string","enum":["examined","skipped","unsupported","inconclusive"]},"examined":{"type":"array","items":{"type":"string"}},"skipped":{"type":"array","items":{"type":"string"}},"limitations":{"type":"array","items":{"type":"string"}},"finding_fingerprints":{"type":"array","items":{"type":"string"}}}}

    - name: rollup-derivation-da-and-fault-proofs
      role: vulnerability-hunter
      category: logic-flaw
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-property-based-testing
        - name: trail-of-bits-sharp-edges
      objective: >-
        Determine from {{tasks.map-protocol-surfaces.output}} whether this is a rollup or supplies a rollup
        component. If applicable, audit L1 origin selection and reorg handling, batch framing, compression and
        decoding, data-availability rules, deposits and forced inclusion, safe/unsafe/finalized head
        transitions, sequencer and batcher assumptions, output-root construction, withdrawal finalization,
        challenge windows, bonds, fault-proof games, and proof VM behavior. Hunt for alternate derivation
        paths, malformed or withheld data, stale L1 views, deadline and boundary errors, censorship escape
        failures, and disagreement between proposer and verifier that permits an invalid output or blocks a
        valid challenge. If absent, report nothing. Cite the crafted L1 event, batch, output, or dispute move,
        the validation defect at file:line, and its safety, liveness, or fund impact.
      dependsOn: [map-protocol-surfaces]
      outputSchema: |-
        {"type":"object","required":["area","status","examined","skipped","limitations","finding_fingerprints"],"properties":{"area":{"type":"string"},"status":{"type":"string","enum":["examined","skipped","unsupported","inconclusive"]},"examined":{"type":"array","items":{"type":"string"}},"skipped":{"type":"array","items":{"type":"string"}},"limitations":{"type":"array","items":{"type":"string"}},"finding_fingerprints":{"type":"array","items":{"type":"string"}}}}

    - name: transaction-crypto-and-accounting
      role: vulnerability-hunter
      category: crypto
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-dimensional-analysis
        - name: trail-of-bits-constant-time-analysis
        - name: trail-of-bits-property-based-testing
      objective: >-
        Audit transaction and protocol authorization, proof verification, and value accounting using
        {{tasks.map-protocol-surfaces.output}}. Payout-ordered priorities 4, 5 and 6 are owned here.
        Priority 4, encoding and decoding round trips and replay: the invariant is that decode after encode
        is the identity and that one identifier has exactly one encoding, so hunt two encodings colliding
        on one identifier, signature malleability, and missing nonce or domain separation (Polygon Plasma,
        $2M). Priority 5, missing balance and state validation, the most frequently confirmed root cause in
        Immunefi's disclosed set: the invariant is that every value-moving path checks the balance, bound
        or existence it depends on before it acts. Priority 6, accounting, rounding, precision and
        decimals: the invariant is that a conversion round-trips within a stated bound across every
        representation and decimal scale, so build the decimals matrix over non-18-decimal representations
        and hunt division before multiplication (Moonbeam, Astar and Acala, $1M). Check signature encoding and recovery, domain and chain
        separation, nonces and replay, threshold and multisignature rules, commitments, randomness, and
        cryptographic errors that fail open. Follow fees, balances, gas, rewards, deposits, withdrawals,
        integer conversions, precision, and rounding across every representation and layer. Hunt for an
        alternate path that omits a check, accepts a proof for the wrong statement, truncates or overflows,
        double counts, or reorders/replays an operation to mint, steal, or freeze value. Leave ordinary
        token/oracle/contract arithmetic to smart-contract-review. Report the attacker-controlled object,
        broken invariant, and verification or accounting defect at file:line.
      dependsOn: [map-protocol-surfaces]
      outputSchema: |-
        {"type":"object","required":["area","status","examined","skipped","limitations","finding_fingerprints"],"properties":{"area":{"type":"string"},"status":{"type":"string","enum":["examined","skipped","unsupported","inconclusive"]},"examined":{"type":"array","items":{"type":"string"}},"skipped":{"type":"array","items":{"type":"string"}},"limitations":{"type":"array","items":{"type":"string"}},"finding_fingerprints":{"type":"array","items":{"type":"string"}}}}

    - name: p2p-sync-mempool-and-rpc
      role: vulnerability-hunter
      category: dos
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-property-based-testing
      objective: >-
        Audit unauthenticated peer, discovery, gossip, mempool, synchronization, RPC, API, and binary parser
        surfaces in {{tasks.map-protocol-surfaces.output}}. Check peer identity and handshake binding,
        eclipse/Sybil resistance assumptions, scoring and ban evasion, equivocation handling, gossip
        validation order, scarce-queue capture, and request amplification. Trace attacker-controlled lengths,
        counts, nesting, compression, framing, and identifiers through decoding, allocation, database work,
        cryptography, logging, and replies. Hunt for panic, memory/disk/CPU amplification, deadlock,
        goroutine/thread/connection leaks, starvation, malformed-state poisoning, rate-limit bypass, and
        exposed admin/debug methods. Distinguish clean rejection from measurable node degradation. Report
        the request/message pattern, cost asymmetry or trust bypass, recovery behavior, and sink at file:line.
      dependsOn: [map-protocol-surfaces]
      outputSchema: |-
        {"type":"object","required":["area","status","examined","skipped","limitations","finding_fingerprints"],"properties":{"area":{"type":"string"},"status":{"type":"string","enum":["examined","skipped","unsupported","inconclusive"]},"examined":{"type":"array","items":{"type":"string"}},"skipped":{"type":"array","items":{"type":"string"}},"limitations":{"type":"array","items":{"type":"string"}},"finding_fingerprints":{"type":"array","items":{"type":"string"}}}}

    - name: cross-chain-bridge-and-custody
      role: vulnerability-hunter
      category: authz
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-sharp-edges
        - name: trail-of-bits-property-based-testing
      objective: >-
        Where {{tasks.map-protocol-surfaces.output}} shows a chain, layer, shard, or custody boundary, trace
        the entire message and value lifecycle. Payout-ordered priority 2 is owned here, cross-chain proof
        and identity binding: the invariant is that a proof is accepted only from the producer allowed to
        have produced it and that a relayed message arrives with the caller identity the destination
        believes it has, so establish who is allowed to have produced this proof, how relayer and forwarder
        identity is bound to it, and what msg.sender becomes on the far side after relaying (Aurora, $1M). Audit origin, destination, chain-id, emitter, nonce,
        membership, stake/guardian quorum, epoch, sequence, finality, proof root, replay, and execution checks;
        canonical encoding across producer and verifier; reorg behavior; relayer confused-deputy paths; and
        retry, refund, partial failure, and withdrawal ownership. Hunt for forged, substituted, reordered, or
        double-executed messages and accounting that creates value twice or strands it. Include on-chain and
        off-chain halves present here, but not generic contract vulnerabilities. If no such boundary exists,
        report nothing. Cite acceptance and execution at file:line and the exact message sequence and impact.
      dependsOn: [map-protocol-surfaces]
      outputSchema: |-
        {"type":"object","required":["area","status","examined","skipped","limitations","finding_fingerprints"],"properties":{"area":{"type":"string"},"status":{"type":"string","enum":["examined","skipped","unsupported","inconclusive"]},"examined":{"type":"array","items":{"type":"string"}},"skipped":{"type":"array","items":{"type":"string"}},"limitations":{"type":"array","items":{"type":"string"}},"finding_fingerprints":{"type":"array","items":{"type":"string"}}}}

    - name: execution-vm-and-host-boundaries
      role: vulnerability-hunter
      category: logic-flaw
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-c-review
        - name: trail-of-bits-rust-review
        - name: trail-of-bits-property-based-testing
      objective: >-
        Audit virtual machines, interpreters, precompiles, system contracts, host functions, plugins, WASM,
        native extensions, and privileged protocol-to-contract calls in {{tasks.map-protocol-surfaces.output}}.
        Hunt for gas undercharging or inconsistent metering, context/caller confusion, reentrancy specifically
        across host or system boundaries, state committed before failed execution, sandbox escape, unsafe
        dynamic loading, memory aliasing, nondeterministic host behavior, and fork-dependent opcode or
        precompile semantics. Compare validation, estimation, tracing, proof, and execution implementations.
        Do not duplicate generic Solidity reentrancy, oracle, token, access-control, or storage-layout work.
        If no execution boundary exists, report nothing. Cite the crafted program or call sequence and the
        consensus, fund, or node-compromise impact at file:line.
      dependsOn: [map-protocol-surfaces]
      outputSchema: |-
        {"type":"object","required":["area","status","examined","skipped","limitations","finding_fingerprints"],"properties":{"area":{"type":"string"},"status":{"type":"string","enum":["examined","skipped","unsupported","inconclusive"]},"examined":{"type":"array","items":{"type":"string"}},"skipped":{"type":"array","items":{"type":"string"}},"limitations":{"type":"array","items":{"type":"string"}},"finding_fingerprints":{"type":"array","items":{"type":"string"}}}}

    - name: signer-policy-quorum-and-hsm
      role: vulnerability-hunter
      category: authz
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-constant-time-analysis
        - name: trail-of-bits-sharp-edges
        - name: trail-of-bits-zeroize-audit
      objective: >-
        Audit signing policy, threshold coordination, and remote signer/HSM interfaces identified in
        {{tasks.map-protocol-surfaces.output}}. Check that each signing request binds the authenticated caller,
        chain, purpose, payload, policy, epoch, and monotonic anti-replay or anti-equivocation state; validate
        DKG and threshold transcripts, participant identity, quorum, and share handling; and compare every
        parser/encoding before policy evaluation and signing. For PKCS#11, KMS, or firmware boundaries, check
        mechanism allowlists, key attributes, handle/tenant isolation, session and login state, attestation,
        firmware authenticity and anti-rollback, backup/restore counters, and audit enforcement. Hunt for a
        concrete request that obtains an unauthorized or conflicting signature or bypasses operator policy.
        Report the request, trust boundary, and decisive authorization or state defect at file:line.
      dependsOn: [map-protocol-surfaces]
      outputSchema: |-
        {"type":"object","required":["area","status","examined","skipped","limitations","finding_fingerprints"],"properties":{"area":{"type":"string"},"status":{"type":"string","enum":["examined","skipped","unsupported","inconclusive"]},"examined":{"type":"array","items":{"type":"string"}},"skipped":{"type":"array","items":{"type":"string"}},"limitations":{"type":"array","items":{"type":"string"}},"finding_fingerprints":{"type":"array","items":{"type":"string"}}}}

    - name: key-material-and-operator-secrets
      role: secrets-auditor
      category: secrets
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-zeroize-audit
        - name: trail-of-bits-constant-time-analysis
      objective: >-
        Audit generation, derivation, storage, import/export, wrapping, backup, transport, rotation,
        zeroization, logging, and error handling for private keys, seed material, operator credentials, and
        API tokens referenced by {{tasks.map-protocol-surfaces.output}}. Hunt for real credentials in source
        or shipped artifacts; extractable or weakly protected keys; secrets exposed through logs, metrics,
        errors, temporary files, core dumps, environment propagation, or permissive permissions; and
        development credentials enabled in production. Never print secret values. Do not review algorithms
        or signing authorization here. Discard fixtures and placeholders; report only a concrete disclosure
        path and what key or privilege it compromises, with redacted file:line evidence.
      dependsOn: [map-protocol-surfaces]
      outputSchema: |-
        {"type":"object","required":["area","status","examined","skipped","limitations","finding_fingerprints"],"properties":{"area":{"type":"string"},"status":{"type":"string","enum":["examined","skipped","unsupported","inconclusive"]},"examined":{"type":"array","items":{"type":"string"}},"skipped":{"type":"array","items":{"type":"string"}},"limitations":{"type":"array","items":{"type":"string"}},"finding_fingerprints":{"type":"array","items":{"type":"string"}}}}

    - name: storage-snapshot-reorg-and-concurrency
      role: vulnerability-hunter
      category: race-condition
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-rust-review
        - name: trail-of-bits-property-based-testing
      objective: >-
        Audit persistent state, sync, snapshots, pruning, rollback, reorg, migration, recovery, and concurrent
        processing from {{tasks.map-protocol-surfaces.output}}. Hunt for snapshots or metadata accepted without
        integrity and network binding, path traversal or unsafe extraction, partial writes and crash states,
        rollback that misses an index/balance/cache/side effect, stale-cache validation, races and lock-order
        deadlocks, check-then-act windows, and cancellation or retry paths that commit twice or lose work.
