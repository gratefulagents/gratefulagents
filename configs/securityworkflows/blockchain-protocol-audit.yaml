        work to examined.
      dependsOn: [account-protocol-and-validation-coverage, account-domain-coverage, run-upstream-fuzz-campaigns]
      outputSchema: |-
        {"type":"object","required":["surface_validation","domains","native_fuzz"],"properties":{"surface_validation":{"type":"object"},"domains":{"type":"array","minItems":12,"maxItems":12},"native_fuzz":{"type":"object","additionalProperties":false,"required":["inventory","runs","uncovered","limitations"],"properties":{"inventory":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["tool","target","harness","surface","decision","reason"],"properties":{"tool":{"type":"string","enum":["cargo-fuzz","go-fuzz-tests"]},"target":{"type":"string"},"harness":{"type":"string"},"surface":{"type":"string"},"decision":{"type":"string","enum":["selected","skipped","unsupported"]},"reason":{"type":"string"}}}},"runs":{"type":"array","maxItems":2,"items":{"type":"object","additionalProperties":false,"required":["tool","target","revision","execution_status","tool_run","seed","duration","workers","corpus_provenance","artifacts","errors","limitations"],"properties":{"tool":{"type":"string","enum":["cargo-fuzz","go-fuzz-tests"]},"target":{"type":"string"},"revision":{"type":"string"},"execution_status":{"type":"string"},"tool_run":{"type":"string"},"seed":{"anyOf":[{"type":"integer"},{"type":"null"}]},"duration":{"type":"string"},"workers":{"type":"integer","minimum":1},"corpus_provenance":{"type":"array","items":{"type":"string"}},"artifacts":{"type":"array","items":{"type":"string"}},"errors":{"type":"array","items":{"type":"string"}},"limitations":{"type":"array","items":{"type":"string"}}}}},"uncovered":{"type":"array","items":{"type":"string"}},"limitations":{"type":"array","items":{"type":"string"}}}}}}

    - name: red-team-bounty-worthiness
      role: exploit-validator
      category: triage
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-fp-check
        - name: bug-bounty-reporting
        - name: exploit-poc-discipline
      objective: >-
        Adversarially review every recorded finding from a skeptical bounty-triager perspective before final
        reporting. Call list_security_findings, then call get_security_finding for every fingerprint and
        read its complete evidence and audit trail before deciding it. Use all available tools, including the
        full run tool surface, to attempt safe local reproduction and disproof. Challenge each
        finding's reachability, least-privileged attacker control, claimed impact, preconditions, program
        scope, novelty, duplicates, and exclusions. Use only disposable local fixtures and dummy assets for
        reproduction. Read-only calls to explicitly in-scope live targets are allowed when they are minimally
        invasive and do not access real-user data. Do not hunt for new vulnerabilities or submit the final
        report. Never send state-changing requests to production
        or live systems, perform destructive testing, expand scope, attack or guess credentials, or perform
        denial-of-service or load testing. Preserve an existing false_positive, accepted_risk, or fixed
        terminal status and add only an audit note. For every other finding, call update_security_finding with
        an evidence-backed disposition: a proven bounty-worthy finding remains status confirmed; a technically
        real but not bounty-eligible finding must become status accepted_risk with the exact evidence-backed
        reason and the matching policy_disposition (scope_excluded, known_issue, or bot_findable when
        applicable); a technically disproved or unreachable finding must become status false_positive with
        policy_disposition disproved and the disproof; and a finding with missing evidence or unavailable
        validation must remain status triaged with policy_disposition not_ready. Never use accepted_risk or
        false_positive merely because evidence is missing or validation is unavailable. Stop after every
        recorded finding has an evidence-backed disposition.
      dependsOn: [account-complete-protocol-coverage, account-chain-coverage, account-cross-system-coverage]

    - name: triage-and-report
      role: finding-triager
      category: triage
      skillRefs:
        - name: blockchain-security-research-method
        - name: trail-of-bits-fp-check
        - name: bug-bounty-reporting
        - name: trail-of-bits-variant-analysis
      objective: >-
        Produce exactly one final report from the complete protocol/domain ledger
        {{tasks.account-complete-protocol-coverage.output}}, chain ledger
        {{tasks.account-chain-coverage.output}}, and cross-system ledger
        {{tasks.account-cross-system-coverage.output}}. Call list_security_findings and re-read each concrete
        attacker path and file:line before keeping it. Keep as submitted findings only candidates whose verdict
        is confirmed in the complete protocol/domain ledger; place unresolved candidates in a clearly
        non-finding appendix with conspicuous blockers. Reject claims that assume a modified binary, pre-existing operator compromise,
        impossible state, or a validation performed elsewhere, and merge duplicates sharing one root cause.
        Rank unauthenticated consensus failure or direct fund loss first, followed by persistent state
        corruption, key compromise, bridge safety failure, single-peer takeover, and sustained denial of
        service; state validator, sequencer, relayer, signer, and operator prerequisites explicitly.

        Include separate structured sections for confirmed findings, tool/task errors and timeouts, unsupported
        platforms or execution methods, skipped or non-applicable targets, inconclusive work, reviewed surfaces,
        and uncovered inventory. A clean bounded result is evidence only for its named revision, harness, seed,
        and bounds and must not be described as safety. For each kept finding provide root cause, smallest safe
        remediation, regression-test guidance, rollout or migration risk, and a deterministic retest recipe
        naming a new immutable revision, exact target, applicable registered tool and seed/bounds, and expected
        evidence. State that an actual remediation retest requires a follow-up scan of that revision; do not
        claim it happened in this immutable scan. Persist branch outcomes with transition_security_hypothesis
        and invariant/actor/state/transition bounds with record_security_coverage. Every confirmed root cause
        requires create_security_variant_sweep followed by complete_security_variant_sweep with scope and
        evidence; blocked or inconclusive sweeps stay internal without an audited human override. Call
        get_security_campaign_status and reconcile durable gaps and budget decisions. Hand every retained finding
        to the configured post-script pipeline and report its packaging state separately from technical confirmation;
        only a successfully persisted post-script artifact may be called bundle-ready. Then submit the final report.
      dependsOn:
        - account-complete-protocol-coverage
        - account-chain-coverage
        - account-cross-system-coverage
        - red-team-bounty-worthiness
