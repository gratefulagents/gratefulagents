        attacker-controlled surfaces in {{tasks.map-protocol-surfaces.output}} to inventory every
        repository-maintained native fuzz harness. For Rust, enumerate `fuzz/Cargo.toml` `[[bin]]` targets and
        follow each manifest-declared path safely contained beneath `fuzz/`, including non-conventional paths;
        for Go, enumerate production packages containing `FuzzXxx` functions.
        Match every harness to an in-scope surface and prioritize parsers, wire formats, transactions, blocks,
        RPC/P2P messages, proofs, and state transitions. Run the highest-value eligible targets through the
        registered `cargo-fuzz` or `go-fuzz-tests` adapter with `run_security_tool`; do not merely inventory
        them and do not substitute a model-authored general-purpose harness. A normal audit runs at most two
        targets for two minutes each. Use an explicit seed for `cargo-fuzz`; record a null seed and the native Go
        runner's schedule/environment reproducibility limitation for `go-fuzz-tests`. Request two Rust workers when that typed option is
        advertised and budget permits; otherwise preserve the runtime's fixed worker count. Do not launch warm
        follow-up rounds here: recommend the dedicated `native-fuzz-campaign` workflow when a high-risk target,
        useful durable corpus, or coverage plateau justifies repeated rounds. A run exists only when
        `run_security_tool` returns a run reference. Return every discovered target and its surface, selection
        decision, exact revision, execution status, tool-run reference, seed, duration, workers, corpus
        provenance, artifacts, errors, and limitations. Reproduce and minimize crashes where safe. Treat clean
        execution only as `not_found_under` the recorded bounds, never as proof of safety; keep ineligible,
