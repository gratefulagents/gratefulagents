        Audit genesis and chain configuration, network and chain IDs, trusted checkpoints, fork and upgrade
        activation, migrations, default service bindings, exposed ports, and deployment wiring associated
        with {{tasks.map-protocol-surfaces.output}}. Payout-ordered priority 1 is owned here,
        initialization and upgrade state on the DEPLOYED implementation: the invariant is that every
        implementation behind a proxy is already initialized, owns nothing, and is reachable only through
        its proxy, so hunt uninitialized implementations, initializer re-entry across upgrades, ownership
        held on the implementation itself, and implementation/admin slot confusion (Wormhole, $10M). That
        is deployed state rather than source: the chain-read pack reads the EIP-1967 implementation, admin
        and beacon slots and the owner and role holders, and deployed-bytecode-diff proves the compiled
        artifact is the code running at the address, and both need an operator-authorized fork endpoint
        alias. With no alias authorized, record the missing authorization as an explicit limitation and
        return unsupported for that check rather than assuming the deployed value. Hunt for inconsistent parameters across components,
        boundary and rollback errors in activation, unsafe production defaults, unverified genesis or
        checkpoint selection, migrations that violate state invariants, and drift between a fork and its
        upstream implementation that changes protocol semantics. Report only a concrete configuration,
        startup, migration, or upgrade path that makes honest nodes diverge, accepts the wrong network,
        exposes a privileged service, corrupts state, or loses liveness, with file:line evidence and the
        attacker or operator precondition.
