      outputSchema: |-
        {
          "type": "array",
          "items": {
            "type": "object",
            "additionalProperties": false,
            "required": ["fingerprint", "source_tasks", "invariant", "verdict", "attempts", "summary"],
            "properties": {
              "fingerprint": {"type": "string", "minLength": 1},
              "source_tasks": {"type": "array", "minItems": 1, "items": {"type": "string", "minLength": 1}},
              "invariant": {"type": "string", "minLength": 1},
              "verdict": {"type": "string", "enum": ["confirmed", "false_positive", "triaged"]},
              "attempts": {"type": "integer", "minimum": 1},
              "reachability": {"type": "string", "minLength": 1},
              "impact": {"type": "string", "minLength": 1},
              "blocker": {"type": "string", "minLength": 1},
              "disproof": {"type": "string", "minLength": 1},
              "reproduction": {
                "type": "object",
                "additionalProperties": false,
                "required": ["command", "exit_status", "artifact", "substrate", "failing_assertion", "observed_output", "negative_control_passed", "oracle_can_fail"],
                "properties": {
                  "command": {"type": "string", "minLength": 1},
                  "exit_status": {"type": "string", "minLength": 1},
                  "artifact": {"type": "string", "minLength": 1, "description": "Repository-relative or tool-returned local reproduction artifact"},
                  "substrate": {"type": "string", "enum": ["local_fixture", "focused_test", "local_harness"]},
                  "failing_assertion": {"type": "string", "minLength": 1},
                  "observed_output": {"type": "string", "minLength": 1},
                  "negative_control_passed": {"const": true},
                  "oracle_can_fail": {"const": true}
                }
              },
              "summary": {"type": "string", "minLength": 1, "description": "Local proof, the control that disproves the path, or the specific validation blocker"}
            },
            "allOf": [
              {"if": {"required": ["verdict"], "properties": {"verdict": {"const": "confirmed"}}}, "then": {"required": ["reachability", "impact", "reproduction"]}},
              {"if": {"required": ["verdict"], "properties": {"verdict": {"const": "false_positive"}}}, "then": {"required": ["disproof"]}},
              {"if": {"required": ["verdict"], "properties": {"verdict": {"const": "triaged"}}}, "then": {"required": ["blocker"]}}
            ]
          }
        }

    - name: account-protocol-and-validation-coverage
      role: finding-triager
      category: triage
      skillRefs:
        - name: blockchain-security-research-method
      objective: >-
        Compare the complete inventory in {{tasks.map-protocol-surfaces.output}} with every result in
        {{tasks.review-critical-surface.output}} and {{tasks.validate-high-impact-findings.output}}. Produce a
        compact ledger naming reviewed and blocked surface ids, inventory domains with no surface, confirmed,
        disproved, and still-triaged fingerprints, and validation limitations. Do not turn a blocked review,
        missing domain, timeout, tool failure, or unresolved candidate into a pass.
      dependsOn: [map-protocol-surfaces, review-critical-surface, validate-high-impact-findings]
      outputSchema: |-
        {"type":"object","required":["reviewed_surfaces","blocked_surfaces","absent_domains","confirmed","false_positives","triaged","limitations"],"properties":{"reviewed_surfaces":{"type":"array","items":{"type":"string"}},"blocked_surfaces":{"type":"array","items":{"type":"string"}},"absent_domains":{"type":"array","items":{"type":"string"}},"confirmed":{"type":"array","items":{"type":"string"}},"false_positives":{"type":"array","items":{"type":"string"}},"triaged":{"type":"array","items":{"type":"string"}},"limitations":{"type":"array","items":{"type":"string"}}}}

    - name: account-complete-protocol-coverage
      role: finding-triager
      category: triage
      skillRefs:
        - name: blockchain-security-research-method
      objective: >-
        Combine the surface and validation ledger {{tasks.account-protocol-and-validation-coverage.output}}
        with the twelve-record domain ledger {{tasks.account-domain-coverage.output}} and native-fuzz inventory,
        bounded runs, and uncovered targets in {{tasks.run-upstream-fuzz-campaigns.output}}. Preserve every
