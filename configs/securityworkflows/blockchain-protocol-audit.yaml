        fingerprint set: emit one disposition for each recorded fingerprint, no invented results, omissions, or
        duplicates, and preserve the source task(s) and named invariant that produced it. Prioritize critical
        and high candidates first, but never submit an unvalidated candidate at any severity. Re-read the full path and confirm
        the entry point is production-reachable, the attacker has the stated protocol
        role, every intermediate validation is absent or bypassable, and the final impact follows. Use only
        safe local fixtures, focused tests, or harnesses that execute the real target code; never contact a live
        network. If no suitable harness exists, create the smallest candidate-specific PoC in a disposable
        working copy, execute it, debug it, minimize it, and preserve exact commands, exit statuses, observed
        output, and artifacts. Exercise a positive control proving the oracle detects the claimed violation and
        a negative control proving the same harness does not fail on a valid path. A missing pre-existing harness
        is not a reason to stop. For consensus and bridge issues, construct the smallest object/sequence that makes the
        implementations disagree or accept invalid state. For DoS, measure or tightly bound attacker versus
        victim cost and recovery. For races, establish a concrete interleaving. For signer issues, use dummy
        keys and prove the unauthorized signing decision. Update each candidate to confirmed when the local
        proof holds, false_positive when a specific control disproves it, or triaged when safe local evidence
        cannot settle it. Publish one result for every recorded fingerprint, including the concrete blocker
