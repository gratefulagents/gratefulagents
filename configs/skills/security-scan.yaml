apiVersion: platform.gratefulagents.dev/v1alpha1
kind: Skill
metadata:
  name: security-scan
  annotations:
    platform.gratefulagents.dev/security-skill: "true"
spec:
  version: "0.1.0"
  description: >-
    Vulnerability research methodology: sources and sinks per ecosystem,
    framework pitfalls, authn/authz and injection checklists, crypto, secrets,
    IaC/CI misconfiguration, dependency review, severity calibration, and the
    platform finding contract.
  source:
    inline:
      instructions: |

        Use this skill when scanning a repository or an operator-authorized website
        for vulnerabilities. It is the technical handbook; the scan lifecycle
        lives in the security-scan mode.

        ## Method

        1. History first: read SECURITY.md, advisories, CHANGELOG security
           entries, prior audit reports, the program's known issues, and recent
           security-fix commits. Past bugs tell you which classes this codebase
           produces and where a fix may have missed a sibling call site.
        2. Map next: entry points (HTTP/gRPC routes, CLI, webhooks, queue
           consumers, parsers, cron), trust boundaries, assets, privilege levels,
           and an explicit attacker for each surface.
        3. Hunt one slice at a time from a fixed attacker position; assume the
           developer made a mistake in it and look for the delta from the
           canonical secure implementation. "Find all vulnerabilities" across a
           repository produces breadth-first noise, not findings.
        4. For each entry point, follow untrusted data to a sink. Findings are
           paths, not patterns: grep produces candidates, the call chain produces
           findings.
        5. Check the guard, not the comment. Read the middleware, the decorator,
           the interceptor — and check whether every route actually uses it.
        6. Report through report_security_finding, one call per distinct issue.
           After a finding is confirmed, sweep the codebase for the same root
           cause before moving on.

        ## Deterministic tool packs

        Scanner binaries are not installed in the run image. Every registered
        deterministic scanner goes through the typed `run_security_tool` tool:
        give it the registered tool name, the target (type, locator, revision),
        the tool's typed options, the authorized `scope`, and a `seed` for
        anything stochastic. There is no image, command, or raw-flag argument —
        the platform derives argv from its compiled registry and runs the tool in
        a dedicated Kubernetes Job built from the pinned security-tools image.

        The call returns a typed result whose `status` is exactly one of `pass`,
        `findings`, `error`, `timeout`, `partial`, or `not_applicable`, plus
        coverage and references to `result.json` and the raw artifacts. Normalized
        findings are ingested into the security pipeline as part of the run, so do
        not re-submit them by hand. Report examined, skipped, and uncovered assets.
        A failure, timeout, missing pin, or unavailable catalog tool is an
        error/not-applicable — never a pass.

        ### Repository-maintained native fuzz campaigns

        Fuzzing is conditional, but discovering an eligible harness makes execution
        mandatory when the workflow requests applicable tools. For Rust, inventory
        `fuzz/Cargo.toml` `[[bin]]` targets and follow each manifest-declared
        path safely contained under `fuzz/` (commonly `fuzz/fuzz_targets/`), then
        use `cargo-fuzz`. For Go, inventory production
        packages containing `FuzzXxx` functions and use `go-fuzz-tests`. Run only
        repository-maintained harnesses that exercise an in-scope,
        attacker-controlled surface; do not put a model-authored general-purpose
        harness in the scan's accept path.

        A normal scan runs at most two highest-value targets for two minutes each.
        Use an explicit seed for `cargo-fuzz`; Go's native fuzz runner has no seed
        option, so record a null seed and its schedule/environment reproducibility
        limitation. Prefer parsers, wire formats, transactions, blocks,
        RPC/P2P messages, proofs, and state transitions. Request two Rust workers
        when the registered tool exposes that typed option and budget permits;
        otherwise record the runtime's fixed worker count rather than injecting an
        unsupported flag. Record every discovered target and why it ran or remained
        uncovered, plus the tool-run reference, revision, seed, duration, workers,
        corpus provenance, artifacts, errors, and limitations. A run exists only
        when `run_security_tool` returns a run reference.

        Longer campaigns belong in a dedicated fuzz workflow, not every normal
        scan. A warm or high-risk target may receive repeated, independently
        recorded rounds of at most fifteen minutes. Each round restores the durable
        corpus from the prior round, uses an explicit Rust seed (or records the Go
        runner's unavailable seed), stops scheduling new rounds after a crash, and
        preserves crash and corpus artifacts. A clean
        bounded run is `not_found_under` its exact revision, harness, corpus, seed,
        workers, and duration — never proof of safety.

        Local command execution is available for repository inspection and safe
        project-native builds, tests, simulators, and harnesses. Inspect invoked
        scripts before running them. Live requests are allowed when the operator has
        explicitly named a website target; keep them reconnaissance-only and
        preserve the exact command, versions, exit status, and output. When a
        concrete finding needs validation and no suitable harness exists, create
        the smallest candidate-specific PoC in a disposable workspace, execute it,
        debug it, and minimize it. Exploratory command output without a bounded
        harness is not a deterministic scan result.

        ## Sources and sinks by ecosystem

        Go: `exec.Command`, `os/exec` with shell strings, `fmt.Sprintf` into SQL,
        `database/sql` string concatenation, `text/template` vs `html/template`,
        `filepath.Join` with user input (no `..` check), `os.ReadFile` on request
        paths, `http.Get` with user URLs (SSRF), `encoding/gob`, `yaml.Unmarshal`
        into interfaces, `math/rand` for tokens, `crypto/tls` with
        `InsecureSkipVerify`, unchecked `err` on auth calls, `context` without
        deadlines on external calls.

        JS/TS: `eval`, `new Function`, `child_process.exec`, template literals in
        SQL, `dangerouslySetInnerHTML`, `innerHTML`, `document.write`,
        `res.redirect(req.query...)`, `require`/dynamic `import` with user data,
        `JSON.parse` on untrusted input into prototype-polluting merges
        (`_.merge`, `Object.assign` on `__proto__`), `path.join(__dirname, req…)`,
        `serialize-javascript`, `vm` module, regex built from user input (ReDoS).

        Python: `os.system`, `subprocess` with `shell=True`, `eval`/`exec`,
        `pickle.loads`, `yaml.load` without `SafeLoader`, `jinja2.Template` on
        user strings, raw cursor `execute` with f-strings, `os.path.join` with
        request data, `requests` with user URLs and `verify=False`,
        `xml.etree`/`lxml` without `resolve_entities=False`, `random` for tokens,
        Django `mark_safe`, `.extra()`/`RawSQL`.

        Java: `Runtime.exec`, `ProcessBuilder`, JPA/JDBC string concatenation,
        `ObjectInputStream.readObject`, SnakeYAML default constructor, XML parsers
        without `FEATURE_SECURE_PROCESSING`, EL/OGNL/SpEL evaluation of user input,
        `Class.forName` on user data, `TrustManager` accepting all certificates.

        Rust: `unsafe` blocks, `std::process::Command` with shell strings,
        `serde` deserialization into untrusted types, index arithmetic and
        `unwrap` on attacker-controlled input, `Command::arg` with joined strings.

        PHP: `eval`, `system`/`exec`/`passthru`, `include`/`require` with user
        input (LFI/RFI), `unserialize`, `extract`, `$_REQUEST` trust, string SQL.

        Ruby: `system`/backticks/`%x`, `eval`, `Marshal.load`, `YAML.load`,
        `send` with user input, `constantize`, ActiveRecord `where("… #{}")`.

        C/C++: `strcpy`, `sprintf`, `memcpy` with computed lengths, integer
        overflow before allocation, `alloca`, format strings, use-after-free on
        error paths, off-by-one in loop bounds.

        ## Framework pitfalls

        - Express/Next: missing `helmet`, permissive CORS with credentials, body
          parsers without limits, API routes without auth, SSR passing user data
          into HTML, `getServerSideProps` leaking secrets to the client bundle.
        - Django/Flask: `DEBUG=True`, `ALLOWED_HOSTS=['*']`, CSRF exemptions,
          `SECRET_KEY` in source, per-view auth decorators missing on some views.
        - Spring: permitAll patterns, actuator endpoints exposed, CSRF disabled,
          `@PreAuthorize` present on some methods but not the reachable ones.
        - Rails: mass assignment without strong parameters, `skip_before_action`,
          `raw`/`html_safe`, unscoped finders in multi-tenant models.
        - gin/net-http: middleware registered on a group that some routes bypass,
          `http.FileServer` rooted too high, missing timeouts.
        - GraphQL: no depth/complexity limits, introspection in production,
          per-resolver authz gaps, batching used to bypass rate limits.
        - ORMs: raw query escape hatches, `LIKE` injection, ordering/column names
          taken from user input.

        ## Authn/authz checklist

        - Every route: is authentication required, and enforced centrally?
        - Session/JWT: signature verified, algorithm pinned (no `none`/HS-vs-RS
          confusion), expiry and audience checked, revocation possible, secure
          cookie flags (HttpOnly, Secure, SameSite).
        - Object access: does the handler check ownership/tenant on the object it
          loaded, or only that the caller is logged in? (IDOR)
        - Privilege: can a normal user reach admin paths by direct URL, by
          setting a field (role, is_admin) in a request body, or through a
          mass-assignment path?
        - Multi-tenancy: is the tenant filter applied in queries, or assumed from
          a header the client controls?
        - Password/credential flows: reset tokens random and single-use, timing-
          safe comparison, rate limits, no user enumeration.

        ## Injection and friends

        - SQL/NoSQL: parameterized everywhere; check dynamic ORDER BY/table names.
        - Command: prefer argv arrays; never build shell strings from input.
        - Path traversal: normalize then verify the resolved path stays inside a
          base directory; check archive extraction (zip-slip) and file uploads.
        - SSRF: user-controlled URLs, redirects followed, metadata endpoints
          (169.254.169.254), DNS rebinding, missing egress allowlists.
        - Deserialization: untrusted data into pickle/gob/Marshal/ObjectInputStream
          or YAML with arbitrary types.
        - XXE: external entity resolution enabled in XML parsers.
        - Template/SSTI: user input rendered as a template rather than as data.
        - Upload: content-type trusted, filename used as path, no size limits, no
          type validation, files served from a writable directory.

        ## Crypto

        Weak or misused primitives (MD5/SHA1 for passwords, DES/RC4, ECB mode,
        static or reused IVs, unauthenticated encryption), `math/rand`-class RNGs
        for tokens or keys, keys committed or derived from constants, missing
        integrity checks, custom crypto, TLS verification disabled, certificate
        pinning removed, JWT signing keys shared with clients.

        ## Secrets

        Grep for `api[_-]?key`, `secret`, `token`, `password`, `BEGIN … PRIVATE KEY`,
        `AKIA`, `ghp_`, `sk-`, `xox`, `AIza`, `eyJ` and high-entropy literals in
        `.env`, CI workflows, Helm values, Kubernetes manifests, Dockerfiles,
        fixtures and git history. Then check handling: secrets in log lines, error
        messages, URLs/query strings, client bundles, ConfigMaps, or images.
        Never print a secret value in a finding — reference file:line, name the
        credential type, redact the value, and require rotation in remediation.

        ## Infrastructure, Kubernetes and CI

        - RBAC wildcards (`*` verbs/resources), cluster-admin bindings, service
          accounts auto-mounted where they are not needed.
        - Pods: `privileged`, `hostNetwork`, `hostPID`, `hostPath` mounts, running
          as root, missing `readOnlyRootFilesystem`, added capabilities.
        - Network: services exposed publicly, no NetworkPolicy, debug/pprof and
          metrics endpoints reachable without auth.
        - Cloud/IaC: permissive IAM policies, public buckets, unencrypted volumes,
          security groups open to 0.0.0.0/0.
        - CI: `pull_request_target` with checkout of untrusted refs, unpinned
          third-party actions, secrets exposed to fork builds, `curl | sh` in
          build steps, artifacts built without pinned toolchains.

        ## Dependencies

        Run the ecosystem's audit tool when available (govulncheck, npm audit,
        pip-audit, cargo audit, bundler-audit). Triage by reachability: is the
        vulnerable API actually called? Also review pinning (floating ranges,
        `latest` images, `@main` actions), install scripts, typosquat-looking
        names, git dependencies on mutable refs, and dependency-confusion exposure.

        ## Severity calibration

        - critical: unauthenticated remote code execution, authentication bypass,
          full database or key material exposure, fund loss — with a traced path.
        - high: serious impact with modest preconditions (authenticated user
          reaches other tenants' data, stored XSS in an admin console, SSRF to
          cloud metadata).
        - medium: real but constrained (self-XSS chained requirements, injection
          reachable only by an admin, DoS needing sustained effort).
        - low: hardening gaps with no direct path (missing security header,
          verbose errors, weak defaults that are overridden in practice).
        - info: observations worth knowing that are not vulnerabilities.
        Noise (do not report): unreachable code paths, test fixtures, framework
        behavior working as documented, "consider adding validation" with no
        attack, dependency versions with no advisory or reachability.

        ## Finding contract

        Every finding is submitted with report_security_finding using these
        fields: `title`, `category`, `severity`, `confidence`, `repository`,
        `revision`, `file_path`, `start_line`, `end_line`, `symbol`, `cwe`,
        `description`, `impact`, `attack_vector`, `remediation`, `evidence`
        (list of `{file_path, start_line, end_line, snippet, note}`),
        `references`, `source_agent`, `scan_step`, `tags`.

        - severity: `critical`, `high`, `medium`, `low`, `info`.
        - confidence: `confirmed` (observed), `firm` (path clear, one step
          inferred), `tentative` (plausible, unproven).
        - category: `injection`, `authn`, `authz`, `secrets`, `crypto`, `ssrf`,
          `xss`, `deserialization`, `path-traversal`, `race-condition`, `dos`,
          `memory-safety`, `supply-chain`, `misconfiguration`, `logic-flaw`,
          `info-leak`, `other`.

        Required in practice: a `file_path` and `start_line` pointing at the
        vulnerable code, an `attack_vector` that names the entry point and the
        path to the sink, and `evidence` snippets copied from the repository.

        ## Non-goals

        Never edit the scanned repository or send destructive, persistent, disruptive,
        credential-attack, or bulk-extraction traffic to live systems. Never
        print secret material. Repository findings need file:line evidence;
        website findings need exact URLs and redacted request/response evidence.
