---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: securityworkflows.triggers.gratefulagents.dev
spec:
  group: triggers.gratefulagents.dev
  names:
    kind: SecurityWorkflow
    listKind: SecurityWorkflowList
    plural: securityworkflows
    singular: securityworkflow
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.referencedBy
      name: ReferencedBy
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SecurityWorkflow is a reusable, namespace-scoped security scan workflow
          referenced by SecurityScan spec.workflowRef. Referenced content is resolved
          and snapshotted at run-creation time, so edits never change historical
          runs.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SecurityWorkflowSpec defines a reusable security scan research
              plan.
            properties:
              description:
                description: description explains what this workflow hunts for.
                type: string
              parallelism:
                description: |-
                  parallelism optionally caps how many tasks may run concurrently in
                  scans using this workflow, overriding the scan's parallelism.
                format: int32
                maximum: 16
                minimum: 1
                type: integer
              parameters:
                description: |-
                  parameters declares the scan-time inputs substituted for double-brace
                  params.<name> references in task objectives. Scans supply values
                  via spec.parameterValues.
                items:
                  description: |-
                    SecurityWorkflowParameter declares one scan-time input substituted for
                    double-brace params.<name> references in task objectives.
                  properties:
                    default:
                      description: default is the value used when a scan omits the
                        parameter.
                      type: string
                    description:
                      description: description explains what the parameter controls.
                      type: string
                    name:
                      description: name identifies the parameter and uses double-brace
                        params.<name> syntax.
                      maxLength: 63
                      pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
                      type: string
                    required:
                      description: required, when true, means a scan must supply a
                        value.
                      type: boolean
                  required:
                  - name
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-type: atomic
              tasks:
                description: |-
                  tasks is the ordered/parallel research plan executed as focused
                  vulnerability-hunting sub-agents (same schema as SecurityScan
                  spec.workflow).
                items:
                  description: |-
                    SecurityScanTask is one focused research task in the scan workflow, executed
                    by a dedicated sub-agent.
                  properties:
                    category:
                      description: category optionally tags the vulnerability class
                        this task hunts for.
                      type: string
                    dependsOn:
                      description: dependsOn lists task names that must complete before
                        this task starts.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                    forEach:
                      description: |-
                        forEach names a dependency task; this task fans out with one instance
                        per record of that task's JSON-array structured output. Records are
                        exposed through double-brace item or item.<field> references. The
                        named task must be listed in dependsOn and must declare outputSchema.
                      maxLength: 63
                      type: string
                    maxCostUSD:
                      description: |-
                        maxCostUSD is a decimal USD ceiling (e.g. "5" or "2.50") on this
                        task's LLM spend in deterministic execution, mapped to the task run's
                        spec.limits.maxCostUsd. Empty means no task-level ceiling.
                      pattern: ^([0-9]+(\.[0-9]+)?)?$
                      type: string
                    maxFindings:
                      description: |-
                        maxFindings caps how many findings this task may report, counted
                        across every fan-out instance and retry of the task within one
                        execution. Zero means unlimited. It is a separate scope from
                        budgets.maxFindings, which every task of the execution shares, so
                        parallel tasks never race for one cumulative allowance.
                      format: int32
                      minimum: 0
                      type: integer
                    maxInstances:
                      description: maxInstances caps forEach fan-out instances. Zero
                        defaults to 10.
                      format: int32
                      maximum: 50
                      minimum: 0
                      type: integer
                    maxRetries:
                      description: |-
                        maxRetries is this task's retry budget in deterministic execution:
                        how many times a failed attempt is rescheduled before the task is
                        marked Failed. Nil inherits spec.execution.taskMaxRetries (default 1).
                      format: int32
                      maximum: 10
                      minimum: 0
                      type: integer
                    maxTurns:
                      description: |-
                        maxTurns is a hard per-task model-turn budget in deterministic
                        execution, mapped to the task run's spec.limits.maxTurns. Zero means
                        no task-level limit.
                      format: int32
                      minimum: 0
                      type: integer
                    model:
                      description: model optionally overrides the model for this task's
                        sub-agent.
                      type: string
                    name:
                      description: name identifies the task and is referenced by dependsOn.
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    objective:
                      description: objective is the focused prompt for this task's
                        sub-agent.
                      minLength: 1
                      type: string
                    outputSchema:
                      description: |-
                        outputSchema is an optional JSON Schema (object form) contract for
                        this task's structured output. Tasks with a schema must publish their
                        output via the submit_task_output tool; dependents consume it through
                        double-brace tasks.<name>... template references.
                      maxLength: 16384
                      type: string
                    repeats:
                      description: |-
                        repeats configures ensemble execution: run this many identical
                        instances of the task and let dependents consume all of their
                        outputs. Zero or one means a single instance.
                      format: int32
                      maximum: 5
                      minimum: 0
                      type: integer
                    role:
                      default: security-reviewer
                      description: role is the RoleInstruction name assumed by this
                        task's sub-agent.
                      type: string
                    skillRefs:
                      description: |-
                        skillRefs lists Skill resources in the same namespace to inject into
                        this task's AgentRuns in addition to spec.defaults.skillRefs.
                      items:
                        description: NamedRef references another namespaced resource by name.
                        properties:
                          name:
                            type: string
                        required:
                        - name
                        type: object
                      type: array
                      x-kubernetes-list-type: atomic
                    targetRuns:
                      description: |-
                        targetRuns sets the desired number of AgentRuns used to process a
                        forEach source. Records are deterministically partitioned across the
                        runs. Zero preserves the legacy one-run-per-record behavior bounded by
                        maxInstances.
                      format: int32
                      maximum: 50
                      minimum: 0
                      type: integer
                    timeout:
                      description: |-
                        timeout is a hard per-task runtime limit in deterministic execution,
                        mapped to the task run's spec.limits.maxRuntime. Zero means no
                        task-level limit.
                      type: string
                    tools:
                      description: |-
                        tools narrows which tools this task's run may use in deterministic
                        execution, mapped to the task run's spec.toolPolicy. It can only
                        narrow, never widen, tool access.
                      properties:
                        allowed:
                          description: |-
                            allowed, when non-empty, restricts the task's run to these tool names
                            (unknown names are ignored).
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                        denied:
                          description: denied tools are removed even when allowed;
                            deny wins.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      type: object
                  required:
                  - name
                  - objective
                  type: object
                maxItems: 64
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
            required:
            - tasks
            type: object
          status:
            description: |-
              SecurityLibraryResourceStatus is the shared observed state of the reusable
              security library resources.
            properties:
              conditions:
                description: conditions represent the current state of the resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the spec generation most recently
                  validated.
                format: int64
                type: integer
              referencedBy:
                description: |-
                  referencedBy is the number of SecurityScans in the namespace that
                  reference this resource.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
