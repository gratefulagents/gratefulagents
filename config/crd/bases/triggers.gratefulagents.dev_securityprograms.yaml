---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: securityprograms.triggers.gratefulagents.dev
spec:
  group: triggers.gratefulagents.dev
  names:
    kind: SecurityProgram
    listKind: SecurityProgramList
    plural: securityprograms
    singular: securityprogram
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.referencedBy
      name: ReferencedBy
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SecurityProgram is a namespace-scoped, operator-verified program scope
          snapshot referenced by SecurityScan spec.securityProgramRef.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SecurityProgramSpec is an operator-verified snapshot of a vulnerability
              disclosure or bug bounty program's scope. ProgramURL records provenance
              only: it is never fetched and does not authorize network access.
            properties:
              assets:
                description: |-
                  assets bind in-scope assets to deployed state so findings can be checked
                  against what is actually running rather than only against source.
                items:
                  description: |-
                    SecurityProgramAsset binds an in-scope asset to what is actually deployed.
                    Several of the highest-impact vulnerability classes (uninitialized proxies,
                    wrong token decimals, oracle wiring) are properties of deployed state rather
                    than of the repository.
                  properties:
                    addedOn:
                      description: addedOn is the date the program listed the asset,
                        as published.
                      maxLength: 64
                      type: string
                    address:
                      description: address is the deployed contract or program address.
                      maxLength: 128
                      type: string
                    chainID:
                      description: |-
                        chainID is the EIP-155 chain identifier, or another chain's canonical
                        network identifier, for a deployed asset.
                      maxLength: 64
                      type: string
                    displayName:
                      description: displayName is the program's own name for the asset.
                      maxLength: 200
                      type: string
                    repositoryURL:
                      description: repositoryURL is the HTTPS source repository for
                        the asset.
                      maxLength: 2048
                      pattern: ^(https://.*)?$
                      type: string
                  type: object
                maxItems: 256
                type: array
                x-kubernetes-list-type: atomic
              displayName:
                description: displayName is the human-readable program name.
                maxLength: 200
                minLength: 1
                type: string
              inScopeImpacts:
                description: |-
                  inScopeImpacts are the program's published impact clauses, transcribed
                  verbatim. A submission must select one of these; a report that invents
                  an impact or asset is rejected, and misrepresenting them is a rules
                  violation rather than a downgrade.
                items:
                  description: |-
                    SecurityProgramImpact is one impact clause transcribed verbatim from the
                    program's published in-scope impact list, with the severity the program's
                    own system assigns it. A report must select one of these clauses; inventing
                    an impact or asset is a rules violation on every major platform.
                  properties:
                    assetType:
                      description: |-
                        assetType is the program's own asset category for the clause, such as
                        "Smart Contract", "Blockchain/DLT", or "Websites and Applications".
                      maxLength: 200
                      type: string
                    impact:
                      description: impact is the verbatim impact clause as published
                        by the program.
                      maxLength: 1024
                      minLength: 1
                      type: string
                    level:
                      description: level is the severity the program's own system
                        assigns this impact.
                      enum:
                      - critical
                      - high
                      - medium
                      - low
                      type: string
                  required:
                  - impact
                  - level
                  type: object
                maxItems: 256
                type: array
                x-kubernetes-list-type: atomic
              knownIssues:
                description: |-
                  knownIssues are issues the program already knows about. They, and
                  findings sharing their root cause, are not reportable.
                items:
                  description: |-
                    SecurityProgramKnownIssue records something the program already knows about.
                    Contest platforms treat prior-audit findings, acknowledged README issues and
                    automated-tool output as ineligible, along with their duplicates.
                  properties:
                    reference:
                      description: reference is an optional HTTPS link to the published
                        known issue.
                      maxLength: 2048
                      pattern: ^(https://.*)?$
                      type: string
                    source:
                      description: |-
                        source describes where the known issue comes from, such as a prior
                        audit, a repository README acknowledgement, or a bot tool.
                      maxLength: 200
                      minLength: 1
                      type: string
                    summary:
                      description: summary describes the known issue in the program's
                        own words.
                      maxLength: 2048
                      minLength: 1
                      type: string
                  required:
                  - source
                  - summary
                  type: object
                maxItems: 256
                type: array
                x-kubernetes-list-type: atomic
              kycRequired:
                description: |-
                  kycRequired records that the program requires identity verification
                  before it pays a reward.
                type: boolean
              outOfScope:
                description: outOfScope are the program's published exclusions, transcribed
                  verbatim.
                items:
                  type: string
                maxItems: 256
                type: array
                x-kubernetes-list-type: atomic
              pocEnvironment:
                description: |-
                  pocEnvironment records the proof-of-concept environment the program
                  accepts.
                enum:
                - mainnet-fork
                - project-test-suite
                - either
                type: string
              pocRequired:
                description: |-
                  pocRequired records that the program requires a runnable proof of
                  concept before a report is eligible.
                type: boolean
              primacy:
                description: |-
                  primacy records whether the program judges by demonstrated impact or
                  strictly by its itemized asset rules.
                enum:
                - impact
                - rules
                type: string
              programURL:
                description: |-
                  programURL is the HTTPS provenance URL for the program. The controller
                  never fetches it and it grants no authorization to contact any target.
                maxLength: 2048
                minLength: 1
                pattern: ^https://
                type: string
              prohibitedTesting:
                description: |-
                  prohibitedTesting are the program's published testing prohibitions,
                  transcribed verbatim. Violating them typically forfeits every report.
                items:
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
              provider:
                description: provider identifies the program platform or operator.
                maxLength: 100
                minLength: 1
                type: string
              scanTarget:
                description: |-
                  scanTarget is the deprecated single-target form. New resources should
                  use scanTargets. It remains readable for backward compatibility.
                properties:
                  baseBranch:
                    default: main
                    description: |-
                      baseBranch is the repository's verified default branch used by imported
                      SecurityScans. Legacy targets that omit it fall back to main.
                    maxLength: 255
                    type: string
                  displayName:
                    description: displayName is the human-readable scan target name.
                    maxLength: 200
                    minLength: 1
                    type: string
                  featured:
                    description: featured includes the target in featured target catalogs.
                    type: boolean
                  policyPackRef:
                    description: policyPackRef names the SecurityPolicyPack to use.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  priority:
                    description: priority controls the target's display order, with
                      lower values first.
                    format: int32
                    minimum: 0
                    type: integer
                  repositoryURL:
                    description: repositoryURL is the HTTPS URL of the repository
                      to scan.
                    maxLength: 2048
                    minLength: 1
                    pattern: ^https://
                    type: string
                  scanName:
                    description: scanName is the suggested SecurityScan name.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  workflowRef:
                    description: workflowRef names the SecurityWorkflow to use.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - displayName
                - featured
                - policyPackRef
                - priority
                - repositoryURL
                - scanName
                - workflowRef
                type: object
              scanTargets:
                description: |-
                  scanTargets describe suggested SecurityScan configurations for the
                  repositories covered by this program.
                items:
                  description: |-
                    SecurityProgramScanTarget describes a suggested SecurityScan configuration
                    for a program.
                  properties:
                    baseBranch:
                      default: main
                      description: |-
                        baseBranch is the repository's verified default branch used by imported
                        SecurityScans. Legacy targets that omit it fall back to main.
                      maxLength: 255
                      type: string
                    displayName:
                      description: displayName is the human-readable scan target name.
                      maxLength: 200
                      minLength: 1
                      type: string
                    featured:
                      description: featured includes the target in featured target
                        catalogs.
                      type: boolean
                    policyPackRef:
                      description: policyPackRef names the SecurityPolicyPack to use.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                    priority:
                      description: priority controls the target's display order, with
                        lower values first.
                      format: int32
                      minimum: 0
                      type: integer
                    repositoryURL:
                      description: repositoryURL is the HTTPS URL of the repository
                        to scan.
                      maxLength: 2048
                      minLength: 1
                      pattern: ^https://
                      type: string
                    scanName:
                      description: scanName is the suggested SecurityScan name.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                    workflowRef:
                      description: workflowRef names the SecurityWorkflow to use.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                  required:
                  - displayName
                  - featured
                  - policyPackRef
                  - priority
                  - repositoryURL
                  - scanName
                  - workflowRef
                  type: object
                maxItems: 256
                type: array
                x-kubernetes-list-map-keys:
                - scanName
                x-kubernetes-list-type: map
              scopePolicy:
                description: |-
                  scopePolicy is the operator-verified scope snapshot supplied to scan
                  prompts as quoted, untrusted data.
                maxLength: 131072
                minLength: 1
                type: string
              severitySystem:
                description: |-
                  severitySystem names the severity ladder this program is judged under.
                  Consumers must rank findings with that system's own table and must never
                  translate a severity label from one system into another.
                enum:
                - immunefi-v2.3
                - code4rena
                - sherlock
                - cantina
                - ethereum-foundation
                - custom
                type: string
              submissionBudget:
                description: submissionBudget rations how many reports may be submitted.
                properties:
                  maxPerPeriod:
                    description: |-
                      maxPerPeriod is the maximum number of submissions allowed per period.
                      Zero means the program publishes no explicit limit.
                    format: int32
                    maximum: 10000
                    minimum: 0
                    type: integer
                  periodDays:
                    description: |-
                      periodDays is the length of the budget period in days. Zero means the
                      limit applies per engagement rather than per rolling window.
                    format: int32
                    maximum: 365
                    minimum: 0
                    type: integer
                  unrestrictedRequiresReputation:
                    description: |-
                      unrestrictedRequiresReputation records that the program only lifts the
                      submission cap for researchers above a reputation or identity threshold.
                    type: boolean
                type: object
              verifiedAt:
                description: |-
                  verifiedAt is when an operator last verified scopePolicy against the
                  program's authoritative source.
                format: date-time
                type: string
            required:
            - displayName
            - programURL
            - provider
            - scopePolicy
            - verifiedAt
            type: object
            x-kubernetes-validations:
            - message: scanTarget and scanTargets cannot both be set
              rule: '!(has(self.scanTarget) && has(self.scanTargets) && self.scanTargets.size()
                > 0)'
          status:
            description: SecurityProgramStatus is the observed validation and usage
              state.
            properties:
              conditions:
                description: conditions represent the current state of the resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              contentDigest:
                description: contentDigest is the SHA-256 digest of the validated
                  spec snapshot.
                type: string
              observedGeneration:
                description: observedGeneration is the spec generation most recently
                  validated.
                format: int64
                type: integer
              referencedBy:
                description: |-
                  referencedBy is the number of SecurityScans in the namespace that
                  reference this program.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
