---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: securityscans.triggers.gratefulagents.dev
spec:
  group: triggers.gratefulagents.dev
  names:
    kind: SecurityScan
    listKind: SecurityScanList
    plural: securityscans
    singular: securityscan
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.repoURL
      name: Repository
      type: string
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .spec.suspend
      name: Suspended
      type: boolean
    - jsonPath: .status.lastScanTime
      name: LastScan
      type: date
    - jsonPath: .status.findings.critical
      name: Critical
      type: integer
    - jsonPath: .status.findings.high
      name: High
      type: integer
    - jsonPath: .status.findings.total
      name: Findings
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SecurityScan is the Schema for the securityscans API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SecurityScanSpec defines the desired state of SecurityScan.
            properties:
              additionalRepos:
                description: |-
                  additionalRepos lists dependency repositories cloned and scanned
                  alongside the target repository.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              baseBranch:
                default: main
                description: baseBranch is the branch of repoURL that is scanned.
                type: string
              checks:
                description: |-
                  checks configures publishing a GitHub check on the scanned commit
                  after each scan run with a recorded revision reaches a terminal phase.
                properties:
                  enabled:
                    description: |-
                      enabled turns on check publishing. Requires spec.triggers.repositoryRef
                      for credentials.
                    type: boolean
                  includeFindingSummaries:
                    description: |-
                      includeFindingSummaries opts in to listing finding titles and file
                      locations in the check summary. The default summary contains only
                      severity counts and a dashboard link; evidence and proof-of-concept
                      content is never published in either mode.
                    type: boolean
                  uploadSARIF:
                    description: |-
                      uploadSARIF opts in to uploading the scan's stored SARIF report
                      artifact to GitHub code scanning for the scanned commit.
                    type: boolean
                type: object
              concurrencyPolicy:
                description: |-
                  concurrencyPolicy controls whether a scheduled tick may create a new
                  AgentRun while a previous AgentRun from this scan is still active.
                  Empty defaults to Forbid for safety.
                enum:
                - Allow
                - Forbid
                type: string
              dedupe:
                description: dedupe configures duplicate-finding suppression.
                properties:
                  enabled:
                    default: true
                    description: enabled toggles dedupe. Defaults to true.
                    type: boolean
                  similarityThresholdPermille:
                    default: 820
                    description: |-
                      similarityThresholdPermille is the similarity score, in thousandths
                      (permille), at or above which two findings are treated as duplicates.
                      820 means a similarity of 0.82.
                    format: int32
                    maximum: 1000
                    minimum: 0
                    type: integer
                type: object
              defaults:
                description: |-
                  defaults holds the fields used when creating AgentRuns. The controller
                  forces defaults.repoURL and defaults.baseBranch from the scan target.
                  Because scans ingest untrusted third-party code, defaults requesting
                  disableCommandSandbox or kubernetesAdmin are rejected: the controller
                  refuses to create runs and reports Ready=False with reason
                  InsecureDefaults.
                properties:
                  additionalRepos:
                    description: |-
                      additionalRepos lists extra git repository URLs cloned into each run's
                      sandbox at startup, under repos/<name> next to the primary repository.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  allowedModels:
                    description: |-
                      allowedModels optionally constrains which provider models may be surfaced
                      for runs created from this source.
                      When empty, all provider-returned models remain eligible for selection.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  authMode:
                    allOf:
                    - enum:
                      - api-key
                      - oauth
                    - enum:
                      - api-key
                      - oauth
                    default: api-key
                    description: |-
                      authMode controls provider credential mode:
                      - "api-key" (default): use defaults.secrets.claudeApiKey or providerKeys
                      - "oauth": supported for provider "openai", "anthropic", and "copilot"; requires
                        defaults.secrets.openaiOAuthSecret
                    type: string
                  baseBranch:
                    default: main
                    description: baseBranch is the branch to fork from.
                    type: string
                  customInstructions:
                    description: |-
                      customInstructions is operator-managed instructions injected into every
                      task's CLAUDE.md for this repo. Prepended before the repo's own CLAUDE.md
                      content so repo-specific rules can override platform defaults.
                    type: string
                  disableCommandSandbox:
                    description: |-
                      disableCommandSandbox completely disables the bubblewrap (bwrap)
                      subprocess sandbox for runs created from this trigger: model-controlled
                      commands and MCP stdio servers execute directly in the worker container
                      instead of inside the enforcing bwrap boundary. The pod/container
                      isolation still applies, but workspace write containment and read-only
                      permission mode become advisory only. Admin-only escape hatch for
                      toolchains that are incompatible with bubblewrap; it is intentionally
                      not exposed through the dashboard API, so it can only be set directly
                      on the trigger resource (kubectl/GitOps).
                    type: boolean
                  executionMode:
                    description: |-
                      executionMode controls the orchestration model for created AgentRuns.
                      When omitted but team is configured, team mode is implied.
                    enum:
                    - linear
                    - team
                    type: string
                  image:
                    description: |-
                      image is the worker pod image.
                      When omitted, the controller uses its built-in default image.
                    type: string
                  kubernetesAdmin:
                    description: |-
                      kubernetesAdmin grants runs created from this trigger cluster-admin
                      RBAC plus read-only platform introspection tools. Admin-only: it is
                      intentionally not exposed through the dashboard trigger APIs, so it can
                      only be set directly on the trigger resource (kubectl/GitOps). Projects
                      additionally expose the admin-gated spec.kubernetesAdmin field for
                      dashboard-created runs.
                    type: boolean
                  mcpPolicyRef:
                    description: |-
                      mcpPolicyRef references an MCPPolicy in the same namespace.
                      The policy controls which MCP servers are allowed or denied.
                      When omitted, the agent defaults to deny-all for MCP tools (zero trust).
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                  mcpServerRefs:
                    description: |-
                      mcpServerRefs lists MCPServer resources in the same namespace to inject
                      into created AgentRuns.
                    items:
                      description: NamedRef references another namespaced resource
                        by name.
                      properties:
                        name:
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  modeRef:
                    description: |-
                      modeRef selects a ModeTemplate for created AgentRuns.
                      When set, the controller pins the resolved template snapshot on the run's status.
                      When omitted, the mode is inferred from workflowMode + executionMode via the compat adapter.
                    properties:
                      channel:
                        type: string
                      name:
                        type: string
                      version:
                        type: string
                    required:
                    - name
                    type: object
                  model:
                    description: |-
                      model is the model identifier for the selected provider.
                      May include a provider prefix (e.g. "anthropic/claude-sonnet-4-6"),
                      in which case the separate provider field is ignored.
                    type: string
                  openaiApi:
                    default: responses
                    description: |-
                      openaiApi selects which OpenAI endpoint family to use when provider is
                      OpenAI-compatible:
                      - "responses": force /v1/responses (default)
                      - "chat-completions": force /v1/chat/completions
                      Copilot selects the supported endpoint per model in the SDK
                      (/v1/messages, /responses, or /chat/completions).
                    enum:
                    - responses
                    - chat-completions
                    type: string
                  openaiBaseURL:
                    description: |-
                      openaiBaseURL overrides the OpenAI-compatible API base URL used for
                      created tasks.
                      If omitted for an OpenAI-compatible provider, a provider-specific default
                      URL is applied automatically.
                    type: string
                  provider:
                    default: openai
                    description: |-
                      Deprecated: use a prefixed model value (e.g. "anthropic/claude-sonnet-4-6") instead.
                      provider selects which LLM runtime provider to use.
                      Supported values:
                      - "anthropic" (Anthropic Messages API)
                      - "openai" (OpenAI-compatible API with OpenAI default URL)
                      - "gemini" (OpenAI-compatible API with Gemini default URL)
                      - "openrouter" (OpenAI-compatible API with OpenRouter default URL)
                      - "groq" (OpenAI-compatible API with Groq default URL)
                      - "xai" (OpenAI-compatible API with xAI default URL)
                      - "copilot" (GitHub OAuth provider)

                      When omitted, "openai" is used.
                    enum:
                    - anthropic
                    - openai
                    - gemini
                    - openrouter
                    - groq
                    - xai
                    - copilot
                    type: string
                  reasoningLevel:
                    allOf:
                    - enum:
                      - none
                      - low
                      - medium
                      - high
                      - xhigh
                      - max
                    - enum:
                      - none
                      - low
                      - medium
                      - high
                      - xhigh
                      - max
                    description: |-
                      reasoningLevel optionally sets the default model reasoning effort for
                      runs created from this source (one of: none, low, medium, high, xhigh, max).
                      Empty uses the provider/model default. Individual runs may override it.
                    type: string
                  repoURL:
                    description: |-
                      repoURL is the git repository URL to clone. Optional: when empty, runs start
                      without a repository (repoless) and repos can be cloned at runtime.
                    type: string
                  runtimeProfileRef:
                    description: |-
                      runtimeProfileRef references a RuntimeProfile in the same namespace.
                      The profile controls permission mode, allowed tools, and other runtime policies.
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                  secrets:
                    description: secrets references K8s Secrets for credentials.
                    properties:
                      claudeApiKey:
                        description: |-
                          Deprecated: use providerKeys instead for explicit per-provider credential mapping.
                          The field name is kept for backward compatibility.
                        type: string
                      githubToken:
                        description: |-
                          githubToken is the name of the K8s Secret containing the GitHub token.
                          It is optional for GitHubRepository triggers that use GitHub App auth.
                        type: string
                      openaiOAuthSecret:
                        description: |-
                          openaiOAuthSecret is the name of the K8s Secret containing provider OAuth
                          material for authMode=oauth. The field name is kept for backward
                          compatibility; it is used by providers that support OAuth.
                        type: string
                      providerKeys:
                        description: |-
                          providerKeys is a list of per-provider API key secret references.
                          Each entry is propagated to the AgentRun and mounted as the correct
                          env var for the specified provider (e.g. ANTHROPIC_API_KEY, OPENAI_API_KEY).
                        items:
                          description: ProviderKeyRef references a K8s Secret holding
                            an API key for a specific provider.
                          properties:
                            provider:
                              description: provider is the provider name (e.g. "anthropic",
                                "openai", "openrouter", "gemini", "groq", "xai", "copilot").
                              type: string
                            secretKey:
                              description: 'secretKey is the key within the K8s Secret
                                (default: "api-key").'
                              type: string
                            secretName:
                              description: secretName is the name of the K8s Secret.
                              type: string
                          required:
                          - provider
                          - secretName
                          type: object
                        type: array
                    type: object
                  skillRefs:
                    description: |-
                      skillRefs lists Skill resources in the same namespace to inject into
                      created AgentRuns (their required MCP servers are auto-attached).
                    items:
                      description: NamedRef references another namespaced resource
                        by name.
                      properties:
                        name:
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  team:
                    description: |-
                      team configures the predeclared team-mode orchestration contract for
                      created AgentRuns.
                    properties:
                      completionPolicy:
                        description: AgentRunCompletionPolicy defines the gates required
                          before success.
                        properties:
                          requireApproval:
                            type: boolean
                        type: object
                      delegationPolicy:
                        description: AgentRunDelegationPolicy defines the parent's
                          child-run limits.
                        properties:
                          maxChildren:
                            format: int32
                            type: integer
                          maxDepth:
                            format: int32
                            type: integer
                          parentOnly:
                            type: boolean
                        type: object
                      steps:
                        items:
                          description: AgentRunTeamStep defines one orchestration
                            step in team mode.
                          properties:
                            name:
                              type: string
                            tasks:
                              items:
                                description: AgentRunTeamTask defines one predeclared
                                  worker assignment inside a TeamStep.
                                properties:
                                  artifactContract:
                                    type: string
                                  dependsOn:
                                    items:
                                      type: string
                                    type: array
                                    x-kubernetes-list-type: atomic
                                  maxRetries:
                                    format: int32
                                    type: integer
                                  name:
                                    type: string
                                  objective:
                                    type: string
                                  role:
                                    type: string
                                  runtimeProfileRef:
                                    description: NamedRef references another namespaced
                                      resource by name.
                                    properties:
                                      name:
                                        type: string
                                    required:
                                    - name
                                    type: object
                                required:
                                - name
                                type: object
                              type: array
                              x-kubernetes-list-type: atomic
                            type:
                              description: AgentRunTeamStepType is the bounded phase-1
                                team step contract.
                              enum:
                              - serial
                              - parallel
                              - approval_gate
                              type: string
                          required:
                          - name
                          - type
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                    type: object
                  timeout:
                    default: 2h
                    description: timeout is the maximum duration for created AgentRuns.
                    type: string
                  workflowMode:
                    allOf:
                    - enum:
                      - chat
                      - auto
                    - enum:
                      - auto
                      - chat
                    description: |-
                      workflowMode is retained for compatibility. Created runs always use auto;
                      legacy chat values are normalized to finish-gated autonomous pacing.
                    type: string
                required:
                - secrets
                type: object
              failOnSeverity:
                description: |-
                  failOnSeverity, when set, makes the controller report a Ready=False
                  condition with reason FindingsExceedThreshold whenever findings at or
                  above this severity exist.
                enum:
                - critical
                - high
                - medium
                - low
                - info
                type: string
              maxRuntime:
                description: |-
                  maxRuntime optionally caps the runtime of each scan AgentRun,
                  overriding defaults.timeout.
                type: string
              minSeverity:
                default: low
                description: minSeverity excludes findings below this severity from
                  the report.
                enum:
                - critical
                - high
                - medium
                - low
                - info
                type: string
              notifications:
                description: |-
                  notifications are rules that send Slack messages and/or create
                  GitHub/Linear issues for new or regressed findings at or above a
                  severity threshold. Each (finding fingerprint, rule, channel) notifies
                  at most once; the sent marker is persisted in the findings store.
                items:
                  description: |-
                    SecurityScanNotificationRule routes new/regressed findings at or above a
                    severity threshold to Slack, GitHub issues, and/or Linear issues.
                  properties:
                    githubIssues:
                      description: |-
                        githubIssues, when set, creates one GitHub issue per newly notified
                        finding using the referenced repository's credentials. Issue bodies
                        contain identifying metadata and a dashboard link, never evidence.
                      properties:
                        repositoryRef:
                          description: |-
                            repositoryRef names the GitHubRepository (same namespace) whose
                            credentials create the issues. When empty, spec.triggers.repositoryRef
                            is used.
                          properties:
                            name:
                              description: name of the referenced resource.
                              maxLength: 253
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                      type: object
                    linear:
                      description: linear, when set, creates one Linear issue per
                        newly notified finding.
                      properties:
                        apiKeySecretRef:
                          description: |-
                            apiKeySecretRef names a Secret in the scan's namespace holding a
                            Linear API key under the key "api-key".
                          minLength: 1
                          type: string
                        teamID:
                          description: teamID is the Linear team the issues are created
                            in.
                          minLength: 1
                          type: string
                      required:
                      - apiKeySecretRef
                      - teamID
                      type: object
                    minSeverity:
                      description: minSeverity is the lowest severity that notifies.
                        Defaults to "high".
                      enum:
                      - critical
                      - high
                      - medium
                      - low
                      - info
                      type: string
                    name:
                      description: |-
                        name identifies the rule; it keys the persisted per-finding dedupe
                        marker, so renaming a rule re-notifies.
                      maxLength: 63
                      minLength: 1
                      type: string
                    notifyOn:
                      description: |-
                        notifyOn selects which baseline states notify. Defaults to
                        "new-and-regressed".
                      enum:
                      - new
                      - regressed
                      - new-and-regressed
                      type: string
                    slack:
                      description: |-
                        slack, when set, posts one message per run summarizing the newly
                        notified findings to a Slack incoming webhook.
                      properties:
                        webhookSecretRef:
                          description: |-
                            webhookSecretRef names a Secret in the scan's namespace holding the
                            Slack incoming-webhook URL under the key "url".
                          minLength: 1
                          type: string
                      required:
                      - webhookSecretRef
                      type: object
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              parallelism:
                default: 4
                description: parallelism caps how many workflow tasks may run concurrently.
                format: int32
                maximum: 16
                minimum: 1
                type: integer
              postScriptRefs:
                description: |-
                  postScriptRefs reference reusable SecurityPostScript resources in the
                  scan's namespace. They are APPENDED after the inline postScripts. The
                  referenced content is resolved and snapshotted when each run is
                  created.
                items:
                  description: |-
                    SecurityResourceRef names a reusable security resource in the same
                    namespace as the referencing SecurityScan.
                  properties:
                    name:
                      description: name of the referenced resource.
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              postScripts:
                description: |-
                  postScripts are per-finding validation, proof-of-concept, or report
                  prompts executed after the workflow produces findings.
                items:
                  description: |-
                    SecurityScanPostScript is a per-finding validation, proof-of-concept, or report
                    prompt executed after findings are collected.
                  properties:
                    name:
                      description: name identifies the post-script.
                      minLength: 1
                      type: string
                    prompt:
                      description: prompt is executed once per matching finding.
                      minLength: 1
                      type: string
                    runOn:
                      default: all
                      description: runOn selects which findings this post-script runs
                        against.
                      enum:
                      - all
                      - confirmed
                      - high-and-above
                      type: string
                  required:
                  - name
                  - prompt
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              rankerRefs:
                description: |-
                  rankerRefs reference reusable SecurityRanker resources in the scan's
                  namespace. Their rules are APPENDED after the inline severityRankers.
                  The referenced content is resolved and snapshotted when each run is
                  created.
                items:
                  description: |-
                    SecurityResourceRef names a reusable security resource in the same
                    namespace as the referencing SecurityScan.
                  properties:
                    name:
                      description: name of the referenced resource.
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              repoURL:
                description: repoURL is the git repository URL that is the target
                  of the scan.
                minLength: 1
                type: string
              revision:
                description: |-
                  revision optionally pins the scan to a specific commit. When empty, the
                  head of baseBranch at scan time is used.
                type: string
              schedule:
                description: |-
                  schedule is an optional standard 5-field cron expression, or a
                  descriptor supported by robfig/cron such as "@daily". When empty, the
                  scan runs exactly once per spec generation.
                type: string
              scope:
                description: scope optionally narrows what the scan looks at.
                properties:
                  excludePaths:
                    description: excludePaths are path globs the scan should skip.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  focus:
                    description: focus is free-form guidance about what to prioritize
                      during the scan.
                    type: string
                  includePaths:
                    description: includePaths restricts the scan to these path globs
                      when non-empty.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  languages:
                    description: languages restricts analysis to these languages when
                      non-empty.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                type: object
              severityRankers:
                description: |-
                  severityRankers hold operator-authored ranking rule text concatenated
                  into the scan prompt and passed to submit_security_scan_report.
                items:
                  description: SecurityScanRanker is operator-authored severity-ranking
                    rule text.
                  properties:
                    name:
                      description: name identifies the ranker.
                      minLength: 1
                      type: string
                    rules:
                      description: |-
                        rules is the ranking rule text concatenated into the scan prompt and
                        passed to submit_security_scan_report.
                      minLength: 1
                      type: string
                  required:
                  - name
                  - rules
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              suspend:
                description: suspend pauses new AgentRun creation while keeping status
                  readable.
                type: boolean
              timeZone:
                default: UTC
                description: |-
                  timeZone is the IANA time zone used to evaluate schedule.
                  When omitted, UTC is used.
                type: string
              triggers:
                description: |-
                  triggers configures repository-event driven scan runs: authorized
                  GitHub pull_request and push webhook deliveries for the referenced
                  GitHubRepository create scan runs pinned to the event's head commit.
                properties:
                  allowForks:
                    description: |-
                      allowForks permits scan runs for pull requests whose head repository
                      differs from the base repository. Fork runs never receive the
                      repository's GitHub credentials: the configured GitHub token secret is
                      stripped from the run so untrusted contributions cannot exfiltrate
                      write tokens. Default false: fork PRs are skipped with an observable
                      condition and event.
                    type: boolean
                  branches:
                    description: |-
                      branches restricts push triggers to branches matching any of these
                      glob patterns (path.Match syntax; a trailing "*" acts as a prefix
                      match). Empty matches every branch.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  diffScope:
                    description: |-
                      diffScope scopes event-triggered scans to the files changed between
                      the merge base and the head (pull requests) or the push's
                      before..after range. When the diff cannot be computed the scan falls
                      back to the full repository and the fallback is stated in the run
                      prompt and the scan condition.
                    type: boolean
                  onPullRequest:
                    description: |-
                      onPullRequest creates a scan run for pull_request opened, reopened,
                      ready_for_review, and synchronize deliveries, pinned to the PR head SHA.
                    type: boolean
                  onPush:
                    description: |-
                      onPush creates a scan run for push deliveries, pinned to the pushed
                      head SHA.
                    type: boolean
                  repositoryRef:
                    description: |-
                      repositoryRef names the GitHubRepository in the scan's namespace whose
                      webhook deliveries trigger this scan and whose credentials publish
                      checks and read diffs. Required when onPullRequest or onPush is set.
                    properties:
                      name:
                        description: name of the referenced resource.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                type: object
              workflow:
                description: |-
                  workflow is the ordered/parallel research plan executed as focused
                  vulnerability-hunting sub-agents. When empty, the controller uses
                  DefaultSecurityWorkflow(). Mutually exclusive with workflowRef: setting
                  both makes the controller report Ready=False with reason InvalidSpec.
                items:
                  description: |-
                    SecurityScanTask is one focused research task in the scan workflow, executed
                    by a dedicated sub-agent.
                  properties:
                    category:
                      description: category optionally tags the vulnerability class
                        this task hunts for.
                      type: string
                    dependsOn:
                      description: dependsOn lists task names that must complete before
                        this task starts.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                    maxFindings:
                      description: |-
                        maxFindings caps how many findings this task may report. Zero means
                        unlimited.
                      format: int32
                      minimum: 0
                      type: integer
                    model:
                      description: model optionally overrides the model for this task's
                        sub-agent.
                      type: string
                    name:
                      description: name identifies the task and is referenced by dependsOn.
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    objective:
                      description: objective is the focused prompt for this task's
                        sub-agent.
                      minLength: 1
                      type: string
                    role:
                      default: security-reviewer
                      description: role is the RoleInstruction name assumed by this
                        task's sub-agent.
                      type: string
                  required:
